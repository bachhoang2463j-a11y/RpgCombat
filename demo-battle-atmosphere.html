<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SVG 技能演练 · 战场环境氛围层</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; overflow: hidden; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; overflow: hidden; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }
    /* —— 演示宿主辅助样式（复刻 index.html 浮字/眩晕环 & 分组标题 & 小屏预览框；不移植） —— */
    @keyframes float-up { 0% { opacity: 0; transform: translateY(5px) scale(0.8); } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 80% { opacity: 1; transform: translateY(-20px) scale(1); } 100% { opacity: 0; transform: translateY(-30px) scale(0.8); } }
    .floating-text { position: fixed; animation: float-up 1s ease-out forwards; pointer-events: none; z-index: 60; text-shadow: 0 2px 4px rgba(0,0,0,0.8); white-space: nowrap; transform: translateX(-50%); }
    @keyframes burst-float-up { 0% { opacity: 0; transform: translateY(0px) scale(0.5); } 20% { opacity: 1; transform: translateY(-20px) scale(1.5); text-shadow: 0 0 20px rgba(251,191,36,1); } 80% { opacity: 1; transform: translateY(-30px) scale(1.2); text-shadow: 0 0 10px rgba(251,191,36,0.8); } 100% { opacity: 0; transform: translateY(-40px) scale(1); } }
    .burst-text { position: fixed; animation: burst-float-up 1.2s ease-out forwards; pointer-events: none; z-index: 70; font-weight: 900; font-style: italic; color: #fde047; white-space: nowrap; transform: translateX(-50%); }
    .stun-fx { display: flex; align-items: center; gap: 4px; filter: drop-shadow(0 0 6px rgba(251,191,36,0.85)); animation: stun-sway 1.1s ease-in-out infinite; }
    .stun-fx.hidden { display: none !important; }
    .stun-star { font-size: 11px; line-height: 1; color: #fde047; text-shadow: 0 0 8px rgba(251,191,36,0.95), 0 1px 2px rgba(0,0,0,0.8); animation: stun-twinkle 0.9s ease-in-out infinite alternate; }
    .stun-star:nth-child(2) { animation-delay: 0.15s; }
    .stun-star:nth-child(3) { animation-delay: 0.30s; }
    @keyframes stun-sway { 0%, 100% { transform: translateX(-50%) translateX(0) rotate(0deg); } 25% { transform: translateX(-50%) translateX(-2px) rotate(-1.6deg); } 75% { transform: translateX(-50%) translateX(2px) rotate(1.6deg); } }
    @keyframes stun-twinkle { 0% { opacity: 0.72; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1.14); } }
    .arcane-atmo-group-hd { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; color: #94a3b8; padding: 4px 6px 2px; border-bottom: 1px solid rgba(148,163,184,0.16); margin-top: 2px; display: flex; justify-content: space-between; align-items: center; }
    .card.arcane-atmo-active { border-color: rgba(34,211,238,0.85); background: rgba(14,116,144,0.32); box-shadow: 0 0 12px rgba(34,211,238,0.22); }
    body.arcane-atmo-mobile-preview { background: #020617; }
    body.arcane-atmo-mobile-preview #app { width: 375px; height: 667px; max-width: 100vw; max-height: 100dvh; left: 50%; top: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); border: 1px solid rgba(148,163,184,0.42); border-radius: 14px; box-shadow: 0 24px 64px rgba(0,0,0,0.9); }
    body.arcane-atmo-mobile-preview #app > div.bottom-\[52px\] { flex-direction: column-reverse !important; padding: 6px !important; gap: 6px !important; }
    body.arcane-atmo-mobile-preview #heroes-container { gap: 4px !important; width: 100% !important; }
    body.arcane-atmo-mobile-preview #heroes-container .portrait { height: 48px !important; }
    body.arcane-atmo-mobile-preview #enemies-container { bottom: 190px !important; left: 8px !important; right: 8px !important; }
    body.arcane-atmo-mobile-preview #enemies-container .enemy-sprite { font-size: 3.4rem !important; }
    body.arcane-atmo-mobile-preview #menu-container { width: 228px !important; height: 150px !important; }
    body.arcane-atmo-mobile-preview #chat-bar span.px-3 { display: none; }
    body.arcane-atmo-mobile-preview .sm\:inline { display: none !important; }
    body.arcane-atmo-mobile-preview .turn-dot { width: 32px; height: 32px; font-size: 16px; }
    body.arcane-atmo-mobile-preview .turn-dot.cur { width: 42px; height: 42px; font-size: 20px; }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* ===== 战场环境氛围层 arcane-atmo-* BEGIN（可移植，全部挂载于 #battle-scene z-1~z-5，pointer-events:none） ===== */
    .arcane-atmo-root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .arcane-atmo-layer { position: absolute; inset: 0; pointer-events: none; }
    .arcane-atmo-tint { z-index: 1; transition: opacity 0.45s ease; }
    .arcane-atmo-far { z-index: 2; }
    .arcane-atmo-mid { z-index: 3; }
    .arcane-atmo-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
    .arcane-atmo-accent { z-index: 4; }
    .arcane-atmo-vignette { z-index: 5; }
    /* 1. 夜雨（rain） */
    .arcane-atmo-tint-rain { background: linear-gradient(165deg, rgba(6,13,26,0.92) 0%, rgba(12,24,42,0.85) 52%, rgba(7,15,24,0.94) 100%), radial-gradient(ellipse 68% 42% at 54% 8%, rgba(125,175,235,0.14), transparent 72%); }
    .arcane-atmo-rain-wrap { position: absolute; inset: -28%; transform: rotate(-13deg); pointer-events: none; overflow: hidden; }
    .arcane-atmo-rain-sheet { position: absolute; left: 0; right: 0; top: -460px; bottom: -460px; background-repeat: repeat; background-size: var(--rain-w) var(--rain-h); will-change: transform; animation: arcane-atmo-rain-fall var(--rain-dur) linear infinite; }
    .arcane-atmo-rain-far { --rain-w: 190px; --rain-h: 290px; --rain-dur: 1.45s; opacity: 0.07; }
    .arcane-atmo-rain-mid { --rain-w: 250px; --rain-h: 370px; --rain-dur: 0.95s; opacity: 0.11; }
    .arcane-atmo-rain-near { --rain-w: 310px; --rain-h: 430px; --rain-dur: 0.62s; opacity: 0.15; }
    @media (max-width: 639px) {
      .arcane-atmo-rain-far { --rain-w: 133px; --rain-h: 203px; }
      .arcane-atmo-rain-mid { --rain-w: 175px; --rain-h: 259px; }
      .arcane-atmo-rain-near { --rain-w: 217px; --rain-h: 301px; }
    }
    body.arcane-atmo-mobile-preview .arcane-atmo-rain-far { --rain-w: 133px; --rain-h: 203px; }
    body.arcane-atmo-mobile-preview .arcane-atmo-rain-mid { --rain-w: 175px; --rain-h: 259px; }
    body.arcane-atmo-mobile-preview .arcane-atmo-rain-near { --rain-w: 217px; --rain-h: 301px; }
    @keyframes arcane-atmo-rain-fall { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, var(--rain-h), 0); } }
    .arcane-atmo-wet-ground { position: absolute; left: 0; right: 0; bottom: 10%; height: 36%; background: radial-gradient(ellipse 62% 38% at 32% 76%, rgba(125,211,252,0.14), transparent 72%), radial-gradient(ellipse 70% 34% at 68% 82%, rgba(56,189,248,0.12), transparent 74%); animation: arcane-atmo-wet-breathe 5.5s ease-in-out infinite; will-change: opacity, transform; }
    @keyframes arcane-atmo-wet-breathe { 0%, 100% { opacity: 0.55; transform: scaleX(1); } 50% { opacity: 0.95; transform: scaleX(1.03); } }
    .arcane-atmo-lightning { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 85% 52% at 62% 8%, rgba(219,234,254,0.92) 0%, rgba(96,165,250,0.28) 45%, transparent 74%); will-change: opacity; }
    .arcane-atmo-lightning.flashing { animation: arcane-atmo-sky-flash 0.44s ease-out both; }
    @keyframes arcane-atmo-sky-flash { 0% { opacity: 0; } 14% { opacity: 0.19; } 34% { opacity: 0.05; } 52% { opacity: 0.14; } 100% { opacity: 0; } }
    .arcane-atmo-vignette-rain { background: radial-gradient(ellipse 78% 72% at 50% 48%, transparent 52%, rgba(3,7,18,0.72) 100%); }
    /* 2. 冷雾（mist）—— 雾带限域于中上场域，底部渐隐不洗白单位卡与血条 */
    .arcane-atmo-tint-mist { background: linear-gradient(172deg, rgba(12,32,42,0.92) 0%, rgba(18,45,58,0.84) 48%, rgba(8,19,27,0.95) 100%), radial-gradient(ellipse 75% 40% at 50% 6%, rgba(165,243,252,0.13), transparent 72%); }
    .arcane-atmo-mist-zone { position: absolute; left: 0; right: 0; top: 0; height: 64%; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, black 0%, black 66%, transparent 100%); mask-image: linear-gradient(to bottom, black 0%, black 66%, transparent 100%); }
    .arcane-atmo-mist-band { position: absolute; left: 0; width: 200%; display: flex; will-change: transform; pointer-events: none; }
    .arcane-atmo-mist-tile { width: 50%; height: 100%; flex-shrink: 0; }
    .arcane-atmo-mist-1 { top: 4%; height: 52%; opacity: 0.10; animation: arcane-atmo-mist-drift 38s linear infinite; }
    .arcane-atmo-mist-2 { top: 22%; height: 56%; opacity: 0.14; animation: arcane-atmo-mist-drift 28s linear infinite reverse; }
    .arcane-atmo-mist-3 { top: 38%; height: 54%; opacity: 0.11; animation: arcane-atmo-mist-drift 48s linear infinite; }
    .arcane-atmo-mist-1 .arcane-atmo-mist-tile { background: radial-gradient(ellipse 32% 45% at 24% 48%, rgba(186,230,253,0.95), transparent 70%), radial-gradient(ellipse 38% 48% at 72% 52%, rgba(207,250,254,0.85), transparent 72%); }
    .arcane-atmo-mist-2 .arcane-atmo-mist-tile { background: radial-gradient(ellipse 36% 48% at 34% 52%, rgba(207,250,254,0.9), transparent 70%), radial-gradient(ellipse 30% 44% at 80% 45%, rgba(165,243,252,0.8), transparent 72%); }
    .arcane-atmo-mist-3 .arcane-atmo-mist-tile { background: radial-gradient(ellipse 40% 46% at 22% 50%, rgba(165,243,252,0.85), transparent 72%), radial-gradient(ellipse 34% 44% at 68% 55%, rgba(224,242,254,0.75), transparent 72%); }
    @keyframes arcane-atmo-mist-drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }
    .arcane-atmo-vignette-mist { background: radial-gradient(ellipse 78% 74% at 50% 48%, transparent 54%, rgba(4,14,20,0.68) 100%); }
    /* 3. 废墟尘埃（ruins） */
    .arcane-atmo-tint-ruins { background: linear-gradient(168deg, rgba(38,29,20,0.92) 0%, rgba(26,21,15,0.87) 52%, rgba(13,10,8,0.95) 100%), radial-gradient(ellipse 64% 48% at 24% 8%, rgba(217,165,98,0.12), transparent 72%); }
    .arcane-atmo-beam { position: absolute; top: -18%; height: 112%; opacity: 0.05; transform-origin: top center; background: linear-gradient(90deg, transparent 0%, rgba(253,224,165,0.22) 26%, rgba(254,243,199,0.56) 50%, rgba(253,224,165,0.20) 74%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.42) 52%, transparent 86%); mask-image: linear-gradient(to bottom, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.42) 52%, transparent 86%); will-change: opacity, transform; }
    .arcane-atmo-beam-1 { left: 8%; width: clamp(72px, 13vw, 170px); transform: rotate(-20deg); animation: arcane-atmo-beam-breathe 7.5s ease-in-out both infinite; }
    .arcane-atmo-beam-2 { left: 21%; width: clamp(54px, 9.5vw, 125px); transform: rotate(-18deg); animation: arcane-atmo-beam-breathe 9.5s ease-in-out -4.2s both infinite; }
    @keyframes arcane-atmo-beam-breathe { 0%, 100% { opacity: 0.05; } 50% { opacity: 0.11; } }
    .arcane-atmo-ruins-edges { position: absolute; inset: 0; opacity: 0.20; -webkit-mask-image: linear-gradient(90deg, black 0%, transparent 24%, transparent 76%, black 100%); mask-image: linear-gradient(90deg, black 0%, transparent 24%, transparent 76%, black 100%); }
    .arcane-atmo-vignette-ruins { background: radial-gradient(ellipse 76% 72% at 50% 48%, transparent 50%, rgba(10,7,4,0.76) 100%); }
    /* 4. 异界低光（eldritch） */
    .arcane-atmo-tint-eldritch { background: linear-gradient(166deg, rgba(16,9,30,0.94) 0%, rgba(9,22,24,0.90) 52%, rgba(5,6,12,0.96) 100%); }
    .arcane-atmo-aurora-wrap { position: absolute; left: -12%; right: -12%; top: -8%; height: 48%; -webkit-mask-image: linear-gradient(to bottom, black 0%, black 48%, transparent 100%); mask-image: linear-gradient(to bottom, black 0%, black 48%, transparent 100%); }
    .arcane-atmo-aurora-a { position: absolute; inset: 0; background: radial-gradient(ellipse 46% 52% at 32% 38%, rgba(16,185,129,0.72), transparent 72%), radial-gradient(ellipse 42% 46% at 68% 42%, rgba(45,212,191,0.48), transparent 74%); will-change: opacity, transform; animation: arcane-atmo-aurora-sway-a 7.8s ease-in-out infinite; }
    .arcane-atmo-aurora-b { position: absolute; inset: 0; background: radial-gradient(ellipse 48% 50% at 58% 34%, rgba(139,92,246,0.70), transparent 72%), radial-gradient(ellipse 36% 44% at 24% 46%, rgba(192,132,252,0.42), transparent 74%); will-change: opacity, transform; animation: arcane-atmo-aurora-sway-b 9.4s ease-in-out infinite; }
    @keyframes arcane-atmo-aurora-sway-a { 0%, 100% { opacity: 0.12; transform: translate3d(-2%, 0, 0) scaleY(0.96); } 50% { opacity: 0.22; transform: translate3d(2%, 2%, 0) scaleY(1.04); } }
    @keyframes arcane-atmo-aurora-sway-b { 0%, 100% { opacity: 0.11; transform: translate3d(2%, 1%, 0) scaleY(1.03); } 50% { opacity: 0.20; transform: translate3d(-2%, -1%, 0) scaleY(0.96); } }
    .arcane-atmo-eldritch-pulse { position: absolute; inset: 0; background: radial-gradient(ellipse 72% 66% at 50% 48%, transparent 56%, rgba(88,28,135,0.34) 84%, rgba(6,40,36,0.42) 100%); will-change: opacity; animation: arcane-atmo-uneasy-pulse 5.5s ease-in-out infinite; }
    @keyframes arcane-atmo-uneasy-pulse { 0%, 100% { opacity: 0.16; } 50% { opacity: 0.28; } }
    .arcane-atmo-vignette-eldritch { background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 48%, rgba(3,4,10,0.82) 100%); }
    /* ===== 战场环境氛围层 arcane-atmo-* END ===== */
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->
  <div class="absolute top-2 sm:top-4 right-2 sm:right-4 z-[115] flex gap-1.5 sm:gap-2">
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-violet-400 hover:text-violet-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📚</span> <span class="hidden sm:inline">世界书</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-purple-400 hover:text-purple-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📜</span> <span class="hidden sm:inline">记录</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-400 hover:text-blue-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔲</span> <span class="hidden sm:inline">全屏</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>💬</span> <span class="hidden sm:inline">对话</span></button>

class CanvasFxEngine {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }
}

        const mkNoise = () => { const s = ctx.createBufferSource(); s.buffer = getPinkNoise(ctx); s.loop = true; s.start(t); stoppers.push(s); nodes.push(s); return s; };
        const mkLfo = (hz, amp, target) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = hz; g.gain.value = amp; o.connect(g); g.connect(target); o.start(t); stoppers.push(o); nodes.push(o, g); };
        if (state.theme === 'rain') {
            const src = mkNoise(), bp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), g1 = ctx.createGain(), g2 = ctx.createGain();
            bp.type = 'bandpass'; bp.frequency.value = 950; bp.Q.value = 0.45; g1.gain.value = 0.72;
            lp.type = 'lowpass'; lp.frequency.value = 240; g2.gain.value = 0.45;
            src.connect(bp); bp.connect(g1); g1.connect(bus);
            src.connect(lp); lp.connect(g2); g2.connect(bus);
            nodes.push(bp, lp, g1, g2);
        } else if (state.theme === 'mist') {
            const src = mkNoise(), bp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter();
            bp.type = 'bandpass'; bp.frequency.value = 260; bp.Q.value = 1.9;
            lp.type = 'lowpass'; lp.frequency.value = 210;
            mkLfo(0.09, 85, bp.frequency);
            src.connect(bp); bp.connect(lp); lp.connect(bus);
            nodes.push(bp, lp);
        } else if (state.theme === 'ruins') {
            const src = mkNoise(), bp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter();
            bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 1.3;
            lp.type = 'lowpass'; lp.frequency.value = 850;
            mkLfo(0.13, 140, bp.frequency);
            src.connect(bp); bp.connect(lp); lp.connect(bus);
            nodes.push(bp, lp);
        } else if (state.theme === 'eldritch') {
            const src = mkNoise(), nLp = ctx.createBiquadFilter(), nG = ctx.createGain(), mainLp = ctx.createBiquadFilter();

    function clearAtmosphere() {

        if (state.rootEl) { state.rootEl.remove(); state.rootEl = null; }
        const scene = getScene();
        if (scene) scene.querySelectorAll('[data-arcane-atmo="root"]').forEach(n => n.remove());
    }
    function setTheme(theme) {
        if (VALID_THEMES.indexOf(theme) === -1) theme = 'baseline';
        clearAtmosphere();
        state.theme = theme;
        if (theme === 'baseline') document.body.removeAttribute('data-atmo-theme');
        else document.body.setAttribute('data-atmo-theme', theme);
        buildThemeDom(theme, state.themeToken);
        syncAmbientAudio();
        return theme;

    function setAmbientSound(on) {

    function demoAt(ms, fn) {

    function spawnDemoFloat(entityId, text, cls, dy = 0, dx = 0) {
        const dom = getEntitySpriteDom(entityId);
        if (!dom) return;
        const r = dom.getBoundingClientRect(), el = document.createElement('div');
        el.className = cls;
        el.style.left = (r.left + r.width / 2 + dx) + 'px';
        el.style.top = Math.max(24, r.top - 8 + dy) + 'px';
        el.textContent = text;
        document.body.appendChild(el);

        if (statusBadgeEl) statusBadgeEl.textContent = `${THEME_LABEL[theme] || theme} · ${sound ? '音开' : '静音'}${demoMobilePreview ? ' · 375px' : ''}`;

    function handleCardClick(card) {
