<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>近战居合一闪·血溅镜头特效 Demo 预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=Cinzel:wght@700;900&family=Share+Tech+Mono&display=swap');
    
    body { 
      font-family: 'Noto Sans SC', sans-serif; 
      user-select: none;
      background: #090d16;
      color: #fff;
    }
    
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
    
    .glass-panel {
      background: rgba(20, 25, 35, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .text-outline-thick {
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 25px rgba(0,0,0,1);
    }
    .text-outline-crimson {
      text-shadow: -2px -2px 0 #3f0000, 2px -2px 0 #3f0000, -2px 2px 0 #3f0000, 2px 2px 0 #3f0000, 0 0 35px #991b1b;
    }

    .breathe { animation: breathe 4s ease-in-out infinite alternate; }
    @keyframes breathe { 
      0% { transform: translateY(0px); filter: drop-shadow(0 5px 15px rgba(255,255,255,0.05)); } 
      100% { transform: translateY(-8px); filter: drop-shadow(0 15px 25px rgba(255,255,255,0.15)); } 
    }

    .heavy-shake { animation: heavy-shake-anim 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes heavy-shake-anim {
      10%, 90% { transform: translate3d(-8px, -4px, 0) scale(1.02); }
      20%, 80% { transform: translate3d(10px, 6px, 0) scale(1.01); }
      30%, 50%, 70% { transform: translate3d(-12px, -8px, 0); }
      40%, 60% { transform: translate3d(10px, 5px, 0); }
    }

    /* ====================================================
       居合一闪·核心动画关键帧 (GPU 硬件加速)
       ==================================================== */
    @keyframes s2-hero-blur-dash {
      0% { transform: translate3d(-50%, -50%, 0) translateX(-60vw) scale(0.7); opacity: 0; filter: blur(25px); }
      15% { transform: translate3d(-50%, -50%, 0) translateX(-10vw) scale(1.1); opacity: 1; filter: blur(0); }
      35% { transform: translate3d(-50%, -50%, 0) translateX(25vw) scale(1); opacity: 1; }
      75% { transform: translate3d(-50%, -50%, 0) translateX(25vw) scale(1); opacity: 1; }
      100% { transform: translate3d(-50%, -50%, 0) translateX(55vw) scale(0.9); opacity: 0; }
    }

    @keyframes s2-blade-flash {
      0% { transform: translate3d(-50%, -50%, 0) rotate(-10deg) scaleX(0) scaleY(0.2); opacity: 0; }
      15% { transform: translate3d(-50%, -50%, 0) rotate(-10deg) scaleX(1) scaleY(1); opacity: 1; }
      100% { transform: translate3d(-50%, -50%, 0) rotate(-10deg) scaleX(1.15) scaleY(0); opacity: 0; }
    }

    @keyframes s2-ink-stamp {
      0% { transform: translate3d(-50%, -50%, 0) scale(0.3) rotate(-15deg); opacity: 0; filter: blur(12px); }
      18% { transform: translate3d(-50%, -50%, 0) scale(1.3) rotate(0deg); opacity: 1; filter: blur(0); }
      28% { transform: translate3d(-50%, -50%, 0) scale(1); opacity: 1; }
      75% { transform: translate3d(-50%, -50%, 0) scale(1.05); opacity: 1; }
      100% { transform: translate3d(-50%, -50%, 0) scale(1.4); opacity: 0; filter: blur(8px); }
    }

    @keyframes s1-top-shatter {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; filter: brightness(1); }
      100% { transform: translate(70px, -80px) rotate(15deg); opacity: 0; filter: brightness(1.4); }
    }
    @keyframes s1-bottom-shatter {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; filter: brightness(1); }
      100% { transform: translate(-70px, 80px) rotate(-15deg); opacity: 0; filter: brightness(0.2); }
    }

    /* ====================================================
       远程同款：血液喷溅与暗红镜头暗角系统 (Blood FX)
       ==================================================== */
    @keyframes blood-splat-burst {
      0% { transform: scale(0.15) rotate(var(--splat-rot, 0deg)); opacity: 0; }
      25% { transform: scale(1.08) rotate(var(--splat-rot, 0deg)); opacity: 1; }
      40% { transform: scale(1) rotate(var(--splat-rot, 0deg)); opacity: 0.95; }
      80% { transform: scale(1) translateY(4px) rotate(var(--splat-rot, 0deg)); opacity: 0.85; }
      100% { transform: scale(1.05) translateY(10px) rotate(var(--splat-rot, 0deg)); opacity: 0; }
    }
    @keyframes blood-drip-flow {
      0% { transform: scaleY(0); opacity: 0; transform-origin: top; }
      30% { transform: scaleY(1); opacity: 0.95; }
      75% { transform: scaleY(1.05) translateY(6px); opacity: 0.85; }
      100% { transform: scaleY(1.1) translateY(14px); opacity: 0; }
    }
    @keyframes blood-vignette-pulse {
      0% { opacity: 0; transform: scale(0.9); }
      20% { opacity: 1; transform: scale(1); }
      75% { opacity: 0.85; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(1.05); }
    }

    /* 原版对比用：刺眼白闪 */
    @keyframes s2-screen-flash {
      0% { opacity: 0; }
      10% { opacity: 0.95; }
      30% { opacity: 0; }
      40% { opacity: 0.85; }
      100% { opacity: 0; }
    }
  </style>
</head>

  <script>
    let currentOption = 1;
    let isPlaying = false;

    const HERO = {
      name: '玛德琳',
      img: 'https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png'
    };

    const ENEMY_SINGLE = [{ name: '食尸鬼', emoji: '👻' }];
    const ENEMY_MULTI = [
      { name: '食尸鬼·队长', emoji: '👻' },
      { name: '食尸鬼·斥候', emoji: '💀' },
      { name: '食尸鬼·腐蚀者', emoji: '🧟' }
    ];

    // 音效缓存与预热
    const audioUrls = {
      'atk1': 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/atk1.mp3',
      'kill': 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/kill.mp3',
      'combatKill': 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/combat_kill.mp3'
    };
    const audioCache = {};
    for (let k in audioUrls) {
      audioCache[k] = new Audio(audioUrls[k]);
      audioCache[k].preload = 'auto';
    }
    function playAudio(k, vol = 0.8) {
      if (audioCache[k]) {
        try {
          const snd = audioCache[k].cloneNode();
          snd.volume = Math.min(1.0, vol);
          snd.play().catch(() => {});
        } catch(e) {}
      }
    }

    function triggerShake() {
      const scene = document.getElementById('battle-scene');
      if (!scene) return;
      scene.classList.add('heavy-shake');
      setTimeout(() => scene.classList.remove('heavy-shake'), 450);
    }

    // 远程同款：生成飞溅血花与自上而下血泪流淌
    function createBloodSplatterHtml(count = 5, dripCount = 2) {
      const splatters = [
        `M20,10 C35,2 50,15 45,30 C55,40 60,60 45,70 C30,80 15,65 10,50 C5,35 10,18 20,10 Z`,
        `M30,5 C45,5 55,20 50,35 C65,30 75,45 70,60 C55,75 40,70 30,80 C15,75 10,55 15,40 C5,25 20,10 30,5 Z`,
        `M15,20 C30,10 50,10 40,30 C55,35 60,55 45,65 C35,75 20,80 15,60 C5,45 5,30 15,20 Z`,
        `M25,12 C40,4 55,18 48,32 C60,42 62,65 48,72 C32,82 18,68 12,52 C8,38 12,20 25,12 Z`
      ];
      let splatItems = '';
      const positions = [
        { top: '16%', left: '18%', scale: 1.35, rot: -25, delay: '0.18s' },
        { top: '66%', left: '24%', scale: 1.15, rot: 45, delay: '0.22s' },
        { top: '24%', right: '18%', scale: 1.45, rot: 15, delay: '0.20s' },
        { top: '60%', right: '22%', scale: 1.25, rot: -60, delay: '0.24s' },
        { top: '44%', left: '48%', scale: 1.65, rot: 10, delay: '0.16s' },
        { top: '12%', left: '42%', scale: 1.1, rot: 75, delay: '0.25s' },
        { top: '78%', right: '35%', scale: 1.3, rot: -40, delay: '0.26s' },
        { top: '38%', left: '10%', scale: 1.2, rot: -15, delay: '0.21s' }
      ];
      
      for (let i = 0; i < Math.min(count, positions.length); i++) {
        const p = positions[i];
        const path = splatters[i % splatters.length];
        splatItems += `
          <div class="absolute pointer-events-none opacity-0 z-40"
               style="${p.top ? `top:${p.top};` : ''} ${p.left ? `left:${p.left};` : ''} ${p.right ? `right:${p.right};` : ''} width:140px; height:140px; --splat-rot:${p.rot}deg; animation: blood-splat-burst 1.1s ${p.delay} cubic-bezier(0.12, 0.85, 0.25, 1) both; will-change: transform, opacity;">
            <svg viewBox="0 0 100 100" class="w-full h-full fill-red-800 drop-shadow-[0_0_10px_#580c0c]" style="filter: drop-shadow(0 0 8px #3f0000);">
              <path d="${path}" />
              <circle cx="85" cy="20" r="4.5" class="fill-red-700"/>
              <circle cx="15" cy="88" r="4" class="fill-red-900"/>
              <circle cx="90" cy="75" r="5" class="fill-red-800"/>
              <circle cx="5" cy="15" r="3.5" class="fill-red-700"/>
            </svg>
          </div>`;
      }

      let drips = '';
      if (dripCount >= 1) {
        drips += `
          <div class="absolute top-0 right-[28%] w-1 bg-gradient-to-b from-red-700 via-red-900 to-transparent rounded-full opacity-0 z-40 pointer-events-none"
               style="height:140px; animation: blood-drip-flow 1.25s 0.22s ease-out both;"></div>`;
      }
      if (dripCount >= 2) {
        drips += `
          <div class="absolute top-0 left-[25%] w-1.5 bg-gradient-to-b from-red-800 via-red-950 to-transparent rounded-full opacity-0 z-40 pointer-events-none"
               style="height:170px; animation: blood-drip-flow 1.35s 0.18s ease-out both;"></div>`;
      }
      return splatItems + drips;
    }

    const DESCS = {
      1: '方案 1（推荐）：去除刺眼纯白闪光，替换为远程同款 5 朵有机喷溅血花与 2 串血泪流淌，配合边缘暗红暗角，极具暗黑电影感且完全不伤眼。',
      2: '方案 2（强化血阵）：增加至 8 朵全屏飞溅血花与强化版深暗红边缘 Vignette，适合追求极致暴力美学与打击反馈的视觉风格。',
      3: '方案 3（轻度血雾）：极简轻度暗红暗角 + 仅 2 朵细微血花，视觉极度清爽护眼，保留打击张力但极少遮挡。',
      4: '方案 4（对比用）：原版双段纯白光爆闪（0.25s 闪烁过曝），用于直观对比两种设计下的视觉刺眼程度。',
      5: '方案 5（群攻演示）：群攻近战多杀场景演示——多敌人阶梯收缩并排碎裂，居中水墨印章切换为「全 滅」，伴随全屏血溅。'
    };

    function switchOption(id) {
      currentOption = id;
      document.querySelectorAll('.style-tab').forEach((tab, idx) => {
        if (idx + 1 === id) {
          tab.className = 'style-tab px-3 py-1 bg-rose-950/90 border border-rose-400 text-rose-200 rounded-full text-xs font-bold transition-all shadow-[0_0_12px_rgba(244,63,94,0.4)]';
        } else {
          tab.className = 'style-tab px-3 py-1 bg-slate-900/60 border border-transparent hover:border-slate-600 text-slate-300 rounded-full text-xs font-bold transition-all';
        }
      });

      document.getElementById('option-desc').innerText = DESCS[id];
      playCurrent();
    }

    function playCurrent() {
      if (isPlaying) return;
      isPlaying = true;
      const root = document.getElementById('fx-root');
      root.innerHTML = '';

      switch (currentOption) {
        case 1: playIaiExecution(root, { mode: 'blood-standard', enemies: ENEMY_SINGLE }); break;
        case 2: playIaiExecution(root, { mode: 'blood-heavy', enemies: ENEMY_SINGLE }); break;
        case 3: playIaiExecution(root, { mode: 'blood-light', enemies: ENEMY_SINGLE }); break;
        case 4: playIaiExecution(root, { mode: 'white-flash', enemies: ENEMY_SINGLE }); break;
        case 5: playIaiExecution(root, { mode: 'blood-standard', enemies: ENEMY_MULTI }); break;
      }
    }

    function playIaiExecution(root, config) {
      const { mode, enemies } = config;
      const n = enemies.length;
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 bg-black/85 flex items-center justify-center overflow-hidden transition-opacity duration-300 pointer-events-none';

      // 敌人多目标自适应排版
      const unitSize = n > 2 ? 'clamp(38px,10vh,110px)' : n > 1 ? 'clamp(58px,15vh,150px)' : 'clamp(80px,18vh,170px)';
      const sizeCls = n > 2 ? 'text-[3rem] sm:text-[4.5rem]' : n > 1 ? 'text-[4rem] sm:text-[6rem]' : 'text-[5.5rem] sm:text-[8rem]';

      const enemiesHtml = enemies.map(enemy => `
        <div class="flex flex-col items-center gap-1 shrink-0">
          <div style="width:${unitSize};height:${unitSize};" class="relative flex items-center justify-center">
            <div class="absolute inset-0 flex items-center justify-center opacity-0 ${sizeCls} drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]"
                 style="clip-path: polygon(0 0, 100% 0, 100% 44%, 0 56%); animation: s1-top-shatter 0.8s 0.28s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">
              ${enemy.emoji}
            </div>
            <div class="absolute inset-0 flex items-center justify-center opacity-0 ${sizeCls} drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]"
                 style="clip-path: polygon(0 56%, 100% 44%, 100% 100%, 0 100%); animation: s1-bottom-shatter 0.8s 0.28s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">
              ${enemy.emoji}
            </div>
          </div>
          <div class="text-rose-300 text-[10px] sm:text-xs font-bold tracking-widest whitespace-nowrap drop-shadow">${enemy.name}</div>
        </div>
      `).join('');

      let flashOrBloodHtml = '';

      if (mode === 'white-flash') {
        // 原版刺眼白闪
        flashOrBloodHtml = `
          <div class="absolute inset-0 bg-white opacity-0 z-40 pointer-events-none"
               style="animation: s2-screen-flash 1.1s 0.25s ease-out both;"></div>`;
      } else if (mode === 'blood-standard') {
        // 标准血液飞溅 (5 朵血花 + 2 串流淌 + 暗红镜头暗角)
        flashOrBloodHtml = `
          <div class="absolute inset-0 pointer-events-none z-10 opacity-0"
               style="background: radial-gradient(circle, transparent 35%, rgba(136,8,8,0.45) 65%, rgba(63,0,0,0.85) 100%); animation: blood-vignette-pulse 1.1s cubic-bezier(0.1, 0.8, 0.2, 1) both;"></div>
          ${createBloodSplatterHtml(5, 2)}`;
      } else if (mode === 'blood-heavy') {
        // 浓烈血阵 (8 朵血花 + 2 串流淌 + 深红高浓暗角)
        flashOrBloodHtml = `
          <div class="absolute inset-0 pointer-events-none z-10 opacity-0"
               style="background: radial-gradient(circle, transparent 25%, rgba(160,10,10,0.55) 60%, rgba(80,0,0,0.92) 100%); animation: blood-vignette-pulse 1.15s cubic-bezier(0.1, 0.8, 0.2, 1) both;"></div>
          ${createBloodSplatterHtml(8, 2)}`;
      } else if (mode === 'blood-light') {
        // 轻度血雾 (微弱暗角 + 2 朵细微血花)
        flashOrBloodHtml = `
          <div class="absolute inset-0 pointer-events-none z-10 opacity-0"
               style="background: radial-gradient(circle, transparent 45%, rgba(120,8,8,0.3) 75%, rgba(50,0,0,0.65) 100%); animation: blood-vignette-pulse 1.0s cubic-bezier(0.1, 0.8, 0.2, 1) both;"></div>
          ${createBloodSplatterHtml(2, 0)}`;
      }

      overlay.innerHTML = `
        <!-- 1. 全屏光效 / 血液喷溅层 -->
        ${flashOrBloodHtml}

        <!-- 2. 全屏撕裂光带与锐利刀光核心 (GPU scaleY 驱动) -->
        <div class="absolute h-24 w-[180vw] bg-gradient-to-r from-transparent via-rose-600/50 to-transparent left-1/2 top-1/2 opacity-0 z-10"
             style="animation: s2-blade-flash 0.9s 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;"></div>
        <div class="absolute h-1.5 bg-rose-400 w-[180vw] left-1/2 top-1/2 opacity-0 z-20 shadow-[0_0_30px_#f43f5e,0_0_60px_#fff]"
             style="animation: s2-blade-flash 0.9s 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;"></div>

        <!-- 3. 英雄残影极速瞬步穿梭 (从左侧穿刺至右侧定格) -->
        <div class="absolute left-1/2 top-1/2 opacity-0 z-30" 
             style="animation: s2-hero-blur-dash 1.2s cubic-bezier(0.14, 1, 0.28, 1) both; will-change: transform, opacity, filter;">
          <div class="w-32 h-32 sm:w-44 sm:h-44 rounded-full border-4 border-rose-500 overflow-hidden shadow-[0_0_40px_#f43f5e] bg-black">
            <img src="${HERO.img}" class="w-full h-full object-cover">
          </div>
        </div>

        <!-- 4. 居中金石水墨印章大字「斬」/「全滅」-->
        <div class="absolute left-1/2 top-1/2 opacity-0 z-30 flex flex-col items-center pointer-events-none" 
             style="animation: s2-ink-stamp 1.2s 0.28s cubic-bezier(0.14, 1, 0.28, 1) both; will-change: transform, opacity;">
          <div class="font-cinzel text-[clamp(4.5rem,12vw,12rem)] font-black text-rose-500 text-outline-crimson tracking-wider drop-shadow-[0_0_50px_#e11d48]">
            ${n > 1 ? '全 滅' : '斬'}
          </div>
          <div class="text-rose-200 text-xs sm:text-base font-bold tracking-[0.8em] -mt-3 sm:-mt-5 uppercase drop-shadow">
            ${n > 1 ? 'ALL TARGETS NEUTRALIZED' : 'EXECUTION COMPLETE'}
          </div>
        </div>

        <!-- 5. 右侧被斩敌人碎裂区 (支持单体与多目标 flex 排布) -->
        <div class="absolute right-[12vw] top-1/2 -translate-y-1/2 z-20 flex items-center gap-2 sm:gap-4">
          ${enemiesHtml}
        </div>
      `;

      root.appendChild(overlay);

      // 音频时序
      playAudio('atk1', 1.0); // 拔刀破空音效

      setTimeout(() => {
        playAudio('combatKill', 1.0); // 处决高亢音效
        playAudio('kill', 0.9);        // 重击击碎
        triggerShake();
      }, 280);

      setTimeout(() => {
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.remove();
          isPlaying = false;
        }, 300);
      }, 1450);
    }

    // 快捷键监听
    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '5') {
        switchOption(parseInt(e.key));
      } else if (e.code === 'Space') {
        e.preventDefault();
        playCurrent();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(playCurrent, 400);
    });
  </script>
</body>
</html>
