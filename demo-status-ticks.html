<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>状态发作、解除与到期 · Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; overflow: hidden; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; overflow: hidden; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    /* ===== 状态发作、解除与到期 arcane-status-*（可移植） ===== */
    .arcane-status-anchor { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; }
    .arcane-status-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .arcane-status-host-rel { position: relative !important; }
    .arcane-status-persist-layer {
        position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: visible;
        transition: opacity 0.26s ease-out; will-change: opacity;
    }
    .arcane-status-persist-layer.exiting { opacity: 0 !important; }
    .arcane-status-flame-chip {
        position: absolute; pointer-events: none; transform-origin: 50% 92%;
        will-change: transform, opacity;
    }
    .arcane-status-flame-chip.f1 { left: 15%; bottom: 1px; width: 11px; height: 16px; animation: arcane-status-flame-flicker 1.25s ease-in-out infinite; }
    .arcane-status-flame-chip.f2 { left: 42%; bottom: -1px; width: 9px; height: 13px; animation: arcane-status-flame-flicker 1.05s ease-in-out -0.45s infinite; }
    .arcane-status-flame-chip.f3 { right: 15%; bottom: 2px; width: 10px; height: 15px; animation: arcane-status-flame-flicker 1.42s ease-in-out -0.78s infinite; }
    .arcane-status-ember-dot {
        position: absolute; width: 2.5px; height: 2.5px; border-radius: 50%; pointer-events: none;
        background: #fde047; box-shadow: 0 0 4px #f97316; will-change: transform, opacity;
    }
    .arcane-status-ember-dot.e1 { left: 26%; bottom: 10%; animation: arcane-status-ember-float 1.6s ease-out infinite; }
    .arcane-status-ember-dot.e2 { right: 24%; bottom: 12%; animation: arcane-status-ember-float 1.85s ease-out -0.82s infinite; }
    @keyframes arcane-status-flame-flicker {
        0%, 100% { transform: translateY(0) scale(0.92, 0.9) skewX(-3deg); opacity: 0.72; }
        35% { transform: translateY(-2px) scale(1.06, 1.12) skewX(3deg); opacity: 0.94; }
        70% { transform: translateY(-1px) scale(0.96, 1.02) skewX(-2deg); opacity: 0.8; }
    }
    @keyframes arcane-status-ember-float {
        0% { transform: translate3d(0, 2px, 0) scale(0.6); opacity: 0; }
        25% { opacity: 0.92; }
        100% { transform: translate3d(3px, -16px, 0) scale(0.35); opacity: 0; }
    }
    .arcane-status-bubble-dot {
        position: absolute; border-radius: 50%; pointer-events: none;
        border: 1px solid rgba(216, 180, 254, 0.82);
        background: radial-gradient(circle at 32% 30%, rgba(243, 232, 255, 0.88) 0%, rgba(168, 85, 247, 0.48) 55%, rgba(107, 33, 168, 0.75) 100%);
        will-change: transform, opacity;
    }
    .arcane-status-bubble-dot.b1 { right: 12%; top: 44%; width: 6px; height: 6px; animation: arcane-status-bubble-drift 2.1s ease-out infinite; }
    .arcane-status-bubble-dot.b2 { right: 25%; top: 34%; width: 5px; height: 5px; animation: arcane-status-bubble-drift 2.45s ease-out -0.85s infinite; }
    .arcane-status-bubble-dot.b3 { right: 17%; top: 24%; width: 7px; height: 7px; animation: arcane-status-bubble-drift 1.95s ease-out -1.45s infinite; }
    @keyframes arcane-status-bubble-drift {
        0% { opacity: 0; transform: translate3d(0, 6px, 0) scale(0.5); }
        22% { opacity: 0.92; transform: translate3d(1px, 1px, 0) scale(0.95); }
        76% { opacity: 0.86; transform: translate3d(-1.5px, -10px, 0) scale(1.08); }
        90% { opacity: 0.9; transform: translate3d(-1px, -13px, 0) scale(1.24); }
        100% { opacity: 0; transform: translate3d(-1px, -15px, 0) scale(0.35); }
    }
    .arcane-status-zap-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    .arcane-status-zap-bolt { opacity: 0; will-change: opacity, transform; transform-origin: 50% 50%; }
    .arcane-status-zap-bolt.z1 { animation: arcane-status-zap-a 1.28s steps(1) infinite; }
    .arcane-status-zap-bolt.z2 { animation: arcane-status-zap-b 1.44s steps(1) -0.46s infinite; }
    .arcane-status-zap-bolt.z3 { animation: arcane-status-zap-c 1.16s steps(1) -0.78s infinite; }
    @keyframes arcane-status-zap-a {
        0%, 38%, 74%, 100% { opacity: 0.96; transform: translate3d(0, 0, 0); }
        18%, 62%, 88% { opacity: 0.16; transform: translate3d(1px, -1px, 0); }
        26%, 50%, 82% { opacity: 1; transform: translate3d(-1px, 1px, 0); }
        68% { opacity: 0; }
    }
    @keyframes arcane-status-zap-b {
        0%, 28%, 66% { opacity: 0.12; }
        10%, 46%, 80%, 94% { opacity: 0.98; transform: translate3d(-1px, 0, 0); }
        20%, 56%, 88% { opacity: 0.58; transform: translate3d(1px, 1px, 0); }
        38%, 72% { opacity: 0; }
    }
    @keyframes arcane-status-zap-c {
        0%, 44%, 76% { opacity: 0; }
        12%, 52%, 86% { opacity: 0.96; transform: translate3d(1px, -1px, 0); }
        24%, 64%, 95% { opacity: 0.45; transform: translate3d(-1px, 0, 0); }
    }
    @keyframes arcane-status-badge-pulse {
        0%, 100% { opacity: 1; box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.35), 0 0 5px rgba(245, 158, 11, 0.25); }
        50% { opacity: 0.54; box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.78), 0 0 9px rgba(245, 158, 11, 0.52); }
    }
    .arcane-status-badge-expiring {
        color: #fde68a !important;
        background: rgba(120, 53, 15, 0.88) !important;
        border-color: rgba(245, 158, 11, 0.92) !important;
        animation: arcane-status-badge-pulse 2s ease-in-out infinite;
    }
    .arcane-status-badge-fading { opacity: 0 !important; transform: translateY(-4px) scale(0.92); transition: opacity 0.22s ease-out, transform 0.22s ease-out; }
    /* 演示对照辅助样式（狂暴/眩晕/分组/飘字：正式版已自带狂暴与眩晕，移植时只取 arcane-status-*） */
    .arcane-status-group-hd { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; color: #94a3b8; padding: 4px 6px 2px; border-bottom: 1px solid rgba(148,163,184,0.16); margin-top: 2px; display: flex; justify-content: space-between; align-items: center; }
    @keyframes arcane-status-float-up {
        0% { opacity: 0; transform: translate(-50%, 6px) scale(0.84); }
        18% { opacity: 1; transform: translate(-50%, -8px) scale(1.12); }
        78% { opacity: 1; transform: translate(-50%, -22px) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -34px) scale(0.92); }
    }
    .arcane-status-float-text {
        position: fixed; pointer-events-none; pointer-events: none; z-index: 66; white-space: nowrap; font-weight: 800;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7);
        animation: arcane-status-float-up 1.1s ease-out forwards;
    }
    .stun-fx { display: flex; align-items: center; gap: 4px; filter: drop-shadow(0 0 6px rgba(251,191,36,0.85)); animation: arcane-status-stun-sway 1.1s ease-in-out infinite; }
    .stun-fx.hidden { display: none !important; }
    .stun-star { font-size: 11px; line-height: 1; color: #fde047; text-shadow: 0 0 8px rgba(251,191,36,0.95), 0 1px 2px rgba(0,0,0,0.8); }
    @keyframes arcane-status-stun-sway { 0%, 100% { transform: translateX(-50%) rotate(-3deg); } 50% { transform: translateX(-50%) rotate(3deg); } }
    @keyframes arcane-status-demo-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-1.5deg); } 50% { transform: translateX(4px) rotate(1.5deg); } 75% { transform: translateX(-3px) rotate(-0.8deg); } }
    .demo-stun-shake { animation: arcane-status-demo-shake 0.4s ease-in-out; }
    .arcane-variant-rage-sprite { filter: drop-shadow(0 0 7px rgba(239, 68, 68, 0.85)) drop-shadow(0 0 18px rgba(185, 28, 28, 0.58)) drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5)); }
    .arcane-variant-rage-fx { position: absolute; inset: -3px; border-radius: 8px; pointer-events: none; z-index: 19; overflow: hidden; box-shadow: inset 0 0 18px rgba(220, 38, 38, 0.42), 0 0 16px rgba(220, 38, 38, 0.4); }
    .arcane-variant-rage-fx.is-sprite { inset: -26px -30px; box-shadow: none; border-radius: 50%; z-index: -1; overflow: visible; background: radial-gradient(ellipse closest-side at 50% 56%, rgba(220, 38, 38, 0.34) 0%, rgba(127, 29, 29, 0.14) 58%, transparent 100%); }
    .arcane-variant-rage-fx::before { content: ''; position: absolute; left: 0; right: 0; top: 8%; bottom: -6%; background: radial-gradient(ellipse closest-side at 50% 62%, rgba(239, 68, 68, 0.34) 0%, rgba(127, 29, 29, 0.14) 55%, transparent 100%); animation: arcane-variant-rage-heat 2.2s linear infinite; }
    @keyframes arcane-variant-rage-heat { 0% { transform: translateY(8%) scaleX(0.96); opacity: 0.65; } 50% { transform: translateY(-7%) scaleX(1.04); opacity: 0.9; } 100% { transform: translateY(8%) scaleX(0.96); opacity: 0.65; } }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->
  <div class="absolute top-2 sm:top-4 right-2 sm:right-4 z-[115] flex gap-1.5 sm:gap-2">
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-violet-400 hover:text-violet-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📚</span> <span class="hidden sm:inline">世界书</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-purple-400 hover:text-purple-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📜</span> <span class="hidden sm:inline">记录</span></button>

 </div>
  <script>
    // ===== 演示宿主 BEGIN：占位数据、渲染、fxEngine；不移植到正式版 =====
    const $ = s => document.querySelector(s);
    let combatToken = 0;
    let heroesData = [], enemiesData = [];
    const HERO_AVATARS = {
        '埃利奥特': 'https://imgur.la/images/2026/06/25/31a4dd84a831e3f76082542bf12fcf19.png',

class CanvasFxEngine {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }
}

    // 普通/反应演练及完整可运行接入示例见根目录《技能SVG模板使用与快速移植.md》。
    // ===== 状态发作、解除与到期演出（可移植至 index.html arcaneVfxModule） =====
    const ST = { persists: new Map(), sfxAt: new Map() };

    function statusRun(totalMs) {

        };

        owner.anim = (el, kf, opts) => { const a = el.animate(kf, opts); owner.animations.add(a); return a; };
        owner.addP = opts => addP(Object.assign({ owner }, opts));

            if (owner.finished) return;

    }
    function buildStatusPersistHtml(kind) {

                + `<span class="arcane-status-flame-chip f2">${flameSvg('M2.2,17 Q2,11 5.8,3 Q9.8,10 9.4,17 Z')}</span>`
                + `<span class="arcane-status-flame-chip f3">${flameSvg('M2,17 Q1.8,9.5 6.4,2 Q10.4,10.5 9.6,17 Z')}</span>`
                + '<span class="arcane-status-ember-dot e1"></span><span class="arcane-status-ember-dot e2"></span>';

                + `<polyline points="${pts}" fill="none" stroke="#0f172a" stroke-width="6.8" stroke-linejoin="bevel" stroke-linecap="round" opacity="0.78"/>`
                + `<polyline points="${pts}" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linejoin="bevel" stroke-linecap="round" opacity="0.96"/>`
                + `<polyline points="${pts}" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linejoin="bevel" stroke-linecap="miter"/>`
                + `<polyline points="${pts}" fill="none" stroke="#f0f9ff" stroke-width="1.25" stroke-linejoin="bevel" stroke-linecap="butt"/>`
                + `<polyline points="${pts}" fill="none" stroke="#fde047" stroke-width="0.7" stroke-dasharray="6 9" stroke-linejoin="bevel"/>`
                + `</g>`;
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" class="arcane-status-zap-svg">`
                + arc('z1', '10,28 29,14 24,31 49,17 44,34 68,21')
                + arc('z2', '32,79 51,62 46,77 72,56 66,73 91,54')

    }
    function setStatusPersist(dom, kind, active) {

            if (!node) {

    function syncStatusLayers(entity) {

        const buffs = entity.buffs || [];
        const has = t => buffs.some(b => b.type === t && (b.duration > 0 || b.permanent));

    function clearStatusLayers(entityOrId) {
        if (entityOrId) {

                dom.querySelectorAll('[data-arcane-status-persist]').forEach(n => {
                    if (n._exitTimer) { clearTimeout(n._exitTimer); S.timers.delete(n._exitTimer); }
                    n.remove();

                if (host) host.classList.remove('arcane-status-host-rel');
                dom.classList.remove('arcane-status-host-rel');

            }
            return;
        }
        ST.persists.forEach((set, dom) => {
            set.forEach(n => {
                if (n._exitTimer) { clearTimeout(n._exitTimer); S.timers.delete(n._exitTimer); }
                n.remove();
            });
            const host = dom && dom.isConnected ? resolveStatusIconHost(dom) : null;
            if (host) host.classList.remove('arcane-status-host-rel');
            if (dom && dom.isConnected) dom.classList.remove('arcane-status-host-rel');

        ST.sfxAt.clear();

            if (n._exitTimer) { clearTimeout(n._exitTimer); S.timers.delete(n._exitTimer); }
            n.remove();

    }
    // 1. 中毒发作：局部紫纹微渗 → 依层 2~4 毒泡从图标右/上方浮出破裂 → 细毒雾上浮 (L1 · 540ms)
    function playStatusPoisonTick(entity, meta = {}, onBeat) {
        const dom = domOf(entity); if (!dom) return null;
        const r = statusVisualRect(dom); if (!r) return null;
        const layers = Math.max(1, Math.min(5, Number(meta.layers) || 1));
        const bubbleCount = layers >= 3 ? 4 : (layers === 2 ? 3 : 2);
        const owner = statusRun(540), uid = 'arcane-status-poison-' + (++S.uid), pan = statusPanOf(r.x);
        const W = Math.max(96, r.w * 1.18), H = Math.max(96, r.h * 1.18), cx = W / 2, cy = H / 2, rw = r.w * 0.42, rh = r.h * 0.42;
        const wispSet = [
            `M${cx + rw * 0.14},${cy + rh * 0.25} L${cx + rw * 0.34},${cy - rh * 0.08} L${cx + rw * 0.28},${cy - rh * 0.32}`,
            `M${cx - rw * 0.28},${cy + rh * 0.18} L${cx - rw * 0.14},${cy - rh * 0.12} L${cx - rw * 0.22},${cy - rh * 0.34}`,

            `M${cx - rw * 0.1},${cy + rh * 0.28} L${cx + rw * 0.16},${cy + rh * 0.1}`,
            `M${cx + rw * 0.34},${cy + rh * 0.18} L${cx + rw * 0.46},${cy - rh * 0.18}`

    // 2. 燃烧发作：图标底部/表面细火苗涌起 → 锐利火星闪爆 → 黑灰余烬上飘；不叠层强度恒定 (L1 · 540ms)

    // 2B. 燃烧禁疗轻提示：治疗光落于燃烧目标瞬间被暗橙火苗压灭 ~200ms (L1 · 240ms)

    // 3. 麻痹僵直触发（高对比双边锐利蓝电裂过图标 + 耗层电晶飞溅）与未命中对照组
    function playStatusParaProc(entity, meta = {}, onBeat) {

        const r = statusVisualRect(dom); if (!r) return null;

        const W = Math.max(108, r.w * 1.28), H = Math.max(108, r.h * 1.28), cx = W / 2, cy = H / 2, rw = r.w * 0.46, rh = r.h * 0.46;
        const boltPts = [

            `${(cx - rw * 0.78).toFixed(1)},${(cy + rh * 0.42).toFixed(1)} ${(cx - rw * 0.16).toFixed(1)},${(cy + rh * 0.12).toFixed(1)} ${(cx - rw * 0.26).toFixed(1)},${(cy + rh * 0.48).toFixed(1)} ${(cx + rw * 0.34).toFixed(1)},${(cy + rh * 0.08).toFixed(1)} ${(cx + rw * 0.82).toFixed(1)},${(cy + rh * 0.34).toFixed(1)}`,

    // 4. 净化消散：淡金/白波纹自上而下扫过 → 最多 3 束对应色碎屑剥离 → 清透收尾；无负面仅轻波纹 (L1~L2 · 740ms)
    function playStatusDispel(entity, meta = {}, onBeat) {
        const dom = domOf(entity); if (!dom) return null;
        const r = statusVisualRect(dom); if (!r) return null;
        const removed = Array.isArray(meta.removedTypes) ? meta.removedTypes : [];
        const colMap = meta.removedColors || {};
        const cOf = t => colMap[t] || STATUS_COLORS[t] || '#c084fc';
        const hasDebuff = removed.length > 0;
        const owner = statusRun(hasDebuff ? 740 : 420), uid = 'arcane-status-dispel-' + (++S.uid), pan = statusPanOf(r.x);
        const W = Math.max(135, r.w * 1.85), H = Math.max(135, r.h * 1.85), cx = W / 2, cy = H / 2, rw = r.w * 0.48, rh = r.h * 0.48;
        const streams = !hasDebuff ? [] : (removed.length <= 3
            ? removed.map(t => ({ colors: [cOf(t)] }))
            : [{ colors: [cOf(removed[0])] }, { colors: [cOf(removed[1])] }, { colors: removed.slice(2).map(cOf) }]);
        const sideDir = r.x > window.innerWidth * 0.55 ? -1 : 1;
        const fragsHtml = streams.map((st, sIdx) => {
            const baseAng = sideDir > 0 ? (-Math.PI * 0.38 + (sIdx - (streams.length - 1) / 2) * 0.55) : (-Math.PI * 0.62 + (sIdx - (streams.length - 1) / 2) * 0.55);
            return [0, 1, 2].map(j => {
                const col = st.colors[j % st.colors.length];
                const ang = baseAng + (j - 1) * 0.16, dist = 42 + j * 14;
                const x0 = cx + Math.cos(ang) * rw * 0.35, y0 = cy + (sIdx - 1) * rh * 0.22;
                const fx = (Math.cos(ang) * dist).toFixed(1), fy = (Math.sin(ang) * dist - 8).toFixed(1);
                return `<g class="s-dispel-frag" data-fx="${fx}" data-fy="${fy}" data-rot="${((sideDir * (26 + j * 18))).toFixed(0)}" style="transform-origin:${x0.toFixed(1)}px ${y0.toFixed(1)}px;opacity:0">`
                    + `<path d="M${(x0 - 7).toFixed(1)},${(y0 - 3).toFixed(1)} Q${x0.toFixed(1)},${(y0 - 9).toFixed(1)} ${(x0 + 8).toFixed(1)},${(y0 - 1).toFixed(1)} Q${(x0 + 4).toFixed(1)},${(y0 + 7).toFixed(1)} ${(x0 - 6).toFixed(1)},${(y0 + 4).toFixed(1)} Z" fill="${col}" opacity="0.88"/>`
                    + `<path d="M${(x0 - 5).toFixed(1)},${(y0 - 2).toFixed(1)} Q${x0.toFixed(1)},${(y0 - 7).toFixed(1)} ${(x0 + 6).toFixed(1)},${(y0 - 1).toFixed(1)}" fill="none" stroke="#fef9c3" stroke-width="1.2" opacity="0.8"/></g>`;

        const layer = owner.layer(

            + `<svg class="arcane-status-svg" viewBox="0 0 ${W} ${H}"><defs>${statusGlowDef(uid + '-gl', 3)}`
            + `<linearGradient id="${uid}-wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef9c3" stop-opacity="0"/><stop offset="0.35" stop-color="#fef3c7" stop-opacity="0.65"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.92"/><stop offset="0.82" stop-color="#fde68a" stop-opacity="0.35"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></linearGradient>`
            + `<radialGradient id="${uid}-cl"><stop offset="0" stop-color="#ffffff" stop-opacity="0.48"/><stop offset="0.6" stop-color="#fef3c7" stop-opacity="0.2"/><stop offset="1" stop-color="#fef3c7" stop-opacity="0"/></radialGradient>`
            + `</defs><g class="s-wave" filter="url(#${uid}-gl)" opacity="0">`
            + `<ellipse cx="${cx}" cy="${cy}" rx="${rw * 1.16}" ry="${rh * 0.28}" fill="url(#${uid}-wv)"/>`
            + `<path d="M${cx - rw * 1.05},${cy} Q${cx},${cy + rh * 0.14} ${cx + rw * 1.05},${cy}" fill="none" stroke="#fffbeb" stroke-width="${hasDebuff ? 2.2 : 1.4}" stroke-linecap="round" opacity="0.88"/></g>`
            + `<circle class="s-clean" cx="${cx}" cy="${cy}" r="${Math.max(rw, rh) * 1.15}" fill="url(#${uid}-cl)" opacity="0" style="transform-origin:${cx}px ${cy}px"/>`

        const gSfx = statusSfxGate('dispel', 75);
        if (gSfx > 0 && hasDebuff) playStatusSample('expire', { pan, vol: 0.20 * gSfx, rate: 1.15 });
        owner.at(160, () => {
            if (onBeat) onBeat({ event: 'dispel', entity, removedTypes: removed });
            if (!hasDebuff) return;
            if (clean) owner.anim(clean, [{ opacity: 0, transform: 'scale(0.75)' }, { opacity: 0.72, transform: 'scale(1.05)', offset: 0.4 }, { opacity: 0, transform: 'scale(1.16)' }], { duration: 360, easing: 'ease-out', fill: 'forwards' });
            layer.querySelectorAll('.s-dispel-frag').forEach((g, idx) => {
                owner.anim(g, [{ opacity: 0.95, transform: 'translate(0px,0px) scale(0.95) rotate(0deg)' }, { opacity: 0.88, transform: `translate(${Number(g.dataset.fx) * 0.55}px,${Number(g.dataset.fy) * 0.55}px) scale(1) rotate(${Number(g.dataset.rot) * 0.5}deg)`, offset: 0.45 }, { opacity: 0, transform: `translate(${g.dataset.fx}px,${g.dataset.fy}px) scale(0.4) rotate(${g.dataset.rot}deg)` }], { duration: 480, easing: 'cubic-bezier(0.2,0.8,0.3,1)', delay: idx * 18, fill: 'forwards' });

    // 5. 到期消散：对应色微粒被动轻蒸发 + 徽章淡出 (L1 · 420ms，显著轻于驱散)
    function playStatusExpire(entity, meta = {}, onBeat) {
        const dom = domOf(entity); if (!dom) return null;
        const r = statusVisualRect(dom); if (!r) return null;
        const id = statusEntityId(entity);
        const types = Array.isArray(meta.expiredTypes) ? meta.expiredTypes : (meta.expiredType ? [meta.expiredType] : ['poison']);
        const colMap = meta.expiredColors || {};
        const colors = types.map(t => colMap[t] || STATUS_COLORS[t] || '#cbd5e1');
        const owner = statusRun(420), pan = statusPanOf(r.x);
        const gSfx = statusSfxGate('expire', 70);
        if (gSfx > 0) playStatusSample('expire', { pan, vol: 0.36 * gSfx, rate: 1.0 });
        const badgeBox = id ? document.getElementById(`${id}-buffs`) : null;
        if (badgeBox) types.forEach(t => {
            const b = badgeBox.querySelector(`[data-buff-type="${t}"]`);
            if (b) b.classList.add('arcane-status-badge-fading');
        });
        owner.burst(8, i => {
            const c = colors[i % colors.length];
            return { x: r.x + rnd(-r.w * 0.38, r.w * 0.38), y: r.y + rnd(-r.h * 0.25, r.h * 0.25), vx: rnd(-0.32, 0.32), vy: rnd(-1.35, -0.65), drag: 0.96, decay: rnd(0.036, 0.052), size: rnd(2.2, 3.8), shape: 'glowOrb', core: '#f8fafc', color: c };
        });
        owner.at(160, () => { if (onBeat) onBeat({ event: 'expire', entity, expiredTypes: types }); });
        return owner.handle;
    }

    function playStatusTickFx(opts = {}) {
        const { event, entity, meta = {}, onBeat } = opts;
        if (event === 'poisonTick') return playStatusPoisonTick(entity, meta, onBeat);
        if (event === 'burnTick') return playStatusBurnTick(entity, meta, onBeat);
        if (event === 'healSuppressed') return playStatusHealSuppressed(entity, meta, onBeat);
        if (event === 'paraProc') return playStatusParaProc(entity, meta, onBeat);
        if (event === 'paraMiss') return playStatusParaMiss(entity, meta, onBeat);
        if (event === 'dispel') return playStatusDispel(entity, meta, onBeat);
        if (event === 'expire') return playStatusExpire(entity, meta, onBeat);
        return null;
    }

    function playArcaneProjectile(type, fromDom, toDom, dodged = false) {
        if (!fromDom || !toDom || !fromDom.getBoundingClientRect || !toDom.getBoundingClientRect) return Promise.resolve();
        const token = combatToken;
        ensureCanvas(); ensureDriver();
        if (type === 'fire') fireProjectile(fromDom, toDom, !!dodged, token);
        else if (type === 'enemy_spell') enemySpellProjectile(fromDom, toDom, !!dodged, token);
        const beat = type === 'fire' ? 580 : 480;
        return new Promise(res => {
            const id = setTimeout(() => { S.rawTimers.delete(id); res(); }, beat);
            S.rawTimers.set(id, res);
        });
    }
    function clearArcaneFx() {
        S.timers.forEach(id => clearTimeout(id)); S.timers.clear();
        S.rawTimers.forEach((resolve, id) => { clearTimeout(id); resolve(); }); S.rawTimers.clear();
        S.intervals.forEach(id => clearInterval(id)); S.intervals.clear();
        S.flights.length = 0; S.particles.length = 0;
        S.particleTimer = null; S.particleUntil = 0;
        if (S.driver) { const idx = fxEngine.particles.indexOf(S.driver); if (idx >= 0) fxEngine.particles.splice(idx, 1); S.driver = null; }
        S.handles.forEach(h => { if (h && h.cancel) h.cancel(); }); S.handles.clear();
        S.layers.forEach(d => d.remove()); S.layers.clear();
        S.anchors.forEach(d => d.remove()); S.anchors.clear();
        S.flashes.forEach(el => el.classList.remove('arcane-flash-cold', 'arcane-flash-heal')); S.flashes.clear();

        if (S.dark) { S.dark.remove(); S.dark = null; }
        clearStatusLayers();
        if (window.__stopStatusSamples) window.__stopStatusSamples();

        if (card.event === 'coexistBurnRage') {
            setDemoRageOverlay(e, true);
            beatStatEl.textContent = '火苗+狂暴共存';
            demoAt(320, () => {
                arcaneVfxModule.playStatusBurnTick(e, {}, () => {
                    updateDemoHp(e, e.hp - 26);
                    spawnDemoFloat(e, '火 -26', 'text-orange-400');
                });
            });
            demoAt(1050, () => {
                beatStatEl.textContent = '燃消散·狂暴留存';
                arcaneVfxModule.playStatusExpire(e, { expiredTypes: ['burn'] }, () => {
                    e.buffs = []; window.renderDemoEntityBuffs(e);
                    spawnDemoFloat(e, '火苗移除(狂暴保留)', 'text-amber-200');
                });
            });
            return 1520;
        }
        if (card.event === 'multiTick') {
            const ids = card.meta.targets || ['e1', 'e2', 'e3', 'e4'], stepMs = card.meta.staggerMs || 40;
            beatStatEl.textContent = '多目标40ms错峰';
            ids.forEach((id, idx) => demoAt(idx * stepMs, () => {
                const t = entityOf(id); if (!t) return;
                const isBurn = (t.buffs || []).some(b => b.type === 'burn');
                if (isBurn) {
                    arcaneVfxModule.playStatusBurnTick(t, {}, () => { updateDemoHp(t, t.hp - 25); spawnDemoFloat(t, '火 -25', 'text-orange-400'); });
                } else {
                    const layers = (t.buffs || []).filter(b => b.type === 'poison').length || 1;
                    arcaneVfxModule.playStatusPoisonTick(t, { layers }, () => { updateDemoHp(t, t.hp - 15 * layers); spawnDemoFloat(t, '毒 -' + (15 * layers), 'text-purple-400'); });
                }
            }));
            return 720;
        }
        if (card.event === 'stressChain') {
            beatStatEl.textContent = '连发压测(可随时重置)';
            arcaneVfxModule.playStatusPoisonTick(e, { layers: 2 }, () => { updateDemoHp(e, e.hp - 36); spawnDemoFloat(e, '毒 -36', 'text-purple-400'); });
            demoAt(280, () => arcaneVfxModule.playStatusBurnTick(e, {}, () => { updateDemoHp(e, e.hp - 24); spawnDemoFloat(e, '火 -24', 'text-orange-400'); }));
            demoAt(560, () => arcaneVfxModule.playStatusParaProc(e, { triggered: true }, () => {
                const idx = (e.buffs || []).findIndex(b => b.type === 'paralyze');
                if (idx >= 0) e.buffs.splice(idx, 1);
                window.renderDemoEntityBuffs(e);
                spawnDemoFloat(e, '麻痹僵直', 'text-yellow-300');
            }));
            demoAt(980, () => arcaneVfxModule.playStatusExpire(e, { expiredTypes: ['poison', 'burn', 'paralyze'] }, () => {
                e.buffs = []; window.renderDemoEntityBuffs(e);
                spawnDemoFloat(e, '状态全部到期', 'text-slate-300');
            }));
            return 1750;
        }
        return 0;
    }
    function playDemoSkill(card) {

    function renderSkillCards() {
        const list = $('#skill-list');
        list.replaceChildren();
        const BADGE_CLS = { L1: 'border-cyan-500/60 text-cyan-300', L2: 'border-amber-400/70 text-amber-300', 对照: 'border-slate-500/60 text-slate-300', 对比: 'border-violet-400/70 text-violet-300', 共存: 'border-rose-400/70 text-rose-300', 压测: 'border-fuchsia-400/70 text-fuchsia-300' };
        DEMO_GROUPS.forEach(group => {
            if (group.hidden) return;
            const hd = document.createElement('div');
            hd.className = 'arcane-status-group-hd';
            hd.innerHTML = `<span>${group.title}</span><span class="text-[8px] text-amber-400/80">${group.badge}</span>`;
            list.appendChild(hd);
            group.items.forEach(card => {
                const button = document.createElement('button');
                button.className = 'card w-full py-1.5 px-2 bg-slate-900/80 hover:bg-violet-950/60 border border-slate-700/80 hover:border-violet-500/60 rounded-lg text-left transition-all shadow-sm';
                button.title = card.description;
                button.innerHTML = '<div class="flex items-center justify-between gap-1"><span class="text-xs font-bold text-slate-100 truncate"></span><span class="text-[9px] font-bold px-1 rounded border shrink-0"></span></div><div class="text-[9px] text-slate-400 truncate"></div>';
                const labels = button.querySelectorAll('span');
                labels[0].textContent = card.name;
                labels[1].textContent = card.level;
                labels[1].className = 'text-[9px] font-bold px-1 rounded border shrink-0 ' + (BADGE_CLS[card.level] || 'border-cyan-500/60 text-cyan-300');
                button.lastElementChild.textContent = card.description;
                button.addEventListener('click', () => playDemoSkill(card));
                list.appendChild(button);
            });
        });
    }

    (function initStatusAudioHost() {
        let sCtx = null;
        const decoded = new Map(), pending = new Map(), activeVoices = new Set();
        function syncAudioAttr() {
            const root = document.documentElement;
            if (!root) return;
            root.setAttribute('data-status-audio-decoded', Array.from(decoded.keys()).join(','));
            root.setAttribute('data-status-audio-active', String(activeVoices.size));
        }
        function ensureCtx() {
            if (!sCtx || sCtx.state === 'closed') {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) sCtx = new AC();
            }
            if (sCtx && sCtx.state === 'suspended') sCtx.resume().catch(() => {});
            return sCtx;
        }
        function decodeSample(key) {
            const b64 = STATUS_SAMPLE_B64[key], c = ensureCtx();
            if (!b64 || b64.startsWith('/*') || !c) return Promise.resolve(null);
            if (decoded.has(key)) return Promise.resolve(decoded.get(key));
            if (pending.has(key)) return pending.get(key);
            try {
                const raw = atob(b64), arr = new Uint8Array(raw.length);
                for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
                const p = c.decodeAudioData(arr.buffer.slice(0)).then(buf => {
                    decoded.set(key, buf); pending.delete(key); syncAudioAttr(); return buf;
                }).catch(err => {
                    pending.delete(key);
                    document.documentElement.setAttribute('data-status-audio-err', key + ':' + (err && err.message || 'decode'));
                    return null;
                });
                pending.set(key, p);
                return p;
            } catch (err) {
                document.documentElement.setAttribute('data-status-audio-err', key + ':' + (err && err.message || 'atob'));
                return Promise.resolve(null);
            }
        }
        function playBuf(buf, { volume = 0.3, pan = 0, rate = 1 } = {}) {
            const c = ensureCtx(); if (!c || !buf) return;
            const src = c.createBufferSource();
            src.buffer = buf;
            if (src.playbackRate) src.playbackRate.value = Math.max(0.5, Math.min(2.0, Number(rate) || 1));
            const gain = c.createGain();
            gain.gain.value = Math.max(0, Math.min(1, Number(volume) || 0.3));
            if (typeof c.createStereoPanner === 'function') {
                const p = c.createStereoPanner();
                p.pan.value = Math.max(-1, Math.min(1, Number(pan) || 0));
                src.connect(gain); gain.connect(p); p.connect(c.destination);
            } else {
                src.connect(gain); gain.connect(c.destination);
            }
            const voice = { src };
            activeVoices.add(voice); syncAudioAttr();
            src.onended = () => { activeVoices.delete(voice); syncAudioAttr(); };
            try { src.start(0); } catch { activeVoices.delete(voice); syncAudioAttr(); }
        }
        document.addEventListener('pointerdown', () => Object.keys(STATUS_SAMPLE_B64).forEach(decodeSample), { once: true });
        syncAudioAttr();
        window.__playStatusSample = function (key, opts) {
            if (!STATUS_SAMPLE_B64[key] || STATUS_SAMPLE_B64[key].startsWith('/*')) return false;
            if (decoded.has(key)) { playBuf(decoded.get(key), opts); return true; }
            const tok = combatToken;
            decodeSample(key).then(buf => { if (buf && tok === combatToken) playBuf(buf, opts); });
            return true;
        };
        window.__stopStatusSamples = function () {
            activeVoices.forEach(v => { try { v.src.stop(0); } catch {} });
            activeVoices.clear(); syncAudioAttr();
        };
        window.__statusAudioStats = () => ({ keys: Object.keys(STATUS_SAMPLE_B64), decoded: Array.from(decoded.keys()), activeCount: activeVoices.size });
    })();
