<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
  <link rel="icon" href="data:,">
  <title>战棋 P00 技术探针</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.45 system-ui, sans-serif; color: #e3e9f2; background: #0b111b; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1480px, calc(100% - 56px)); margin: 24px auto; }
    h1 { font-size: 28px; letter-spacing: .02em; margin: 0; }
    header p { color: #aabbd0; margin: 5px 0 15px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
    button { color: #ecf4ff; background: #19273a; border: 1px solid #415772; border-radius: 7px; padding: 7px 13px; font: inherit; cursor: pointer; }
    button:hover { background: #273b53; }
    button:focus-visible { outline: 2px solid #86dae0; outline-offset: 2px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 16px; align-items: start; }
    #stage { width: 100%; max-height: min(530px, calc(100vh - 240px)); aspect-ratio: 1000 / 520; background: #101a29; outline: 1px solid #304159; border-radius: 8px; overflow: hidden; }
    canvas { display: block; cursor: crosshair; }
    aside { border: 1px solid #304159; border-radius: 8px; background: #121e2d; padding: 12px 14px; }
    aside h2 { font-size: 16px; margin: 0 0 8px; }
    aside p { margin: 7px 0 0; }
    .note { color: #aabbd0; }
    output { display: block; overflow-wrap: anywhere; }
    #click { color: #ffd099; min-height: 3em; margin-top: 8px; }
    #status, #camera, #route, #fov, #assets { margin-top: 6px; }
    .trail { color: #7ee1c3; }
    .cone { color: #86dae0; }
    .target { color: #ffc589; }
    @media (max-width: 760px) { main { width: calc(100% - 24px); margin-top: 12px; } .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <!-- P00_MOCK -->
  <main>
    <header>
      <h1>战棋 P00 技术探针</h1>
      <p>点击橙色圆形目标，平移并放大后再点一次。</p>
    </header>
    <div class="toolbar">
      <button id="transform" type="button">平移并放大</button>
      <button id="reset" type="button">复位相机</button>
    </div>
    <div class="layout">
      <div id="stage" role="region" aria-label="固定地图画布"></div>
      <aside aria-label="实测读数">
        <h2>实测读数</h2>
        <output id="status">等待首帧</output>
        <output id="camera"></output>
        <output id="route" class="trail"></output>
        <output id="fov" class="cone"></output>
        <output id="assets" class="note"></output>
        <output id="click">尚未点击地图</output>
        <p class="note"><span class="trail">绿线</span>表示路径，<span class="cone">青色格</span>表示扇形内可见地面，<span class="target">橙色</span>标记已知测试目标。</p>
      </aside>
    </div>
  </main>
  <!-- P00_LICENSES -->
  <!-- P00_BUNDLE -->
</body>
</html>
