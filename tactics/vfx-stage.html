<head>

  /* 仅工作台局部适配右下角控制面板，防止窄屏下被左侧英雄栏挤出视口 */
  #heroes-container { min-width: 0 !important; flex: 1 1 0 !important; }
  #menu-container.vfx-stage-panel { width: 290px !important; height: 265px !important; }
  .vfx-bar-row { display: flex; flex-wrap: wrap; gap: 3px; padding: 4px 6px; border-bottom: 1px solid rgba(51,65,85,0.55); background: rgba(15,23,42,0.85); }

  .vfx-chip.active { border-color: #22d3ee; color: #67e8f9; background: rgba(8,145,178,0.28); font-weight: 700; }
  .vfx-chip.warn.active { border-color: #f43f5e; color: #fda4af; background: rgba(190,18,60,0.3); }
