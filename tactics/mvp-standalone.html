<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>战棋战斗 · 最小可玩 Demo（单文件）</title>
<style>
/* ==========================================
   战棋 P02 本地样式（无 Tailwind CDN / Google Fonts 外链；系统字体栈）
   槽位语义沿用原 RPG：暗色战场、左侧行动轴、右下 260×172 菜单、四列我方卡片。
   ========================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  background: #0b0f16; color: #d7dde8; font-size: 14px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
#tactics-app { position: relative; width: 100%; height: 100%; overflow: hidden; }

/* ---- 战场背景与地图槽（原 #enemies-container 槽位 → 全屏地图，z-10 低于悬浮 UI） ---- */
#battle-scene {
  position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(135deg, #1e2740 0%, #17202e 55%, #14301f 100%);
}
#tactics-map-slot { position: absolute; inset: 0; z-index: 10; }

/* ---- 战报条 ---- */
#battle-log-wrap { position: absolute; top: 40px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 40; pointer-events: none; }
#battle-log {
  padding: 6px 22px; border-radius: 999px; font-size: 13px; color: rgba(255,255,255,0.9);
  background: rgba(10,14,22,0.72); border: 1px solid rgba(255,255,255,0.08);
  opacity: 0; transform: translateY(-8px); transition: opacity .3s, transform .3s;
}
#battle-log.t-visible { opacity: 1; transform: translateY(0); }

/* ---- 左侧行动轴槽位 ---- */
#turn-order-rail {
  position: absolute; left: 4px; top: 64px; bottom: 190px; width: 56px; z-index: 30;
  display: flex; flex-direction: column; align-items: center;
}
#turn-order-container {
  width: 100%; height: 100%; overflow-y: auto; scrollbar-width: none;
  display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 8px 0;
  mask-image: linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
}
#turn-order-container::-webkit-scrollbar { display: none; }
.t-queue-item {
  width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
  border: 2px solid #38bdf8; background: rgba(8,20,36,0.85); opacity: .75;
}
.t-queue-item.t-queue-current { border-color: #facc15; opacity: 1; box-shadow: 0 0 10px rgba(250,204,21,0.7); }
.t-queue-item img { width: 100%; height: 100%; object-fit: cover; }

/* ---- 顶部工具栏（顺序沿用原版） ---- */
#tactics-topbar { position: absolute; top: 8px; right: 8px; z-index: 115; display: flex; gap: 6px; }
.t-topbtn {
  display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px;
  background: rgba(12,17,26,0.85); border: 1px solid rgba(255,255,255,0.08);
  font-size: 11px; font-weight: 700; color: #94a3b8;
}
.t-topbtn:hover { background: rgba(30,41,59,0.95); color: #e2e8f0; }
@media (max-width: 1400px) { .t-toplabel { display: none; } }

/* ---- 悬浮 UI 层：我方卡片 + 菜单 ---- */
#tactics-float-ui {
  position: absolute; bottom: 52px; left: 0; width: 100%; padding: 0 16px 8px; z-index: 20;
  display: flex; flex-direction: row; align-items: flex-end; justify-content: space-between; gap: 12px;
  pointer-events: none;
}
#heroes-container {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 672px;
  pointer-events: auto; flex: 0 1 auto;
}
.t-hero-card {
  display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 10px;
  background: rgba(8,17,30,0.88); border: 1px solid rgba(56,189,248,0.35); text-align: left;
}
.t-hero-card.t-selected { border-color: #facc15; box-shadow: 0 0 8px rgba(250,204,21,0.55); }
.t-hero-avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #1e293b; }
.t-hero-avatar img { width: 100%; height: 100%; object-fit: cover; }
.t-hero-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.t-hero-info b { font-size: 11px; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-bar { display: block; width: 100%; height: 5px; border-radius: 3px; background: #1e293b; overflow: hidden; font-style: normal; }
.t-bar i { display: block; height: 100%; border-radius: 3px; transition: width .25s; font-style: normal; }
.t-bar-hp i { background: #f43f5e; }
.t-bar-mp i { background: #38bdf8; }

#menu-outer { pointer-events: auto; }
#menu-container {
  width: 260px; height: 172px; background: rgba(2,6,16,0.95); border: 1px solid rgba(51,65,85,0.8);
  border-top: 2px solid rgba(34,211,238,0.8); border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.9);
}
#active-hero-name {
  text-align: center; font-size: 11px; padding: 5px 0; color: rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.05); letter-spacing: 2px; font-weight: 700;
  border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0;
}
#main-menu { flex: 1; display: flex; flex-direction: column; gap: 5px; justify-content: center; padding: 6px; }
#main-menu button {
  width: 100%; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; text-align: left;
  background: rgba(15,23,42,0.85); border: 1px solid rgba(71,85,105,0.8); color: #e2e8f0;
}
#main-menu button:hover { border-color: #22d3ee; color: #67e8f9; }
#menu-attack { border-color: rgba(244,63,94,0.5) !important; color: #fecdd3 !important; }
#menu-support { border-color: rgba(16,185,129,0.5) !important; color: #a7f3d0 !important; }
#submenu { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#submenu-head {
  display: flex; justify-content: space-between; align-items: center; padding: 5px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
}
#submenu-title { font-size: 12px; font-weight: 700; color: #67e8f9; }
#submenu-back { font-size: 10px; padding: 2px 8px; border-radius: 6px; background: rgba(30,41,59,0.9); border: 1px solid rgba(71,85,105,0.8); color: #94a3b8; }
#submenu-back:hover { color: #fff; }
#submenu-list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; }
.t-submenu-item {
  display: flex; align-items: center; gap: 6px; width: 100%; padding: 6px 9px; border-radius: 7px;
  background: rgba(15,23,42,0.85); border: 1px solid rgba(71,85,105,0.6); font-size: 12px; color: #e2e8f0;
}
.t-submenu-item:hover { border-color: #22d3ee; }
.t-submenu-item i { margin-left: auto; font-style: normal; font-size: 10px; color: #94a3b8; }
.t-submenu-empty { padding: 12px; font-size: 11px; color: #64748b; text-align: center; }

/* ---- MVP：原槽位状态，不新增入口 ---- */
button:disabled { opacity: .42; cursor: default; }
#active-hero-name { letter-spacing: .3px; }
.t-unit-down .t-unit-medal { opacity: .35; filter: grayscale(1); }
.t-unit-down .t-unit-name { color: #94a3b8; }
.t-unit-hit .t-unit-avatar { box-shadow: 0 0 20px #facc15; }
.t-hero-card.t-down { opacity: .45; }

/* ---- 底部聊天输入区（原 #chat-input-area 槽位） ---- */
#chat-input-area { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 90; }
#chat-input-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: linear-gradient(to top, rgba(5,5,10,0.97), rgba(5,5,10,0.85));
  border-top: 1px solid rgba(255,255,255,0.06);
}
#chat-text-input {
  flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06); color: #e2e8f0; font-size: 12px; outline: none;
}
#chat-text-input:focus { border-color: #22d3ee; }
#chat-ally-toggle, #chat-enemy-toggle {
  padding: 5px 10px; border-radius: 7px; font-size: 11px; color: #94a3b8;
  background: rgba(30,41,59,0.85); border: 1px solid rgba(71,85,105,0.8);
}
#chat-ally-toggle.t-toggle-on, #chat-enemy-toggle.t-toggle-on { color: #4ade80; border-color: rgba(74,222,128,0.5); }
#chat-send-btn {
  padding: 5px 12px; border-radius: 7px; font-size: 11px; font-weight: 700;
  background: rgba(8,47,73,0.9); border: 1px solid rgba(56,189,248,0.5); color: #7dd3fc;
}

/* ---- 面板壳（记录/设置/对话/世界书；覆盖地图，z 高于地图低于顶栏） ---- */
#panel-overlay {
  position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center;
  background: rgba(2,4,10,0.72);
}
#panel-box {
  width: min(560px, 92vw); max-height: 78vh; display: flex; flex-direction: column;
  background: rgba(10,14,24,0.97); border: 1px solid rgba(71,85,105,0.8); border-radius: 14px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.85);
}
#panel-head {
  display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
}
#panel-title { font-size: 14px; font-weight: 700; color: #e2e8f0; }
#panel-close {
  font-size: 11px; padding: 4px 10px; border-radius: 7px; color: #94a3b8;
  background: rgba(30,41,59,0.9); border: 1px solid rgba(71,85,105,0.8);
}
#panel-close:hover { color: #fff; }
#panel-body { padding: 12px 14px; overflow-y: auto; scrollbar-width: thin; }
.t-roster-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.t-roster-table th, .t-roster-table td { padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,0.07); text-align: left; }
.t-roster-table th { color: #7dd3fc; font-weight: 700; }
.t-history-row { padding: 4px 0; font-size: 12px; color: #cbd5e1; border-bottom: 1px dashed rgba(255,255,255,0.06); }

/* ---- 地图单位视图（billboard：屏幕显示尺度恒定；锚点随世界相机） ---- */
.t-unit-name {
  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
  font-size: 11px; font-weight: 700; color: #f1f5f9; white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,0.95); pointer-events: none;
}
.t-unit-medal { position: absolute; left: 0; top: 0; width: var(--d); height: var(--d); transform: translate(-50%,-50%); }
.t-unit-avatar {
  position: absolute; inset: 3px; border-radius: 50%; overflow: hidden; background: #1e293b;
}
.t-unit-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.t-side-hero { }
.t-side-hero .t-unit-avatar { border: 2px solid #22d3ee; box-shadow: 0 0 6px rgba(34,211,238,0.55), 0 2px 6px rgba(0,0,0,0.6); }
.t-side-enemy .t-unit-avatar { border: 2px solid #f43f5e; box-shadow: 0 0 6px rgba(244,63,94,0.55), 0 2px 6px rgba(0,0,0,0.6); }
.t-unit-direction {
  position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;
  transform-origin: 0 0; pointer-events: none;
  /* rotate(deg) 由内联 transform 设置：translate(-50%,-50%) 后绕圆心旋转 */
  margin-left: -22px; margin-top: -22px;
}
.t-unit-bars {
  position: absolute; left: 50%; top: 24px; transform: translateX(-50%);
  width: 64px; display: flex; flex-direction: column; gap: 2px; pointer-events: none;
}
.t-unit-bars .t-bar { height: 4px; background: rgba(10,14,22,0.9); border: 1px solid rgba(255,255,255,0.12); }
.t-unit-footprint {
  border: 1.5px dashed rgba(244,63,94,0.45); background: rgba(244,63,94,0.05);
  border-radius: 3px; pointer-events: none;
}

</style>
</head>
