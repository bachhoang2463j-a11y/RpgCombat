<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>战棋战斗 · 视听切片 Demo（单文件）</title>
<style>
/* ==========================================
   战棋视听切片界面（翻新版）：深色哥特战术 HUD
   基调：深墨底 + 冷灰细线 + 金色强调（我方/当前）+ 绯红（敌方）；玻璃质面板、细边、克制发光。
   槽位：左侧行动轴 / 右上入口 / 底部我方卡片 / 右下指令面板 / 战报条 / 面板 / 底栏旁白。
   无外链字体或 CDN；系统字体栈。
   ========================================== */
:root {
  --ink: #07090d; --panel: rgba(12,15,21,0.86); --panel-2: rgba(18,22,30,0.92);
  --line: rgba(148,163,184,0.18); --line-2: rgba(148,163,184,0.32);
  --text: #e5e9f0; --mute: #8a94a6; --dim: #5b6577;
  --gold: #e8c170; --gold-2: #f5d98f; --gold-glow: rgba(232,193,112,0.45);
  --crim: #e0525e; --crim-glow: rgba(224,82,94,0.45);
  --hp: #4ade80; --hp-foe: #f0606c; --mp: #60a5fa;
  --ease: cubic-bezier(.2,.8,.3,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: 'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif; background: var(--ink); color: var(--text); font-size: 13px; -webkit-font-smoothing: antialiased; user-select: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
button:disabled { opacity: .42; cursor: default; }
#tactics-app { position: relative; width: 100%; height: 100%; overflow: hidden; }

/* ---- 战场 ---- */
#battle-scene { position: absolute; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 40%, #111720 0%, #090c11 70%); }
#tactics-map-slot { position: absolute; inset: 0; z-index: 10; }
#tactics-map-viewport::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at 45% 45%, transparent 50%, rgba(3,5,8,0.62) 100%); }
.t-map-light { position: absolute; inset: 0; pointer-events: none; }
.t-light-pool { position: absolute; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,200,130,0.20) 0%, rgba(255,170,90,0.07) 40%, transparent 70%); animation: t-flicker 4.2s ease-in-out infinite alternate; }
@keyframes t-flicker { 0% { opacity: .82; } 50% { opacity: 1; } 100% { opacity: .9; } }

/* 地图就地提示 */
.t-map-hint { position: absolute; left: 0; top: 0; z-index: 30; pointer-events: none; white-space: nowrap;
  margin: -52px 0 0 0; padding: 5px 11px; border-radius: 6px; font-size: 12px; color: var(--text); translate: -50% 0;
  background: rgba(9,12,18,0.94); border: 1px solid var(--line-2); box-shadow: 0 6px 18px rgba(0,0,0,0.6); opacity: 0; transition: opacity .1s; }
.t-map-hint::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: inherit; border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
.t-map-hint.t-visible { opacity: 1; }
.t-map-hint b { color: var(--gold-2); font-weight: 700; }
.t-map-hint.t-hint-bad { color: #fecaca; border-color: rgba(248,113,113,0.55); }
.t-map-hint.t-hint-lock { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(232,193,112,0.25), 0 6px 18px rgba(0,0,0,0.6); }

/* ---- 地图单位：圆形徽章（头像正立）+ 阵营环 + 独立朝向箭头 + 名牌 + 血条 + 接地阴影 ---- */
.t-unit { z-index: 1; }
.t-unit.t-unit-current, .t-unit.t-unit-moving, .t-unit.t-unit-hover { z-index: 3; }
.t-unit-ground { position: absolute; pointer-events: none; }
.t-unit-shadow { position: absolute; left: 14%; right: 14%; top: 60%; height: 30%; border-radius: 50%; transform-origin: 50% 50%;
  background: radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.25) 55%, transparent 72%); }
.t-unit-footprint { position: absolute; inset: 3px; border: 1.5px solid rgba(224,82,94,0.45); border-radius: 8px; background: rgba(224,82,94,0.05); }
.t-unit-ring-floor { position: absolute; inset: 4%; border-radius: 50%; opacity: 0; transition: opacity .25s;
  border: 2px solid rgba(245,217,143,0.9); box-shadow: 0 0 16px var(--gold-glow), inset 0 0 12px rgba(232,193,112,0.3); }
.t-side-enemy .t-unit-ring-floor { border-color: rgba(240,96,108,0.9); box-shadow: 0 0 16px var(--crim-glow), inset 0 0 12px rgba(224,82,94,0.3); }
.t-unit-current .t-unit-ring-floor { opacity: 1; animation: t-floor-pulse 1.6s ease-in-out infinite; }
.t-unit-big .t-unit-ring-floor { border-radius: 12px; }
@keyframes t-floor-pulse { 0%,100% { transform: scale(0.94); opacity: .7; } 50% { transform: scale(1.04); opacity: 1; } }
/* 当前行动者：屏幕空间光环（徽章随镜头反缩放，地面环在远景会被徽章盖住） */
.t-unit-medal::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .25s;
  border: 2px solid var(--gold-2); box-shadow: 0 0 18px var(--gold-glow), inset 0 0 10px rgba(232,193,112,0.35); }
.t-side-enemy .t-unit-medal::before { border-color: #ff8a94; box-shadow: 0 0 18px var(--crim-glow), inset 0 0 10px rgba(224,82,94,0.35); }
.t-unit-current .t-unit-medal::before { opacity: 1; animation: t-halo 1.5s ease-in-out infinite; }
@keyframes t-halo { 0%,100% { transform: scale(.96); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }

.t-unit-billboard { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.t-unit-sprite { position: absolute; left: calc(var(--d) / -2); top: calc(var(--d) / -2); width: var(--d); height: var(--d); }
.t-unit-medal { position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d); transform: translate(-50%,-50%); }
.t-unit-avatar, .t-unit-emoji { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #10141b; }
.t-unit-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
.t-unit-emoji { font-size: calc(var(--d) * 0.56); line-height: 1; background: radial-gradient(circle at 50% 35%, #34181d 0%, #150a0d 75%); }
.t-side-hero .t-unit-avatar { border: 2.5px solid var(--gold); box-shadow: 0 0 0 2px rgba(7,9,13,0.9), 0 0 12px var(--gold-glow), 0 4px 10px rgba(0,0,0,0.75); }
.t-side-enemy .t-unit-emoji { border: 2.5px solid var(--crim); box-shadow: 0 0 0 2px rgba(7,9,13,0.9), 0 0 12px var(--crim-glow), 0 4px 10px rgba(0,0,0,0.75); }
.t-unit-hover .t-unit-avatar, .t-unit-hover .t-unit-emoji { filter: brightness(1.18); }
.t-unit-direction { position: absolute; left: 50%; top: 50%; width: calc(var(--d) + 22px); height: calc(var(--d) + 22px);
  margin-left: calc((var(--d) + 22px) / -2); margin-top: calc((var(--d) + 22px) / -2); transform-origin: 50% 50%; pointer-events: none; overflow: visible; transition: transform .12s linear; }
.t-unit-direction path { fill: var(--gold-2); stroke: #4a3410; stroke-width: 1.2; }
.t-side-enemy .t-unit-direction path { fill: #ff8a94; stroke: #3d0a10; }
.t-unit-name { position: absolute; left: 50%; bottom: calc(var(--d) / 2 + 4px); transform: translateX(-50%); font-size: 11px; font-weight: 800; white-space: nowrap; letter-spacing: .5px;
  color: var(--gold-2); text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,0.9); pointer-events: none; }
.t-side-enemy .t-unit-name { color: #ff9aa3; }
.t-unit-bars { position: absolute; left: 50%; top: calc(var(--d) / 2 + 5px); transform: translateX(-50%); width: 46px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
.t-unit-big .t-unit-bars { width: 62px; }
.t-unit-bars .t-bar { height: 4px; background: rgba(4,6,9,0.92); border: 1px solid rgba(255,255,255,0.14); }
.t-unit-bars .t-bar-mp { height: 3px; }
.t-avatar-missing-mark { display: none; font-size: 9px; color: #fecaca; text-align: center; line-height: 1.1; padding: 2px; font-style: normal; }
.t-avatar-missing img { display: none; }
.t-avatar-missing .t-avatar-missing-mark { display: block; }
.t-avatar-missing { background: repeating-linear-gradient(45deg, #3f1d24, #3f1d24 4px, #2a1218 4px, #2a1218 8px) !important; }
.t-bar { position: relative; display: block; width: 100%; height: 5px; border-radius: 3px; background: #161b24; overflow: hidden; font-style: normal; }
.t-bar i { position: absolute; left: 0; top: 0; display: block; height: 100%; border-radius: 3px; font-style: normal; }
.t-bar .t-bar-ghost { background: #fde68a; opacity: .85; }
.t-bar-hp .t-bar-fill { background: linear-gradient(90deg, #c2343f, var(--hp-foe)); }
.t-side-hero .t-bar-hp .t-bar-fill, .t-hero-card .t-bar-hp .t-bar-fill { background: linear-gradient(90deg, #22a35a, var(--hp)); }
.t-bar-mp .t-bar-fill { background: linear-gradient(90deg, #3b82f6, var(--mp)); }

/* 步伐尘土 */
.t-dust { position: absolute; width: 22px; height: 10px; margin: -5px 0 0 -11px; border-radius: 50%; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse, rgba(190,200,215,0.45) 0%, rgba(150,160,175,0.15) 55%, transparent 72%); animation: t-dust .5s ease-out forwards; }
.t-dust-big { width: 46px; height: 18px; margin: -9px 0 0 -23px; }
@keyframes t-dust { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.7, 1.3); opacity: 0; } }

/* 倒地/死亡收尾 */
.t-unit-falling .t-unit-medal { animation: t-fall .62s cubic-bezier(.3,0,.4,1) forwards; }
.t-side-enemy.t-unit-falling .t-unit-medal { animation-name: t-die; }
@keyframes t-fall { 0% { transform: translate(-50%,-50%) rotate(0) scale(1); } 35% { transform: translate(-50%,-42%) rotate(-10deg) scale(.96); } 100% { transform: translate(-50%,-36%) rotate(-18deg) scale(.9); filter: grayscale(1) brightness(.6); } }
@keyframes t-die { 0% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 25% { transform: translate(-50%,-50%) scale(1.14); filter: brightness(2.4) saturate(0); } 100% { transform: translate(-50%,-44%) scale(.76); filter: grayscale(1) brightness(.42); opacity: .66; } }
.t-unit-down .t-unit-medal { transform: translate(-50%,-38%) rotate(-16deg) scale(.86); filter: grayscale(1) brightness(.5); opacity: .66; }
.t-unit-down .t-unit-direction, .t-unit-down .t-unit-bars { opacity: 0; }
.t-unit-down .t-unit-name { color: var(--dim); }
.t-unit-down .t-unit-footprint { border-style: dashed; opacity: .35; }
.t-unit-down .t-unit-ring-floor { display: none; }

/* ---- 战报条 ---- */
#battle-log-wrap { position: absolute; top: 12px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 40; pointer-events: none; }
#battle-log { padding: 6px 18px; border-radius: 4px; font-size: 12.5px; color: var(--text); letter-spacing: .3px;
  background: linear-gradient(90deg, transparent, rgba(9,12,18,0.92) 12%, rgba(9,12,18,0.92) 88%, transparent); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  opacity: 0; transform: translateY(-6px); transition: opacity .22s, transform .22s; min-width: 240px; text-align: center; }
#battle-log.t-visible { opacity: 1; transform: none; }
#battle-log.t-log-hit { color: #fecdd3; }
#battle-log.t-log-dodge { color: #cbd5e1; font-style: italic; }
#battle-log.t-log-warn, #battle-log.t-log-miss { color: #fed7aa; }
#battle-log.t-log-win { color: #bbf7d0; font-weight: 700; }
#battle-log.t-log-lose { color: #fecdd3; font-weight: 700; }
#battle-log.t-log-act { color: var(--gold-2); }

/* ---- 轮次横幅 ---- */
#turn-banner { position: absolute; left: 0; right: 0; top: 30%; z-index: 60; pointer-events: none; display: flex; justify-content: center; opacity: 0; }
#turn-banner .tb-inner { display: flex; align-items: center; gap: 16px; padding: 12px 64px 12px 28px; min-width: 420px;
  background: linear-gradient(90deg, transparent 0, rgba(8,10,15,0.94) 18%, rgba(8,10,15,0.94) 82%, transparent 100%);
  border-top: 1px solid rgba(232,193,112,0.55); border-bottom: 1px solid rgba(232,193,112,0.55); transform: translateX(-60px); }
#turn-banner.t-enemy .tb-inner { border-color: rgba(224,82,94,0.6); }
#turn-banner .tb-face-in { display: flex; width: 54px; height: 54px; border-radius: 50%; overflow: hidden; border: 2.5px solid var(--gold); box-shadow: 0 0 18px var(--gold-glow); align-items: center; justify-content: center; background: #10141b; }
#turn-banner .tb-face-in img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
#turn-banner .tb-face-in.t-face-emoji { font-size: 30px; border-color: var(--crim); box-shadow: 0 0 18px var(--crim-glow); background: #1b0d10; }
#turn-banner .tb-text { display: flex; flex-direction: column; }
#turn-banner .tb-name { font-size: 24px; font-weight: 900; letter-spacing: 6px; color: var(--gold-2); text-shadow: 0 0 18px var(--gold-glow); }
#turn-banner.t-enemy .tb-name { color: #ff9aa3; text-shadow: 0 0 18px var(--crim-glow); }
#turn-banner .tb-sub { font-style: normal; font-size: 11px; letter-spacing: 4px; color: var(--mute); }
#turn-banner.t-show { animation: tb-fade 1.15s var(--ease) forwards; }
#turn-banner.t-show .tb-inner { animation: tb-slide 1.15s var(--ease) forwards; }
@keyframes tb-fade { 0% { opacity: 0; } 14% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
@keyframes tb-slide { 0% { transform: translateX(-80px); } 18% { transform: translateX(0); } 75% { transform: translateX(10px); } 100% { transform: translateX(60px); } }

/* ---- 左侧行动轴 ---- */
#turn-order-rail { position: absolute; left: 10px; top: 14px; bottom: 214px; width: 60px; z-index: 30; display: flex; flex-direction: column; align-items: center; }
.t-rail-head { font-size: 9.5px; letter-spacing: 3px; color: var(--mute); padding: 2px 0 6px; border-bottom: 1px solid var(--line); width: 100%; text-align: center; }
#turn-order-container { width: 100%; flex: 1; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 10px 0;
  mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 24px), transparent 100%); }
#turn-order-container::-webkit-scrollbar { display: none; }
.t-queue-item { position: relative; width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; cursor: pointer; transition: transform .25s var(--ease), opacity .25s; opacity: .8; }
.t-q-face { display: flex; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; align-items: center; justify-content: center; background: #10141b; border: 2px solid rgba(232,193,112,0.7); }
.t-q-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
.t-q-enemy .t-q-face { border-color: rgba(224,82,94,0.75); background: #1b0d10; font-size: 20px; }
.t-queue-item em { position: absolute; right: -6px; bottom: -6px; font-style: normal; font-size: 9px; color: var(--mute); background: rgba(7,9,13,0.9); padding: 0 3px; border-radius: 3px; }
.t-queue-item.t-queue-current { width: 50px; height: 50px; opacity: 1; }
.t-queue-current .t-q-face { border-width: 2.5px; border-color: var(--gold); box-shadow: 0 0 14px var(--gold-glow); }
.t-q-enemy.t-queue-current .t-q-face { border-color: var(--crim); box-shadow: 0 0 14px var(--crim-glow); font-size: 26px; }
.t-queue-item:hover { transform: scale(1.08); opacity: 1; }
.t-queue-shift .t-queue-item { animation: t-queue-in .35s var(--ease) both; animation-delay: calc(var(--i) * 35ms); }
@keyframes t-queue-in { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: .8; } }
.t-queue-shift .t-queue-current { animation-name: t-queue-cur; }
@keyframes t-queue-cur { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---- 右上入口 ---- */
#tactics-topbar { position: absolute; top: 10px; right: 10px; z-index: 115; display: flex; gap: 4px; }
.t-topbtn { display: flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); font-size: 11px; color: var(--mute); transition: color .15s, border-color .15s; }
.t-topbtn:hover { color: var(--text); border-color: var(--line-2); }
@media (max-width: 1400px) { .t-toplabel { display: none; } }

/* ---- 底部悬浮层：我方卡片 + 指令面板 ---- */
#tactics-float-ui { position: absolute; bottom: 44px; left: 0; width: 100%; padding: 0 12px 6px 80px; z-index: 20; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; pointer-events: none; }
#heroes-container { display: grid; grid-template-columns: repeat(4, minmax(140px, 176px)); gap: 6px; pointer-events: auto; }
.t-hero-card { position: relative; display: flex; align-items: center; gap: 8px; padding: 7px 9px 7px 7px; border-radius: 8px; text-align: left;
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(4px); transition: transform .25s var(--ease), border-color .2s, box-shadow .2s, opacity .3s; }
.t-hero-card:hover { border-color: var(--line-2); }
.t-hero-card.t-current { border-color: rgba(232,193,112,0.75); box-shadow: 0 0 0 1px rgba(232,193,112,0.2), 0 0 18px rgba(232,193,112,0.22); transform: translateY(-4px); }
.t-hero-card.t-selected { border-color: rgba(147,197,253,0.6); }
.t-hero-avatar { display: flex; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #10141b; border: 2px solid rgba(232,193,112,0.7); align-items: center; justify-content: center; }
.t-hero-card.t-current .t-hero-avatar { border-color: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
.t-hero-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
.t-hero-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.t-hero-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.t-hero-row b { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-hero-hpnum { font-style: normal; font-size: 11px; color: var(--text); font-variant-numeric: tabular-nums; }
.t-hero-hpnum small { color: var(--dim); font-size: 10px; }
.t-hero-card .t-bar-hp { height: 6px; }
.t-hero-card .t-bar-mp { height: 3px; }
.t-card-turn { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 9px; letter-spacing: 2px; padding: 1px 8px; border-radius: 999px;
  color: #1a1206; background: var(--gold); opacity: 0; transition: opacity .2s; white-space: nowrap; }
.t-hero-card.t-current .t-card-turn { opacity: 1; }
.t-hero-card.t-low .t-bar-hp .t-bar-fill { animation: t-low 1s ease-in-out infinite; }
@keyframes t-low { 50% { filter: brightness(1.5); } }
.t-card-hit { animation: t-card-hit .36s ease-out; }
@keyframes t-card-hit { 20% { transform: translateX(-4px); border-color: #fb7185; } 45% { transform: translateX(3px); } }
.t-hero-card.t-down { opacity: .45; filter: grayscale(.85); }

/* 指令面板（原菜单槽） */
#menu-outer { pointer-events: auto; }
#menu-container { position: relative; width: 340px; min-height: 176px; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden;
  background: var(--panel-2); border: 1px solid var(--line); box-shadow: 0 18px 40px rgba(0,0,0,0.7), inset 0 1px 0 rgba(232,193,112,0.35); backdrop-filter: blur(6px); }
#menu-container.t-menu-enemy { box-shadow: 0 18px 40px rgba(0,0,0,0.7), inset 0 1px 0 rgba(224,82,94,0.45); }
#active-hero-name { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-bottom: 1px solid var(--line); min-height: 52px; }
.t-cmd-idle { color: var(--mute); }
.t-cmd-face { display: flex; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0; align-items: center; justify-content: center; border: 2px solid var(--gold); background: #10141b; }
.t-cmd-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
.t-cmd-face.t-face-emoji { font-size: 20px; border-color: var(--crim); background: #1b0d10; }
.t-cmd-id { display: flex; flex-direction: column; min-width: 0; }
.t-cmd-id b { font-size: 14px; letter-spacing: 1px; }
.t-cmd-id i { font-style: normal; font-size: 10px; color: var(--mute); letter-spacing: 2px; }
.t-cmd-res { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.t-res-move { position: relative; width: 74px; height: 16px; border-radius: 3px; background: rgba(96,165,250,0.12); border: 1px solid rgba(96,165,250,0.35); overflow: hidden; }
