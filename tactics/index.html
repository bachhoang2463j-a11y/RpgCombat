<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>战棋战斗 · 三层礼拜堂 Demo</title>
<link rel="stylesheet" href="./src/vendor/rpg-ui/rpg-ui.css">
<link rel="stylesheet" href="./tactics.css">
<link rel="stylesheet" href="./src/vendor/rpg-av/rpg-av.css">
</head>
<body>
<div id="tactics-app"></div>
<script type="module">
import { createApp, DEFAULT_YAML_A } from './src/main.mjs';
import { DEMO_YAML, DEMO_PLACEMENTS } from './src/demo-fixture.mjs';
import { createEncounterDemo } from './src/scenario-data.mjs';

const qs = new URLSearchParams(location.search);
const p02 = qs.get('stage') === 'p02';
// 默认载入典型对局权威样本（三层礼拜堂）；?demo=slice 回到旧视听切片，?demo=nave 使用单房间演示数据
const slice = qs.get('demo') === 'slice';
const singleRoom = qs.get('demo') === 'nave';
const typicalYaml = p02 || slice ? null : await (await fetch('../doc/tactics/' + encodeURIComponent('典型对局-战棋版.yaml'))).text();
const app = createApp(document.getElementById('tactics-app'), {
  ...(p02 ? { defaultYaml: DEFAULT_YAML_A } : slice ? { defaultYaml: DEMO_YAML } : singleRoom ? createEncounterDemo(typicalYaml) : { defaultYaml: typicalYaml }),
  defaultPlacements: p02 || !slice ? undefined : DEMO_PLACEMENTS,
  playable: !p02,
});
app.boot();

// 调试句柄（测试读数专用：只回 JSON 快照，不暴露写规则状态的入口）
window.__TACTICS_APP__ = {
  app,
  snapshot: () => app.sandbox.getSnapshot(),
  loadYaml: (text, opts) => app.loadYaml(text, opts),
  playProjectile: (type, from, to) => app.playProjectile(type, from, to),
  resources: () => app.resources(),
};
</script>
</body>
</html>
