<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>战棋战斗 · 视听切片 Demo</title>
<link rel="stylesheet" href="./tactics.css">
<link rel="stylesheet" href="./src/vendor/rpg-av/rpg-av.css">
</head>
<body>
<div id="tactics-app"></div>
<script type="module">
import { createApp, DEFAULT_YAML_A } from './src/main.mjs';
import { DEMO_YAML, DEMO_PLACEMENTS } from './src/demo-fixture.mjs';

const p02 = new URLSearchParams(location.search).get('stage') === 'p02';
const app = createApp(document.getElementById('tactics-app'), {
  defaultYaml: p02 ? DEFAULT_YAML_A : DEMO_YAML,
  defaultPlacements: p02 ? undefined : DEMO_PLACEMENTS,
  playable: !p02,
});
app.boot();

// 调试句柄（测试读数专用：只回 JSON 快照，不暴露写规则状态的入口）
window.__TACTICS_APP__ = {
  app,
  snapshot: () => app.sandbox.getSnapshot(),
  loadYaml: (text, opts) => app.loadYaml(text, opts),
  playProjectile: (type, from, to) => app.playProjectile(type, from, to),
  resources: () => app.resources(),
};
</script>
</body>
</html>
