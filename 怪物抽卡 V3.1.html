        .tower-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 500px; }
        .floor-btn { background: #0a0a0a; border: 2px solid #2a241a; padding: 15px 25px; color: #d4c4a8; font-size: 1.2rem; cursor: pointer; display: flex; justify-content: space-between; transition: all 0.2s; }
        .floor-btn:hover { background: #141414; border-color: #8b1c1c; transform: scale(1.02); }

        .inv-name-wrap { display: flex; flex-direction: column; }
        .inv-name { font-size: 1.3rem; color: #e0d4c3; font-weight: bold; }

        /* 模态框 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }

            localStorage.setItem('invRoster', JSON.stringify(roster));
            localStorage.setItem('invEEDrawn', JSON.stringify(easterEggsDrawn));
            localStorage.setItem('invSelectedIndices', JSON.stringify([...selectedIndices]));

        function loadData() {
            try {
                const r = localStorage.getItem('invRoster');
                if (r) roster = JSON.parse(r);
                const ee = localStorage.getItem('invEEDrawn');
                if (ee) easterEggsDrawn = JSON.parse(ee);
                const selected = localStorage.getItem('invSelectedIndices');
                if (selected) {
                    const savedIndices = JSON.parse(selected);
                    if (Array.isArray(savedIndices)) {
                        selectedIndices = new Set(savedIndices.filter(i => Number.isInteger(i) && i >= 0 && i < roster.length));
                    }
                }
            } catch(e) { console.error('Failed to load data', e); }
        }

                selectedIndices.clear();
                saveData();
                renderRoster();

        function switchTab(mode) {
            currentTab = mode;
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

            document.querySelector(`.nav-tab[onclick="switchTab('${mode}')"]`).classList.add('active');
            document.getElementById(`view-${mode}`).classList.add('active');
            if (mode === 'roster') renderRoster();
        }
        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function generateId() { return Math.random().toString(36).substr(2, 9); }

        // --- RECRUIT ---
        function executeRecruit() {
            if (roster.length >= 12) { alert("驻地已满 (12/12)，请先解雇部分调查员！"); return; }
            
            const roll = Math.random();
            let isEasterEgg = false;
            let eeKey = null;

            if (roll < 0.10) { 
                if (Math.random() < 0.30) {
                    const availableEE = Object.keys(EASTER_EGGS).filter(k => !easterEggsDrawn.includes(k));
                    if (availableEE.length > 0) { isEasterEgg = true; eeKey = pickRandom(availableEE); }
                }
            }

            if (isEasterEgg) {
                tempRecruit = JSON.parse(JSON.stringify(EASTER_EGGS[eeKey]));
                tempRecruit.id = generateId();
                tempRecruit.eeKey = eeKey;
            } else {
                let rarityObj = RARITIES[0];
                if (roll < 0.10) rarityObj = RARITIES[2]; else if (roll < 0.40) rarityObj = RARITIES[1];
                
                if (rarityObj.id === 'Normal') {
                    let base = pickRandom(NORMAL_INVESTIGATORS);
                    tempRecruit = JSON.parse(JSON.stringify(base));
                    tempRecruit.id = generateId();
                    tempRecruit.eeKey = null;
                } else if (rarityObj.id === 'Elite') {
                    let base = pickRandom(ELITE_INVESTIGATORS);
                    tempRecruit = JSON.parse(JSON.stringify(base));
                    tempRecruit.id = generateId();
                    tempRecruit.eeKey = null;
                } else if (rarityObj.id === 'Legendary') {
                    let base = pickRandom(LEGENDARY_INVESTIGATORS);
                    tempRecruit = JSON.parse(JSON.stringify(base));
                    tempRecruit.id = generateId();
                    tempRecruit.eeKey = null;
                }
            }
            showRecruitModal();
        }

            if (roster.length >= 12) return;
            const nameInput = document.getElementById('modal-name');
            const bgInput = document.getElementById('modal-bg');
            if (nameInput) tempRecruit.name = nameInput.value.trim() || tempRecruit.name;
            if (bgInput) tempRecruit.bg = bgInput.value.trim() || tempRecruit.bg;

            roster.push(tempRecruit);
            if (tempRecruit.eeKey) easterEggsDrawn.push(tempRecruit.eeKey);
            closeModal();
            saveData();
            switchTab('roster'); // User requested: jump directly, no alert
        }
        
        function renderRoster() {
            document.getElementById('roster-count').innerText = roster.length;
            document.getElementById('squad-count').innerText = selectedIndices.size;
            const grid = document.getElementById('roster-grid');
            if (roster.length === 0) { grid.innerHTML = `<div class="empty-roster">驻地空无一人，请前往招募大厅。</div>`; return; }
            grid.innerHTML = '';
            roster.forEach((inv, i) => {
                const isSelected = selectedIndices.has(i);
                grid.innerHTML += `
                    <div class="inv-card ${isSelected ? 'selected' : ''}">
                        <div class="inv-card-header">
                            <div class="inv-name-wrap"><span class="inv-name">${inv.name}</span><span class="inv-class">${inv.cls}</span></div>
                            <span class="rarity-badge rarity-${inv.rarity.id}">${inv.rarity.name}</span>
                        </div>
                        <div class="inv-stats-mini">HP:${inv.hp} | MP:${inv.mp} | Spd:${inv.speed} | Def:${inv.armor}</div>
                        <div class="inv-skills-mini">${inv.skills.join('<br>')}</div>
                        <div class="inv-actions">
                            <button class="btn-card btn-select ${isSelected ? 'active' : ''}" onclick="toggleSelect(${i})">${isSelected ? '取消出战' : '选择出战'}</button>
                            <button class="btn-card btn-fire" onclick="fireInvestigator(${i})">解雇</button>
                        </div>
                    </div>
                `;
            });
        }
        
        function toggleSelect(i) {
            if (selectedIndices.has(i)) { selectedIndices.delete(i); }
            else {
                if (selectedIndices.size >= 4) { alert("最多只能选择 4 名调查员出战！"); return; }
                selectedIndices.add(i);
            }
            saveData();
            renderRoster();
        }
        
        function fireInvestigator(i) {
            if (confirm(`确定要解雇 ${roster[i].name} 吗？`)) {
                selectedIndices.delete(i);
                roster.splice(i, 1);
                selectedIndices.clear();
                saveData();
                renderRoster();
            }

            currentDifficulty = diff;

            currentFloor = floor;

            tempEncounter = [];
            TOWER_CONFIGS[currentDifficulty][floor].forEach(c => {
                for(let i=0; i<c.count; i++) {
                    const pool = MONSTERS.filter(m => m.tier === c.tier);
                    if (pool.length > 0) tempEncounter.push(pickRandom(pool));
                }
            });
            showBattleModal();
        }

                    <span>发送战斗数据（仅首次初始化新战斗时勾选）</span>
                </label>
                <button class="action-btn btn-retreat" onclick="closeModal()">撤退</button>
                <button class="action-btn btn-engage" style="flex:2;" onclick="deployBattle()">全员降临战场！</button>
            `;
            document.getElementById('result-modal').classList.add('active');
        }

        function closeModal() { document.getElementById('result-modal').classList.remove('active'); }

        function deployBattle() {
            const btns = document.querySelectorAll('.action-btn');
            btns.forEach(b => b.style.pointerEvents = 'none');
            const sendCombatData = document.getElementById('send-combat-data')?.checked ?? true;
            
            let squadBlocks = Array.from(selectedIndices).map(idx => {
                let d = roster[idx];
                let skStr = d.skills.map(s => `          - "${s}"`).join('\n');
                return `    - 角色:
        名字: "${d.name}"
        属性: "[HP:${d.hp}/${d.hp}][MP:${d.mp}/${d.mp}][Atk:${d.atk}][Armor:${d.armor}][Speed:${d.speed}][职业:${d.cls}]"
        技能:
${skStr}`;
            }).join('\n');

            const monsterNames = tempEncounter.map(m => `- ${m.name}`).join('\n');

            const combatDataSection = sendCombatData ? `
你本次回复需要在文本描写后输出<Combat_block>，用于战斗数据初始化。

<Combat_block>需严格遵守yaml生成，调查员的数据已给出，怪物的请查看<monster>标签中对应的<Combat_block>数据。你只需要拼接已有的我方角色和敌方怪物词条！不要自行发挥！

以下是格式示例，再次提醒，我方列表已由程序脚本自动生成，你需要完整复制，敌方列表则是一个示例，你需要读取怪物数据：
<Combat_block>
战斗数据栏:
  我方列表:
${squadBlocks}
       
  敌方列表:
    - 角色:
        名字: "👻示例怪物"
        属性: "[HP:130/130][MP:13/13][Atk:40][Armor:0][Speed:65][行动次数:3]"
        技能:
          - "【撕裂利爪】[单体;power:60][近战]"
          - "【死缠啃咬】[单体;power:25][单降;power:15][MP:2][近战]"
          - "【橡胶韧皮】[免伤;power:50][MP:1][反应:远程]"
          - "【幽暗凝视】[单盲;power:20][Turn:3][MP:3][法术]"
</Combat_block>` : `
<Combat_block>需严格遵守yaml生成，调查员的技能和属性前文已给出，怪物的请查看<monster>标签中对应的<Combat_block>数据。你只需要拼接已有的我方角色和敌方怪物词条！不要自行发挥！`;

            const command = `这是一组克苏鲁世界观中的调查员小队，他们打算挑战一座高塔。如果这是游戏开场，你需要首先描写他们在出发前各自的介绍，并以对话的形式表现他们各自为何而挑战高塔。如果之前已经有战斗和对话，继续故事！

现在，调查员们进入了第${currentFloor}层，他们遇到了以下敌人：
${monsterNames}

你需要描述战前的侦察与反侦察交锋，然后将叙事停留在开战的前一刻，等待玩家返回结果。
${combatDataSection}`;
            
            const textarea = window.parent.document.getElementById('send_textarea');
            if (textarea) {
                textarea.value = command;
                textarea.dispatchEvent(new Event('input', { bubbles: true }));
            }
            
            document.getElementById('sys-msg').style.opacity = '1';
            setTimeout(() => {
                closeModal();
                btns.forEach(b => b.style.pointerEvents = 'auto');
                document.getElementById('sys-msg').style.opacity = '0';
            }, 1500);
        }
    </script>
</body>
</html>
