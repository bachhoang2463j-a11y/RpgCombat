<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>变种能力 · 抗性与免疫生效瞬间</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; overflow: hidden; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; overflow: hidden; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    /* ===== 第二期：抗性与免疫特效样式 arcane-resist-*（可移植） ===== */
    .arcane-resist-anchor { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; }
    .arcane-resist-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .arcane-resist-shard { transform-box: fill-box; transform-origin: center; }
    .arcane-resist-ghost { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .arcane-resist-hit-flash { animation: arcane-resist-hit-step 0.22s steps(1) both; }
    @keyframes arcane-resist-hit-step {
        0% { filter: brightness(2.05) saturate(0.25); }
        50% { filter: brightness(1.38) saturate(0.6); }
        100% { filter: none; }
    }
    .arcane-resist-stun-pop {
        display: flex; align-items: center; gap: 4px;
        filter: drop-shadow(0 0 6px rgba(251,191,36,0.9));
        font-size: 12px; line-height: 1; color: #fde047;
        text-shadow: 0 0 8px rgba(251,191,36,0.95), 0 1px 2px rgba(0,0,0,0.85);
    }
    /* 一期常驻外观样式复用（正式版已存在，仅用于本 demo 验证常驻外观不冲突） */
    .arcane-variant-host-rel { position: relative !important; }
    .arcane-variant-molt-sprite { filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.72)) drop-shadow(0 0 16px rgba(245, 158, 11, 0.42)) drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5)); }
    .arcane-variant-rage-sprite { filter: drop-shadow(0 0 7px rgba(239, 68, 68, 0.85)) drop-shadow(0 0 18px rgba(185, 28, 28, 0.58)) drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5)); }
    .arcane-variant-molted-fx { position: absolute; inset: -3px; border-radius: 8px; pointer-events: none; z-index: 18; box-shadow: inset 0 0 14px rgba(245, 158, 11, 0.32), 0 0 14px rgba(251, 191, 36, 0.34); background: radial-gradient(ellipse at 50% 85%, rgba(251, 191, 36, 0.18) 0%, transparent 68%); }
    .arcane-variant-molted-fx.is-sprite { inset: -24px -28px; box-shadow: none; border-radius: 50%; z-index: -1; background: radial-gradient(ellipse closest-side at 50% 70%, rgba(251, 191, 36, 0.42) 0%, rgba(217, 119, 6, 0.16) 54%, transparent 100%); }
    .arcane-variant-rage-fx { position: absolute; inset: -3px; border-radius: 8px; pointer-events: none; z-index: 19; overflow: hidden; box-shadow: inset 0 0 18px rgba(220, 38, 38, 0.42), 0 0 16px rgba(220, 38, 38, 0.4); }
    .arcane-variant-rage-fx.is-sprite { inset: -26px -30px; box-shadow: none; border-radius: 50%; z-index: -1; overflow: visible; background: radial-gradient(ellipse closest-side at 50% 56%, rgba(220, 38, 38, 0.34) 0%, rgba(127, 29, 29, 0.14) 58%, transparent 100%); }
    /* 正式版眩晕星环样式（用于对照组展示存留晃动） + 演示列表辅助样式 */
    .stun-fx { display: flex; align-items: center; gap: 4px; filter: drop-shadow(0 0 6px rgba(251,191,36,0.85)); animation: stun-sway 1.1s ease-in-out infinite; }
    .stun-fx.hidden { display: none !important; }
    .stun-star { font-size: 11px; line-height: 1; color: #fde047; text-shadow: 0 0 8px rgba(251,191,36,0.95), 0 1px 2px rgba(0,0,0,0.8); animation: stun-twinkle 0.9s ease-in-out infinite alternate; }
    .stun-star:nth-child(2) { animation-delay: 0.15s; }
    .stun-star:nth-child(3) { animation-delay: 0.30s; }
    @keyframes stun-sway { 0%, 100% { transform: translateX(-50%) translateX(0) rotate(0deg); } 25% { transform: translateX(-50%) translateX(-2px) rotate(-1.6deg); } 75% { transform: translateX(-50%) translateX(2px) rotate(1.6deg); } }
    @keyframes stun-twinkle { 0% { opacity: 0.72; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1.14); } }
    .arcane-variant-group-hd { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; color: #94a3b8; padding: 4px 6px 2px; border-bottom: 1px solid rgba(148,163,184,0.16); margin-top: 2px; display: flex; justify-content: space-between; align-items: center; }
    @keyframes arcane-variant-float-up { 0% { opacity: 0; transform: translate(-50%, 6px) scale(0.84); } 18% { opacity: 1; transform: translate(-50%, -8px) scale(1.14); } 78% { opacity: 1; transform: translate(-50%, -22px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -34px) scale(0.92); } }
    .arcane-variant-float-text { position: fixed; pointer-events: none; z-index: 66; white-space: nowrap; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7); animation: arcane-variant-float-up 1.15s ease-out forwards; }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->
  <div class="absolute top-2 sm:top-4 right-2 sm:right-4 z-[115] flex gap-1.5 sm:gap-2">
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-violet-400 hover:text-violet-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📚</span> <span class="hidden sm:inline">世界书</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-purple-400 hover:text-purple-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📜</span> <span class="hidden sm:inline">记录</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-400 hover:text-blue-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔲</span> <span class="hidden sm:inline">全屏</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>💬</span> <span class="hidden sm:inline">对话</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-yellow-500 hover:text-yellow-400 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>⚙️</span> <span class="hidden sm:inline">设置</span></button>
    <button id="btn-reset" class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-emerald-400 hover:text-emerald-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔄</span> <span class="hidden sm:inline">重置</span></button>
  </div>

  <!-- 全屏战场区域 -->
  <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-800 to-emerald-900 overflow-hidden z-0" id="battle-scene">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-0"></div>
    <div class="absolute left-1 sm:left-4 md:left-6 top-16 sm:top-20 bottom-44 sm:bottom-48 w-12 sm:w-14 z-30 flex flex-col items-center select-none">
      <div class="relative w-full h-full flex flex-col items-center">
        <div class="timeline-rail"><div class="rail-pulse-beam"></div></div>
        <div id="turn-order-container" class="relative w-full h-full flex flex-col gap-2 sm:gap-2.5 items-center overflow-y-auto no-scrollbar mask-fade-y py-3"></div>
      </div>
    </div>
    <div id="enemies-container" class="absolute left-2 sm:left-6 right-2 sm:right-6 top-[10%] bottom-[190px] sm:bottom-[220px] z-10 flex flex-col items-center justify-start gap-6 overflow-visible pointer-events-none"></div>
  </div>

  <!-- 悬浮 UI 层 -->
  <div class="absolute bottom-[52px] left-0 w-full p-1.5 sm:p-6 flex flex-col-reverse sm:flex-row items-end justify-between gap-1.5 sm:gap-4 z-20 pointer-events-none pb-2 sm:pb-6">
    <div id="heroes-container" class="w-full sm:flex-1 grid grid-cols-4 gap-1 sm:gap-4 max-w-2xl pointer-events-auto relative"></div>
    <div class="relative self-end">
      <div id="menu-container" class="w-[260px] h-[172px] bg-slate-950/95 backdrop-blur-xl rounded-xl border border-slate-700/80 border-t-2 border-t-cyan-500/80 flex flex-col overflow-hidden relative shadow-[0_15px_35px_rgba(0,0,0,0.9)] pointer-events-auto self-end mb-1 sm:mb-0">
        <div class="px-2.5 py-1 bg-gradient-to-r from-violet-950/60 via-slate-900/90 to-slate-950 border-b border-violet-900/40 flex justify-between items-center shrink-0">
          <div class="flex items-center gap-1.5 min-w-0"><span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse shrink-0"></span><span class="text-xs font-bold text-sky-200 truncate">抗性与免疫 · 生效瞬间</span></div>
          <div class="flex items-center gap-1 shrink-0"><span id="variant-beat-stat" class="text-[9px] font-mono text-sky-300/90 truncate max-w-[92px]" title="当前状态/拍点">待机</span><button id="btn-variant-sfx" class="text-[9px] font-bold px-1.5 rounded border border-emerald-500/60 text-emerald-300 hover:bg-white/10 transition-all shrink-0" aria-pressed="true">🔊 音开</button></div>
        </div>
        <div id="skill-list" class="flex-1 flex flex-col gap-1 p-1 overflow-y-auto custom-scrollbar"></div>
      </div>
    </div>
  </div>

  <!-- 底部对话栏（复刻主界面，仅装饰） -->
  <div id="chat-bar" class="absolute bottom-0 left-0 right-0 h-[52px] z-30 flex items-center gap-2 px-2 sm:px-3 bg-black/60 border-t border-white/5">
    <div class="w-9 h-9 rounded-full bg-slate-700 border border-white/20 shrink-0 flex items-center justify-center">🕵️</div>
    <input type="text" placeholder="说点什么... (Enter发送)" class="flex-1 h-9 rounded-full px-4 text-sm outline-none">
    <span class="px-3 py-1 rounded-full text-xs font-bold border border-emerald-500/60 text-emerald-300 bg-emerald-950/50">友方旁白 ON</span>
    <span class="px-3 py-1 rounded-full text-xs font-bold border border-rose-500/60 text-rose-300 bg-rose-950/50">敌方旁白 ON</span>
    <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">➤</div>
  </div>
 </div>
  <script>
    // ===== 演示宿主 BEGIN：占位数据、渲染、fxEngine；不移植到正式版 =====
    const $ = s => document.querySelector(s);
    let combatToken = 0;
    let heroesData = [], enemiesData = [];
    const HERO_AVATARS = {
        '埃利奥特': 'https://imgur.la/images/2026/06/25/31a4dd84a831e3f76082542bf12fcf19.png',
        '弗兰克': 'https://imgur.la/images/2026/06/25/26f001dbe399876cd74978bbe12a265b.png',
        '玛德琳': 'https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png',
        '索恩': 'https://imgur.la/images/2026/08/13/77fcdf0fd006c4ff1ccae30774322270.png'
    };
    const HERO_DATA = [['h1', '埃利奥特', '👨', 100, 55, 110, 5], ['h2', '弗兰克', '🧔', 180, 0, 17, 0], ['h3', '玛德琳', '👩', 140, 0, 14, 0], ['h4', '索恩', '🕵️', 140, 0, 20, 0]];
    const ENEMY_ROWS = [[['e1', '🐟'], ['e2', '❄️'], ['e3', '🐟']], [['e4', '👻'], ['e5', '👻'], ['e6', '🌀']]];

function createCompactBarHTML(id, type, label, val, max, colorClass, isTp = false, shield = 0) {
  const pct = Math.max(0, Math.min(100, (val / max) * 100)); const barWidthClass = isTp ? 'w-1/3' : 'w-full';
  const shieldText = shield > 0 && type === 'hp' ? `<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾${shield})</span>` : '';
  let finalColor = colorClass; let extraClass = ''; if (isTp && val >= max) { finalColor = 'bg-amber-400'; extraClass = 'shadow-[0_0_10px_rgba(251,191,36,0.8)] animate-pulse'; }
  return `<div class="relative pt-1.5 sm:pt-2.5 mb-0 sm:mb-[2px]"><span id="${id}-${type}-text" class="absolute right-0 top-0 text-[8px] sm:text-xs font-mono font-bold text-white leading-none text-outline z-10 whitespace-nowrap">${Math.floor(val)}${shieldText}</span><div class="flex items-center gap-1 sm:gap-1.5"><span class="text-[7px] sm:text-[10px] font-bold text-gray-200 leading-none text-outline w-3 sm:w-4">${label}</span><div class="flex-grow h-1 sm:h-1.5 bg-[#222] rounded-[1px] overflow-hidden border border-[#111]"><div id="${id}-${type}-bar" class="${barWidthClass} h-full ${finalColor} ${extraClass} transition-all duration-300 ease-out" style="width: ${pct}%"></div></div></div></div>`;
}

function getEntitySpriteDom(entityOrId){
  const id = entityOrId && typeof entityOrId === 'object' ? entityOrId.id : String(entityOrId||'');
  if(!id) return null;
  return document.getElementById(`hero-card-${id}`) || document.getElementById(`${id}-sprite`) || document.getElementById(`hero-wrap-${id}`) || null;
}
window.getEntitySpriteDom = getEntitySpriteDom;

    function renderEntityBuffs(entity) {
        const box = document.getElementById(`${entity.id}-buffs`);
        if (box) {
            const buffs = entity.buffs || [];
            box.innerHTML = buffs.map(b => `<span class="text-[8px] sm:text-[9px] font-bold px-1 rounded bg-black/75 border border-white/20 shadow" style="color:${b.color || '#f8fafc'}">${b.label}</span>`).join('');
        }
        updateDemoStunVisual(entity);
    }
    function updateDemoStunVisual(entity) {
        const stunEl = document.getElementById(`${entity.id}-stunFx`);
        if (!stunEl) return;
        const isStunned = (entity.buffs || []).some(b => b.type === 'stun');
        stunEl.classList.toggle('hidden', !(isStunned && entity.isAlive !== false));
    }
    window.renderDemoEntityBuffs = renderEntityBuffs;
    window.updateDemoStunVisual = updateDemoStunVisual;

    function initUI(init = {}) {
        heroesData = HERO_DATA.map(([id, name, face, hp, shield, mp, tp]) => Object.assign({ id, name, face, img: HERO_AVATARS[name] || '', hp, maxHp: hp, shield, mp, maxMp: mp, tp, maxTp: 100, isAlive: true, buffs: [] }, init[id]));
        enemiesData = ENEMY_ROWS.flat().map(([id, face]) => Object.assign({ id, name: id, face, hp: 1000, maxHp: 1000, shield: 0, isAlive: true, buffs: [] }, init[id]));
        $('#heroes-container').innerHTML = heroesData.map(({ id, name, face, img, hp, maxHp, shield, mp, maxMp, tp, maxTp }) => `
      <div class="hero relative transition-all duration-300 min-w-[70px] z-20" id="hero-wrap-${id}">
        <div id="${id}-stunFx" class="stun-fx hidden absolute -top-2 left-1/2 -translate-x-1/2 z-30 pointer-events-none"><span class="stun-star">★</span><span class="stun-star">★</span><span class="stun-star">★</span></div>
        <div id="hero-card-${id}" class="fx-body hero-card-inner bg-[#18181b] rounded overflow-hidden relative border shadow-2xl transition-all border-gray-800">

class CanvasFxEngine {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }
}

        { name: '狂暴红外观 + 虚形(近战)共存', targetId: 'e4', fromId: 'h2', incomingType: '近战', isAoe: false, hasTag: ['[虚形]'], outcome: 'hit', stateResult: 'none', setupPersist: { id: 'e4', kind: 'rage' }, meta: { rawDamage: 190, finalDamage: 95, resistReduced: 95 } },

        { name: '钢体 · 免疫眩晕 [星环碎裂]', targetId: 'h2', fromId: 'e5', incomingType: '近战', isAoe: false, hasTag: ['[钢体]'], outcome: 'hit', stateResult: 'immuneStun', meta: { rawDamage: 26, finalDamage: 26 } },
        { name: '无钢体对照 · 眩晕星环存留晃动', targetId: 'h3', fromId: 'e5', incomingType: '近战', isAoe: false, hasTag: [], outcome: 'hit', stateResult: 'stun', meta: { rawDamage: 26, finalDamage: 26 } },
        { name: '免疫仍扣血 · 先重击扣血后星环碎裂', targetId: 'h2', fromId: 'e4', incomingType: '近战', isAoe: false, hasTag: ['[钢体]'], outcome: 'hit', stateResult: 'immuneStun', meta: { rawDamage: 62, finalDamage: 62 } },
        { name: '闪避目标 · 全抗性/免疫均无响应', targetId: 'e4', fromId: 'h3', incomingType: '法术', isAoe: true, hasTag: ['[破法]', '[要害]', '[防火]', '[钢体]'], outcome: 'dodge', stateResult: 'immuneStun', meta: { spellColor: '#a855f7', rawDamage: 0, finalDmg: 0 } }
      ] },
      { title: '五、连发并发压测 & 中途重置', tag: '并发鲁棒', cards: [
        { name: '连发压测 · 同体连吃近战→法术', mode: 'seq', steps: [
          { delay: 0, targetId: 'e4', fromId: 'h2', incomingType: '近战', isAoe: false, hasTag: ['[虚形]'], outcome: 'hit', stateResult: 'none', meta: { rawDamage: 160, finalDamage: 80, resistReduced: 80 } },
          { delay: 290, targetId: 'e4', fromId: 'h3', incomingType: '法术', isAoe: false, hasTag: ['[破法]'], outcome: 'hit', stateResult: 'none', meta: { spellColor: '#38bdf8', rawDamage: 180, finalDamage: 90, resistReduced: 90 } }
        ] },
        { name: 'AoE同批 · 有[要害]与无[要害]齐中', mode: 'batch', targets: [
          { targetId: 'e5', hasTag: ['[要害]'], meta: { rawDamage: 170, finalDamage: 85, resistReduced: 85 } },
          { targetId: 'e6', hasTag: [], meta: { rawDamage: 170, finalDamage: 170 } }
        ], fromId: 'h3', incomingType: '法术', isAoe: true, outcome: 'hit', stateResult: 'none', meta: { spellColor: '#fbbf24' } }
      ] }

    function clearDemoExtras() {
      demoTimers.forEach(id => clearTimeout(id)); demoTimers.clear();
      demoExtras.forEach(el => { try { el.remove(); } catch (_) {} }); demoExtras.clear();
      stopVariantHostAudio();
    }
    function findDemoEnt(id) { return heroesData.find(x => x.id === id) || enemiesData.find(x => x.id === id) || null; }
    function spawnDemoFloat(targetId, text, color = '#f8fafc', dy = -12) {
      const dom = getEntitySpriteDom(targetId);
      if (!dom) return;
      const b = dom.getBoundingClientRect();
      const el = document.createElement('div');
      el.className = 'arcane-variant-float-text text-xs sm:text-sm';
      el.textContent = text;
      el.style.cssText = `left:${b.left + b.width / 2}px;top:${b.top + dy}px;color:${color};`;
      document.body.appendChild(el);
      demoExtras.add(el);
      demoAt(1180, () => { try { el.remove(); } catch (_) {} demoExtras.delete(el); });
    }
    function updateDemoHp(ent, dmg) {
      if (!ent || !dmg) return;
      let rem = Math.max(0, Math.floor(dmg));
      if (ent.shield > 0) { const s = Math.min(ent.shield, rem); ent.shield -= s; rem -= s; }
      ent.hp = Math.max(12, ent.hp - rem);
      const bar = document.getElementById(`${ent.id}-hp-bar`), txt = document.getElementById(`${ent.id}-hp-text`);
      if (bar) bar.style.width = `${Math.max(0, Math.min(100, (ent.hp / ent.maxHp) * 100))}%`;
      if (txt) {
        const isHero = heroesData.some(h => h.id === ent.id);
        txt.innerHTML = isHero ? `${Math.floor(ent.hp)}${ent.shield > 0 ? `<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾${ent.shield})</span>` : ''}` : `${Math.floor(ent.hp)}/${ent.maxHp}`;
      }
    }
    function playDemoPoisonSeep(dom, token) {
      if (!dom || token !== combatToken) return;
      const r = dom.getBoundingClientRect();
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;left:${r.left + r.width / 2 - 40}px;top:${r.top + r.height / 2 - 40}px;width:80px;height:80px;border-radius:50%;pointer-events:none;z-index:445;background:radial-gradient(circle,rgba(216,180,254,0.85) 0%,rgba(147,51,234,0.5) 55%,transparent 75%);`;
      document.body.appendChild(el); demoExtras.add(el);
      el.animate([{ transform: 'scale(1.25)', opacity: 0.92 }, { transform: 'scale(0.5)', opacity: 0 }], { duration: 520, fill: 'forwards' });
      demoAt(540, () => { try { el.remove(); } catch (_) {} demoExtras.delete(el); });
    }
    function playDemoBurnFlare(dom, token) {
      if (!dom || token !== combatToken) return;
      const r = dom.getBoundingClientRect();
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;left:${r.left + r.width / 2 - 42}px;top:${r.top + r.height / 2 - 42}px;width:84px;height:84px;border-radius:50%;pointer-events:none;z-index:445;background:radial-gradient(circle,rgba(254,240,138,0.9) 0%,rgba(249,115,22,0.65) 55%,transparent 76%);`;
      document.body.appendChild(el); demoExtras.add(el);
      el.animate([{ transform: 'scale(1.2)', opacity: 0.95 }, { transform: 'scale(0.65)', opacity: 0 }], { duration: 500, fill: 'forwards' });
      demoAt(520, () => { try { el.remove(); } catch (_) {} demoExtras.delete(el); });
    }
    function triggerDemoHitCoexist(step, tDom, quietIdle = false) {
      const ent = findDemoEnt(step.targetId), dmg = (step.meta && (step.meta.finalDamage ?? step.meta.finalDmg)) || 0;
      if (tDom) {
        tDom.classList.remove('arcane-resist-hit-flash');
        void tDom.offsetWidth;
        tDom.classList.add('arcane-resist-hit-flash');
        demoAt(240, () => tDom.classList.remove('arcane-resist-hit-flash'));
        if (!quietIdle && tDom.animate) {
          tDom.animate([{ transform: 'translate3d(0,0,0)' }, { transform: 'translate3d(4px,-2px,0)' }, { transform: 'translate3d(0,0,0)' }], { duration: 150, easing: 'ease-out' });
        }
      }
      if (ent && dmg > 0) { updateDemoHp(ent, dmg); spawnDemoFloat(ent.id, `-${dmg}`, step.meta && step.meta.resistReduced ? '#fda4af' : '#f8fafc', 14); }
    }
    function playDemoLeadIn(fromDom, toDoms, step, token, onImpact) {
      const fc = fromDom ? fromDom.getBoundingClientRect() : { left: 180, top: 360, width: 40, height: 40 };
      const sx = fc.left + fc.width / 2, sy = fc.top + fc.height / 2;
      const pan = Math.max(-0.8, Math.min(0.8, (sx / (window.innerWidth || 1280) - 0.5) * 1.4));
      const sKey = step.incomingType === '远程' ? 'demo_gun' : (step.incomingType === '法术' ? 'demo_spell' : 'demo_atk');
      playVariantSample(sKey, { volume: 0.44, pan });
      const col = (step.meta && step.meta.spellColor) || (step.incomingType === '远程' ? '#fde047' : (step.incomingType === '近战' ? '#f8fafc' : '#a855f7'));
      if (fromDom && fromDom.animate) {
        const dxLunge = (toDoms[0] && toDoms[0].getBoundingClientRect().left > sx ? 14 : -14);
        fromDom.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${dxLunge}px)` }, { transform: 'translateX(0)' }], { duration: 220, easing: 'ease-out' });
      }
      toDoms.forEach(td => {
        if (!td) return;
        const tb = td.getBoundingClientRect();
        const tx = tb.left + tb.width / 2 + (step.outcome === 'dodge' ? 38 : 0), ty = tb.top + tb.height / 2;
        const orb = document.createElement('div');
        orb.style.cssText = `position:fixed;left:${sx - 9}px;top:${sy - 9}px;width:${step.isAoe ? 24 : 16}px;height:${step.isAoe ? 24 : 16}px;border-radius:50%;pointer-events:none;z-index:438;background:radial-gradient(circle,#fff 0%,${col} 52%,transparent 76%);box-shadow:0 0 12px ${col};`;
        document.body.appendChild(orb); demoExtras.add(orb);
        orb.animate([{ transform: 'translate3d(0,0,0) scale(0.75)', opacity: 0.95 }, { transform: `translate3d(${(tx - sx).toFixed(1)}px,${(ty - sy).toFixed(1)}px,0) scale(${step.isAoe ? 1.4 : 1})`, opacity: step.outcome === 'dodge' ? 0.35 : 1 }], { duration: 220, easing: 'cubic-bezier(0.3,0.7,0.4,1)', fill: 'forwards' });
        demoAt(240, () => { try { orb.remove(); } catch (_) {} demoExtras.delete(orb); });
      });
      demoAt(225, () => { if (token === combatToken) onImpact(); });
    }
    function applyDemoStatusOrImmune(step, tDom, fDom, token) {
      const ent = findDemoEnt(step.targetId), sr = step.stateResult;
      if (!ent || !sr || sr === 'none' || token !== combatToken) return;
      const imm = resolveImmuneKind(step);
      if (imm) {
        setBeatStat(`状态免疫 · ${imm}`, '#fde047');
        playVariantResistFx({ target: tDom, incomingType: step.incomingType, isAoe: step.isAoe, outcome: step.outcome, stateResult: sr, kind: imm, meta: { from: fDom }, onBeat: () => setBeatStat(`完成 · ${sr}`, '#86efac') });
        const lbl = sr === 'immuneBurn' ? '免疫·燃' : (sr === 'immunePoison' ? '免疫·毒' : '免疫·晕');
        spawnDemoFloat(ent.id, lbl, '#fde047', -28);
        return;
      }
      if (sr === 'burn') {
        if (!ent.buffs.some(b => b.type === 'burn')) ent.buffs.push({ type: 'burn', label: '🔥 灼烧', color: '#fb923c' });
        renderEntityBuffs(ent);
        playDemoBurnFlare(tDom, token);
        spawnDemoFloat(ent.id, '灼烧 +1', '#fb923c', -26);
        setBeatStat('状态挂上 · 灼烧', '#fb923c');
      } else if (sr === 'poison') {
        if (!ent.buffs.some(b => b.type === 'poison')) ent.buffs.push({ type: 'poison', label: '☠️ 中毒', color: '#c084fc' });
        renderEntityBuffs(ent);
        playDemoPoisonSeep(tDom, token);
        spawnDemoFloat(ent.id, '中毒 +1', '#c084fc', -26);
        setBeatStat('状态挂上 · 中毒', '#c084fc');
      } else if (sr === 'stun') {
        if (!ent.buffs.some(b => b.type === 'stun')) ent.buffs.push({ type: 'stun', label: '⚡ 眩晕', color: '#fde047' });
        renderEntityBuffs(ent);
        spawnDemoFloat(ent.id, '眩晕!', '#fde047', -28);
        setBeatStat('状态挂上 · 眩晕星环', '#fde047');
      }
    }

    function executeDemoStep(step, token) {
      if (token !== combatToken) return;
      if (step.setupPersist) { const pd = getEntitySpriteDom(step.setupPersist.id); if (pd) setPersistentFx(pd, step.setupPersist.kind, true); }
      const fDom = getEntitySpriteDom(step.fromId), tDom = getEntitySpriteDom(step.targetId);
      setBeatStat('前摇蓄势...', '#93c5fd');
      playDemoLeadIn(fDom, [tDom], step, token, () => {
        if (token !== combatToken) return;
        if (step.outcome === 'dodge') {
          if (tDom && tDom.animate) tDom.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(20px)' }, { transform: 'translateX(0)' }], { duration: 240, easing: 'ease-out' });
          playVariantResistFx({ target: tDom, incomingType: step.incomingType, isAoe: step.isAoe, outcome: 'dodge', stateResult: step.stateResult, layers: ['antiMagic', 'vital'] });
          spawnDemoFloat(step.targetId, '闪避 · 无响应', '#94a3b8', -14);
          setBeatStat('闪避 · 无抗性/免疫', '#94a3b8');
          demoAt(650, () => setBeatStat('待机', '#7dd3fc'));
          return;
        }
        triggerDemoHitCoexist(step, tDom, step.stateResult === 'immuneStun');
        const layers = resolveResistLayers(step);
        if (layers.length) {
          setBeatStat(`抗性接触 · ${layers.join('+')}`, '#38bdf8');
          playVariantResistFx({ target: tDom, incomingType: step.incomingType, isAoe: step.isAoe, outcome: 'hit', layers, meta: Object.assign({ from: fDom }, step.meta), onBeat: (_, info) => setBeatStat(`卸力 · ${info.type}`, '#67e8f9') });
        } else {
          setBeatStat('常规命中 · 无匹配抗性', '#cbd5e1');
        }
        if (step.stateResult && step.stateResult !== 'none') {
          demoAt(190, () => applyDemoStatusOrImmune(step, tDom, fDom, token));
          demoAt(820, () => setBeatStat('待机', '#7dd3fc'));
        } else {
          demoAt(840, () => setBeatStat('待机', '#7dd3fc'));
        }
      });
    }

    function playDemoSkill(card, btn) {
      ensureVariantSamples();
      if (btn) { document.querySelectorAll('#skill-list button').forEach(b => b.classList.remove('ring-1', 'ring-sky-400/70')); btn.classList.add('ring-1', 'ring-sky-400/70'); }
      const tok = combatToken;
      if (card.mode === 'seq' && Array.isArray(card.steps)) {
        card.steps.forEach(s => demoAt(s.delay || 0, () => executeDemoStep(s, tok)));
        return;
      }
      if (card.mode === 'batch' && Array.isArray(card.targets)) {
        const fDom = getEntitySpriteDom(card.fromId), toDoms = card.targets.map(t => getEntitySpriteDom(t.targetId));
        setBeatStat('AoE 同批前摇...', '#93c5fd');
        playDemoLeadIn(fDom, toDoms, card, tok, () => {
          card.targets.forEach(t => {
            const sub = Object.assign({}, card, t);
            const tDom = getEntitySpriteDom(sub.targetId);
            triggerDemoHitCoexist(sub, tDom, false);
            const layers = resolveResistLayers(sub);
            if (layers.length) playVariantResistFx({ target: tDom, incomingType: sub.incomingType, isAoe: true, outcome: 'hit', layers, meta: Object.assign({ from: fDom }, sub.meta) });
          });
          setBeatStat('AoE 同批分化完成', '#67e8f9');
          demoAt(840, () => setBeatStat('待机', '#7dd3fc'));
        });
        return;
      }
      executeDemoStep(card, tok);
    }

    function renderSkillCards() {
      const box = $('#skill-list');
      if (!box) return;
      box.innerHTML = DEMO_GROUPS.map((g, gi) => `<div class="arcane-variant-group-hd"><span>${g.title}</span><span class="text-[8px] text-sky-400/80">${g.tag}</span></div>` + g.cards.map((c, ci) => `<button type="button" data-gi="${gi}" data-ci="${ci}" class="w-full text-left px-2 py-1 rounded bg-slate-900/85 hover:bg-slate-800/95 border border-slate-700/60 hover:border-sky-500/50 transition-all text-[10px] text-slate-200 flex items-center justify-between gap-1 shrink-0"><span class="truncate">${c.name}</span><span class="text-[8px] font-mono text-slate-400 shrink-0">${c.mode ? '并发' : (c.outcome === 'dodge' ? '闪避' : (c.isAoe ? '群·' : '') + (c.incomingType || ''))}</span></button>`).join('')).join('');
      box.querySelectorAll('button[data-gi]').forEach(btn => {
        btn.addEventListener('click', () => {
          const c = DEMO_GROUPS[+btn.dataset.gi].cards[+btn.dataset.ci];
          if (c) playDemoSkill(c, btn);
        });
      });
    }

    function resetDemo() {
      combatToken++;
      clearDemoExtras();
      clearArcaneFx();
      initUI();
      renderSkillCards();
      setBeatStat('已重置 · 待机', '#86efac');
    }
    $('#btn-reset').addEventListener('click', resetDemo);
    renderSkillCards();
    // ===== 演示控制 END =====
    // 移植：只将新增 arcane- CSS、技能函数、标签与分派合并到正式版已有模块。
    // 必须同时追加 WEBM_FX_REGISTRY 的 { url: '', scale: 1.0, particles: 'arcane', delay: 蓄势秒数 }。
    // 技能数据追加 [特效:精确标签]；按技能类型核对默认光效去重与真实反应回调，不改数值规则。
    // 详细接线、测试与打包步骤见《技能SVG模板使用与快速移植.md》，不是复制整页即可上线。
    // 正式版已提供 fxEngine / combatToken / getEntitySpriteDom / heroesData / enemiesData，勿重复复制演示宿主。
  </script>
