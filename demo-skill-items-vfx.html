  <title>SVG 技能演练 · 安魂曲音叉 / 塞赫美特之愠 / 逆咒归源镜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; overflow: hidden; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; overflow: hidden; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    .arcane-tint-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 41; opacity: 0; }
    .arcane-prop-wrap { position: fixed; pointer-events: none; z-index: 53; transform-origin: center center; will-change: transform, opacity; }
    .arcane-webm-cv { position: fixed; pointer-events: none; z-index: 54; transform: translate(-50%, -50%); will-change: transform, opacity; }
    @keyframes arcane-f-silence { 0% { filter: brightness(0.65) saturate(0.25) hue-rotate(45deg) drop-shadow(0 0 18px #7c3aed); } 55% { filter: brightness(0.85) saturate(0.5); } 100% { filter: none; } }
    @keyframes arcane-f-shatter { 0% { filter: brightness(2.6) contrast(1.6) drop-shadow(0 0 22px #e0f2fe); } 45% { filter: brightness(1.5) contrast(1.25); } 100% { filter: none; } }
    @keyframes arcane-f-lava { 0% { filter: brightness(2.8) saturate(2.2) hue-rotate(-25deg) drop-shadow(0 0 28px #f97316); } 35% { filter: brightness(1.7) saturate(1.8) drop-shadow(0 0 14px #ef4444); } 100% { filter: none; } }
    @keyframes arcane-f-drain { 0% { filter: brightness(1.65) hue-rotate(30deg) drop-shadow(0 0 16px #38bdf8); } 100% { filter: none; } }
    .arcane-flash-silence { animation: arcane-f-silence 0.65s steps(1) both !important; }
    .arcane-flash-shatter { animation: arcane-f-shatter 0.48s steps(1) both !important; }
    .arcane-flash-lava { animation: arcane-f-lava 0.72s steps(1) both !important; }
    .arcane-flash-drain { animation: arcane-f-drain 0.45s steps(1) both !important; }
    @keyframes arcane-fork-hum { 0%, 100% { transform: translate(-50%, -50%) translateX(-1.5px) scale(1); } 50% { transform: translate(-50%, -50%) translateX(1.5px) scale(1.015); } }
    @keyframes arcane-fork-viol { 0%, 100% { transform: translate(-50%, -50%) translate(-4px, -1px) rotate(-1.6deg); } 50% { transform: translate(-50%, -50%) translate(4px, 1px) rotate(1.6deg); } }
    @keyframes arcane-pulse-ring { 0% { transform: translate(-50%, -50%) scale(0.25); opacity: 0.92; } 100% { transform: translate(-50%, -50%) scale(2.1); opacity: 0; } }
    @keyframes arcane-beam-slash { 0% { transform: translate(-50%, -50%) scaleX(0.08) scaleY(1.9); opacity: 0.95; } 35% { transform: translate(-50%, -50%) scaleX(1.08) scaleY(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scaleX(1.25) scaleY(0.05); opacity: 0; } }
    .arcane-preset-btn.active { border-color: rgba(56,189,248,0.85) !important; background: rgba(14,116,144,0.35) !important; color: #e0f2fe !important; }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>

function createCompactBarHTML(id, type, label, val, max, colorClass, isTp = false, shield = 0) {
  const pct = Math.max(0, Math.min(100, (val / max) * 100)); const barWidthClass = isTp ? 'w-1/3' : 'w-full';
  const shieldText = shield > 0 && type === 'hp' ? `<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾${shield})</span>` : '';
  let finalColor = colorClass; let extraClass = ''; if (isTp && val >= max) { finalColor = 'bg-amber-400'; extraClass = 'shadow-[0_0_10px_rgba(251,191,36,0.8)] animate-pulse'; }
  return `<div class="relative pt-1.5 sm:pt-2.5 mb-0 sm:mb-[2px]"><span id="${id}-${type}-text" class="absolute right-0 top-0 text-[8px] sm:text-xs font-mono font-bold text-white leading-none text-outline z-10 whitespace-nowrap">${Math.floor(val)}${shieldText}</span><div class="flex items-center gap-1 sm:gap-1.5"><span class="text-[7px] sm:text-[10px] font-bold text-gray-200 leading-none text-outline w-3 sm:w-4">${label}</span><div class="flex-grow h-1 sm:h-1.5 bg-[#222] rounded-[1px] overflow-hidden border border-[#111]"><div id="${id}-${type}-bar" class="${barWidthClass} h-full ${finalColor} ${extraClass} transition-all duration-300 ease-out" style="width: ${pct}%"></div></div></div></div>`;
}

function getEntitySpriteDom(entityOrId){
  const id = entityOrId && typeof entityOrId === 'object' ? entityOrId.id : String(entityOrId||'');
  if(!id) return null;
  return document.getElementById(`hero-card-${id}`) || document.getElementById(`${id}-sprite`) || document.getElementById(`hero-wrap-${id}`) || null;
}

class CanvasFxEngine {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }
}

    // —— 真音采样播放器（零振荡器合成：Buffer 缓存 + <audio> 自动降级，受 combatToken 与重置控制） ——
    async function loadSfxBuffer(ctx, key) {
        if (sfxBufferCache.has(key)) return sfxBufferCache.get(key);
        const file = SFX_FILES[key]; if (!file) return null;
        const p = (async () => {
            try {
                const res = await fetch(`${ASSET_BASE}/${encodeURIComponent(file)}`);
                if (!res.ok) return null;
                const ab = await res.arrayBuffer();
                return await ctx.decodeAudioData(ab);
            } catch (_) { return null; }
        })();
        sfxBufferCache.set(key, p);
        return p;
    }
    function playSfxSample(key, delaySec = 0, opts = {}) {
        const file = SFX_FILES[key]; if (!file) return;
        const token = combatToken;
        const vol = opts.volume ?? 0.78, rate = opts.rate ?? 1, pan = opts.pan ?? 0;
        const offset = opts.offset ?? 0, durCap = opts.durCap ?? 0;
        const playFn = () => {
            if (token !== combatToken) return;
            try {
                const ctx = audio();
                loadSfxBuffer(ctx, key).then(buf => {
                    if (token !== combatToken) return;
                    if (!buf) { fallbackHtmlAudio(); return; }
                    const src = ctx.createBufferSource();
                    src.buffer = buf; src.playbackRate.value = rate;
                    const g = ctx.createGain();
                    const now = ctx.currentTime;
                    g.gain.setValueAtTime(vol, now);
                    const total = durCap > 0 ? Math.min(durCap, Math.max(0.1, buf.duration / rate - offset)) : Math.max(0.1, buf.duration / rate - offset);
                    if (opts.fadeOut && total > opts.fadeOut) {
                        g.gain.setValueAtTime(vol, now + total - opts.fadeOut);
                        g.gain.exponentialRampToValueAtTime(0.0001, now + total);
                    }
                    const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
                    if (p) { p.pan.setValueAtTime(pan, now); src.connect(g); g.connect(p); p.connect(ctx.destination); }
                    else { src.connect(g); g.connect(ctx.destination); }
                    const stopMe = () => { try { src.stop(); src.disconnect(); } catch (_) {} S.sampleAudios.delete(stopMe); };
                    S.sampleAudios.add(stopMe);
                    src.onended = () => S.sampleAudios.delete(stopMe);
                    src.start(now, offset, durCap > 0 ? durCap : undefined);
                });
            } catch (_) { fallbackHtmlAudio(); }
        };
        function fallbackHtmlAudio() {
            if (token !== combatToken) return;
            try {
                const a = new Audio(`${ASSET_BASE}/${encodeURIComponent(file)}`);
                a.volume = Math.max(0, Math.min(1, vol));
                a.playbackRate = rate;
                if (offset) a.currentTime = offset;
                const stopMe = () => { try { a.pause(); a.src = ''; } catch (_) {} S.sampleAudios.delete(stopMe); };
                S.sampleAudios.add(stopMe);
                a.onended = () => S.sampleAudios.delete(stopMe);
                a.play().catch(() => {});
                if (durCap > 0) after(durCap * 1000, stopMe);
            } catch (_) {}
        }
        if (delaySec > 0) after(Math.round(delaySec * 1000), playFn);
        else playFn();
    }

        const token = combatToken;
        const cleanups = [];
        const cleanup = () => { while (cleanups.length) { try { cleanups.pop()(); } catch (_) {} } S.videos.delete(cleanup); };
        S.videos.add(cleanup);
        const startPlay = () => {
            if (token !== combatToken) { cleanup(); return; }
            const v = document.createElement('video');
            v.muted = true; v.playsInline = true; v.preload = 'auto'; v.crossOrigin = 'anonymous';
            v.src = `${ASSET_BASE}/${encodeURIComponent(file)}`;
            const cv = document.createElement('canvas');
            cv.className = 'arcane-webm-cv';
            cv.setAttribute('data-arcane-fx', 'webm');
            cv.style.left = `${x}px`; cv.style.top = `${y}px`;
            cv.style.zIndex = String(opts.zIndex || 54);
            cv.style.mixBlendMode = opts.blend || 'screen';
            cv.style.opacity = String(opts.opacity ?? 0.96);
            if (opts.filter) cv.style.filter = opts.filter;
            document.body.appendChild(cv);
            let stopped = false, rafId = 0, rvfcId = 0;
            cleanups.push(() => {
                stopped = true;
                if (rafId) cancelAnimationFrame(rafId);
                if (rvfcId && v.cancelVideoFrameCallback) try { v.cancelVideoFrameCallback(rvfcId); } catch (_) {}
                try { v.pause(); v.removeAttribute('src'); v.load(); } catch (_) {}
                cv.remove();
            });
            const scale = opts.scale ?? 1.0, rate = opts.playbackRate ?? 1.0;
            v.playbackRate = rate;
            v.addEventListener('loadedmetadata', () => {
                if (stopped || token !== combatToken) { cleanup(); return; }
                const natW = v.videoWidth || 480, natH = v.videoHeight || 360;
                const drawW = opts.width ? opts.width : Math.round(natW * scale);
                const drawH = opts.height ? opts.height : Math.round(natH * scale);
                const keyW = Math.min(drawW, 960), keyH = Math.round(keyW * (drawH / Math.max(1, drawW)));
                cv.width = keyW; cv.height = keyH;
                cv.style.width = `${drawW}px`; cv.style.height = `${drawH}px`;
                if (opts.flipX) cv.style.transform = 'translate(-50%, -50%) scaleX(-1)';
                const g = cv.getContext('2d', { willReadFrequently: true });
                const renderFrame = () => {
                    if (stopped || token !== combatToken || v.ended) { cleanup(); return; }
                    if (v.readyState >= 2) {
                        g.clearRect(0, 0, keyW, keyH);
                        g.drawImage(v, 0, 0, keyW, keyH);
                        if (opts.keyDark) {
                            const img = g.getImageData(0, 0, keyW, keyH), d = img.data;
                            for (let i = 0; i < d.length; i += 4) {
                                const mx = Math.max(d[i], d[i + 1], d[i + 2]);
                                if (mx < 10) d[i + 3] = 0;
                                else if (mx < 26) d[i + 3] = Math.round(d[i + 3] * (mx - 10) / 16);
                            }
                            g.putImageData(img, 0, 0);
                        }
                    }
                    if (v.requestVideoFrameCallback) rvfcId = v.requestVideoFrameCallback(renderFrame);
                    else rafId = requestAnimationFrame(renderFrame);
                };
                v.play().then(() => {
                    if (stopped || token !== combatToken) { cleanup(); return; }
                    renderFrame();
                    if (opts.onStart) opts.onStart(v);
                }).catch(() => cleanup());
            }, { once: true });
            v.addEventListener('ended', cleanup, { once: true });
            v.addEventListener('error', cleanup, { once: true });
            if (opts.durMs) after(opts.durMs, cleanup);
        };
        if (opts.delayMs) after(opts.delayMs, startPlay);
        else startPlay();
        return cleanup;
    }

    // —— 精准立绘视觉锚点（避开血条） & 暗铁音叉 / 色罩辅助 ——
    function visualCtr(el) {

        const vis = (el.querySelector && el.querySelector('.portrait')) || el;

    // 接入点 2：在这里写 playXxx(caster, targets, isReaction)，使用 domOf / ctr / unionRect 定位。
    // 延时用 after / every；SVG 用 fsLayer(html, 生命周期毫秒)；粒子用 addP / burst / fly；不要另起永久 rAF。
    // 无固定寿命的图层由 handle.cancel() 和自然收尾显式移除；darken(o) 收尾必须调用 darken(0)。
    // 保持纯演出：不改 HP/状态，不负责浮字或战斗结算；测试反馈放在下方演示控制区。
    // 持续演出返回 handle：doneAt: Date.now() + 总演出毫秒（含尾韵），不能用 performance.now()。
    // cancel() 只清理自身图层、计时和 WAAPI 动画，不在技能内部调用全局 clearArcaneFx()。
    // 按需提供 dodge(success) / hit(type) / dispel(dom) / impactDom，与正式版反应接口一致。
    // impactDom 可指向实体或 mkAnchor() 自建落点；dropAnchor() 只用于后者，不能删除真实角色 DOM。
    // handle 加入 S.handles；结束时删除并调用 releaseIdleCanvas()；WAAPI 动画由 cancel() 取消。
    // 普通/反应演练及完整可运行接入示例见根目录《技能SVG模板使用与快速移植.md》。
    // ===== ① 【安魂曲音叉 · 谐律之庇】L3 全屏我方群驱散 (2300ms / 爆发点 900ms) =====
    function playHarmonyShelter(caster, targets) {
        const token = combatToken, uid = ++S.uid, localAnim = [];
        const doms = teamSprites(caster);
        const rawDoms = (targets || []).map(domOf).filter(Boolean);
        const allyDoms = doms.length ? doms : rawDoms;
        const box = unionRect(allyDoms) || { x: window.innerWidth * 0.4, y: window.innerHeight * 0.72, w: 520, h: 160 };
        const forkPos = { x: window.innerWidth * 0.5, y: Math.max(150, window.innerHeight * 0.34) };
        const trackAnim = a => { if (a) localAnim.push(a); return a; };
        const fp = audioPresetState.fork || 'A';

        darken(0.55);
        tintOverlay('radial-gradient(ellipse at 50% 60%, rgba(14,116,144,0.34) 0%, rgba(15,23,42,0.58) 72%, rgba(2,6,23,0.82) 100%)', 2300, 0.78);
        playSfxSample(fp === 'B' ? 'forkHum' : (fp === 'C' ? 'forkWiki' : 'fork432'), 0.08, { volume: 0.85, fadeOut: 0.5 });
        playSfxSample(fp === 'B' ? 'bowlClear' : (fp === 'C' ? 'crystalChime' : 'bowlNepal'), 0.82, { volume: 0.72, fadeOut: 0.6 });

        const propWrap = fsLayer(`<div class="arcane-fs-anchor" style="left:${forkPos.x}px; top:${forkPos.y}px; width:260px; height:240px;">${mkTuningForkGroupSvg(uid, 'harmony')}</div>`, 2250);
        const propEl = propWrap.firstElementChild;
        trackAnim(propEl.animate([
            { transform: 'translate(-50%, -50%) scale(0.55)', opacity: 0 },
            { transform: 'translate(-50%, -50%) scale(1)', opacity: 1, offset: 0.14 },
            { transform: 'translate(-50%, -50%) scale(1.06)', opacity: 1, offset: 0.86 },
            { transform: 'translate(-50%, -50%) scale(0.85)', opacity: 0 }
        ], { duration: 2150, fill: 'both' }));

        after(120, () => {
            if (token !== combatToken) return;
            propEl.style.animation = 'arcane-fork-hum 0.11s linear infinite';
            burst(16, () => { const a = rnd(0, 6.283), s = rnd(1.5, 4); return { x: forkPos.x + 18, y: forkPos.y - 45, vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: 0.93, decay: 0.04, size: rnd(10, 18), shape: 'gradOrb', core: '#ffffff', mid: '#7dd3fc', outer: 'rgba(14,165,233,0.12)' }; });
            addP({ x: forkPos.x + 16, y: forkPos.y - 42, shape: 'gradFlare', rx: 64, ry: 12, decay: 0.06, core: '#fff', mid: '#bae6fd', outer: 'rgba(56,189,248,0.1)' });
        });

        // 蓄势阶段聚拢光尘与双道青银音律涟漪
        const cId = every(90, () => {
            if (token !== combatToken) return;
            allyDoms.forEach(d => {
                const c = visualCtr(d), ang = rnd(0, 6.283), rad = rnd(58, 92);
                addP({ x: c.x + Math.cos(ang) * rad, y: c.y + Math.sin(ang) * rad, vx: -Math.cos(ang) * 2.4, vy: -Math.sin(ang) * 2.2 - 0.5, drag: 0.96, decay: 0.04, size: rnd(6, 12), shape: 'gradOrb', core: '#ffffff', mid: '#38bdf8', outer: 'rgba(186,230,253,0.08)' });
            });
        });
        after(820, () => stopEvery(cId));

        after(900, () => {
            if (token !== combatToken) return;
            shake('light');
            addP({ x: box.x, y: box.y + 12, shape: 'gradRing', sy: 0.36, r0: 45, r1: 380, decay: 0.025, color: 'rgba(186,230,253,0.28)', edge: 'rgba(224,242,254,0.58)' });
            playWebMFX('vfx_harmony_ripple.webm', box.x, box.y + 18, { width: Math.max(540, box.w * 1.15), height: 210, opacity: 0.94, blend: 'screen', durMs: 1450 });
            allyDoms.forEach((d, idx) => {
                const c = visualCtr(d), rw = Math.max(82, c.w * 1.15), rh = Math.max(38, c.h * 0.42);
                const halo = fsLayer(`<div class="arcane-fs-anchor" style="left:${c.x}px; top:${c.bottom - 6}px; width:${rw}px; height:${rh}px; border-radius:50%; background:radial-gradient(ellipse at 50% 50%, transparent 48%, rgba(56,189,248,0.42) 76%, rgba(186,230,253,0.55) 86%, transparent 100%); box-shadow:0 0 18px rgba(125,211,252,0.45);"></div>`, 1350);
                halo.firstElementChild.animate([{ transform: 'translate(-50%,-50%) scale(0.75)', opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1.06)', opacity: 0.92, offset: 0.25 }, { transform: 'translate(-50%,-50%) scale(1.18)', opacity: 0 }], { duration: 1250, delay: idx * 45, fill: 'both' });
                flash(d, 'arcane-flash-heal');
                burst(14, () => ({ x: c.x + rnd(-c.w * 0.42, c.w * 0.42), y: c.y + rnd(-c.h * 0.25, c.h * 0.35), vx: rnd(-0.6, 0.6), vy: rnd(-2.4, -0.8), drag: 0.97, decay: rnd(0.018, 0.03), size: rnd(7, 14), shape: 'gradOrb', core: '#ffffff', mid: '#7dd3fc', outer: 'rgba(186,230,253,0.1)' }));
                burst(4, () => ({ x: c.x + rnd(-26, 26), y: c.y + rnd(-20, 20), vx: rnd(-0.3, 0.3), vy: rnd(-0.9, -0.3), drag: 0.99, decay: 0.018, size: rnd(26, 40), shape: 'gradMist', blend: 'screen', inner: 'rgba(125,211,252,0.26)', outer: 'rgba(14,116,144,0.08)' }));
            });
        });

        after(1950, () => darken(0));
        const h = {
            doneAt: Date.now() + 2300,
            dispel(tDom) {
                if (token !== combatToken || !tDom) return;
                const c = visualCtr(tDom);

                burst(18, () => ({ x: c.x + rnd(-24, 24), y: c.y + rnd(-12, 24), vx: rnd(-1.2, 1.2), vy: rnd(-3.2, -1), drag: 0.95, decay: rnd(0.025, 0.045), size: rnd(8, 16), shape: 'gradOrb', core: '#ffffff', mid: '#e0f2fe', outer: 'rgba(56,189,248,0.1)' }));
            },
            cancel() {
                localAnim.forEach(a => { try { a.cancel(); } catch (_) {} });
                darken(0);
                S.handles.delete(h);
                releaseIdleCanvas();
            }
        };
        S.handles.add(h);
        after(2300, () => { S.handles.delete(h); releaseIdleCanvas(); });
        return h;
    }
