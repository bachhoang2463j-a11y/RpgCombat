<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>变种能力生效瞬间 · Demo v1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; overflow: hidden; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; overflow: hidden; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    /* ===== 变种能力触发特效 arcane-variant-*（可移植） ===== */
    .arcane-variant-anchor { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; }
    .arcane-variant-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .arcane-variant-host-rel { position: relative !important; }
    .arcane-variant-revive-desat { filter: grayscale(0.88) brightness(0.8) contrast(1.06) drop-shadow(0 0 10px rgba(186, 230, 253, 0.32)) !important; transition: filter 0.18s ease-out !important; }
    .arcane-variant-molt-sprite { filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.72)) drop-shadow(0 0 16px rgba(245, 158, 11, 0.42)) drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5)); }
    .arcane-variant-rage-sprite { filter: drop-shadow(0 0 7px rgba(239, 68, 68, 0.85)) drop-shadow(0 0 18px rgba(185, 28, 28, 0.58)) drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5)); transition: filter 0.45s ease-out; }
    .arcane-variant-molt-sprite.arcane-variant-rage-sprite { filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.8)) drop-shadow(0 0 12px rgba(239, 68, 68, 0.85)) drop-shadow(0 0 22px rgba(185, 28, 28, 0.55)) drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5)); }
    .arcane-variant-molted-fx {
        position: absolute; inset: -3px; border-radius: 8px; pointer-events: none; z-index: 18;
        box-shadow: inset 0 0 14px rgba(245, 158, 11, 0.32), 0 0 14px rgba(251, 191, 36, 0.34);
        background: radial-gradient(ellipse at 50% 85%, rgba(251, 191, 36, 0.18) 0%, transparent 68%);
        animation: arcane-variant-molt-idle 3.4s ease-in-out infinite;
    }
    .arcane-variant-molted-fx.is-sprite {
        inset: -24px -28px; box-shadow: none; border-radius: 50%; z-index: -1;
        background: radial-gradient(ellipse closest-side at 50% 70%, rgba(251, 191, 36, 0.42) 0%, rgba(217, 119, 6, 0.16) 54%, transparent 100%);
    }
    .arcane-variant-molted-fx::after {
        content: '蜕'; position: absolute; right: 4px; bottom: 4px; padding: 0 4px;
        font-size: 9px; font-weight: 900; line-height: 1.35; color: #fef3c7;
        background: linear-gradient(135deg, rgba(146, 64, 14, 0.9), rgba(69, 26, 3, 0.92));
        box-shadow: 0 0 6px rgba(251, 191, 36, 0.45); border-radius: 4px;
    }
    .arcane-variant-molted-fx.is-sprite::after { right: 22px; bottom: 22px; }
    @keyframes arcane-variant-molt-idle {
        0%, 100% { opacity: 0.78; transform: scale(1); }
        50% { opacity: 0.96; transform: scale(1.02); }
    }
    .arcane-variant-rage-fx {
        position: absolute; inset: -3px; border-radius: 8px; pointer-events: none; z-index: 19; overflow: hidden;
        box-shadow: inset 0 0 18px rgba(220, 38, 38, 0.42), 0 0 16px rgba(220, 38, 38, 0.4);
        transition: opacity 0.45s ease-out, transform 0.45s ease-out;
    }
    .arcane-variant-rage-fx.is-sprite {
        inset: -26px -30px; box-shadow: none; border-radius: 50%; z-index: -1; overflow: visible;
        background: radial-gradient(ellipse closest-side at 50% 56%, rgba(220, 38, 38, 0.34) 0%, rgba(127, 29, 29, 0.14) 58%, transparent 100%);
    }
    .arcane-variant-rage-fx::before {
        content: ''; position: absolute; left: 0; right: 0; top: 8%; bottom: -6%;
        background: radial-gradient(ellipse closest-side at 50% 62%, rgba(239, 68, 68, 0.34) 0%, rgba(127, 29, 29, 0.14) 55%, transparent 100%);
        animation: arcane-variant-rage-heat 2.2s linear infinite;
    }
    @keyframes arcane-variant-rage-heat {
        0% { transform: translateY(8%) scaleX(0.96); opacity: 0.65; }
        50% { transform: translateY(-7%) scaleX(1.04); opacity: 0.9; }
        100% { transform: translateY(8%) scaleX(0.96); opacity: 0.65; }
    }
    .arcane-variant-rage-fx.exiting { opacity: 0 !important; transform: scale(0.95); }
    /* 演示控制区与时间轴衔接辅助样式 */
    .arcane-variant-group-hd { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; color: #94a3b8; padding: 4px 6px 2px; border-bottom: 1px solid rgba(148,163,184,0.16); margin-top: 2px; display: flex; justify-content: space-between; align-items: center; }
    @keyframes arcane-variant-extra-badge {
        0%, 100% { transform: translateX(-50%) scale(1); filter: drop-shadow(0 0 5px rgba(251,191,36,0.85)); }
        50% { transform: translateX(-50%) scale(1.12); filter: drop-shadow(0 0 11px rgba(251,191,36,1)); }
    }
    .arcane-variant-extra-badge { animation: arcane-variant-extra-badge 1.2s ease-in-out infinite; }
    @keyframes arcane-variant-float-up {
        0% { opacity: 0; transform: translate(-50%, 6px) scale(0.84); }
        18% { opacity: 1; transform: translate(-50%, -8px) scale(1.14); }
        78% { opacity: 1; transform: translate(-50%, -22px) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -34px) scale(0.92); }
    }
    .arcane-variant-float-text {
        position: fixed; pointer-events: none; z-index: 66; white-space: nowrap; font-weight: 800;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7);
        animation: arcane-variant-float-up 1.15s ease-out forwards;
    }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->
  <div class="absolute top-2 sm:top-4 right-2 sm:right-4 z-[115] flex gap-1.5 sm:gap-2">
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-violet-400 hover:text-violet-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📚</span> <span class="hidden sm:inline">世界书</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-purple-400 hover:text-purple-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📜</span> <span class="hidden sm:inline">记录</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-400 hover:text-blue-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔲</span> <span class="hidden sm:inline">全屏</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>💬</span> <span class="hidden sm:inline">对话</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-yellow-500 hover:text-yellow-400 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>⚙️</span> <span class="hidden sm:inline">设置</span></button>
    <button id="btn-reset" class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-emerald-400 hover:text-emerald-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔄</span> <span class="hidden sm:inline">重置</span></button>
  </div>

  <!-- 全屏战场区域 -->
  <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-800 to-emerald-900 overflow-hidden z-0" id="battle-scene">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-0"></div>
    <div class="absolute left-1 sm:left-4 md:left-6 top-16 sm:top-20 bottom-44 sm:bottom-48 w-12 sm:w-14 z-30 flex flex-col items-center select-none">
      <div class="relative w-full h-full flex flex-col items-center">
        <div class="timeline-rail"><div class="rail-pulse-beam"></div></div>
        <div id="turn-order-container" class="relative w-full h-full flex flex-col gap-2 sm:gap-2.5 items-center overflow-y-auto no-scrollbar mask-fade-y py-3"></div>
      </div>
    </div>
    <div id="enemies-container" class="absolute left-2 sm:left-6 right-2 sm:right-6 top-[10%] bottom-[190px] sm:bottom-[220px] z-10 flex flex-col items-center justify-start gap-6 overflow-visible pointer-events-none"></div>
  </div>

  <!-- 悬浮 UI 层 -->
  <div class="absolute bottom-[52px] left-0 w-full p-1.5 sm:p-6 flex flex-col-reverse sm:flex-row items-end justify-between gap-1.5 sm:gap-4 z-20 pointer-events-none pb-2 sm:pb-6">
    <div id="heroes-container" class="w-full sm:flex-1 grid grid-cols-4 gap-1 sm:gap-4 max-w-2xl pointer-events-auto relative"></div>
    <div class="relative self-end">
      <div id="menu-container" class="w-[260px] h-[172px] bg-slate-950/95 backdrop-blur-xl rounded-xl border border-slate-700/80 border-t-2 border-t-cyan-500/80 flex flex-col overflow-hidden relative shadow-[0_15px_35px_rgba(0,0,0,0.9)] pointer-events-auto self-end mb-1 sm:mb-0">
        <div class="px-2.5 py-1 bg-gradient-to-r from-violet-950/60 via-slate-900/90 to-slate-950 border-b border-violet-900/40 flex justify-between items-center shrink-0">
          <div class="flex items-center gap-1.5 min-w-0"><span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse shrink-0"></span><span class="text-xs font-bold text-amber-200 truncate">变种能力 · 生效瞬间</span></div>
          <div class="flex items-center gap-1 shrink-0"><span id="variant-beat-stat" class="text-[9px] font-mono text-amber-300/90 truncate max-w-[90px]" title="当前状态/拍点">待机</span><button id="btn-variant-sfx" class="text-[9px] font-bold px-1.5 rounded border border-emerald-500/60 text-emerald-300 hover:bg-white/10 transition-all shrink-0" aria-pressed="true">🔊 音开</button></div>

  <!-- 底部对话栏（复刻主界面，仅装饰） -->

    <span class="px-3 py-1 rounded-full text-xs font-bold border border-rose-500/60 text-rose-300 bg-rose-950/50">敌方旁白 ON</span>
    <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">➤</div>
  </div>
 </div>
  <script>
    // ===== 演示宿主 BEGIN：占位数据、渲染、fxEngine；不移植到正式版 =====
    const $ = s => document.querySelector(s);
    let combatToken = 0;
    let heroesData = [], enemiesData = [];
    const HERO_AVATARS = {
        '埃利奥特': 'https://imgur.la/images/2026/06/25/31a4dd84a831e3f76082542bf12fcf19.png',
        '弗兰克': 'https://imgur.la/images/2026/06/25/26f001dbe399876cd74978bbe12a265b.png',
        '玛德琳': 'https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png',
        '索恩': 'https://imgur.la/images/2026/08/13/77fcdf0fd006c4ff1ccae30774322270.png'
    };
    const HERO_DATA = [['h1', '埃利奥特', '👨', 100, 55, 110, 5], ['h2', '弗兰克', '🧔', 180, 0, 17, 0], ['h3', '玛德琳', '👩', 140, 0, 14, 0], ['h4', '索恩', '🕵️', 140, 0, 20, 0]];
    const ENEMY_ROWS = [[['e1', '🐟'], ['e2', '❄️'], ['e3', '🐟']], [['e4', '👻'], ['e5', '👻'], ['e6', '🌀']]];

function createCompactBarHTML(id, type, label, val, max, colorClass, isTp = false, shield = 0) {
  const pct = Math.max(0, Math.min(100, (val / max) * 100)); const barWidthClass = isTp ? 'w-1/3' : 'w-full';
  const shieldText = shield > 0 && type === 'hp' ? `<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾${shield})</span>` : '';
  let finalColor = colorClass; let extraClass = ''; if (isTp && val >= max) { finalColor = 'bg-amber-400'; extraClass = 'shadow-[0_0_10px_rgba(251,191,36,0.8)] animate-pulse'; }
  return `<div class="relative pt-1.5 sm:pt-2.5 mb-0 sm:mb-[2px]"><span id="${id}-${type}-text" class="absolute right-0 top-0 text-[8px] sm:text-xs font-mono font-bold text-white leading-none text-outline z-10 whitespace-nowrap">${Math.floor(val)}${shieldText}</span><div class="flex items-center gap-1 sm:gap-1.5"><span class="text-[7px] sm:text-[10px] font-bold text-gray-200 leading-none text-outline w-3 sm:w-4">${label}</span><div class="flex-grow h-1 sm:h-1.5 bg-[#222] rounded-[1px] overflow-hidden border border-[#111]"><div id="${id}-${type}-bar" class="${barWidthClass} h-full ${finalColor} ${extraClass} transition-all duration-300 ease-out" style="width: ${pct}%"></div></div></div></div>`;
}

function getEntitySpriteDom(entityOrId){
  const id = entityOrId && typeof entityOrId === 'object' ? entityOrId.id : String(entityOrId||'');
  if(!id) return null;
  return document.getElementById(`hero-card-${id}`) || document.getElementById(`${id}-sprite`) || document.getElementById(`hero-wrap-${id}`) || null;
}
window.getEntitySpriteDom = getEntitySpriteDom;

    const DEFAULT_TURN_ITEMS = [
        { id: 'h1', e: '👨', name: '埃利奥特', hero: true },
        { id: 'e2', e: '❄️', name: 'e2', hero: false },
        { id: 'h2', e: '🧔', name: '弗兰克', hero: true },
        { id: 'h3', e: '👩', name: '玛德琳', hero: true },
        { id: 'h4', e: '🕵️', name: '索恩', hero: true },
        { id: 'e4', e: '👻', name: 'e4', hero: false },
        { id: 'e5', e: '👻', name: 'e5', hero: false }
    ];
    let demoTurnItems = DEFAULT_TURN_ITEMS.map(x => ({ ...x }));

    function renderTurnTimeline(items) {
        demoTurnItems = (items || DEFAULT_TURN_ITEMS).map(x => ({ ...x }));
        $('#turn-order-container').innerHTML = demoTurnItems.map((it, i) => {
            const av = it.hero && HERO_AVATARS[it.name];
            const borderColor = it.isExtra ? '#fbbf24' : (it.hero ? '#06b6d4' : '#e11d48');
            const extraShadow = it.isExtra ? 'box-shadow:0 0 12px rgba(251,191,36,0.9);' : '';

    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }
}

        return `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${std}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

    function cloneVisualOnly(dom) {
        const portrait = dom.querySelector && dom.querySelector('.portrait');

        const clone = (target || dom).cloneNode(true);

    function variantRun(totalMs, lockId) {
        const token = combatToken;
        ensureCanvas(); ensureDriver();
        if (lockId) lockVariantEntity(lockId);
        const owner = {
            cancelled: false, finished: false, token, lockId: lockId || '',
            timers: new Set(), intervals: new Set(), animations: new Set(),
            layers: new Set(), anchors: new Set(), flights: new Set(), restores: []
        };
        owner.at = (ms, fn) => {
            const id = after(ms, () => {
                owner.timers.delete(id);
                if (owner.cancelled || owner.finished || token !== combatToken) return;
                fn();
            });
            owner.timers.add(id); return id;
        };
        owner.every = (ms, fn) => {
            const id = every(ms, () => {
                if (owner.cancelled || owner.finished || token !== combatToken) { stopEvery(id); owner.intervals.delete(id); return; }
                fn();
            });
            owner.intervals.add(id); return id;
        };
        owner.layer = html => { const d = fsLayer(html); owner.layers.add(d); return d; };
        owner.anim = (el, kf, opts) => { const a = el.animate(kf, opts); owner.animations.add(a); return a; };
        owner.addP = opts => addP(Object.assign({ owner }, opts));
        owner.burst = (n, fn) => { for (let i = 0; i < n; i++) owner.addP(fn(i)); };
        owner.fly = (a, b, lift, dur, draw, done, ease) => {
            const f = fly(a, b, lift, dur, draw, () => {
                owner.flights.delete(f);
                if (!owner.cancelled && !owner.finished && token === combatToken && done) done();
            }, ease);
            owner.flights.add(f); return f;
        };
        owner.flyBezier = (a, ctrl, b, dur, draw, done, ease) => {
            const f = flyBezier(a, ctrl, b, dur, draw, () => {
                owner.flights.delete(f);
                if (!owner.cancelled && !owner.finished && token === combatToken && done) done();
            }, ease);
            owner.flights.add(f); return f;
        };
        owner.onRestore = fn => { owner.restores.push(fn); };
        function cleanup() {
            if (owner.finished) return;
            owner.finished = true;
            owner.timers.forEach(id => { clearTimeout(id); S.timers.delete(id); }); owner.timers.clear();
            owner.intervals.forEach(id => { clearInterval(id); S.intervals.delete(id); }); owner.intervals.clear();
            owner.animations.forEach(a => { try { a.cancel(); } catch {} }); owner.animations.clear();
            owner.layers.forEach(d => { S.layers.delete(d); d.remove(); }); owner.layers.clear();
            owner.anchors.forEach(d => dropAnchor(d)); owner.anchors.clear();
            owner.flights.forEach(f => { clearTimeout(f.timer); S.timers.delete(f.timer); });
            if (owner.flights.size) S.flights = S.flights.filter(f => !owner.flights.has(f));
            owner.flights.clear();
            S.particles = S.particles.filter(p => p.owner !== owner);
            owner.restores.forEach(fn => { try { fn(); } catch {} }); owner.restores.length = 0;
            if (owner.lockId) { unlockVariantEntity(owner.lockId); owner.lockId = ''; }
            S.handles.delete(handle);
            releaseIdleCanvas();
        }
        const handle = { doneAt: Date.now() + totalMs, cancel() { owner.cancelled = true; cleanup(); } };
        S.handles.add(handle);
        owner.at(totalMs, cleanup);
        owner.handle = handle;
        return owner;
    }

    function playVariantThorn(holderEntity, attackerEntity, meta = {}, onBeat) {

        const fromDom = domOf(holderEntity), toDom = domOf(attackerEntity);

        const aR = entityVisualRect(fromDom), bR = entityVisualRect(toDom);
        const owner = variantRun(600), uid = 'arcane-var-thorn-' + (++S.uid);
        const dx = bR.x - aR.x, dy = bR.y - aR.y, dist = Math.hypot(dx, dy) || 1;
        const ux = dx / dist, uy = dy / dist, deg = Math.atan2(dy, dx) * 180 / Math.PI;
        const hitPt = { x: aR.x + ux * Math.min(aR.w, aR.h) * 0.34, y: aR.y + uy * Math.min(aR.w, aR.h) * 0.34 };
        const endPt = { x: bR.x, y: bR.y };

        const spikeLayer = owner.layer(
            `<div class="arcane-variant-anchor" style="left:${hitPt.x}px;top:${hitPt.y}px;width:112px;height:112px;transform:translate(-50%,-50%) rotate(${deg}deg)">`

            + `<linearGradient id="${uid}-sp" x1="0" y1="0.5" x2="1" y2="0.5"><stop offset="0" stop-color="#5eead4" stop-opacity="0.45"/><stop offset="0.55" stop-color="#cffafe"/><stop offset="1" stop-color="#ffffff"/></linearGradient>`
            + `</defs><g filter="url(#${uid}-gl)">`
            + `<circle cx="44" cy="56" r="28" fill="url(#${uid}-cg)"/>`
            + `<path d="M38,56 Q62,46 98,56 Q62,66 38,56 Z M36,48 Q62,26 86,28 Q60,44 38,52 Z M36,64 Q62,86 86,84 Q60,68 38,60 Z" fill="url(#${uid}-sp)" opacity="0.96"/>`
            + `</g></svg></div>`
        ).firstElementChild;
        if (spikeLayer) owner.anim(spikeLayer, [
            { transform: `translate(-50%,-50%) rotate(${deg}deg) scale(0.36)`, opacity: 1 },
            { transform: `translate(-50%,-50%) rotate(${deg}deg) scale(1.16)`, opacity: 1, offset: 0.25 },
            { transform: `translate(-50%,-50%) rotate(${deg}deg) scale(1.06)`, opacity: 0.9, offset: 0.55 },
            { transform: `translate(-50%,-50%) rotate(${deg}deg) scale(0.95)`, opacity: 0 }

            vSample(owner, 'thorn_parry', { vol: 0.44, maxDurSec: 0.54, fadeOutSec: 0.14, pan: panOf(hitPt.x) }) || vClick(0, 0.24, 4800, 0.01);
            const nx = -uy, ny = ux;
            [-14, 0, 14].forEach((spread, idx) => {
                const rad = (deg + spread) * Math.PI / 180;

                    owner.addP({ x, y, vx: ux * 2.5, vy: uy * 2.5, shape: 'spark', size: 2.0, decay: 0.26, color: '#67e8f9' });
                    owner.addP({ x, y, shape: 'glowOrb', size: 4.8, decay: 0.28, color: '#99f6e4' });
                }, idx === 1 ? () => {
                    const redFlash = owner.layer(`<div class="arcane-variant-anchor" style="left:${endPt.x}px;top:${endPt.y}px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle, rgba(254,226,226,0.92) 0%, rgba(239,68,68,0.52) 44%, transparent 74%);transform:translate(-50%,-50%)"></div>`).firstElementChild;
                    if (redFlash) owner.anim(redFlash, [{ transform: 'translate(-50%,-50%) scale(0.4)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(1.26)', opacity: 0 }], { duration: 240, easing: 'ease-out', fill: 'forwards' });
                    owner.burst(12, i => { const a = rnd(0, 6.283), s = rnd(1.8, 4.6); return { x: endPt.x, y: endPt.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: 0.92, decay: 0.055, size: i % 2 ? rnd(1.4, 2.2) : rnd(3.5, 5.5), shape: i % 2 ? 'spark' : 'glowOrb', color: pick(['#f87171', '#fca5a5', '#99f6e4']) }; });
                    if (onBeat) onBeat({ phase: 'thorn', entity: attackerEntity });
                } : null);
            });
        });
        return owner.handle;
    }

    function playVariantTriggerFx(opts = {}) {
        const { trigger, entity, sourceEntity, targetEntity, meta = {}, onBeat } = opts;
        if (!trigger || meta.triggered === false) return null;
        const primary = entity || targetEntity || sourceEntity;
        if (trigger === 'revive') return playVariantRevive(primary, meta, onBeat);
        if (trigger === 'molt') return playVariantMolt(primary, meta, onBeat);
        if (trigger === 'rage') return playVariantRage(primary, meta, onBeat);

        if (trigger === 'link') return playVariantLink(primary, meta, onBeat);
        if (trigger === 'leech') return playVariantLeech(sourceEntity || meta.sourceEntity, targetEntity || primary, meta, onBeat);
        if (trigger === 'regen') return playVariantRegen(primary, meta, onBeat);
        if (trigger === 'thorn') return playVariantThorn(sourceEntity || primary, targetEntity || meta.attackerEntity, meta, onBeat);

                { name: '荆棘 · 敌反我 (近战触发)', level: 'L1', description: 'h2近战击中e5 → 银青碎芒反向刺伤h2 (-45)', trigger: 'thorn', sourceId: 'e5', targetId: 'h2', meta: { isMelee: true, reflected: true, reflectDamage: 45 } },
                { name: '荆棘 · 我反敌 (双向验证)', level: 'L1', description: 'e2近战击中h1 → 银青碎芒反向刺伤e2 (-52)', trigger: 'thorn', sourceId: 'h1', targetId: 'e2', meta: { isMelee: true, reflected: true, reflectDamage: 52 } }
            ]
        },
        {
            title: '对照组与连发并发压测', badge: '3项',
            items: [
                { name: '对照 · 错误时机无演出', level: '对照', description: '远程打荆棘 / 未达阈值 / 未反弹 → 全数拦截不播', trigger: 'noop', meta: {} },
                { name: '连发 · 同实体连续触发', level: '压测', description: 'e5连续触发 吸血→再生→狂暴，验证不遮罩不覆盖', trigger: 'chain', enemyId: 'e5', init: { e5: { hp: 250, maxHp: 1000 } }, meta: {} },
                { name: '并发 · 多实体同拍压测', level: '压测', description: 'e1复活 / e3蜕皮 / e6反伤 / h3吸血同拍并发+重置检', trigger: 'concurrent', init: { e1: { hp: 180, maxHp: 1000 }, e3: { hp: 420, maxHp: 1000, buffs: [{ label: '☠️毒', color: '#c084fc' }] }, h3: { hp: 85, maxHp: 140 } }, meta: {} }
            ]
        }
    ];
    const CARDS = DEMO_GROUPS.flatMap(g => g.items);
    let unlockTimer = null, demoSfxOn = true;
    const demoTimers = new Set(), demoLayers = new Set();
    const beatStatEl = $('#variant-beat-stat'), sfxBtn = $('#btn-variant-sfx');
    const entityOf = id => heroesData.concat(enemiesData).find(e => e.id === id);

    function clearDemoExtras() {
        stopVariantHostAudio();
        demoTimers.forEach(id => clearTimeout(id)); demoTimers.clear();
        demoLayers.forEach(el => el.remove()); demoLayers.clear();
    }
    function demoAt(ms, fn) {
        const token = combatToken;
        const id = setTimeout(() => { demoTimers.delete(id); if (token === combatToken) fn(); }, ms);
        demoTimers.add(id);
        return id;
    }
    function renderSfxBtn() {
        sfxBtn.textContent = demoSfxOn ? '🔊 音开' : '🔇 音关';
        sfxBtn.setAttribute('aria-pressed', String(demoSfxOn));
        sfxBtn.className = 'text-[9px] font-bold px-1.5 rounded border transition-all hover:bg-white/10 shrink-0 ' + (demoSfxOn ? 'border-emerald-500/60 text-emerald-300' : 'border-slate-600 text-slate-400');
    }
    sfxBtn.addEventListener('click', () => {
        demoSfxOn = !demoSfxOn;
        arcaneVfxModule.setVariantSfx(demoSfxOn);
        if (!demoSfxOn) stopVariantHostAudio();
        renderSfxBtn();
    });
    renderSfxBtn();

    function updateDemoHp(entity, hpVal) {
        if (!entity) return;
        entity.hp = Math.max(0, Math.min(entity.maxHp, hpVal));
        const bar = document.getElementById(entity.id + '-hp-bar'), txt = document.getElementById(entity.id + '-hp-text');
        if (bar) bar.style.width = (entity.hp / entity.maxHp * 100) + '%';
        if (txt) txt.textContent = entity.id.startsWith('h') ? Math.floor(entity.hp) : Math.floor(entity.hp) + '/' + entity.maxHp;
    }
    function spawnDemoFloat(entityOrId, text, colorCls) {
        const dom = getEntitySpriteDom(entityOrId); if (!dom) return;
        const r = dom.getBoundingClientRect();
        const el = document.createElement('div');
        el.className = 'arcane-variant-float-text text-sm sm:text-xl ' + (colorCls || 'text-white');
        el.style.left = (r.left + r.width / 2 + (Math.random() - 0.5) * 28) + 'px';
        el.style.top = Math.max(24, r.top - 4) + 'px';
        el.textContent = text;
        document.body.appendChild(el);
        demoLayers.add(el);
        demoAt(1180, () => { demoLayers.delete(el); el.remove(); });
    }
    function lockCards(locked) {
        document.querySelectorAll('#skill-list .card').forEach(card => { card.disabled = locked; });
    }
    function scheduleUnlock(ms) {
        clearTimeout(unlockTimer);
        lockCards(true);
        unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, ms);
    }

    function runSingleCard(card) {
        const e = card.enemyId ? entityOf(card.enemyId) : null;
        if (card.trigger === 'revive') {
            const h2 = entityOf(card.meta.preFatalFrom || 'h2');
            beatStatEl.textContent = '致命接触…';
            arcaneVfxModule.playArcaneProjectile('fire', getEntitySpriteDom(h2), getEntitySpriteDom(e), false).then(() => {
                if (!e) return;
                updateDemoHp(e, 0);
                spawnDemoFloat(e, '-' + (card.meta.fatalDmg || 320), 'text-rose-400');
                beatStatEl.textContent = '致死拦截→复聚';
                arcaneVfxModule.playVariantTriggerFx({ trigger: 'revive', entity: e, meta: card.meta, onBeat: () => { updateDemoHp(e, card.meta.healTo || 300); spawnDemoFloat(e, '死里逃生!', 'text-emerald-300'); } });
            });
            return 2060;
        }
        if (card.trigger === 'molt') {
            beatStatEl.textContent = '裂壳觉醒';
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'molt', entity: e, meta: card.meta, onBeat: () => {
                e.buffs = []; window.renderDemoEntityBuffs(e);
                updateDemoHp(e, e.hp + (card.meta.healAmount || 300));
                spawnDemoFloat(e, '绝境爆发! +' + (card.meta.healAmount || 300), 'text-amber-300');
            } });
            return 1380;
        }
        if (card.trigger === 'rage') {
            beatStatEl.textContent = '血性沸腾';
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'rage', entity: e, meta: card.meta, onBeat: () => spawnDemoFloat(e, '狂暴!', 'text-red-400') });
            return 1280;
        }
        if (card.trigger === 'rageExit') {
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'rage', entity: e, meta: { instant: true } });
            beatStatEl.textContent = '狂暴中(26%)';
            demoAt(380, () => {
                updateDemoHp(e, e.hp + (card.meta.healAmount || 220));
                spawnDemoFloat(e, '+' + (card.meta.healAmount || 220) + ' 脱离狂暴', 'text-emerald-300');
                beatStatEl.textContent = '跨30%→淡出';
                arcaneVfxModule.playVariantTriggerFx({ trigger: 'rageExit', entity: e, meta: card.meta });
            });
            return 920;
        }
        if (card.trigger === 'link') {
            beatStatEl.textContent = '紫影疾闪抢攻';
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'link', entity: e, meta: {}, onBeat: () => {
                spawnDemoFloat(e, '抢攻!', 'text-fuchsia-400');
                beatStatEl.textContent = '极速残影→普攻';
                demoAt(240, () => {
                    const h2 = entityOf(card.meta.followAttackTarget || 'h2');
                    arcaneVfxModule.playArcaneProjectile('enemy_spell', getEntitySpriteDom(e), getEntitySpriteDom(h2), false).then(() => {
                        updateDemoHp(h2, h2.hp - 22); spawnDemoFloat(h2, '-22', 'text-rose-400');
                    });
                });
            } });
            return 1450;
        }
        if (card.trigger === 'leech') {
            const src = entityOf(card.sourceId), tgt = entityOf(card.targetId);
            beatStatEl.textContent = src.id + '→' + tgt.id + ' 吸血';
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'leech', sourceEntity: src, targetEntity: tgt, meta: card.meta, onBeat: () => {
                updateDemoHp(tgt, tgt.hp + (card.meta.drain || 36));
                spawnDemoFloat(tgt, '嗜血 +' + (card.meta.drain || 36), 'text-red-300');
            } });
            return 750;
        }
        if (card.trigger === 'regen') {
            beatStatEl.textContent = '自体修复';
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'regen', entity: e, meta: card.meta, onBeat: () => {
                updateDemoHp(e, e.hp + (card.meta.heal || 100));
                spawnDemoFloat(e, '调息 +' + (card.meta.heal || 100), 'text-green-300');
            } });
            return 680;
        }
        if (card.trigger === 'thorn') {
            const src = entityOf(card.sourceId), tgt = entityOf(card.targetId);
            beatStatEl.textContent = src.id + '→' + tgt.id + ' 反伤';
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'thorn', sourceEntity: src, targetEntity: tgt, meta: card.meta, onBeat: () => {
                updateDemoHp(tgt, tgt.hp - (card.meta.reflectDamage || 45));
                spawnDemoFloat(tgt, '反震 -' + (card.meta.reflectDamage || 45), 'text-emerald-300');
            } });
            return 620;
        }
        if (card.trigger === 'noop') {
            const r1 = arcaneVfxModule.playVariantTriggerFx({ trigger: 'thorn', sourceEntity: entityOf('e5'), targetEntity: entityOf('h2'), meta: { isMelee: false, reflected: true } });
            const r2 = arcaneVfxModule.playVariantTriggerFx({ trigger: 'molt', entity: entityOf('e3'), meta: { triggered: false } });
            const r3 = arcaneVfxModule.playVariantTriggerFx({ trigger: 'thorn', sourceEntity: entityOf('e5'), targetEntity: entityOf('h2'), meta: { isMelee: true, reflected: false } });
            beatStatEl.textContent = (!r1 && !r2 && !r3) ? '对照:3例均拦截' : '误触发!';
            spawnDemoFloat('e5', '远程/未达线/无反弹：无演出', 'text-slate-300');
            return 650;
        }
        if (card.trigger === 'chain') {
            beatStatEl.textContent = '同体三连发';
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'leech', sourceEntity: entityOf('h2'), targetEntity: e, onBeat: () => { updateDemoHp(e, e.hp + 20); spawnDemoFloat(e, '嗜血 +20', 'text-red-300'); } });
            demoAt(200, () => arcaneVfxModule.playVariantTriggerFx({ trigger: 'regen', entity: e, onBeat: () => { updateDemoHp(e, e.hp + 50); spawnDemoFloat(e, '调息 +50', 'text-green-300'); } }));
            demoAt(420, () => arcaneVfxModule.playVariantTriggerFx({ trigger: 'rage', entity: e, onBeat: () => spawnDemoFloat(e, '狂暴!', 'text-red-400') }));
            return 1700;
        }
        if (card.trigger === 'concurrent') {
            beatStatEl.textContent = '四线并发压测';
            const e1 = entityOf('e1'), e3 = entityOf('e3'), e6 = entityOf('e6'), h4 = entityOf('h4'), h3 = entityOf('h3'), e4 = entityOf('e4');
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'revive', entity: e1, onBeat: () => { updateDemoHp(e1, 300); spawnDemoFloat(e1, '死里逃生!', 'text-emerald-300'); } });
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'molt', entity: e3, meta: { clearedDebuffs: ['毒'], debuffColors: { '毒': '#a855f7' } }, onBeat: () => { e3.buffs = []; window.renderDemoEntityBuffs(e3); updateDemoHp(e3, 720); spawnDemoFloat(e3, '绝境爆发!', 'text-amber-300'); } });
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'thorn', sourceEntity: e6, targetEntity: h4, meta: { isMelee: true, reflected: true }, onBeat: () => { updateDemoHp(h4, h4.hp - 38); spawnDemoFloat(h4, '反震 -38', 'text-emerald-300'); } });
            arcaneVfxModule.playVariantTriggerFx({ trigger: 'leech', sourceEntity: e4, targetEntity: h3, onBeat: () => { updateDemoHp(h3, h3.hp + 30); spawnDemoFloat(h3, '嗜血 +30', 'text-red-300'); } });
            return 1500;
        }
        return 0;
    }

    async function playDemoSkill(card) {
        const myToken = ++combatToken;
        clearDemoExtras();
        clearArcaneFx();
        clearTimeout(unlockTimer);
        initUI(card.init || {});
        try { await ensureVariantSamples(); } catch {}
        if (myToken !== combatToken) return;
        const waitMs = runSingleCard(card);
        if (waitMs > 0) scheduleUnlock(waitMs);
    }
    function renderSkillCards() {
        const list = $('#skill-list');
        list.replaceChildren();
        const BADGE_CLS = { 'L2': 'border-amber-400/70 text-amber-300', 'L1': 'border-cyan-500/60 text-cyan-300', '对照': 'border-slate-500/60 text-slate-300', '压测': 'border-fuchsia-400/70 text-fuchsia-300' };
        DEMO_GROUPS.forEach(group => {
            const hd = document.createElement('div');
            hd.className = 'arcane-variant-group-hd';
            hd.innerHTML = `<span>${group.title}</span><span class="text-[8px] text-amber-400/80">${group.badge}</span>`;
            list.appendChild(hd);
            group.items.forEach(card => {
                const button = document.createElement('button');
                button.className = 'card w-full py-1.5 px-2 bg-slate-900/80 hover:bg-violet-950/60 border border-slate-700/80 hover:border-violet-500/60 rounded-lg text-left transition-all shadow-sm';
                button.title = card.description;
                button.innerHTML = '<div class="flex items-center justify-between gap-1"><span class="text-xs font-bold text-slate-100 truncate"></span><span class="text-[9px] font-bold px-1 rounded border shrink-0"></span></div><div class="text-[9px] text-slate-400 truncate"></div>';
                const labels = button.querySelectorAll('span');
                labels[0].textContent = card.name;
                labels[1].textContent = card.level;
                labels[1].className = 'text-[9px] font-bold px-1 rounded border shrink-0 ' + (BADGE_CLS[card.level] || 'border-cyan-500/60 text-cyan-300');
                button.lastElementChild.textContent = card.description;
                button.addEventListener('click', () => playDemoSkill(card));
                list.appendChild(button);
            });
        });
    }
    function resetDemo() {
        combatToken++;
        clearDemoExtras();
        clearTimeout(unlockTimer); unlockTimer = null;
        lockCards(false);
        clearArcaneFx();
        cancelAnimationFrame(fxEngine.animationFrameId); fxEngine.animationFrameId = null;
        fxEngine.particles.length = 0; fxEngine.hitStop = 0; fxEngine.lastFrameTime = 0;
        fxEngine.ctx.clearRect(0, 0, fxEngine.canvas.width, fxEngine.canvas.height);
        beatStatEl.textContent = '待机';
        initUI();
        renderSkillCards();
    }
    $('#btn-reset').addEventListener('click', resetDemo);
    document.addEventListener('pointerdown', () => { ensureVariantSamples().catch(() => {}); }, { once: true });
    renderSkillCards();
    // ===== 演示控制 END =====
    // 移植：只将新增 arcane- CSS、技能函数、标签与分派合并到正式版已有模块。
    // 必须同时追加 WEBM_FX_REGISTRY 的 { url: '', scale: 1.0, particles: 'arcane', delay: 蓄势秒数 }。
    // 技能数据追加 [特效:精确标签]；按技能类型核对默认光效去重与真实反应回调，不改数值规则。
    // 详细接线、测试与打包步骤见《技能SVG模板使用与快速移植.md》，不是复制整页即可上线。
    // 正式版已提供 fxEngine / combatToken / getEntitySpriteDom / heroesData / enemiesData，勿重复复制演示宿主。
  </script>
</body>
