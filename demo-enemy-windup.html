<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SVG 技能演练 · 空白模板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    /* ===== 敌方攻击前摇：八种普通行动起手，统一 330ms 出手拍点 / 600ms 回位 =====
       基准项 omenBase 与正式版 index.html 的 enemyOmenCombo 完全一致，仅改名便于对照。 */
    @keyframes omenBase {
      0% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0px rgba(239, 68, 68, 0)); }
      10% { transform: scale(1.05) translate(-4px, 2px) rotate(-1deg); filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.95)); }
      20% { transform: scale(1) translate(4px, -2px) rotate(1deg); filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.3)); }
      30% { transform: scale(1.05) translate(-3px, -2px) rotate(-0.5deg); filter: drop-shadow(0 0 22px rgba(239, 68, 68, 0.95)); }
      40% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.4)); }
      45% { transform: scale(0.98) translate(0, -2px); filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.8)); }
      55% { transform: scale(1.15) translate(0, 20px) rotate(3deg); filter: drop-shadow(0 0 30px rgba(239, 68, 68, 1)) drop-shadow(0 0 50px rgba(239, 68, 68, 0.9)); }
      75% { transform: scale(1.08) translate(0, 15px) rotate(2deg); filter: drop-shadow(0 0 50px rgba(239, 68, 68, 0.5)) drop-shadow(0 0 80px rgba(239, 68, 68, 0.25)); }
      100% { transform: scale(1) translate(0, 0) rotate(0deg); filter: drop-shadow(0 0 0px rgba(239, 68, 68, 0)); }
    }
    .omen-red-single { animation: omenBase 600ms cubic-bezier(0.25, 1, 0.5, 1) forwards; }

    /* 红·近战群攻：侧倾收身 → 横向甩身 → 回正（横向甩出，不向前冲） */
    @keyframes omenRedWide {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); filter: drop-shadow(0 0 0 rgba(248, 113, 113, 0)); }
      16% { transform: scale(0.95) translate(-7px, 3px) rotate(-7deg); filter: drop-shadow(0 0 14px rgba(248, 113, 113, 0.7)); }
      30% { transform: scale(0.94) translate(-9px, 3px) rotate(-8deg); filter: drop-shadow(0 0 20px rgba(248, 113, 113, 0.85)); }
      42% { transform: scale(0.97) translate(-4px, 1px) rotate(-4deg); filter: drop-shadow(0 0 26px rgba(248, 113, 113, 0.9)); }
      55% { transform: scale(1.12) translate(12px, 4px) rotate(7deg); filter: drop-shadow(0 0 34px rgba(248, 113, 113, 1)) drop-shadow(0 0 58px rgba(248, 113, 113, 0.5)); }
      75% { transform: scale(1.04) translate(5px, 2px) rotate(3deg); filter: drop-shadow(0 0 22px rgba(248, 113, 113, 0.4)); }
      100% { transform: scale(1) translate(0, 0) rotate(0deg); filter: drop-shadow(0 0 0 rgba(248, 113, 113, 0)); }
    }
    .omen-red-wide { animation: omenRedWide 600ms cubic-bezier(0.25, 1, 0.5, 1) forwards; }

    /* 黄·远程单体：向后压身 → 短促后坐 → 回正 */
    @keyframes omenAmberSingle {
      0% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0)); }
      18% { transform: scale(1.03) translate(0, -4px); filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.55)); }
      38% { transform: scale(0.93) translate(0, -2px); filter: drop-shadow(0 0 18px rgba(250, 204, 21, 0.8)); }
      48% { transform: scale(0.93) translate(0, -3px); filter: drop-shadow(0 0 22px rgba(250, 204, 21, 0.95)); }
      55% { transform: scale(1.1) translate(0, -11px); filter: drop-shadow(0 0 30px rgba(250, 204, 21, 1)) drop-shadow(0 0 52px rgba(250, 204, 21, 0.45)); }
      72% { transform: scale(1.04) translate(0, -6px); filter: drop-shadow(0 0 18px rgba(250, 204, 21, 0.45)); }
      100% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0)); }
    }
    .omen-amber-single { animation: omenAmberSingle 600ms cubic-bezier(0.25, 1, 0.5, 1) forwards; }

    /* 黄·远程群攻：后缩蓄势 → 一次较宽的后坐 → 回正 */
    @keyframes omenAmberWide {
      0% { transform: scale(1, 1) translate(0, 0); filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0)); }
      20% { transform: scale(0.9, 0.96) translate(0, -3px); filter: drop-shadow(0 0 14px rgba(250, 204, 21, 0.6)); }
      42% { transform: scale(0.92, 0.94) translate(0, -5px); filter: drop-shadow(0 0 20px rgba(250, 204, 21, 0.85)); }
      55% { transform: scale(1.16, 1.1) translate(0, -13px); filter: drop-shadow(0 0 32px rgba(250, 204, 21, 1)) drop-shadow(0 0 56px rgba(250, 204, 21, 0.45)); }
      76% { transform: scale(1.05, 1.02) translate(0, -6px); filter: drop-shadow(0 0 20px rgba(250, 204, 21, 0.45)); }
      100% { transform: scale(1, 1) translate(0, 0); filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0)); }
    }
    .omen-amber-wide { animation: omenAmberWide 600ms cubic-bezier(0.25, 1, 0.5, 1) forwards; }

    /* 紫·法术单体：轻浮起 → 向中心收束 → 点亮释放 */
    @keyframes omenVioletSingle {
      0% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0 rgba(192, 132, 252, 0)); }
      20% { transform: scale(1.03) translate(0, -6px); filter: drop-shadow(0 0 14px rgba(192, 132, 252, 0.6)); }
      38% { transform: scale(0.94) translate(0, -4px); filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.85)); }
      50% { transform: scale(0.93) translate(0, -5px); filter: drop-shadow(0 0 24px rgba(192, 132, 252, 0.95)); }
      55% { transform: scale(1.06) translate(0, -9px); filter: brightness(1.22) drop-shadow(0 0 30px rgba(192, 132, 252, 1)) drop-shadow(0 0 54px rgba(168, 85, 247, 0.5)); }
      75% { transform: scale(1.02) translate(0, -5px); filter: drop-shadow(0 0 18px rgba(192, 132, 252, 0.45)); }
      100% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0 rgba(192, 132, 252, 0)); }
    }
    .omen-violet-single { animation: omenVioletSingle 600ms cubic-bezier(0.25, 1, 0.5, 1) forwards; }

    /* 紫·法术群攻：轻浮起 → 向外舒展 → 回落 */
    @keyframes omenVioletWide {
      0% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0 rgba(192, 132, 252, 0)); }
      20% { transform: scale(0.96) translate(0, -7px); filter: drop-shadow(0 0 14px rgba(192, 132, 252, 0.55)); }
      42% { transform: scale(1.02) translate(0, -10px); filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.8)); }
      55% { transform: scale(1.14) translate(0, -9px); filter: brightness(1.18) drop-shadow(0 0 32px rgba(192, 132, 252, 1)) drop-shadow(0 0 58px rgba(168, 85, 247, 0.45)); }
      80% { transform: scale(1.03) translate(0, -2px); filter: drop-shadow(0 0 18px rgba(192, 132, 252, 0.4)); }
      100% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0 rgba(192, 132, 252, 0)); }
    }
    .omen-violet-wide { animation: omenVioletWide 600ms cubic-bezier(0.25, 1, 0.5, 1) forwards; }

    /* 粉·自身增益：纵向收身 → 向上舒展 → 落稳 */
    @keyframes omenRoseSelf {
      0% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0 rgba(249, 168, 212, 0)); }
      22% { transform: scale(0.92) translate(0, 3px); filter: drop-shadow(0 0 12px rgba(249, 168, 212, 0.55)); }
      40% { transform: scale(0.93) translate(0, 3px); filter: drop-shadow(0 0 16px rgba(249, 168, 212, 0.75)); }
      55% { transform: scale(1.08) translate(0, -9px); filter: brightness(1.16) drop-shadow(0 0 26px rgba(249, 168, 212, 1)) drop-shadow(0 0 48px rgba(244, 114, 182, 0.4)); }
      80% { transform: scale(1.02) translate(0, -1px); filter: drop-shadow(0 0 16px rgba(249, 168, 212, 0.4)); }
      100% { transform: scale(1) translate(0, 0); filter: drop-shadow(0 0 0 rgba(249, 168, 212, 0)); }
    }
    .omen-rose-self { animation: omenRoseSelf 600ms cubic-bezier(0.25, 1, 0.5, 1) forwards; }

    /* 黑·施加减益：短暂停稳 → 微前倾下压 → 回正（图标褪色下压，不铺黑罩遮挡） */
    @keyframes omenGloomFoe {
      0% { transform: scale(1, 1) translate(0, 0); filter: grayscale(0) brightness(1) drop-shadow(0 0 0 rgba(15, 23, 42, 0)); }
      20% { transform: scale(0.99, 0.99) translate(0, 0); filter: grayscale(0.4) brightness(0.86) drop-shadow(0 0 14px rgba(15, 23, 42, 0.9)); }
      40% { transform: scale(0.99, 0.98) translate(0, 1px); filter: grayscale(0.62) brightness(0.74) drop-shadow(0 0 20px rgba(15, 23, 42, 1)); }
      55% { transform: scale(1.03, 0.94) translate(0, 7px); filter: grayscale(1) brightness(0.6) drop-shadow(0 0 26px rgba(15, 23, 42, 1)) drop-shadow(0 0 44px rgba(51, 65, 85, 0.75)); }
      78% { transform: scale(1.01, 0.99) translate(0, 2px); filter: grayscale(0.5) brightness(0.8) drop-shadow(0 0 16px rgba(15, 23, 42, 0.6)); }
      100% { transform: scale(1, 1) translate(0, 0); filter: grayscale(0) brightness(1) drop-shadow(0 0 0 rgba(15, 23, 42, 0)); }
    }
    .omen-gloom-foe { animation: omenGloomFoe 600ms cubic-bezier(0.25, 1, 0.5, 1) forwards; }

    /* 周边轮廓：只用空心细线，不遮挡图标本体、血条与相邻单位 */
    .omen-aura { pointer-events: none; }
    .omen-aura svg { position: absolute; overflow: visible; }
    .omen-svg-anim { transform-box: view-box; transform-origin: 50% 50%; }
    @keyframes omenFade { 0% { opacity: 0; } 14% { opacity: 1; } 66% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes omenDraw { 0% { stroke-dashoffset: 1; opacity: 0; } 12% { opacity: 0.95; } 55% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes omenRingIn { 0% { opacity: 0; transform: scale(1.5); } 14% { opacity: 0.85; } 46% { transform: scale(0.82); opacity: 1; } 56% { opacity: 0.5; } 100% { opacity: 0; transform: scale(0.74); } }
    @keyframes omenRingOut { 0% { opacity: 0; transform: scale(0.72); } 16% { opacity: 0.9; } 55% { transform: scale(1.06); opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }
    @keyframes omenRise { 0% { opacity: 0; transform: translateY(18px); } 20% { opacity: 0.9; } 55% { transform: translateY(-10px); opacity: 1; } 100% { opacity: 0; transform: translateY(-38px); } }
    @keyframes omenPeel { 0% { opacity: 0; transform: rotate(0deg) scale(0.86); } 18% { opacity: 0.55; } 55% { transform: rotate(13deg) scale(1.1); opacity: 0.8; } 100% { opacity: 0; transform: rotate(25deg) scale(1.32); } }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->
  <div class="absolute top-2 sm:top-4 right-2 sm:right-4 z-[115] flex gap-1.5 sm:gap-2">
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-violet-400 hover:text-violet-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📚</span> <span class="hidden sm:inline">世界书</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-purple-400 hover:text-purple-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📜</span> <span class="hidden sm:inline">记录</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-400 hover:text-blue-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔲</span> <span class="hidden sm:inline">全屏</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>💬</span> <span class="hidden sm:inline">对话</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-yellow-500 hover:text-yellow-400 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>⚙️</span> <span class="hidden sm:inline">设置</span></button>
    <button id="btn-reset" class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-emerald-400 hover:text-emerald-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔄</span> <span class="hidden sm:inline">重置</span></button>
  </div>

  <!-- 全屏战场区域 -->
  <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-800 to-emerald-900 overflow-hidden z-0" id="battle-scene">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-0"></div>
    <div class="absolute left-1 sm:left-4 md:left-6 top-16 sm:top-20 bottom-44 sm:bottom-48 w-12 sm:w-14 z-30 flex flex-col items-center select-none">
      <div class="relative w-full h-full flex flex-col items-center">
        <div class="timeline-rail"><div class="rail-pulse-beam"></div></div>
        <div id="turn-order-container" class="relative w-full h-full flex flex-col gap-2 sm:gap-2.5 items-center overflow-y-auto no-scrollbar mask-fade-y py-3"></div>
      </div>
    </div>
    <div id="enemies-container" class="absolute left-2 sm:left-6 right-2 sm:right-6 top-[10%] bottom-[190px] sm:bottom-[220px] z-10 flex flex-col items-center justify-start gap-6 overflow-visible pointer-events-none"></div>
  </div>

  <!-- 悬浮 UI 层 -->
  <div class="absolute bottom-[52px] left-0 w-full p-1.5 sm:p-6 flex flex-col-reverse sm:flex-row items-end justify-between gap-1.5 sm:gap-4 z-20 pointer-events-none pb-2 sm:pb-6">
    <div id="heroes-container" class="w-full sm:flex-1 grid grid-cols-4 gap-1 sm:gap-4 max-w-2xl pointer-events-auto relative"></div>
    <div class="relative self-end">
      <div id="menu-container" class="w-[260px] h-[172px] bg-slate-950/95 backdrop-blur-xl rounded-xl border border-slate-700/80 border-t-2 border-t-cyan-500/80 flex flex-col overflow-hidden relative shadow-[0_15px_35px_rgba(0,0,0,0.9)] pointer-events-auto self-end mb-1 sm:mb-0">
        <div class="px-2.5 py-1 bg-gradient-to-r from-violet-950/60 via-slate-900/90 to-slate-950 border-b border-violet-900/40 flex justify-between items-center shrink-0">
          <div class="flex items-center gap-1.5 min-w-0"><span class="w-1.5 h-1.5 rounded-full bg-violet-400 animate-pulse shrink-0"></span><span class="text-xs font-bold text-violet-300">敌方前摇演练</span></div>
          <button id="btn-omen-sfx" class="text-[9px] font-bold px-1.5 rounded border border-emerald-500/60 text-emerald-300 hover:bg-white/10 transition-all shrink-0">🔊 音效开</button>
        </div>
        <div id="skill-list" class="flex-1 flex flex-col gap-1 p-1 overflow-y-auto custom-scrollbar"></div>
      </div>
    </div>

class CanvasFxEngine {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }
}

            const dot = (cx, cy, r, delay) => `<circle class="omen-svg-anim" cx="${cx}" cy="${cy}" r="${r}" fill="#fbcfe8" style="animation:omenRise 600ms ${delay}ms ease-out both;"/>`;
            return wrap(`<svg width="300" height="280" viewBox="0 0 300 280" style="left:-150px; top:-200px;">
                ${arc('M96 236 Q60 172 100 104', 0)}
                ${arc('M204 236 Q240 172 200 104', 0)}
                ${dot(126, 150, 3, 40)}${dot(174, 146, 2.6, 90)}${dot(138, 112, 2.4, 20)}${dot(166, 108, 2.8, 110)}
            </svg>`);
        }
        if (kind === 'gloom-foe') {
            return wrap(`<svg width="260" height="260" viewBox="0 0 260 260" style="left:-130px; top:-130px;">
                <circle class="omen-svg-anim" cx="130" cy="130" r="88" fill="none" stroke="rgba(15,23,42,0.92)" stroke-width="9" style="animation:omenFade 600ms linear forwards;"/>
                <circle class="omen-svg-anim" cx="130" cy="130" r="80" fill="none" stroke="rgba(148,163,184,0.9)" stroke-width="1.6" stroke-dasharray="16 22" style="animation:omenPeel 600ms linear forwards;"/>
                <circle class="omen-svg-anim" cx="130" cy="130" r="96" fill="none" stroke="rgba(100,116,139,0.8)" stroke-width="1" stroke-dasharray="6 30" style="animation:omenPeel 600ms 60ms linear forwards;"/>
            </svg>`);
        }
        return '';
    }

    // 抽象行为音：近战风切 / 远程干脆释压 / 法术轻谐振 / 增益柔和上行 / 减益低频下滑。
    // 单体和群攻只靠音色宽度（pan 展宽、尾音长度）区分，不加拍数，避免误示多段攻击。
    function omenSound(kind, bag) {
        if (!OMEN_SFX) return;
        const beat = fn => localAfter(OMEN_BEAT, fn, bag);
        if (kind === 'red-single') {
            whoosh(0, { f0: 520, f1: 1700, q: 1.5, dur: 0.28, vol: 0.26, peak: 0.12 });
            beat(() => click(0, 0.22, 3600, 0.008));
        } else if (kind === 'red-wide') {
            whoosh(0, { f0: 360, f1: 1300, q: 0.9, dur: 0.32, vol: 0.28, peak: 0.14, pan: -0.55, pan1: 0.55 });
            beat(() => whoosh(0, { f0: 700, f1: 2200, q: 0.7, dur: 0.16, vol: 0.22, cut: true, pan: -0.7, pan1: 0.7 }));
        } else if (kind === 'amber-single') {
            click(0, 0.26, 2400, 0.01); tone(0, { type: 'square', f0: 260, f1: 170, dur: 0.12, vol: 0.045, lp: 1200 });
            beat(() => { click(0, 0.42, 5200, 0.008); boom(0, { f0: 1400, f1: 320, dur: 0.16, vol: 0.14, peak: 0.04 }); });
        } else if (kind === 'amber-wide') {
            click(0, 0.24, 2100, 0.012); boom(0, { f0: 1800, f1: 420, dur: 0.18, vol: 0.12, peak: 0.03, pan: -0.4, pan1: 0.4 });
            beat(() => { click(0, 0.36, 4600, 0.01); boom(0, { f0: 1600, f1: 300, dur: 0.24, vol: 0.16, pan: -0.7, pan1: 0.7 }); });
        } else if (kind === 'violet-single') {
            tone(0, { type: 'triangle', f0: 210, f1: 320, dur: 0.3, vol: 0.09, wet: 0.3 });
            beat(() => chime(0, 880, 0.4, 0.055));
        } else if (kind === 'violet-wide') {
            tone(0, { type: 'triangle', f0: 190, f1: 280, dur: 0.3, vol: 0.075, pan: -0.5, wet: 0.3 });
            tone(0, { type: 'triangle', f0: 245, f1: 355, dur: 0.3, vol: 0.07, pan: 0.5, wet: 0.3 });
            beat(() => { chime(0, 660, 0.5, 0.045, -0.6); chime(0, 990, 0.5, 0.04, 0.6); });
        } else if (kind === 'rose-self') {
            tone(0, { type: 'sine', f0: 330, f1: 520, dur: 0.34, vol: 0.08, wet: 0.4 });
            beat(() => chime(0, 660, 0.6, 0.06));
        } else if (kind === 'gloom-foe') {
            tone(0, { type: 'sine', f0: 150, f1: 88, dur: 0.4, vol: 0.14, lp: 600 });
            beat(() => { crunch(0, { f: 420, f1: 200, q: 1.4, dur: 0.22, vol: 0.12, drive: 2 }); tone(0, { type: 'sawtooth', f0: 74, f1: 46, dur: 0.42, vol: 0.05, lp: 380, wet: 0.4 }); });
        }
    }

    // 单次前摇：图标动作 + 周边轮廓 + 短音色；作用于传入实体，不改任何数值或状态。
    function playEnemyWindup(caster, kind) {
        const dom = domOf(caster);
        if (!dom) return null;
        const cls = 'omen-' + kind;
        const c = ctr(dom);
        const bag = new Set();          // 本 handle 的定时器
        const layers = [];              // 本 handle 的临时层
        const hadBreathe = dom.classList.contains('breathe');

        dom.classList.remove('breathe'); // 呼吸动画与起手动画同占 transform，必须先让位
        void dom.offsetWidth;
        dom.classList.add(cls);

        const aura = omenAura(kind, c.x, c.y);
        if (aura) layers.push(fsLayer(aura, OMEN_MS + 120));
        omenSound(kind, bag);

        const restore = () => {
            dom.classList.remove(cls);
            if (hadBreathe && caster.isAlive && !dom.classList.contains('breathe')) dom.classList.add('breathe');
        };
        const dropLayers = () => layers.forEach(d => { S.layers.delete(d); if (d.isConnected) d.remove(); });
        const handle = {
            doneAt: Date.now() + OMEN_MS,
            impactDom: dom,
            cancel() {
                bag.forEach(id => { clearTimeout(id); S.timers.delete(id); }); bag.clear();
                restore(); dropLayers();
                S.handles.delete(handle);
            }
        };
        S.handles.add(handle);
        localAfter(OMEN_MS, () => { restore(); dropLayers(); S.handles.delete(handle); releaseIdleCanvas(); }, bag);
        return handle;
    }

    function setWindupSfx(on) { OMEN_SFX = !!on; return OMEN_SFX; }
    // ===== 新技能实现 END =====

    // ===== 对外接口（与正式版同名同参；不将演示卡片或占位数据带入模块） =====
    function isArcaneSkillFx(fxTag) { return ARCANE_TAGS.indexOf(fxTag) !== -1; }
    function playArcaneSkillFx(fxTag, caster, targets, isReaction = false) {
        if (!isArcaneSkillFx(fxTag)) return null;
        // 接入点 3：按 fxTag 分派到上方新技能函数，返回它的 handle。
        return playEnemyWindup(caster, fxTag.replace('omen:', ''));
    }
    function playArcaneProjectile(type, fromDom, toDom, dodged = false) {
        if (!fromDom || !toDom || !fromDom.getBoundingClientRect || !toDom.getBoundingClientRect) return Promise.resolve();
        const token = combatToken;
        ensureCanvas(); ensureDriver();
        if (type === 'fire') fireProjectile(fromDom, toDom, !!dodged, token);
        else if (type === 'enemy_spell') enemySpellProjectile(fromDom, toDom, !!dodged, token);
        const beat = type === 'fire' ? 580 : 480;
        return new Promise(res => {
            const id = setTimeout(() => { S.rawTimers.delete(id); res(); }, beat);
            S.rawTimers.set(id, res);
        });
    }
    function clearArcaneFx() {
        S.timers.forEach(id => clearTimeout(id)); S.timers.clear();
        S.rawTimers.forEach((resolve, id) => { clearTimeout(id); resolve(); }); S.rawTimers.clear();
        S.intervals.forEach(id => clearInterval(id)); S.intervals.clear();
        S.flights.length = 0; S.particles.length = 0;
        S.particleTimer = null; S.particleUntil = 0;
        if (S.driver) { const idx = fxEngine.particles.indexOf(S.driver); if (idx >= 0) fxEngine.particles.splice(idx, 1); S.driver = null; }
        S.handles.forEach(h => { if (h && h.cancel) h.cancel(); }); S.handles.clear();
        S.layers.forEach(d => d.remove()); S.layers.clear();
        S.anchors.forEach(d => d.remove()); S.anchors.clear();
        S.flashes.forEach(el => el.classList.remove('arcane-flash-cold', 'arcane-flash-heal')); S.flashes.clear();
        S.shakeEls.forEach(el => el.classList.remove('arcane-shake-light', 'arcane-shake-heavy', 'arcane-shake-quake')); S.shakeEls.clear();
        if (S.dark) { S.dark.remove(); S.dark = null; }
        if (S.canvas) { S.canvas.remove(); S.canvas = null; S.ctx = null; }
        if (audioCtx) { audioCtx.close(); audioCtx = null; sfxBus = null; sfxVerb = null; sfxNoise = null; }
    }
    window.isArcaneSkillFx = isArcaneSkillFx;
    window.playArcaneSkillFx = playArcaneSkillFx;
    window.playArcaneProjectile = playArcaneProjectile;
    window.clearArcaneFx = clearArcaneFx;
    window.setWindupSfx = setWindupSfx;
    return { isArcaneSkillFx, playArcaneSkillFx, playArcaneProjectile, clearArcaneFx, setWindupSfx };
})();
    // ===== 可移植特效模块 END =====

    // ===== 演示控制 BEGIN：仅驱动上述正式版接口，不参与移植 =====
    // 接入点 4：CARDS 每项为 { name, level, description, fxTag, casterId, targetIds, isReaction }。
    // casterId / targetIds 使用上方 h1-h4、e1-e6；level 使用 L1-L4，默认列表为空。
    // 反应演练可在 playDemoSkill 中调用返回的 handle.dodge / hit，不把模拟攻击写进技能实现。
    // 敌方前摇演练：八项全部固定在 e5，排除图标图案与体型差异，只比较动作。
    const CARDS = [
        { name: '红 · 单体近战', level: '基准', description: '前冲红光晕（正式版原动作对照）', fxTag: 'omen:red-single', casterId: 'e5', targetIds: [] },
        { name: '红 · 近战群攻', level: '群攻', description: '侧倾收身 → 横向甩身 + 横扫弧', fxTag: 'omen:red-wide', casterId: 'e5', targetIds: [] },
        { name: '黄 · 远程单体', level: '单体', description: '后压蓄势 → 短促后坐 + 收尖楔形', fxTag: 'omen:amber-single', casterId: 'e5', targetIds: [] },
        { name: '黄 · 远程群攻', level: '群攻', description: '后缩蓄势 → 宽后坐 + 展开扇面', fxTag: 'omen:amber-wide', casterId: 'e5', targetIds: [] },
        { name: '紫 · 法术单体', level: '单体', description: '浮起 → 向心收束 + 内收环', fxTag: 'omen:violet-single', casterId: 'e5', targetIds: [] },
        { name: '紫 · 法术群攻', level: '群攻', description: '浮起 → 向外舒展 + 外展环', fxTag: 'omen:violet-wide', casterId: 'e5', targetIds: [] },
        { name: '粉 · 自身增益', level: '自身', description: '收身 → 向上舒展 + 上升短弧', fxTag: 'omen:rose-self', casterId: 'e5', targetIds: [] },
        { name: '黑 · 施加减益', level: '施加', description: '停稳 → 前倾下压 + 剥离断弧（给敌对方上负面）', fxTag: 'omen:gloom-foe', casterId: 'e5', targetIds: [] }
    ];
    let unlockTimer = null;

    // 音效开关：只控制前摇短音色，不新增自动播放
    const sfxBtn = document.getElementById('btn-omen-sfx');
    let sfxOn = true;
    function renderSfxBtn() {
        sfxBtn.textContent = sfxOn ? '🔊 音效开' : '🔇 音效关';
        sfxBtn.className = 'text-[9px] font-bold px-1.5 rounded border transition-all hover:bg-white/10 shrink-0 ' + (sfxOn ? 'border-emerald-500/60 text-emerald-300' : 'border-slate-600 text-slate-400');
    }
    sfxBtn.addEventListener('click', () => { sfxOn = !sfxOn; arcaneVfxModule.setWindupSfx(sfxOn); renderSfxBtn(); });
    renderSfxBtn();

    function lockCards(locked) {
        document.querySelectorAll('#skill-list .card').forEach(card => { card.disabled = locked; });
    }
    function playDemoSkill(card) {
        combatToken++;
        clearArcaneFx();
        clearTimeout(unlockTimer);
        const entities = heroesData.concat(enemiesData);
        const caster = entities.find(e => e.id === card.casterId);
        const targets = card.targetIds.map(id => entities.find(e => e.id === id));
        const handle = playArcaneSkillFx(card.fxTag, caster, targets, !!card.isReaction);
        if (handle && handle.doneAt > Date.now()) {
            lockCards(true);
            unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, handle.doneAt - Date.now());
        }
        return handle;
    }
    function renderSkillCards() {
        const list = $('#skill-list');
        list.replaceChildren();
        if (!CARDS.length) {
            list.innerHTML = '<div class="flex-1 flex items-center justify-center text-xs text-slate-500">暂无技能</div>';
            return;
        }
        CARDS.forEach(card => {
            const button = document.createElement('button');
            button.className = 'card w-full py-1.5 px-2 bg-slate-900/80 hover:bg-violet-950/60 border border-slate-700/80 hover:border-violet-500/60 rounded-lg text-left transition-all shadow-sm';
            button.title = card.fxTag;
            button.innerHTML = '<div class="flex items-center justify-between gap-1"><span class="text-xs font-bold text-slate-100"></span><span class="text-[9px] font-bold px-1 rounded border border-cyan-500/60 text-cyan-300"></span></div><div class="text-[9px] text-slate-400 truncate"></div>';
            const labels = button.querySelectorAll('span');
            labels[0].textContent = card.name;
            labels[1].textContent = card.level;
            button.lastElementChild.textContent = card.description;
            button.addEventListener('click', () => playDemoSkill(card));
            list.appendChild(button);
        });
    }
    function resetDemo() {
        combatToken++;
        clearTimeout(unlockTimer); unlockTimer = null;
        clearArcaneFx();
        cancelAnimationFrame(fxEngine.animationFrameId); fxEngine.animationFrameId = null;
        fxEngine.particles.length = 0; fxEngine.hitStop = 0; fxEngine.lastFrameTime = 0;
        fxEngine.ctx.clearRect(0, 0, fxEngine.canvas.width, fxEngine.canvas.height);
        initUI();
        renderSkillCards();
    }
    $('#btn-reset').addEventListener('click', resetDemo);
    renderSkillCards();
    // ===== 演示控制 END =====
    // 移植：只将新增 arcane- CSS、技能函数、标签与分派合并到正式版已有模块。
    // 必须同时追加 WEBM_FX_REGISTRY 的 { url: '', scale: 1.0, particles: 'arcane', delay: 蓄势秒数 }。
    // 技能数据追加 [特效:精确标签]；按技能类型核对默认光效去重与真实反应回调，不改数值规则。
    // 详细接线、测试与打包步骤见《技能SVG模板使用与快速移植.md》，不是复制整页即可上线。
    // 正式版已提供 fxEngine / combatToken / getEntitySpriteDom / heroesData / enemiesData，勿重复复制演示宿主。
  </script>
</body>
</html>
