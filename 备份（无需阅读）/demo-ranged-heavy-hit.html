<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【双管猎象枪】[特效:远程重击] 特效演练场 Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=Cinzel:wght@700;900&family=Share+Tech+Mono&family=Special+Elite&display=swap');
    
    body { 
      font-family: 'Noto Sans SC', sans-serif; 
      user-select: none;
      background: #080c16;
      color: #fff;
    }
    
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
    .font-typewriter { font-family: 'Special Elite', monospace; }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
    }

    .text-outline-thick {
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 25px rgba(0,0,0,1);
    }
    .text-outline-crimson {
      text-shadow: -2px -2px 0 #3f0000, 2px -2px 0 #3f0000, -2px 2px 0 #3f0000, 2px 2px 0 #3f0000, 0 0 35px #991b1b;
    }
    .text-outline-gold {
      text-shadow: -1px -1px 0 #78350f, 1px -1px 0 #78350f, -1px 1px 0 #78350f, 1px 1px 0 #78350f, 0 0 20px #d97706;
    }

    .breathe { animation: breathe 3.6s ease-in-out infinite alternate; }
    @keyframes breathe { 
      0% { transform: translateY(0px); } 
      100% { transform: translateY(-6px); } 
    }

    /* ==== 重击专属震屏系统 ==== */
    .heavy-shake { animation: heavy-shake-anim 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes heavy-shake-anim {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      12% { transform: translate3d(-18px, 12px, 0) scale(1.04) rotate(-2deg); }
      25% { transform: translate3d(20px, -14px, 0) scale(1.05) rotate(2.2deg); }
      40% { transform: translate3d(-15px, 9px, 0) scale(1.03) rotate(-1.5deg); }
      55% { transform: translate3d(12px, -7px, 0) scale(1.02) rotate(1deg); }
      70% { transform: translate3d(-7px, 4px, 0) scale(1.01) rotate(-0.5deg); }
      85% { transform: translate3d(4px, -2px, 0) scale(1.005) rotate(0.2deg); }
    }

    /* 普通轻微震屏（对比用） */
    .light-shake { animation: light-shake-anim 0.25s ease-out both; }
    @keyframes light-shake-anim {
      0%, 100% { transform: translate(0, 0); }
      20%, 60% { transform: translate(-3px, 2px); }
      40%, 80% { transform: translate(3px, -2px); }
    }

    /* ========================================================
       枪口爆炸 (Muzzle Explosion Blast) SVG 动画
       ======================================================== */
    @keyframes muzzle-burst-core {
      0% { transform: translate(-50%, -50%) scale(0.1) rotate(0deg); opacity: 0; filter: brightness(2.5); }
      12% { transform: translate(-50%, -50%) scale(1.35) rotate(15deg); opacity: 1; filter: brightness(2); }
      30% { transform: translate(-50%, -50%) scale(1.15) rotate(25deg); opacity: 0.95; filter: brightness(1.4); }
      70% { transform: translate(-50%, -50%) scale(1.25) rotate(40deg); opacity: 0.6; filter: brightness(1); }
      100% { transform: translate(-50%, -50%) scale(1.45) rotate(55deg); opacity: 0; filter: brightness(0.7); }
    }

    @keyframes muzzle-shockwave-ring {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; stroke-width: 8; }
      40% { transform: translate(-50%, -50%) scale(2.0); opacity: 0.85; stroke-width: 4; }
      100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; stroke-width: 1; }
    }

    @keyframes muzzle-smoke-cloud {
      0% { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(1.1) rotate(-15deg); opacity: 0.75; }
      70% { transform: translate(-50%, -50%) scale(1.5) rotate(-35deg); opacity: 0.4; }
      100% { transform: translate(-50%, -50%) scale(1.9) rotate(-50deg); opacity: 0; }
    }

    @keyframes muzzle-spark-jet {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(var(--jet-rot, 0deg)); opacity: 1; }
      40% { transform: translate(-50%, -50%) scale(1.2) translateY(-30px) rotate(var(--jet-rot, 0deg)); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5) translateY(-65px) rotate(var(--jet-rot, 0deg)); opacity: 0; }
    }

    /* 敌人猛烈受击后仰与顿挫 */
    @keyframes enemy-heavy-hit-recoil {
      0% { transform: scale(1) translateY(0) rotate(0deg); filter: brightness(1); }
      10% { transform: scale(0.88) translateY(14px) rotate(-6deg); filter: brightness(3) contrast(1.5) drop-shadow(0 0 30px #ef4444); }
      28% { transform: scale(1.1) translateY(-16px) rotate(4deg); filter: brightness(1.8) drop-shadow(0 0 20px #f97316); }
      50% { transform: scale(0.96) translateY(6px) rotate(-2deg); filter: brightness(1.2); }
      75% { transform: scale(1.02) translateY(-2px) rotate(1deg); filter: brightness(1); }
      100% { transform: scale(1) translateY(0) rotate(0deg); filter: brightness(1); }
    }

    /* 伤害数字暴击弹跳 */
    @keyframes crit-damage-pop {
      0% { transform: translate(-50%, -20%) scale(0.2); opacity: 0; }
      18% { transform: translate(-50%, -80%) scale(1.45); opacity: 1; }
      32% { transform: translate(-50%, -100%) scale(1.1); opacity: 1; }
      75% { transform: translate(-50%, -120%) scale(1); opacity: 0.95; }
      100% { transform: translate(-50%, -150%) scale(0.85); opacity: 0; }
    }

    /* ========================================================
       屏幕镜头溅血与血块系统 (Screen Lens Blood Splatters)
       ======================================================== */
    @keyframes blood-splat-burst {
      0% { transform: scale(0.12) rotate(var(--splat-rot, 0deg)); opacity: 0; }
      20% { transform: scale(1.12) rotate(var(--splat-rot, 0deg)); opacity: 1; }
      35% { transform: scale(1) rotate(var(--splat-rot, 0deg)); opacity: 0.95; }
      75% { transform: scale(1.01) translateY(4px) rotate(var(--splat-rot, 0deg)); opacity: 0.88; }
      100% { transform: scale(1.04) translateY(12px) rotate(var(--splat-rot, 0deg)); opacity: 0; }
    }

    @keyframes blood-drip-flow {
      0% { transform: scaleY(0); opacity: 0; transform-origin: top; }
      25% { transform: scaleY(1); opacity: 0.95; }
      70% { transform: scaleY(1.06) translateY(8px); opacity: 0.85; }
      100% { transform: scaleY(1.12) translateY(18px); opacity: 0; }
    }

    @keyframes blood-vignette-pulse {
      0% { opacity: 0; transform: scale(0.92); }
      18% { opacity: 1; transform: scale(1); }
      75% { opacity: 0.85; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(1.05); }
    }

    /* 全屏高能爆发火光闪现 */
    @keyframes muzzle-screen-flash {
      0% { opacity: 0; }
      12% { opacity: 0.45; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body class="w-screen h-screen overflow-hidden relative select-none bg-[#090d18]">

  <!-- ========================================== -->
  <!-- 顶部控制栏 (Top Bar) -->
  <!-- ========================================== -->
  <div class="fixed top-3 left-1/2 -translate-x-1/2 z-[300] glass-panel px-3.5 py-2 rounded-full flex flex-wrap items-center justify-center gap-2 shadow-[0_10px_35px_rgba(0,0,0,0.85)] border border-amber-500/40">
    <div class="flex items-center gap-1 bg-black/60 px-2.5 py-1 rounded-full border border-amber-500/30">
      <span class="text-amber-400 text-xs font-bold font-cinzel tracking-wider flex items-center gap-1">
        <span>🐘</span> <span>【双管猎象枪】重击特效标签演练</span>
      </span>
    </div>

    <div class="w-[1px] h-4 bg-white/20 hidden sm:block"></div>

    <!-- 方案切换 -->
    <div class="flex items-center gap-1 bg-black/50 p-0.5 rounded-full border border-gray-700">
      <button id="tab-1" onclick="setScheme(1)" class="px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all bg-gradient-to-r from-red-700 to-rose-600 text-white shadow-md border border-rose-400">
        1. 💥 推荐：双管重爆 (枪口烈火+5团血块+重震)
      </button>
      <button id="tab-2" onclick="setScheme(2)" class="px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all text-gray-300 hover:text-white">
        2. 🩸 强化：狂暴血阵 (8团血块+强暗角+超爆)
      </button>
      <button id="tab-3" onclick="setScheme(3)" class="px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all text-gray-300 hover:text-white">
        3. 🎯 穿透：破甲巨弹 (锥形激波+放射血线)
      </button>
      <button id="tab-4" onclick="setScheme(4)" class="px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all text-gray-400 hover:text-white">
        4. ⚪ 对比：普通枪击 (无重击/小黄圈/无血)
      </button>
    </div>

    <div class="w-[1px] h-4 bg-white/20 hidden sm:block"></div>

    <!-- 目标数量切换 -->
    <div class="flex items-center gap-1 bg-black/60 p-0.5 rounded-full border border-gray-700">
      <button onclick="setEnemyCount(1)" id="btn-cnt-1" class="px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">单目标</button>
      <button onclick="setEnemyCount(3)" id="btn-cnt-3" class="px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono text-gray-400 hover:text-white">3目标</button>
    </div>

    <!-- 触发按钮 -->
    <button onclick="fireGunshot()" class="px-4 py-1.5 bg-gradient-to-r from-amber-600 via-red-600 to-rose-700 hover:from-amber-500 hover:to-rose-600 text-white rounded-full text-xs font-bold tracking-wider shadow-[0_0_15px_rgba(239,68,68,0.7)] flex items-center gap-1.5 transform hover:scale-105 active:scale-95 transition-all">
      <span>🔥 扣动扳机射击</span>
    </button>
  </div>

  <!-- 顶部副提示栏 -->
  <div class="fixed top-16 left-1/2 -translate-x-1/2 z-[290] pointer-events-none text-center max-w-2xl w-full px-4">
    <div id="scheme-desc" class="text-[11px] font-mono text-amber-200/95 bg-black/80 px-3 py-1 rounded-full border border-amber-500/30 backdrop-blur-md shadow-lg">
      方案 1：【双管猎象枪·经典重击】枪口剧烈火光爆炸 + 5 朵有机镜头飞溅血块 + 2 条自上而下血痕 + 强力反击重枪声音效 + 0.48s 剧烈镜头震动。
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 战斗场景 (1:1 游戏视觉复刻) -->
  <!-- ========================================== -->
  <div id="battle-scene" class="absolute inset-0 bg-gradient-to-br from-[#0b0e1b] via-[#101726] to-[#1c0f1a] overflow-hidden z-0">
    <div class="absolute inset-0 opacity-25 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-600/30 via-red-950/20 to-black"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/90 via-black/40 to-transparent z-0"></div>

    <!-- 顶部状态栏 -->
    <div class="absolute top-3 right-4 z-50 flex gap-2">
      <div class="glass-panel px-3 py-1.5 rounded-full text-xs font-bold text-amber-400 flex items-center gap-1.5 shadow-md">
        <span>🏟️</span> <span>有备而来</span>
      </div>
      <div class="glass-panel px-3 py-1.5 rounded-full text-xs text-purple-300 flex items-center gap-1">
        <span>📜</span> <span>记录</span>
      </div>
    </div>

    <!-- 左侧：行动顺序时间轴 -->
    <div class="absolute left-3 sm:left-6 top-20 bottom-48 w-12 z-30 flex flex-col items-center select-none">
      <div class="relative w-full h-full flex flex-col gap-3 items-center py-2">
        <div class="w-10 h-10 rounded-full border-2 border-amber-400 bg-slate-900 shadow-[0_0_12px_rgba(245,158,11,0.6)] overflow-hidden relative scale-105">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120" class="w-full h-full object-cover">
          <span class="absolute -bottom-0.5 -right-0.5 bg-amber-600 text-[8px] font-bold px-1 rounded-full">#1</span>
        </div>
        <div class="w-9 h-9 rounded-full border border-rose-500 bg-slate-900 shadow-md overflow-hidden opacity-90 relative">
          <div class="w-full h-full flex items-center justify-center text-lg">🦏</div>
          <span class="absolute -bottom-0.5 -right-0.5 bg-rose-700 text-[8px] font-bold px-1 rounded-full">#2</span>
        </div>
        <div class="w-9 h-9 rounded-full border border-rose-500 bg-slate-900 shadow-md overflow-hidden opacity-80 relative">
          <div class="w-full h-full flex items-center justify-center text-lg">🧟</div>
          <span class="absolute -bottom-0.5 -right-0.5 bg-rose-700 text-[8px] font-bold px-1 rounded-full">#3</span>
        </div>
      </div>
    </div>

    <!-- 中央战场：敌方目标 (支持点击指定受击目标) -->
    <div id="target-anchor" class="absolute inset-0 z-10 flex items-center justify-center pb-32 gap-10 sm:gap-16">
      <!-- 动态渲染敌人列表 -->
    </div>

    <!-- 浮动伤害与效果挂载容器 (固定定位，随屏幕对齐) -->
    <div id="fx-layer" class="fixed inset-0 pointer-events-none z-[180] overflow-hidden"></div>
  </div>

  <!-- ========================================== -->
  <!-- 底部英雄栏与右侧技能面板 (1:1 游戏界面) -->
  <!-- ========================================== -->
  <div class="absolute bottom-2 left-0 w-full px-4 sm:px-8 flex items-end justify-between gap-4 z-20 pointer-events-none">
    
    <!-- 左下：英雄卡片栏 -->
    <div class="w-full max-w-2xl grid grid-cols-4 gap-2.5 pointer-events-auto">
      
      <!-- 1号位：持枪猎人 (当前行动角色) -->
      <div class="glass-panel p-2 rounded-xl border-2 border-amber-500/80 shadow-[0_0_20px_rgba(245,158,11,0.35)] bg-gradient-to-b from-amber-950/50 to-slate-900/90 transform scale-[1.02]">
        <div class="flex items-center gap-1.5 mb-1.5">
          <div class="w-9 h-9 rounded-full overflow-hidden border-2 border-amber-400 shadow shrink-0">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120" class="w-full h-full object-cover">
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[11px] font-bold text-amber-200 truncate">艾莲娜·老牌猎手</div>
            <div class="text-[9px] text-amber-400/90 font-mono">重型火器 / 115速</div>
          </div>
        </div>
        <div class="space-y-1">
          <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 w-[92%]"></div></div>
          <div class="h-1 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-blue-500 w-[80%]"></div></div>
          <div class="h-1 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-amber-400 w-[100%] animate-pulse"></div></div>
        </div>
      </div>

      <!-- 2号位 -->
      <div class="glass-panel p-2 rounded-xl border border-white/10 bg-slate-900/70 opacity-80">
        <div class="flex items-center gap-1.5 mb-1.5">
          <div class="w-8 h-8 rounded-full overflow-hidden border border-gray-500 shrink-0">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120" class="w-full h-full object-cover">
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[11px] font-bold text-gray-300 truncate">爱德华·教士</div>
            <div class="text-[9px] text-gray-400 font-mono">圣职者</div>
          </div>
        </div>
        <div class="space-y-1">
          <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 w-[100%]"></div></div>
        </div>
      </div>

      <!-- 3号位 -->
      <div class="glass-panel p-2 rounded-xl border border-white/10 bg-slate-900/70 opacity-80">
        <div class="flex items-center gap-1.5 mb-1.5">
          <div class="w-8 h-8 rounded-full overflow-hidden border border-gray-500 shrink-0">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120" class="w-full h-full object-cover">
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[11px] font-bold text-gray-300 truncate">布莱克·保镖</div>
            <div class="text-[9px] text-gray-400 font-mono">防守者</div>
          </div>
        </div>
        <div class="space-y-1">
          <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 w-[85%]"></div></div>
        </div>
      </div>

      <!-- 4号位 -->
      <div class="glass-panel p-2 rounded-xl border border-white/10 bg-slate-900/70 opacity-80">
        <div class="flex items-center gap-1.5 mb-1.5">
          <div class="w-8 h-8 rounded-full overflow-hidden border border-gray-500 shrink-0">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120" class="w-full h-full object-cover">
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[11px] font-bold text-gray-300 truncate">维多利亚·学者</div>
            <div class="text-[9px] text-gray-400 font-mono">施法者</div>
          </div>
        </div>
        <div class="space-y-1">
          <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 w-[90%]"></div></div>
        </div>
      </div>
    </div>

    <!-- 右下：技能行动面板 (核心技能展示) -->
    <div class="w-[320px] glass-panel rounded-2xl p-3 pointer-events-auto flex flex-col justify-between border-2 border-amber-500/50 shadow-2xl bg-slate-950/90">
      <div class="text-[11px] font-bold text-amber-300 pb-1.5 border-b border-white/10 flex justify-between items-center">
        <span class="flex items-center gap-1">⚡ 艾莲娜的行动回合</span>
        <span class="text-[9px] text-amber-400 font-mono bg-amber-950/80 px-1.5 py-0.5 rounded border border-amber-500/40">[高阶]</span>
      </div>

      <!-- 技能标签全解析栏 -->
      <div class="my-2 bg-black/60 p-2 rounded-xl border border-red-500/30">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-bold text-amber-200">【双管猎象枪】</span>
          <span class="text-[10px] text-rose-400 font-bold font-mono">威力: 220</span>
        </div>
        
        <!-- 标签胶囊 -->
        <div class="flex flex-wrap gap-1 text-[9px] font-mono">
          <span class="bg-red-950/90 text-red-300 px-1.5 py-0.5 rounded border border-red-500/40">[单体(枪击);power:220]</span>
          <span class="bg-purple-950/90 text-purple-300 px-1.5 py-0.5 rounded border border-purple-500/40">[单降;power:20]</span>
          <span class="bg-amber-950/90 text-amber-300 px-1.5 py-0.5 rounded border border-amber-500/40">[Aim:90]</span>
          <span class="bg-blue-950/90 text-blue-300 px-1.5 py-0.5 rounded border border-blue-500/40">[远程]</span>
          <span class="bg-gradient-to-r from-red-600 to-amber-600 text-white font-bold px-1.5 py-0.5 rounded border border-yellow-300 shadow-[0_0_8px_rgba(245,158,11,0.6)] animate-pulse">[特效:远程重击]</span>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="flex gap-2">
        <button onclick="fireGunshot()" class="flex-1 py-2 bg-gradient-to-r from-red-700 via-rose-600 to-amber-700 hover:from-red-600 hover:to-amber-600 text-white rounded-xl text-xs font-bold tracking-wider shadow-[0_0_15px_rgba(220,38,38,0.7)] flex items-center justify-center gap-1.5 transform hover:scale-[1.02] active:scale-95 transition-all">
          <span>💥 释放【双管猎象枪】</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 底部配置与调试面板 -->
  <!-- ========================================== -->
  <div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-[250] flex items-center gap-3 bg-black/85 backdrop-blur-md px-4 py-1.5 rounded-full border border-gray-700 text-xs">
    <label class="flex items-center gap-1.5 cursor-pointer text-gray-300 hover:text-white">
      <input type="checkbox" id="chk-slowmo" class="accent-amber-500">
      <span>🐢 0.3x 慢动作分解</span>
    </label>
    <div class="w-[1px] h-3 bg-gray-600"></div>
    <label class="flex items-center gap-1.5 cursor-pointer text-gray-300 hover:text-white">
      <input type="checkbox" id="chk-shake" checked class="accent-red-500">
      <span>📳 镜头震屏反馈</span>
    </label>
    <div class="w-[1px] h-3 bg-gray-600"></div>
    <button onclick="testAudioOnly()" class="text-amber-400 hover:text-amber-300 font-bold flex items-center gap-1">
      <span>🔊 试听强力枪声</span>
    </button>
  </div>

  <script>
    // ==========================================
    // 音频引擎 (强力反击音效 + Web Audio GainNode 放大)
    // ==========================================
    const SOUNDS = {
      shot01: 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/shot01.mp3',      // 强力反击重枪声
      hitDown: 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/hitDown.mp3',     // 重击撞击沉闷音
      normalShot: 'https://files.catbox.moe/7w223l.mp3'                                    // 常规攻击轻音效
    };

    let audioContext = null;
    function getAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioContext = new AudioContextClass();
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    // 合成重低音冲击波 (物理级混响)
    function playSubBassBoom() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(32, ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.8, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch(e){}
    }

    function playSound(name, vol = 1.0) {
      const url = SOUNDS[name];
      if (!url) return;
      try {
        const audio = new Audio(url);
        audio.volume = Math.min(1.0, vol);
        audio.play().catch(e => console.warn('音频播放异常:', e));
      } catch(e){}
    }

    function testAudioOnly() {
      playSubBassBoom();
      playSound('shot01', 1.0);
    }

    // ==========================================
    // 方案状态与描述
    // ==========================================
    let currentScheme = 1;
    let selectedEnemyId = 1;
    let enemyCount = 1;

    const enemyTemplates = [
      { id: 1, name: '狂暴蛮象兽', tag: 'BOSS', hp: '850/850', img: 'https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=300' },
      { id: 2, name: '异端行刑者', tag: 'LV.20', hp: '420/420', img: 'https://images.unsplash.com/photo-1509281373149-e957c6296406?w=300' },
      { id: 3, name: '深潜者祭司', tag: 'LV.18', hp: '380/380', img: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300' }
    ];

    const SCHEME_DESCRIPTIONS = {
      1: '方案 1：【双管猎象枪·经典重击】(推荐) 枪口剧烈火光爆炸 + 5 朵有机镜头飞溅血块 + 2 条自上而下血痕 + 强力反击重枪声音效 + 0.48s 剧烈镜头震动。',
      2: '方案 2：【象枪爆头·狂暴重创】超大型双环枪口爆风 + 8 朵密集飞溅血浆 + 狂暴暗角暗红脉冲 + 强力枪声 + 0.55s 强震屏。',
      3: '方案 3：【穿甲重铅·贯穿激波】锥形气浪激波 + 放射状外扩血线 + 强力反击重枪声 + 极速受击后仰。',
      4: '方案 4：【普通枪击对比】(常规无重击标签) 黄色小光圈 + 普攻轻音效 + 无屏幕血块 + 0.2s 微弱震动。'
    };

    function renderEnemies() {
      const container = document.getElementById('target-anchor');
      const list = enemyTemplates.slice(0, enemyCount);
      container.innerHTML = list.map(e => `
        <div id="enemy-target-${e.id}" onclick="selectEnemy(${e.id})" class="flex flex-col items-center cursor-pointer transition-all duration-300 transform hover:scale-105 group relative select-none">
          <div id="enemy-lock-${e.id}" class="absolute -top-6 bg-red-950/80 border border-red-500/50 text-[10px] text-red-200 px-2 py-0.5 rounded-full font-mono font-bold shadow-md ${selectedEnemyId===e.id ? 'flex' : 'hidden'} items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-ping"></span>
            <span>目标锁定</span>
          </div>

          <div id="enemy-sprite-${e.id}" class="w-28 h-28 sm:w-36 sm:h-36 rounded-2xl border-2 ${selectedEnemyId===e.id ? 'border-rose-500 shadow-[0_0_30px_rgba(244,63,94,0.5)]' : 'border-gray-700'} bg-slate-900/90 overflow-hidden relative flex items-center justify-center p-1.5 transition-all">
            <img src="${e.img}" class="w-full h-full object-cover rounded-xl filter contrast-125">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
            <span class="absolute bottom-1 right-2 text-xs font-mono font-bold text-amber-300">HP: ${e.hp}</span>
            <span class="absolute top-1 left-2 bg-red-900/90 text-[9px] font-bold px-1.5 py-0.5 rounded border border-red-400/40 text-red-200">${e.tag}</span>
          </div>

          <div class="text-center mt-2">
            <div class="text-sm font-bold text-rose-200 tracking-wider">${e.name}</div>
            <div class="w-32 bg-gray-800 h-2 rounded-full overflow-hidden mt-1 border border-gray-700 relative">
              <div id="enemy-hp-bar-${e.id}" class="bg-gradient-to-r from-red-600 to-rose-500 h-full w-full transition-all duration-300"></div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setEnemyCount(cnt) {
      enemyCount = cnt;
      if (selectedEnemyId > cnt) selectedEnemyId = 1;
      document.getElementById('btn-cnt-1').className = cnt === 1 
        ? 'px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40'
        : 'px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono text-gray-400 hover:text-white';
      document.getElementById('btn-cnt-3').className = cnt === 3 
        ? 'px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40'
        : 'px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono text-gray-400 hover:text-white';
      renderEnemies();
    }

    function selectEnemy(id) {
      selectedEnemyId = id;
      renderEnemies();
    }

    function setScheme(sch) {
      currentScheme = sch;
      for (let i = 1; i <= 4; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (!tab) continue;
        if (i === sch) {
          tab.className = 'px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all bg-gradient-to-r from-red-700 to-rose-600 text-white shadow-md border border-rose-400';
        } else {
          tab.className = 'px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all text-gray-300 hover:text-white';
        }
      }
      document.getElementById('scheme-desc').textContent = SCHEME_DESCRIPTIONS[sch];
    }

    // ==========================================
    // 核心特效生成引擎
    // ==========================================

    // 1. 生成屏幕镜头溅血 SVG
    function createScreenBloodHtml(scheme) {
      if (scheme === 4) return ''; // 普通枪击无屏幕血块

      const count = scheme === 2 ? 8 : scheme === 3 ? 4 : 5;

      const splatPaths = [
        `M20,10 C35,2 50,15 45,30 C55,40 60,60 45,70 C30,80 15,65 10,50 C5,35 10,18 20,10 Z`,
        `M30,5 C45,5 55,20 50,35 C65,30 75,45 70,60 C55,75 40,70 30,80 C15,75 10,55 15,40 C5,25 20,10 30,5 Z`,
        `M15,20 C30,10 50,10 40,30 C55,35 60,55 45,65 C35,75 20,80 15,60 C5,45 5,30 15,20 Z`,
        `M25,12 C40,8 55,18 50,32 C60,42 65,58 52,68 C38,78 22,70 12,55 C4,38 12,22 25,12 Z`
      ];

      const positions = [
        { top: '16%', left: '18%', scale: 1.35, rot: -25, delay: '0.08s' },
        { top: '65%', left: '22%', scale: 1.15, rot: 45, delay: '0.12s' },
        { top: '20%', right: '16%', scale: 1.5, rot: 15, delay: '0.1s' },
        { top: '60%', right: '18%', scale: 1.25, rot: -55, delay: '0.14s' },
        { top: '38%', left: '46%', scale: 1.65, rot: 8, delay: '0.05s' },
        // 方案2追加
        { top: '48%', left: '12%', scale: 1.2, rot: 75, delay: '0.15s' },
        { top: '12%', left: '42%', scale: 1.4, rot: -40, delay: '0.13s' },
        { top: '72%', right: '35%', scale: 1.1, rot: 30, delay: '0.16s' }
      ];

      let splatsHtml = '';
      for (let i = 0; i < Math.min(count, positions.length); i++) {
        const p = positions[i];
        const path = splatPaths[i % splatPaths.length];
        splatsHtml += `
          <div class="absolute pointer-events-none opacity-0 z-40"
               style="${p.top ? `top:${p.top};` : ''} ${p.left ? `left:${p.left};` : ''} ${p.right ? `right:${p.right};` : ''} width:150px; height:150px; --splat-rot:${p.rot}deg; transform-origin: center; animation: blood-splat-burst 1.15s ${p.delay} cubic-bezier(0.12, 0.85, 0.25, 1) both; will-change: transform, opacity;">
            <svg viewBox="0 0 100 100" class="w-full h-full fill-red-800" style="filter: drop-shadow(0 0 10px #450a0a) drop-shadow(0 0 4px #7f1d1d);">
              <path d="${path}" />
              <!-- 飞溅微小血滴 -->
              <circle cx="85" cy="18" r="4.5" class="fill-red-700"/>
              <circle cx="15" cy="85" r="3.5" class="fill-red-900"/>
              <circle cx="92" cy="72" r="5" class="fill-red-800"/>
              <circle cx="6" cy="16" r="3" class="fill-red-700"/>
              <circle cx="70" cy="92" r="2.5" class="fill-red-600"/>
            </svg>
          </div>
        `;
      }

      // 自上而下的血痕流淌
      const drips = `
        <div class="absolute top-0 right-[25%] w-1.5 bg-gradient-to-b from-red-700 via-red-900 to-transparent rounded-full opacity-0 z-40 pointer-events-none"
             style="height:140px; animation: blood-drip-flow 1.25s 0.15s ease-out both;"></div>
        <div class="absolute top-0 left-[22%] w-2 bg-gradient-to-b from-red-800 via-red-950 to-transparent rounded-full opacity-0 z-40 pointer-events-none"
             style="height:180px; animation: blood-drip-flow 1.35s 0.1s ease-out both;"></div>
      `;

      // 镜头外圈暗红晕影 (Lens Vignette)
      const vignette = `
        <div class="absolute inset-0 pointer-events-none z-30 opacity-0"
             style="background: radial-gradient(circle, transparent ${scheme===2?'25%':'35%'}, rgba(136,8,8,0.45) 70%, rgba(55,0,0,0.92) 100%); animation: blood-vignette-pulse 1.1s cubic-bezier(0.1, 0.8, 0.2, 1) both;"></div>
      `;

      return vignette + splatsHtml + drips;
    }

    // 2. 生成目标受击点的【枪口爆炸 (Muzzle Explosion)】SVG
    function createMuzzleExplosionSvg(scheme) {
      if (scheme === 4) {
        // 普通枪击效果
        return `
          <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 pointer-events-none">
            <svg viewBox="0 0 100 100" class="w-full h-full" style="animation: muzzle-burst-core 0.3s ease-out both;">
              <circle cx="50" cy="50" r="20" fill="#fcd34d" />
              <circle cx="50" cy="50" r="35" stroke="#fef08a" stroke-width="4" fill="none" opacity="0.8"/>
            </svg>
          </div>
        `;
      }

      // 重击专属：高能火光爆炸、震波环、向外喷射的火星射线与烟云
      const isExtreme = scheme === 2;
      const size = isExtreme ? '330px' : '270px';

      // 双管猎象枪专属：左管与右管双重爆破叠加
      return `
        <!-- 枪口爆破核心组件 -->
        <div class="absolute left-1/2 top-1/2 pointer-events-none z-50" style="width:${size}; height:${size};">
          
          <!-- 1. 膨胀激波环 (Shockwave Ring) -->
          <svg viewBox="0 0 200 200" class="absolute inset-0 w-full h-full text-amber-400 stroke-current fill-none pointer-events-none"
               style="animation: muzzle-shockwave-ring 0.45s cubic-bezier(0.1, 0.8, 0.2, 1) both; filter: drop-shadow(0 0 15px #f59e0b);">
            <circle cx="100" cy="100" r="50" stroke="#fef08a" stroke-width="5" />
            <circle cx="100" cy="100" r="42" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 6" opacity="0.8"/>
            ${isExtreme ? '<circle cx="100" cy="100" r="60" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" opacity="0.9"/>' : ''}
          </svg>

          <!-- 2. 枪口硝烟云 (Smoke Cloud) -->
          <div class="absolute left-1/2 top-1/2 w-full h-full pointer-events-none opacity-0"
               style="animation: muzzle-smoke-cloud 0.75s 0.05s ease-out both;">
            <svg viewBox="0 0 200 200" class="w-full h-full fill-stone-900/80">
              <circle cx="90" cy="95" r="45" />
              <circle cx="115" cy="90" r="38" />
              <circle cx="100" cy="115" r="40" />
            </svg>
          </div>

          <!-- 3. 烈焰火星八向喷射 (Muzzle Sparks Jet) -->
          <div class="absolute inset-0 flex items-center justify-center">
            ${[0, 45, 90, 135, 180, 225, 270, 315].map(deg => `
              <div class="absolute w-2.5 h-16 bg-gradient-to-t from-transparent via-amber-300 to-white rounded-full opacity-0"
                   style="--jet-rot:${deg}deg; animation: muzzle-spark-jet 0.42s cubic-bezier(0.15, 0.85, 0.35, 1) both; filter: drop-shadow(0 0 8px #f97316);"></div>
            `).join('')}
          </div>

          <!-- 4. 核心枪口烈焰爆炸 (双管交叠火光) -->
          <div class="absolute left-1/2 top-1/2 w-full h-full pointer-events-none"
               style="animation: muzzle-burst-core 0.55s cubic-bezier(0.12, 0.9, 0.25, 1) both; will-change: transform, opacity;">
            <svg viewBox="0 0 200 200" class="w-full h-full" style="filter: drop-shadow(0 0 25px #ea580c) drop-shadow(0 0 45px #dc2626);">
              <defs>
                <radialGradient id="muzzle-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="25%" stop-color="#fef08a" />
                  <stop offset="55%" stop-color="#f97316" />
                  <stop offset="85%" stop-color="#dc2626" />
                  <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0" />
                </radialGradient>
              </defs>

              <!-- 烈焰多角星刺 -->
              <polygon points="100,10 120,70 185,45 135,95 190,140 125,130 115,190 90,135 20,160 65,110 10,75 75,70" fill="url(#muzzle-grad)" />
              <polygon points="100,25 115,80 165,65 125,105 160,145 115,130 100,175 85,125 35,140 75,100 30,65 85,75" fill="#fef08a" opacity="0.85" />
              
              <!-- 双管左枪管与右枪管高热核心 -->
              <circle cx="92" cy="98" r="28" fill="#ffffff" style="filter: drop-shadow(0 0 12px #fff);" />
              <circle cx="108" cy="102" r="28" fill="#ffffff" style="filter: drop-shadow(0 0 12px #fff);" />
              <circle cx="100" cy="100" r="48" fill="#fde047" opacity="0.7" />
            </svg>
          </div>

        </div>
      `;
    }

    // ==========================================
    // 执行射击动画流程
    // ==========================================
    let isShooting = false;

    async function fireGunshot() {
      if (isShooting) return;
      isShooting = true;

      const isSlowMo = document.getElementById('chk-slowmo').checked;
      const isShakeEnabled = document.getElementById('chk-shake').checked;

      const enemySprite = document.getElementById(`enemy-sprite-${selectedEnemyId}`);
      if (!enemySprite) return;

      const fxLayer = document.getElementById('fx-layer');
      const battleScene = document.getElementById('battle-scene');

      // 获取敌人受击中心
      const targetRect = enemySprite.getBoundingClientRect();
      const tx = targetRect.left + targetRect.width / 2;
      const ty = targetRect.top + targetRect.height / 2;

      // 1. 音效播放 (强力反击枪声 + 超重低音冲击)
      if (currentScheme === 4) {
        playSound('normalShot', 0.6);
      } else {
        playSubBassBoom();
        playSound('shot01', 1.0);
        setTimeout(() => playSound('hitDown', 0.8), 60);
      }

      // 2. 镜头震屏
      if (isShakeEnabled) {
        if (currentScheme === 4) {
          battleScene.classList.add('light-shake');
          setTimeout(() => battleScene.classList.remove('light-shake'), 250);
        } else {
          battleScene.classList.add('heavy-shake');
          setTimeout(() => battleScene.classList.remove('heavy-shake'), 480);
        }
      }

      // 3. 敌人受击反应动画
      enemySprite.style.animation = 'none';
      void enemySprite.offsetWidth; // force reflow
      enemySprite.style.animation = currentScheme === 4 
        ? 'light-shake-anim 0.25s ease-out' 
        : 'enemy-heavy-hit-recoil 0.55s cubic-bezier(0.15, 0.85, 0.35, 1) both';

      // 4. 清理旧特效并挂载新特效
      fxLayer.innerHTML = '';

      // 4a. 屏幕暗角与血块
      const bloodHtml = createScreenBloodHtml(currentScheme);

      // 4b. 枪口爆炸
      const muzzleHtml = `
        <div style="position: absolute; left: ${tx}px; top: ${ty}px;">
          ${createMuzzleExplosionSvg(currentScheme)}
        </div>
      `;

      // 4c. 暴击数字与属性下降飘字 (power: 220 伤害, 单降: 20)
      const damageVal = currentScheme === 4 ? 65 : 242;
      const floatersHtml = `
        <div class="absolute pointer-events-none z-[190] text-center"
             style="left: ${tx}px; top: ${ty}px; animation: crit-damage-pop 0.9s cubic-bezier(0.12, 0.9, 0.25, 1) both;">
          <div class="font-cinzel text-5xl sm:text-6xl font-black ${currentScheme===4?'text-yellow-300':'text-transparent bg-clip-text bg-gradient-to-b from-amber-100 via-rose-500 to-red-600'} text-outline-crimson tracking-wider whitespace-nowrap">
            -${damageVal}
          </div>
          ${currentScheme !== 4 ? `
            <div class="mt-1 text-xs font-bold font-mono text-purple-300 bg-purple-950/80 px-2 py-0.5 rounded-full border border-purple-500/50 shadow-md">
              🔻 攻击力 -20 [单降]
            </div>
          ` : ''}
        </div>
      `;

      // 4d. 全屏白色高亮闪光
      const screenFlashHtml = currentScheme !== 4 ? `
        <div class="fixed inset-0 bg-white pointer-events-none z-[150]"
             style="animation: muzzle-screen-flash 0.3s ease-out both;"></div>
      ` : '';

      fxLayer.innerHTML = screenFlashHtml + bloodHtml + muzzleHtml + floatersHtml;

      // 血条扣减反馈
      const hpBar = document.getElementById(`enemy-hp-bar-${selectedEnemyId}`);
      if (hpBar) {
        const curW = parseInt(hpBar.style.width || '100');
        const nextW = Math.max(10, curW - (currentScheme === 4 ? 8 : 28));
        hpBar.style.width = `${nextW}%`;
        if (nextW <= 10) {
          setTimeout(() => { hpBar.style.width = '100%'; }, 1200);
        }
      }

      // 动画持续时间清理
      const delayTime = isSlowMo ? 2500 : 1200;
      setTimeout(() => {
        isShooting = false;
      }, delayTime);
    }

    // 页面初始化
    window.addEventListener('DOMContentLoaded', () => {
      renderEnemies();
      setTimeout(() => {
        getAudioContext();
      }, 500);
    });
  </script>
</body>
</html>
