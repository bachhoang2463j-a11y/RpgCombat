<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>枪击视觉体系重构与 [特效:枪击穿透] 演练 Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=Cinzel:wght@700;900&family=Share+Tech+Mono&family=Special+Elite&display=swap');
    
    body { 
      font-family: 'Noto Sans SC', sans-serif; 
      user-select: none;
      background: #080c16;
      color: #fff;
    }
    
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
    .font-typewriter { font-family: 'Special Elite', monospace; }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
    }

    .text-outline-thick {
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 25px rgba(0,0,0,1);
    }
    .text-outline-crimson {
      text-shadow: -2px -2px 0 #3f0000, 2px -2px 0 #3f0000, -2px 2px 0 #3f0000, 2px 2px 0 #3f0000, 0 0 35px #991b1b;
    }
    .text-outline-cyan {
      text-shadow: -2px -2px 0 #082f49, 2px -2px 0 #082f49, -2px 2px 0 #082f49, 2px 2px 0 #082f49, 0 0 25px #0284c7;
    }
    .text-outline-amber {
      text-shadow: -2px -2px 0 #451a03, 2px -2px 0 #451a03, -2px 2px 0 #451a03, 2px 2px 0 #451a03, 0 0 25px #d97706;
    }

    .breathe { animation: breathe 3.6s ease-in-out infinite alternate; }
    @keyframes breathe { 
      0% { transform: translateY(0px); } 
      100% { transform: translateY(-6px); } 
    }

    /* ==== 震屏系统 ==== */
    /* 1. 中小口径普通射击：轻快微震 (160ms) */
    .gunshot-shake { animation: gunshot-shake-anim 0.18s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes gunshot-shake-anim {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-5px, 3px) scale(1.008); }
      45% { transform: translate(6px, -4px) scale(1.005); }
      70% { transform: translate(-3px, 2px); }
      85% { transform: translate(2px, -1px); }
    }

    /* 2. 穿透射击：锐利后坐力震颤 (240ms) */
    .pierce-shake { animation: pierce-shake-anim 0.26s cubic-bezier(0.25, 1, 0.5, 1) both; }
    @keyframes pierce-shake-anim {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(10px, -6px) rotate(1.2deg) scale(1.018); }
      35% { transform: translate(-12px, 5px) rotate(-1.5deg) scale(1.012); }
      60% { transform: translate(6px, -3px) rotate(0.6deg); }
      80% { transform: translate(-3px, 1px) rotate(-0.3deg); }
    }

    /* 3. 远程重击：剧烈沉重震屏 (480ms) */
    .heavy-shake { animation: heavy-shake-anim 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes heavy-shake-anim {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      12% { transform: translate3d(-18px, 12px, 0) scale(1.04) rotate(-2deg); }
      25% { transform: translate3d(20px, -14px, 0) scale(1.05) rotate(2.2deg); }
      40% { transform: translate3d(-15px, 9px, 0) scale(1.03) rotate(-1.5deg); }
      55% { transform: translate3d(12px, -7px, 0) scale(1.02) rotate(1deg); }
      70% { transform: translate3d(-7px, 4px, 0) scale(1.01) rotate(-0.5deg); }
      85% { transform: translate3d(4px, -2px, 0) scale(1.005) rotate(0.2deg); }
    }

    /* ========================================================
       1. 中小口径【单体(枪击)】全新高质感 SVG 关键帧
       ======================================================== */
    @keyframes gunshot-core-flash {
      0% { transform: translate(-50%, -50%) scale(0.15) rotate(0deg); opacity: 0; filter: brightness(2.5); }
      18% { transform: translate(-50%, -50%) scale(1.18) rotate(12deg); opacity: 1; filter: brightness(1.8); }
      40% { transform: translate(-50%, -50%) scale(1.02) rotate(20deg); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1.35) rotate(35deg); opacity: 0; }
    }

    @keyframes gunshot-spark-ray {
      0% { transform: translate(-50%, -50%) scale(0.1) rotate(var(--ray-rot, 0deg)); opacity: 1; }
      35% { transform: translate(-50%, -50%) scale(1.15) translateY(-22px) rotate(var(--ray-rot, 0deg)); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.35) translateY(-42px) rotate(var(--ray-rot, 0deg)); opacity: 0; }
    }

    @keyframes gunshot-shock-ring {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; stroke-width: 6; }
      50% { transform: translate(-50%, -50%) scale(1.6); opacity: 0.75; stroke-width: 2.5; }
      100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; stroke-width: 1; }
    }

    @keyframes enemy-gunshot-flinch {
      0% { transform: scale(1) translate(0, 0); filter: brightness(1); }
      20% { transform: scale(0.95) translate(6px, -4px); filter: brightness(2) drop-shadow(0 0 15px #fbbf24); }
      50% { transform: scale(1.03) translate(-3px, 2px); filter: brightness(1.3); }
      100% { transform: scale(1) translate(0, 0); filter: brightness(1); }
    }

    /* ========================================================
       2. 【特效:枪击穿透】弱点锁定 + 超音速激波穿透关键帧
       ======================================================== */
    /* 弱点准星瞬锁与碎裂 */
    @keyframes pierce-weakpoint-lock {
      0% { transform: translate(-50%, -50%) scale(2.2) rotate(-45deg); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(0.95) rotate(0deg); opacity: 1; }
      45% { transform: translate(-50%, -50%) scale(1.05) rotate(5deg); opacity: 1; filter: drop-shadow(0 0 15px #38bdf8); }
      70% { transform: translate(-50%, -50%) scale(1.15) rotate(10deg); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(1.4) rotate(20deg); opacity: 0; }
    }

    /* 穿甲弹道超音速锥形激波束 (Tracer Beam) */
    @keyframes pierce-beam-penetrate {
      0% { transform: translate(-50%, -50%) scaleX(0.1) scaleY(2.2); opacity: 0; }
      15% { transform: translate(-50%, -50%) scaleX(1.15) scaleY(1); opacity: 1; filter: brightness(2.2) drop-shadow(0 0 15px #0ea5e9); }
      40% { transform: translate(-50%, -50%) scaleX(1) scaleY(0.7); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scaleX(1.3) scaleY(0); opacity: 0; }
    }

    /* 贯穿穿出背部粒子破片喷射 */
    @keyframes pierce-exit-cone {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
      30% { transform: translate(30px, -50%) scale(1.4); opacity: 1; }
      100% { transform: translate(75px, -50%) scale(2.0); opacity: 0; }
    }

    /* 敌人被贯穿后瞬间硬直与震荡 */
    @keyframes enemy-pierce-stutter {
      0% { transform: scale(1) translate(0, 0); filter: brightness(1); }
      12% { transform: scale(0.92) translate(14px, -2px) skewX(-4deg); filter: brightness(2.8) contrast(1.4) drop-shadow(0 0 25px #38bdf8); }
      30% { transform: scale(1.06) translate(-10px, 4px) skewX(2deg); filter: brightness(1.6) drop-shadow(0 0 15px #0284c7); }
      60% { transform: scale(0.98) translate(4px, -1px); filter: brightness(1.2); }
      100% { transform: scale(1) translate(0, 0); filter: brightness(1); }
    }

    /* 暴击/穿透飘字动画 */
    @keyframes crit-pop {
      0% { transform: translate(-50%, 0%) scale(0.3); opacity: 0; }
      18% { transform: translate(-50%, -60%) scale(1.35); opacity: 1; }
      35% { transform: translate(-50%, -85%) scale(1.05); opacity: 1; }
      75% { transform: translate(-50%, -105%) scale(1); opacity: 0.9; }
      100% { transform: translate(-50%, -135%) scale(0.85); opacity: 0; }
    }
  </style>
</head>
<body class="w-screen h-screen overflow-hidden relative select-none bg-[#070b14]">

  <!-- ========================================== -->
  <!-- 底部调试与独立试听条 -->
  <!-- ========================================== -->
  <div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-[250] flex flex-wrap items-center justify-center gap-2.5 bg-black/85 backdrop-blur-md px-4 py-1.5 rounded-full border border-gray-700 text-xs">
    <label class="flex items-center gap-1.5 cursor-pointer text-gray-300 hover:text-white">
      <input type="checkbox" id="chk-slowmo" class="accent-amber-500">
      <span>🐢 0.3x 慢动作</span>
    </label>
    <div class="w-[1px] h-3 bg-gray-600"></div>
    <label class="flex items-center gap-1.5 cursor-pointer text-gray-300 hover:text-white">
      <input type="checkbox" id="chk-shake" checked class="accent-amber-500">
      <span>📳 镜头震屏</span>
    </label>
    <div class="w-[1px] h-3 bg-gray-600"></div>
    <!-- 独立试听按钮 -->
    <button onclick="playTestSound('gunshot1')" class="text-amber-400 hover:text-white font-mono font-bold">🔊 gunshot1</button>
    <button onclick="playTestSound('gunshot2')" class="text-amber-400 hover:text-white font-mono font-bold">🔊 gunshot2</button>
    <button onclick="playTestSound('gunshot3')" class="text-amber-400 hover:text-white font-mono font-bold">🔊 gunshot3</button>
    <button onclick="playTestSound('gunshot_pierce')" class="text-sky-400 hover:text-white font-mono font-bold">🎯 pierce</button>
  </div>

  <script>
    // ==========================================
    // 音频管理中心
    // ==========================================
    const SOUND_URLS = {
      gunshot1: 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/gunshot1.mp3',
      gunshot2: 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/gunshot2.mp3',
      gunshot3: 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/gunshot3.mp3',
      gunshot_pierce: 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/gunshot_pierce.mp3',
      shot01: 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/shot01.mp3',
      hitDown: 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/hitDown.mp3',
      oldAtk2: 'https://files.catbox.moe/7w223l.mp3'
    };

    const soundCache = {};
    for (let key in SOUND_URLS) {
      soundCache[key] = new Audio(SOUND_URLS[key]);
      soundCache[key].preload = 'auto';
    }

    function playSound(key, vol = 1.0) {
      try {
        if (soundCache[key]) {
          const snd = soundCache[key].cloneNode();
          snd.volume = Math.min(1.0, vol);
          snd.play().catch(e => console.warn('音频播放受限:', e));
        } else if (SOUND_URLS[key]) {
          const snd = new Audio(SOUND_URLS[key]);
          snd.volume = Math.min(1.0, vol);
          snd.play().catch(e => console.warn('音频播放受限:', e));
        }
      } catch(e){}
    }

    function playRandomStandardGunshot() {
      const candidates = ['gunshot1', 'gunshot2', 'gunshot3'];
      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      playSound(chosen, 0.95);
      const label = document.getElementById('last-sfx-label');
      if (label) label.textContent = `音效: ${chosen}.mp3`;
      return chosen;
    }

    function playTestSound(name) {
      playSound(name, 1.0);
      const label = document.getElementById('last-sfx-label');
      if (label) label.textContent = `试听: ${name}.mp3`;
    }

    // ==========================================
    // 方案与状态
    // ==========================================
    let currentScheme = 1;

    const SCHEME_INFO = {
      1: {
        title: '【精密速射】(中小口径枪击全新改造)',
        desc: '方案 1：【中小口径枪击改造】干脆利落的中小口径枪口火星绽裂 + 激波光环 + 每次独立击发从 gunshot1/2/3 中随机抽取音效 + 0.18s 轻微震屏。'
      },
      2: {
        title: '【弱点贯穿】([特效:枪击穿透])',
        desc: '方案 2：【特效:枪击穿透】呼叫 gunshot_pierce.mp3 专属破甲音效 + 弱点锁定碎裂 + 超音速锥形贯穿激波束 + 穿出背部粒子破片 + 0.26s 锐利震感。'
      },
      3: {
        title: '【双管猎象枪】([特效:远程重击])',
        desc: '方案 3：【双管猎象枪·远程重击】双管交叠枪口烈焰大爆炸 + 5 朵镜头飞溅血块 + 2 道血痕流淌 + 强力反击重枪声音效 + 0.48s 剧烈镜头震动。'
      },
      4: {
        title: '【旧版枪击】(历史简单黄色光圈对比)',
        desc: '方案 4：【旧版对比】常规简单黄色小圈 + 默认轻打击音效 atk2 + 无弱点穿透效果 + 0.15s 微震。'
      }
    };

    function setScheme(sch) {
      currentScheme = sch;
      for (let i = 1; i <= 4; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (!tab) continue;
        if (i === sch) {
          tab.className = sch === 2
            ? 'px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all bg-gradient-to-r from-sky-600 to-cyan-500 text-white shadow-md border border-cyan-300'
            : sch === 3
            ? 'px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all bg-gradient-to-r from-red-700 to-rose-600 text-white shadow-md border border-rose-400'
            : 'px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all bg-gradient-to-r from-amber-600 to-yellow-500 text-white shadow-md border border-yellow-300';
        } else {
          tab.className = 'px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all text-gray-300 hover:text-white';
        }
      }
      document.getElementById('scheme-desc').textContent = SCHEME_INFO[sch].desc;
    }

    function selectEnemy(id) {
      // 保持选中目标
    }

    // ==========================================
    // 视觉生成器 (SVG 架构)
    // ==========================================

    // 1. 中小口径枪击 (Standard Gunshot Refactor)
    function createStandardGunshotSvg() {
      return `
        <div class="absolute left-1/2 top-1/2 pointer-events-none z-50" style="width: 140px; height: 140px;">
          <!-- 激波光圈 -->
          <svg viewBox="0 0 100 100" class="absolute inset-0 w-full h-full text-amber-300 stroke-current fill-none pointer-events-none"
               style="animation: gunshot-shock-ring 0.28s cubic-bezier(0.1, 0.8, 0.2, 1) both; filter: drop-shadow(0 0 8px #f59e0b);">
            <circle cx="50" cy="50" r="22" stroke="#fef08a" stroke-width="3" />
            <circle cx="50" cy="50" r="16" stroke="#f97316" stroke-width="2" stroke-dasharray="4 3" opacity="0.8"/>
          </svg>

          <!-- 6向锐利枪火火星飞溅 -->
          <div class="absolute inset-0 flex items-center justify-center">
            ${[0, 60, 120, 180, 240, 300].map(deg => `
              <div class="absolute w-1.5 h-8 bg-gradient-to-t from-transparent via-amber-300 to-white rounded-full opacity-0"
                   style="--ray-rot:${deg}deg; animation: gunshot-spark-ray 0.26s cubic-bezier(0.15, 0.85, 0.35, 1) both; filter: drop-shadow(0 0 6px #f59e0b);"></div>
            `).join('')}
          </div>

          <!-- 枪口亮白高热火花核心 -->
          <div class="absolute left-1/2 top-1/2 w-full h-full pointer-events-none"
               style="animation: gunshot-core-flash 0.32s cubic-bezier(0.12, 0.9, 0.25, 1) both; will-change: transform, opacity;">
            <svg viewBox="0 0 100 100" class="w-full h-full" style="filter: drop-shadow(0 0 15px #f59e0b) drop-shadow(0 0 25px #ea580c);">
              <defs>
                <radialGradient id="std-gun-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="35%" stop-color="#fef08a" />
                  <stop offset="70%" stop-color="#f97316" />
                  <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
                </radialGradient>
              </defs>
              <!-- 锐角十字星芒与星刺 -->
              <polygon points="50,15 56,40 85,50 56,60 50,85 44,60 15,50 44,40" fill="url(#std-gun-grad)" />
              <circle cx="50" cy="50" r="14" fill="#ffffff" style="filter: drop-shadow(0 0 8px #fff);" />
              <circle cx="50" cy="50" r="22" fill="#fde047" opacity="0.6" />
            </svg>
          </div>
        </div>
      `;
    }

    // 2. 【特效:枪击穿透】(Gunshot Pierce Weakpoint Penetration)
    function createGunshotPierceSvg() {
      return `
        <div class="absolute left-1/2 top-1/2 pointer-events-none z-50" style="width: 220px; height: 220px;">
          
          <!-- 弱点全息准星与锁定碎裂 -->
          <div class="absolute left-1/2 top-1/2 w-full h-full pointer-events-none"
               style="animation: pierce-weakpoint-lock 0.65s cubic-bezier(0.15, 0.9, 0.2, 1) both; will-change: transform, opacity;">
            <svg viewBox="0 0 120 120" class="w-full h-full fill-none stroke-current text-sky-400" style="filter: drop-shadow(0 0 12px #38bdf8);">
              <!-- 菱形与十字瞄准刻度 -->
              <polygon points="60,10 110,60 60,110 10,60" stroke-width="2.5" stroke="#38bdf8" stroke-dasharray="8 4"/>
              <circle cx="60" cy="60" r="38" stroke="#0ea5e9" stroke-width="1.8" />
              <line x1="60" y1="5" x2="60" y2="35" stroke="#f0f9ff" stroke-width="2.5"/>
              <line x1="60" y1="85" x2="60" y2="115" stroke="#f0f9ff" stroke-width="2.5"/>
              <line x1="5" y1="60" x2="35" y2="60" stroke="#f0f9ff" stroke-width="2.5"/>
              <line x1="85" y1="60" x2="115" y2="60" stroke="#f0f9ff" stroke-width="2.5"/>
              <!-- 弱点核心 -->
              <circle cx="60" cy="60" r="6" fill="#38bdf8"/>
            </svg>
          </div>

          <!-- 超音速贯穿激波光束 (Tracer Beam) -->
          <div class="absolute left-1/2 top-1/2 w-[340px] h-6 bg-gradient-to-r from-transparent via-cyan-200 to-sky-500 opacity-0 pointer-events-none -rotate-12"
               style="animation: pierce-beam-penetrate 0.45s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity; filter: drop-shadow(0 0 15px #0284c7);">
          </div>

          <!-- 穿出背部的高速破甲金属破片喷射 (Exit Shrapnel) -->
          <div class="absolute left-1/2 top-1/2 pointer-events-none opacity-0"
               style="animation: pierce-exit-cone 0.5s 0.05s ease-out both;">
            <svg viewBox="0 0 100 100" class="w-32 h-32 fill-sky-200">
              <polygon points="50,45 80,30 65,48 95,50 65,55 85,70 50,55" fill="#e0f2fe" style="filter: drop-shadow(0 0 10px #38bdf8);"/>
              <circle cx="85" cy="35" r="3" fill="#bae6fd" />
              <circle cx="95" cy="55" r="2.5" fill="#fff" />
              <circle cx="75" cy="65" r="2" fill="#7dd3fc" />
            </svg>
          </div>

          <!-- 核心高能激波环 -->
          <svg viewBox="0 0 100 100" class="absolute inset-0 w-full h-full stroke-current fill-none pointer-events-none"
               style="animation: gunshot-shock-ring 0.35s cubic-bezier(0.1, 0.8, 0.2, 1) both; filter: drop-shadow(0 0 15px #38bdf8);">
            <circle cx="50" cy="50" r="28" stroke="#38bdf8" stroke-width="4" />
            <circle cx="50" cy="50" r="18" stroke="#ffffff" stroke-width="3" />
          </svg>

        </div>
      `;
    }

    // 3. 远程重击 (Heavy Blast)
    function createRangedHeavySvg() {
      return `
        <div class="absolute left-1/2 top-1/2 pointer-events-none z-50" style="width: 260px; height: 260px;">
          <svg viewBox="0 0 200 200" class="absolute inset-0 w-full h-full text-amber-400 stroke-current fill-none pointer-events-none"
               style="animation: gunshot-shock-ring 0.45s cubic-bezier(0.1, 0.8, 0.2, 1) both; filter: drop-shadow(0 0 15px #f59e0b);">
            <circle cx="100" cy="100" r="50" stroke="#fef08a" stroke-width="5" />
            <circle cx="100" cy="100" r="42" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 6" opacity="0.8"/>
          </svg>
          <div class="absolute left-1/2 top-1/2 w-full h-full pointer-events-none"
               style="animation: gunshot-core-flash 0.55s cubic-bezier(0.12, 0.9, 0.25, 1) both; will-change: transform, opacity;">
            <svg viewBox="0 0 200 200" class="w-full h-full" style="filter: drop-shadow(0 0 25px #ea580c) drop-shadow(0 0 45px #dc2626);">
              <polygon points="100,10 120,70 185,45 135,95 190,140 125,130 115,190 90,135 20,160 65,110 10,75 75,70" fill="#f97316" />
              <circle cx="100" cy="100" r="34" fill="#ffffff" style="filter: drop-shadow(0 0 15px #fff);" />
              <circle cx="100" cy="100" r="48" fill="#fde047" opacity="0.7" />
            </svg>
          </div>
        </div>
      `;
    }

    // 4. 旧版枪击
    function createOldGunshotSvg() {
      return `
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 pointer-events-none">
          <svg viewBox="0 0 100 100" class="w-full h-full" style="animation: gunshot-core-flash 0.3s ease-out both;">
            <circle cx="50" cy="50" r="20" fill="#fcd34d" />
            <circle cx="50" cy="50" r="35" stroke="#fef08a" stroke-width="4" fill="none" opacity="0.8"/>
          </svg>
        </div>
      `;
    }

    // ==========================================
    // 击发主流程
    // ==========================================
    let isFiring = false;

    async function fireCurrentSkill() {
      if (isFiring) return;
      isFiring = true;

      const isSlowMo = document.getElementById('chk-slowmo').checked;
      const isShakeEnabled = document.getElementById('chk-shake').checked;

      const enemySprite = document.getElementById('enemy-sprite-1');
      const fxLayer = document.getElementById('fx-layer');
      const battleScene = document.getElementById('battle-scene');

      const targetRect = enemySprite.getBoundingClientRect();
      const tx = targetRect.left + targetRect.width / 2;
      const ty = targetRect.top + targetRect.height / 2;

      // 1. 音效分流
      if (currentScheme === 1) {
        // 中小口径枪击：随机选 gunshot1~3
        playRandomStandardGunshot();
      } else if (currentScheme === 2) {
        // 枪击穿透：专属 gunshot_pierce.mp3
        playSound('gunshot_pierce', 1.0);
        document.getElementById('last-sfx-label').textContent = '音效: gunshot_pierce.mp3';
      } else if (currentScheme === 3) {
        // 远程重击：强力反击重枪声 shot01.mp3
        playSound('shot01', 1.0);
        setTimeout(() => playSound('hitDown', 0.8), 60);
        document.getElementById('last-sfx-label').textContent = '音效: shot01.mp3';
      } else {
        // 旧版
        playSound('oldAtk2', 0.6);
        document.getElementById('last-sfx-label').textContent = '音效: atk2.mp3 (旧版)';
      }

      // 2. 镜头震屏
      if (isShakeEnabled) {
        battleScene.classList.remove('gunshot-shake', 'pierce-shake', 'heavy-shake');
        void battleScene.offsetWidth;
        if (currentScheme === 1) {
          battleScene.classList.add('gunshot-shake');
          setTimeout(() => battleScene.classList.remove('gunshot-shake'), 180);
        } else if (currentScheme === 2) {
          battleScene.classList.add('pierce-shake');
          setTimeout(() => battleScene.classList.remove('pierce-shake'), 260);
        } else if (currentScheme === 3) {
          battleScene.classList.add('heavy-shake');
          setTimeout(() => battleScene.classList.remove('heavy-shake'), 480);
        }
      }

      // 3. 目标受击动画
      enemySprite.style.animation = 'none';
      void enemySprite.offsetWidth;
      if (currentScheme === 1) {
        enemySprite.style.animation = 'enemy-gunshot-flinch 0.22s ease-out both';
      } else if (currentScheme === 2) {
        enemySprite.style.animation = 'enemy-pierce-stutter 0.45s cubic-bezier(0.15, 0.85, 0.35, 1) both';
      } else if (currentScheme === 3) {
        enemySprite.style.animation = 'enemy-pierce-stutter 0.55s cubic-bezier(0.15, 0.85, 0.35, 1) both';
      } else {
        enemySprite.style.animation = 'enemy-gunshot-flinch 0.18s ease-out both';
      }

      // 4. 清理旧特效并挂载
      fxLayer.innerHTML = '';

      let fxHtml = '';
      if (currentScheme === 1) fxHtml = createStandardGunshotSvg();
      else if (currentScheme === 2) fxHtml = createGunshotPierceSvg();
      else if (currentScheme === 3) fxHtml = createRangedHeavySvg();
      else fxHtml = createOldGunshotSvg();

      const containerWrap = `
        <div style="position: absolute; left: ${tx}px; top: ${ty}px;">
          ${fxHtml}
        </div>
      `;

      // 5. 飘字与伤害反馈
      let damageText = '-115';
      let tagBadge = '';
      if (currentScheme === 1) {
        damageText = '-118';
      } else if (currentScheme === 2) {
        damageText = '-195';
        tagBadge = `<div class="mt-1 text-xs font-bold font-mono text-cyan-300 bg-sky-950/80 px-2 py-0.5 rounded-full border border-sky-400/50 shadow-md">🎯 弱点穿透·破甲</div>`;
      } else if (currentScheme === 3) {
        damageText = '-242';
        tagBadge = `<div class="mt-1 text-xs font-bold font-mono text-purple-300 bg-purple-950/80 px-2 py-0.5 rounded-full border border-purple-500/50 shadow-md">🔻 攻击力 -20 [单降]</div>`;
      } else {
        damageText = '-82';
      }

      const floatersHtml = `
        <div class="absolute pointer-events-none z-[190] text-center"
             style="left: ${tx}px; top: ${ty}px; animation: crit-pop 0.8s cubic-bezier(0.12, 0.9, 0.25, 1) both;">
          <div class="font-cinzel text-5xl sm:text-6xl font-black ${currentScheme===2?'text-cyan-300 text-outline-cyan':currentScheme===3?'text-transparent bg-clip-text bg-gradient-to-b from-amber-100 to-rose-600 text-outline-crimson':'text-amber-300 text-outline-amber'} tracking-wider whitespace-nowrap">
            ${damageText}
          </div>
          ${tagBadge}
        </div>
      `;

      fxLayer.innerHTML = containerWrap + floatersHtml;

      // 血条扣减
      const hpBar = document.getElementById('enemy-hp-bar-1');
      if (hpBar) {
        const curW = parseInt(hpBar.style.width || '100');
        const dW = currentScheme === 2 ? 25 : currentScheme === 3 ? 32 : 15;
        const nextW = Math.max(10, curW - dW);
        hpBar.style.width = `${nextW}%`;
        if (nextW <= 10) {
          setTimeout(() => { hpBar.style.width = '100%'; }, 1000);
        }
      }

      const delayTime = isSlowMo ? 2200 : 850;
      setTimeout(() => {
        isFiring = false;
      }, delayTime);
    }
  </script>
</body>
</html>
