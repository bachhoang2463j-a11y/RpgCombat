<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>命中结果与伤害量级分层 · demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* ===== 命中结果反馈 arcane-hit-（可移植） ===== */
    /* 双层血条：残影在后、前景在前；前景瞬时到位，残影由 JS 控制停留后收拢 */
    .arcane-hit-ghost { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #fecaca, #fff1f2); box-shadow: 0 0 6px rgba(254,202,202,0.9); z-index: 0; }
    .arcane-hit-fill { z-index: 1; transition: none; }
    @keyframes arcane-hit-fill-blink { 0% { filter: brightness(2.2); } 100% { filter: none; } }
    .arcane-hit-fill-blink { animation: arcane-hit-fill-blink 0.22s ease-out; }
    /* 数字层：高于粒子 canvas(55)，与正式版浮字 60/70 同级 */
    .arcane-hit-num-layer { position: fixed; inset: 0; pointer-events: none; z-index: 62; overflow: hidden; }
    .arcane-hit-num { position: absolute; transform: translate(-50%, -50%); font-family: 'JetBrains Mono', monospace; font-weight: 700; white-space: nowrap; line-height: 1; letter-spacing: -0.02em;
        paint-order: stroke fill; -webkit-text-stroke: 3px rgba(8,6,12,0.92); text-shadow: 0 2px 4px rgba(0,0,0,0.7); will-change: transform, opacity; }
    .arcane-hit-num.l1 { font-size: 18px; color: #fecdd3; }
    .arcane-hit-num.l2 { font-size: 26px; color: #fb7185; }
    .arcane-hit-num.l3 { font-size: 36px; color: #f43f5e; -webkit-text-stroke-width: 4px; }
    .arcane-hit-num.crit { color: #fdba74; text-shadow: 0 0 10px rgba(251,146,60,0.75), 0 2px 4px rgba(0,0,0,0.7); }
    .arcane-hit-num.burst { color: #fffbeb; text-shadow: 0 0 12px rgba(253,224,71,0.95), 0 0 24px rgba(250,204,21,0.55), 0 2px 4px rgba(0,0,0,0.7); }
    .arcane-hit-num.shield { font-size: 17px; color: #e0f2fe; text-shadow: 0 0 8px rgba(125,211,252,0.7); }
    .arcane-hit-num.shield.sub { font-size: 13px; }
    .arcane-hit-num.word { font-family: 'Noto Sans SC', sans-serif; font-weight: 900; font-size: 17px; letter-spacing: 0.08em; }
    .arcane-hit-num.dodge { color: #cbd5e1; font-style: italic; }
    .arcane-hit-num.block { color: #e2e8f0; }
    .arcane-hit-num.break { color: #bae6fd; font-size: 14px; }
    .arcane-hit-tag { position: absolute; transform: translate(-50%, -50%); font-family: 'Noto Sans SC', sans-serif; font-weight: 900; font-size: 11px; letter-spacing: 0.12em; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
    .arcane-hit-tag.crit { color: #1c0a00; background: linear-gradient(90deg, #fb923c, #fde047); box-shadow: 0 0 10px rgba(251,146,60,0.8); }
    .arcane-hit-tag.burst { color: #422006; background: linear-gradient(90deg, #fef9c3, #fde047, #fff); box-shadow: 0 0 14px rgba(253,224,71,0.9); }
    .arcane-hit-core { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
    /* 被硬直的元素：只用独立 translate/rotate 属性，不覆盖其原有 animation（breathe 等） */
    .arcane-hit-recoil { will-change: translate, rotate; }
    /* ===== 命中结果反馈 END ===== */
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->
  <div class="absolute top-2 sm:top-4 right-2 sm:right-4 z-[115] flex gap-1.5 sm:gap-2">
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-violet-400 hover:text-violet-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📚</span> <span class="hidden sm:inline">世界书</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-purple-400 hover:text-purple-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📜</span> <span class="hidden sm:inline">记录</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-400 hover:text-blue-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔲</span> <span class="hidden sm:inline">全屏</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>💬</span> <span class="hidden sm:inline">对话</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-yellow-500 hover:text-yellow-400 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>⚙️</span> <span class="hidden sm:inline">设置</span></button>
    <button id="btn-reset" class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-emerald-400 hover:text-emerald-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔄</span> <span class="hidden sm:inline">重置</span></button>
  </div>

  <!-- 全屏战场区域 -->
  <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-800 to-emerald-900 overflow-hidden z-0" id="battle-scene">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-0"></div>
    <div class="absolute left-1 sm:left-4 md:left-6 top-16 sm:top-20 bottom-44 sm:bottom-48 w-12 sm:w-14 z-30 flex flex-col items-center select-none">
      <div class="relative w-full h-full flex flex-col items-center">
        <div class="timeline-rail"><div class="rail-pulse-beam"></div></div>
        <div id="turn-order-container" class="relative w-full h-full flex flex-col gap-2 sm:gap-2.5 items-center overflow-y-auto no-scrollbar mask-fade-y py-3"></div>
      </div>
    </div>
    <div id="enemies-container" class="absolute left-2 sm:left-6 right-2 sm:right-6 top-[10%] bottom-[190px] sm:bottom-[220px] z-10 flex flex-col items-center justify-start gap-6 overflow-visible pointer-events-none"></div>
  </div>

  <!-- 悬浮 UI 层 -->
  <div class="absolute bottom-[52px] left-0 w-full p-1.5 sm:p-6 flex flex-col-reverse sm:flex-row items-end justify-between gap-1.5 sm:gap-4 z-20 pointer-events-none pb-2 sm:pb-6">
    <div id="heroes-container" class="w-full sm:flex-1 grid grid-cols-4 gap-1 sm:gap-4 max-w-2xl pointer-events-auto relative"></div>
    <div class="relative self-end">
      <div id="menu-container" class="w-[260px] h-[172px] bg-slate-950/95 backdrop-blur-xl rounded-xl border border-slate-700/80 border-t-2 border-t-cyan-500/80 flex flex-col overflow-hidden relative shadow-[0_15px_35px_rgba(0,0,0,0.9)] pointer-events-auto self-end mb-1 sm:mb-0">
        <div class="px-2.5 py-1 bg-gradient-to-r from-violet-950/60 via-slate-900/90 to-slate-950 border-b border-violet-900/40 flex justify-between items-center shrink-0">
          <div class="flex items-center gap-1.5 min-w-0"><span class="w-1.5 h-1.5 rounded-full bg-violet-400 animate-pulse shrink-0"></span><span class="text-xs font-bold text-violet-300">命中反馈 · 场景</span></div>
          <span class="text-[9px] text-slate-500" id="hit-status">点击场景</span>
        </div>
        <div id="skill-list" class="flex-1 flex flex-col gap-1 p-1 overflow-y-auto custom-scrollbar"></div>
      </div>
    </div>
  </div>

  <!-- 底部对话栏（复刻主界面，仅装饰） -->
  <div id="chat-bar" class="absolute bottom-0 left-0 right-0 h-[52px] z-30 flex items-center gap-2 px-2 sm:px-3 bg-black/60 border-t border-white/5">
    <div class="w-9 h-9 rounded-full bg-slate-700 border border-white/20 shrink-0 flex items-center justify-center">🕵️</div>
    <input type="text" placeholder="说点什么... (Enter发送)" class="flex-1 h-9 rounded-full px-4 text-sm outline-none">
    <span class="px-3 py-1 rounded-full text-xs font-bold border border-emerald-500/60 text-emerald-300 bg-emerald-950/50">友方旁白 ON</span>
    <span class="px-3 py-1 rounded-full text-xs font-bold border border-rose-500/60 text-rose-300 bg-rose-950/50">敌方旁白 ON</span>
    <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">➤</div>
  </div>
 </div>
  <script>
    // ===== 演示宿主 BEGIN：占位数据、渲染、fxEngine；不移植到正式版 =====
    const $ = s => document.querySelector(s);
    let combatToken = 0;
    let heroesData = [], enemiesData = [];
    const HERO_DATA = [['h1', '埃利奥特', '👨', 100, 55, 110, 5], ['h2', '弗兰克', '🧔', 180, 0, 17, 0], ['h3', '玛德琳', '👩', 140, 0, 14, 0], ['h4', '索恩', '🕵️', 140, 0, 20, 0]];
    const ENEMY_ROWS = [[['e1', '🐟'], ['e2', '❄️'], ['e3', '🐟']], [['e4', '👻'], ['e5', '👻'], ['e6', '🌀']]];

function createCompactBarHTML(id, type, label, val, max, colorClass, isTp = false, shield = 0) {
  const pct = Math.max(0, Math.min(100, (val / max) * 100)); const barWidthClass = isTp ? 'w-1/3' : 'w-full';
  const shieldText = shield > 0 && type === 'hp' ? `<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾${shield})</span>` : '';
  let finalColor = colorClass; let extraClass = ''; if (isTp && val >= max) { finalColor = 'bg-amber-400'; extraClass = 'shadow-[0_0_10px_rgba(251,191,36,0.8)] animate-pulse'; }
  return `<div class="relative pt-1.5 sm:pt-2.5 mb-0 sm:mb-[2px]"><span id="${id}-${type}-text" class="absolute right-0 top-0 text-[8px] sm:text-xs font-mono font-bold text-white leading-none text-outline z-10 whitespace-nowrap">${Math.floor(val)}${shieldText}</span><div class="flex items-center gap-1 sm:gap-1.5"><span class="text-[7px] sm:text-[10px] font-bold text-gray-200 leading-none text-outline w-3 sm:w-4">${label}</span><div class="arcane-hit-track flex-grow h-1 sm:h-1.5 bg-[#222] rounded-[1px] overflow-hidden border border-[#111] relative">${type === 'hp' ? `<div id="${id}-hp-ghost" class="arcane-hit-ghost" style="width: ${pct}%"></div>` : ''}<div id="${id}-${type}-bar" class="${barWidthClass} h-full ${finalColor} ${extraClass} relative ${type === 'hp' ? 'arcane-hit-fill' : 'transition-all duration-300 ease-out'}" style="width: ${pct}%"></div></div></div></div>`;
}

function getEntitySpriteDom(entityOrId){
  const id = entityOrId && typeof entityOrId === 'object' ? entityOrId.id : String(entityOrId||'');
  if(!id) return null;
  return document.getElementById(`hero-card-${id}`) || document.getElementById(`${id}-sprite`) || document.getElementById(`hero-wrap-${id}`) || null;
}
window.getEntitySpriteDom = getEntitySpriteDom;

    // 敌方血条初值（initUI 内 enemiesData 赋值后调用）
    const enemyOf = id => enemiesData.find(e => e.id === id);
    const enemyPct = id => { const e = enemyOf(id); return Math.max(0, Math.min(100, e.hp / e.maxHp * 100)); };
    const enemyLabel = id => { const e = enemyOf(id); return Math.floor(e.hp) + '/' + e.maxHp + (e.shield > 0 ? ' 盾' + e.shield : ''); };
    // init：场景初值 { id: { hp, maxHp, shield } }，未列出的实体用默认值
    function initUI(init = {}) {
        heroesData = HERO_DATA.map(([id, name, face, hp, shield, mp, tp]) => Object.assign({ id, name, face, hp, maxHp: hp, shield, mp, maxMp: mp, tp, maxTp: 100, isAlive: true, buffs: [] }, init[id]));
        enemiesData = ENEMY_ROWS.flat().map(([id, face]) => Object.assign({ id, name: id, face, hp: 100, maxHp: 100, shield: 0, isAlive: true, buffs: [] }, init[id]));
    $('#heroes-container').innerHTML = heroesData.map(({ id, name, face, hp, maxHp, shield, mp, maxMp, tp, maxTp }) => `
      <div class="hero relative transition-all duration-300 min-w-[70px] z-20" id="hero-wrap-${id}">
        <div id="hero-card-${id}" class="fx-body hero-card-inner bg-[#18181b] rounded overflow-hidden relative border shadow-2xl transition-all border-gray-800">
          <div id="${id}-buffs" class="absolute top-1 right-1 flex flex-col gap-1 items-end z-20 pointer-events-none"></div>
          <div class="w-full h-12 sm:h-auto sm:aspect-[4/3] relative bg-gray-900 border-b border-gray-700">
            <div class="absolute top-0 left-0 w-full bg-gradient-to-b from-black/80 to-transparent px-1.5 py-1 text-[9px] sm:text-xs font-bold text-white z-10 flex justify-between"><span>${name}</span></div>
            <div class="portrait w-full h-full">${face}</div>
          </div>
          <div class="px-1 py-1 sm:px-2 sm:py-1.5 flex flex-col gap-[1px] sm:gap-0.5">${createCompactBarHTML(id, 'hp', 'HP', hp, maxHp, 'bg-yellow-400', false, shield)}${createCompactBarHTML(id, 'mp', 'MP', mp, maxMp, 'bg-cyan-400')}${createCompactBarHTML(id, 'tp', 'TP', tp, maxTp, 'bg-green-500', true)}</div>
        </div>
      </div>`).join('');
    $('#enemies-container').innerHTML = ENEMY_ROWS.map((row, ri) => `<div class="flex items-end justify-center" style="gap:${ri ? 26 : 22}px; ${ri ? 'margin-top:18px' : ''}">${row.map(([id, em]) => `
      <div class="flex flex-col items-center group relative shrink-0" id="enemy-box-${id}" style="transform:scale(${ri ? 1 : 0.72}); ${ri ? '' : 'filter:brightness(0.82) saturate(0.92)'}">
        <div id="${id}-sprite" class="fx-body enemy-sprite text-7xl sm:text-8xl drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] breathe mt-2 sm:mt-4 flex justify-center items-center">${em}</div>
        <div class="arcane-hit-track w-10 sm:w-16 h-1 sm:h-1.5 bg-black/50 mt-2 sm:mt-4 rounded-full overflow-hidden relative"><div id="${id}-hp-ghost" class="arcane-hit-ghost" style="width:${enemyPct(id)}%"></div><div id="${id}-hp-bar" class="arcane-hit-fill h-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.8)] relative" style="width:${enemyPct(id)}%"></div></div>
        <div id="${id}-hp-text" class="mt-0.5 text-[9px] sm:text-[10px] font-mono font-bold text-white/80 text-outline leading-none">${enemyLabel(id)}</div>
      </div>`).join('')}</div>`).join('');
    $('#turn-order-container').innerHTML = ['👨', '❄️', '🧔', '👩', '🕵️', '👻', '👻'].map((e, i) => `<div class="turn-dot ${i ? '' : 'cur'}" style="border-color:${i === 1 || i > 4 ? '#e11d48' : '#06b6d4'}">${e}</div>`).join('');
    }
    initUI();

class CanvasFxEngine {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt

            progress() { return Math.min(1, (performance.now() - startedAt) / dur); }
        };
        S.flights.push(f);
        ensureCanvas(); ensureDriver();
        f.timer = after(dur, () => {
            const index = S.flights.indexOf(f);

    function step(dt) {

    // ===== 命中结果反馈 BEGIN（可移植）=====

    // playHitFeedback(results, { onBeat }) —— results 可为单个或数组（同一命中拍点的群体）。

    const HIT_HOLD_MS = 450, HIT_COLLAPSE_MS = 500, HIT_STOP_MS = 60, HIT_LIFE_MS = 1300;

    // 结果 / 量级 / 修饰 三维独立判定；量级只看 hpDmg/maxHp，与主线 severityStr 同口径
    function classifyHit(r) {
        const hpDmg = Math.max(0, r.hpDmg || 0), shieldDmg = Math.max(0, r.shieldDmg || 0);
        let kind;
        if (r.outcome === 'dodge') kind = 'dodge';
        else if (r.outcome === 'block' || (hpDmg === 0 && shieldDmg === 0)) kind = 'block';
        else if (hpDmg > 0) kind = 'hp';
        else kind = 'shield';
        const ratio = r.maxHp > 0 ? hpDmg / r.maxHp : 0;
        const tier = kind !== 'hp' ? 0 : ratio < 0.10 ? 1 : ratio <= 0.50 ? 2 : 3;
        const shieldBroken = shieldDmg > 0 && (r.shieldBefore || 0) > 0 && (r.shieldAfter || 0) === 0;
        const landed = kind === 'hp' || kind === 'shield';
        return { kind, tier, hpDmg, shieldDmg, shieldBroken, crit: landed && !!r.isCrit, burst: landed && !!r.isBurst };
    }

    // ---- 双层血条：前景瞬时到位；残影停留后收拢；连续受击残影不回跳 ----
    function hitBar(id, hpBefore, hpAfter, maxHp) {
        const fill = document.getElementById(id + '-hp-bar'), ghost = document.getElementById(id + '-hp-ghost');
        if (!fill) return;
        const pct = v => Math.max(0, Math.min(100, v / maxHp * 100));
        fill.style.width = pct(hpAfter) + '%';
        fill.classList.remove('arcane-hit-fill-blink'); void fill.offsetWidth; fill.classList.add('arcane-hit-fill-blink');
        if (!ghost) return;
        const st = H.ghosts.get(id);

            // 收拢中被再次命中：冻结在当前视觉宽度（只会 ≥ 新血量），重新计时
            clearTimeout(st.timer);
            const track = ghost.parentElement.getBoundingClientRect().width || 1;
            ghost.style.transition = 'none';
            ghost.style.width = Math.max(pct(hpAfter), ghost.getBoundingClientRect().width / track * 100) + '%';
        } else {
            ghost.style.transition = 'none';
            ghost.style.width = Math.max(pct(hpBefore), pct(hpAfter)) + '%';

        const next = { el: ghost, timer: null };
        next.timer = setTimeout(() => {
            if (!ghost.isConnected) { H.ghosts.delete(id); return; }
            ghost.style.transition = 'width ' + HIT_COLLAPSE_MS + 'ms cubic-bezier(0.3,0,0.2,1)';
            ghost.style.width = pct(hpAfter) + '%';
            next.timer = setTimeout(() => { if (H.ghosts.get(id) === next) H.ghosts.delete(id); }, HIT_COLLAPSE_MS);
        }, HIT_HOLD_MS);
        H.ghosts.set(id, next);
    }

        { name: '英雄受击 · 混合', level: '英雄', desc: '扣盾/轻伤/受伤/重创 四卡', from: 'e5', init: { h1: { hp: 100, maxHp: 100, shield: 55 }, h2: { hp: 180, maxHp: 180, shield: 0 }, h3: { hp: 140, maxHp: 140 }, h4: { hp: 140, maxHp: 140 } }, beats: [[{ t: 'h1', dmg: 30 }, { t: 'h2', dmg: 12 }, { t: 'h3', dmg: 40 }, { t: 'h4', dmg: 90 }]] },
        { name: '英雄 · 破盾并扣血', level: '英雄', desc: '埃利奥特 盾55 → 0，血 -25', from: 'e5', init: { h1: { hp: 100, maxHp: 100, shield: 55 } }, beats: [[{ t: 'h1', dmg: 80 }]] },
        { name: '英雄 · 闪避/格挡', level: '英雄', desc: '两卡零伤害但结果不同', from: 'e5', init: {}, beats: [[{ t: 'h3', dodge: true }, { t: 'h4', block: true }]] },
    ];

    const entityOf = id => heroesData.concat(enemiesData).find(e => e.id === id);
    // 按主线 calculateDamage 口径：先扣盾、余量扣血；hp 下限 0
    function settle(spec) {
        const e = entityOf(spec.t);
        const base = { targetId: e.id, maxHp: e.maxHp, hpBefore: e.hp, hpAfter: e.hp, hpDmg: 0, shieldBefore: e.shield || 0, shieldAfter: e.shield || 0, shieldDmg: 0, isCrit: !!spec.crit, isBurst: !!spec.burst };
        if (spec.dodge) return Object.assign(base, { outcome: 'dodge' });
        if (spec.block) return Object.assign(base, { outcome: 'block' });
        let dmg = spec.dmg;
        const shieldDmg = Math.min(e.shield || 0, dmg); dmg -= shieldDmg;
        const hpDmg = Math.min(e.hp, dmg);
        e.shield = (e.shield || 0) - shieldDmg; e.hp -= hpDmg;
        return Object.assign(base, { outcome: 'hit', hpAfter: e.hp, hpDmg, shieldAfter: e.shield, shieldDmg });
    }
    // 宿主数值文本刷新（正式版对应 updateUI；这里只刷 HP 文本，血条由组件处理）
    function refreshText(list) {
        list.forEach(r => {
            const e = entityOf(r.targetId), el = document.getElementById(e.id + '-hp-text');
            if (!el) return;
            if (e.id.startsWith('h')) el.innerHTML = Math.floor(e.hp) + (e.shield > 0 ? '<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾' + e.shield + ')</span>' : '');
            else el.textContent = Math.floor(e.hp) + '/' + e.maxHp + (e.shield > 0 ? ' 盾' + e.shield : '');
        });
    }

    // 来袭轨迹：所有场景（含旧版）共用同一条 180ms 短弹道，保证比较只差在"结果反馈"
    const INCOMING_MS = 180;
    let demoTimers = [], unlockTimer = null, activeHandles = [];
    function demoAfter(ms, fn) { const token = combatToken; const id = setTimeout(() => { if (token === combatToken) fn(); }, ms); demoTimers.push(id); return id; }
    function incoming(fromId, targetIds) {
        const from = getEntitySpriteDom(fromId); if (!from) return;
        const fr = from.getBoundingClientRect();
        targetIds.forEach(id => {
            const to = getEntitySpriteDom(id); if (!to) return;
            const tr = to.getBoundingClientRect();
            const line = document.createElement('div');
            const ax = fr.left + fr.width / 2, ay = fr.top + fr.height / 2, bx = tr.left + tr.width / 2, by = tr.top + tr.height * 0.45;
            const len = Math.hypot(bx - ax, by - ay), ang = Math.atan2(by - ay, bx - ax) * 180 / Math.PI;
            line.setAttribute('data-arcane-fx', 'demo-incoming');
            line.style.cssText = 'position:fixed; left:' + ax + 'px; top:' + ay + 'px; width:46px; height:3px; margin-top:-1.5px; border-radius:2px; pointer-events:none; z-index:56; transform-origin:0 50%; background:linear-gradient(90deg, transparent, #e2e8f0); box-shadow:0 0 8px #e2e8f0;';
            document.body.appendChild(line);
            line.animate([{ transform: 'rotate(' + ang + 'deg) translateX(0)', opacity: 0.2 }, { transform: 'rotate(' + ang + 'deg) translateX(' + (len - 46) + 'px)', opacity: 1 }], { duration: INCOMING_MS, easing: 'cubic-bezier(0.5,0,0.9,0.6)', fill: 'forwards' });
            demoAfter(INCOMING_MS + 20, () => line.remove());
        });
    }
    // 旧版基线：复刻正式版 createFloatingText(-N, text-rose-500) + .shake 0.4s + 单层血条 300/500ms 过渡 + atk2 近似音
    function legacyFeedback(list) {
        const tools = window.__hitDemoTools;
        list.forEach(r => {
            const dom = getEntitySpriteDom(r.targetId); if (!dom) return;
            const rect = dom.getBoundingClientRect();
            const f = document.createElement('div');
            f.setAttribute('data-arcane-fx', 'demo-legacy');
            f.className = 'text-sm sm:text-2xl font-bold text-rose-500';
            f.style.cssText = 'position:fixed; pointer-events:none; z-index:60; white-space:nowrap; text-shadow:0 2px 4px rgba(0,0,0,0.8); left:' + (rect.left + rect.width / 2 + (Math.random() - 0.5) * 40) + 'px; top:' + rect.top + 'px;';
            f.textContent = r.hpDmg > 0 ? '-' + r.hpDmg : (r.shieldDmg > 0 ? '-' + r.shieldDmg + ' 破盾' : '-0');
            document.body.appendChild(f);
            f.animate([{ opacity: 0, transform: 'translateY(5px) scale(0.8)' }, { opacity: 1, transform: 'translateY(-10px) scale(1.2)', offset: 0.2 }, { opacity: 1, transform: 'translateY(-20px) scale(1)', offset: 0.8 }, { opacity: 0, transform: 'translateY(-30px) scale(0.8)' }], { duration: 1000, easing: 'ease-out', fill: 'forwards' });
            demoAfter(1200, () => f.remove());
            dom.animate([{ translate: '0 0' }, { translate: '-3px 0', rotate: '-1deg', offset: 0.25 }, { translate: '3px 0', rotate: '1deg', offset: 0.5 }, { translate: '-3px 0', rotate: '-0.5deg', offset: 0.75 }, { translate: '0 0' }], { duration: 400, easing: 'ease-in-out' });
            const bar = document.getElementById(r.targetId + '-hp-bar'), ghost = document.getElementById(r.targetId + '-hp-ghost');
            if (ghost) ghost.style.display = 'none';   // 旧版无残影
            if (bar) { bar.style.transition = 'width ' + (r.targetId.startsWith('h') ? 300 : 500) + 'ms ease-out'; bar.style.width = Math.max(0, r.hpAfter / r.maxHp * 100) + '%'; }
        });
        tools.click(0, 0.6, 3200); tools.kick(0, { hi: 200, lo: 70, pd: 0.03, dur: 0.16, vol: 0.55, drive: 3 });
    }

    function lockCards(locked) { document.querySelectorAll('#skill-list .card').forEach(card => { card.disabled = locked; }); }
    function clearDemo() {
        combatToken++;
        demoTimers.forEach(clearTimeout); demoTimers = [];
        clearTimeout(unlockTimer); unlockTimer = null;
        activeHandles = [];
        clearArcaneFx();
        document.querySelectorAll('[data-arcane-fx^="demo-"]').forEach(el => el.remove());
        cancelAnimationFrame(fxEngine.animationFrameId); fxEngine.animationFrameId = null;
        fxEngine.particles.length = 0; fxEngine.hitStop = 0; fxEngine.lastFrameTime = 0;
        fxEngine.ctx.clearRect(0, 0, fxEngine.canvas.width, fxEngine.canvas.height);
    }
    function setStatus(text) { const s = document.getElementById('hit-status'); if (s) s.textContent = text; }
    function playScene(scene) {
        clearDemo();
        initUI(scene.init);                     // 点击前恢复该场景初值，血条立即到位
        setStatus(scene.name);
        const gap = scene.gap || 0;
        let t = 0;
        scene.beats.forEach((beat, i) => {
            const targets = beat.map(s => s.t);
            const from = scene.from || (targets[0].startsWith('h') ? ATK : HERO_ATK);
            const start = i === 0 ? 0 : t;
            demoAfter(start, () => incoming(from, targets));
            demoAfter(start + INCOMING_MS, () => {
                const list = beat.map(settle);
                if (scene.legacy) { refreshText(list); legacyFeedback(list); }
                else activeHandles.push(playHitFeedback(list, { onBeat: refreshText }));
            });
            t = start + INCOMING_MS + gap;
        });
        const total = t + 1300;
        lockCards(true);
        unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, total);
    }
    function renderSkillCards() {
        const list = $('#skill-list');
        list.replaceChildren();
        SCENES.forEach(scene => {
            const button = document.createElement('button');
            button.className = 'card w-full py-1.5 px-2 bg-slate-900/80 hover:bg-violet-950/60 border border-slate-700/80 hover:border-violet-500/60 rounded-lg text-left transition-all shadow-sm';
            button.innerHTML = '<div class="flex items-center justify-between gap-1"><span class="text-xs font-bold text-slate-100"></span><span class="text-[9px] font-bold px-1 rounded border border-cyan-500/60 text-cyan-300"></span></div><div class="text-[9px] text-slate-400 truncate"></div>';
            const labels = button.querySelectorAll('span');
            labels[0].textContent = scene.name;
            labels[1].textContent = scene.level;
            button.lastElementChild.textContent = scene.desc;
            button.addEventListener('click', () => playScene(scene));
            list.appendChild(button);
        });
    }
    function resetDemo() {
        clearDemo();
        initUI();
        setStatus('已重置');
        renderSkillCards();
    }
    $('#btn-reset').addEventListener('click', resetDemo);
    renderSkillCards();
    window.__hitDemo = { SCENES, playScene, resetDemo };
    // ===== 演示控制 END =====
    // 移植：只将新增 arcane- CSS、技能函数、标签与分派合并到正式版已有模块。
    // 必须同时追加 WEBM_FX_REGISTRY 的 { url: '', scale: 1.0, particles: 'arcane', delay: 蓄势秒数 }。
    // 技能数据追加 [特效:精确标签]；按技能类型核对默认光效去重与真实反应回调，不改数值规则。
    // 详细接线、测试与打包步骤见《技能SVG模板使用与快速移植.md》，不是复制整页即可上线。
    // 正式版已提供 fxEngine / combatToken / getEntitySpriteDom / heroesData / enemiesData，勿重复复制演示宿主。
  </script>
