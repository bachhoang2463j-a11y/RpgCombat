                { name: '群雷·我方施放·混合命中', level: 'L2+', description: '跨前后排4敌，e2/e5支路偏落旁侧', scope: 'aoe', subtype: '雷', casterId: 'h3', targetIds: ['e1', 'e2', 'e4', 'e5'], outcomes: { e1: 'hit', e2: 'dodge', e4: 'hit', e5: 'dodge' } },
                { name: '群爆·2目标跨行', level: 'L2+', description: '仅选后排e1+前排e5，验证unionRect自适应', scope: 'aoe', subtype: '爆炸', casterId: 'h4', targetIds: ['e1', 'e5'] },
                { name: '群雷·2目标跨端', level: 'L2+', description: '仅选左右两端h1+h4，验证稀疏目标电网', scope: 'aoe', subtype: '雷', casterId: 'e5', targetIds: ['h1', 'h4'] },
                { name: '连发并发·多轴压测', level: '压测', description: '连续并发3发不同轴攻击（可点右上重置打断）', concurrentDemo: true }
            ]
        }
    ];
    const CARDS = DEMO_GROUPS.flatMap(g => g.items);
    let unlockTimer = null;
    const legacyLayers = new Set(), legacyTimers = new Set();
    const beatStatEl = $('#identity-beat-stat');
    const sfxBtn = $('#btn-identity-sfx');

    function clearLegacyDemoFx() {
        legacyTimers.forEach(id => clearTimeout(id)); legacyTimers.clear();
        legacyLayers.forEach(d => d.remove()); legacyLayers.clear();
    }
    function renderSfxBtn() {
        sfxBtn.textContent = hostSfxOn ? '🔊 音开' : '🔇 音关';
        sfxBtn.setAttribute('aria-pressed', String(hostSfxOn));
        sfxBtn.className = 'text-[9px] font-bold px-1.5 rounded border transition-all hover:bg-white/10 shrink-0 ' + (hostSfxOn ? 'border-emerald-500/60 text-emerald-300' : 'border-slate-600 text-slate-400');
    }
    sfxBtn.addEventListener('click', () => {
        hostSfxOn = !hostSfxOn;
        arcaneVfxModule.setIdentitySfx(hostSfxOn);
        if (!hostSfxOn) window.stopIdentityHostAudio();
        renderSfxBtn();
    });
    renderSfxBtn();

    function playLegacyGunDemo(kind, targetDom) {
        if (!targetDom) return 0;
        const r = targetDom.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
        const uid = Date.now() + Math.floor(Math.random() * 10000);
        const wrap = document.createElement('div');
        wrap.style.cssText = `position:fixed;left:${x}px;top:${y}px;z-index:95;pointer-events:none;transform:translate(-50%,-50%);`;
        if (kind === 'gunshot') {
            window.playRandomStandardGunshot();
            wrap.style.width = '140px'; wrap.style.height = '140px';
            wrap.innerHTML = `<svg viewBox="0 0 100 100" class="w-full h-full" style="animation:arcane-identity-shock-ring 0.28s ease-out both;"><circle cx="50" cy="50" r="22" stroke="#fef08a" stroke-width="3" fill="none"/></svg><div class="absolute inset-0" style="animation:arcane-identity-gun-flash 0.32s ease-out both;"><svg viewBox="0 0 100 100" class="w-full h-full arcane-identity-glow-amber"><polygon points="50,15 56,40 85,50 56,60 50,85 44,60 15,50 44,40" fill="#fde047"/><circle cx="50" cy="50" r="14" fill="#fff"/></svg></div>`;
        } else {
            window.playShotgunSound();
            const pts = [{ x: -28, y: -22, r: 8, d: 0.03 }, { x: 14, y: -30, r: 9, d: 0.05 }, { x: 26, y: 12, r: 7.5, d: 0.04 }, { x: -12, y: 24, r: 8.5, d: 0.06 }, { x: 2, y: -4, r: 11, d: 0.02 }, { x: -32, y: 8, r: 7, d: 0.07 }];
            wrap.innerHTML = `<div style="position:absolute;left:0;top:0;width:200px;height:200px;transform:translate(-50%,-50%);animation:arcane-identity-gun-flash 0.32s ease-out both;"><svg viewBox="0 0 200 200" class="w-full h-full arcane-identity-glow-amber"><polygon points="100,20 118,65 175,45 135,92 190,100 135,115 170,155 118,135 100,185 82,135 30,155 65,115 10,100 65,92 25,45 82,65" fill="#f97316"/><circle cx="100" cy="100" r="26" fill="#fff"/></svg></div>` + pts.map(p => `<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:${p.r * 5}px;height:${p.r * 5}px;animation:arcane-identity-puncture 0.38s ${p.d}s both;"><svg viewBox="0 0 60 60" class="w-full h-full arcane-identity-glow-amber"><polygon points="30,8 33,26 50,30 33,34 30,52 27,34 10,30 27,26" fill="#fff"/><circle cx="30" cy="30" r="7" fill="#f97316"/></svg></div>`).join('');
        }
        document.body.appendChild(wrap);
        legacyLayers.add(wrap);
        const tid = setTimeout(() => { legacyTimers.delete(tid); legacyLayers.delete(wrap); wrap.remove(); }, 550);
        legacyTimers.add(tid);
        return 550;
    }

    function lockCards(locked) {
        document.querySelectorAll('#skill-list .card').forEach(card => { card.disabled = locked; });
    }
    async function playDemoSkill(card) {
        combatToken++;
        const token = combatToken;
        clearArcaneFx();
        clearLegacyDemoFx();
        clearTimeout(unlockTimer);
        lockCards(true);
        beatStatEl.textContent = card.legacy ? '旧版无拍点' : '演出中…';
        try { await ensureHostGunSamples(); } catch {}
        if (token !== combatToken) return null;

        const entities = heroesData.concat(enemiesData);
        const byId = id => entities.find(e => e.id === id);

        if (card.legacy) {
            const ms = playLegacyGunDemo(card.legacy, getEntitySpriteDom(byId(card.targetIds[0])));
            unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, ms);
            return null;
        }

        const impactCounts = new Map();
        const onImpact = (target, info) => {
            if (token !== combatToken) return;
            const id = target && target.id ? target.id : '?';
            const n = (impactCounts.get(id) || 0) + 1;
            impactCounts.set(id, n);
            const total = impactCounts.size;
            beatStatEl.textContent = total > 1
                ? `${total}靶@${info.beatMs}ms`
                : `${id}:${info.outcome === 'dodge' ? '避' : '中'}@${info.beatMs}ms×${n}`;
        };

        if (card.concurrentDemo) {
            const h1 = arcaneVfxModule.playAttackIdentityFx({ scope: 'single', subtype: '枪击', caster: byId('h2'), targets: [byId('e4')], outcomes: { e4: 'hit' }, onImpact });
            const tid1 = setTimeout(() => {
                legacyTimers.delete(tid1); if (token !== combatToken) return;
                arcaneVfxModule.playAttackIdentityFx({ scope: 'single', subtype: '光', caster: byId('h1'), targets: [byId('e6')], outcomes: { e6: 'hit' }, onImpact });
            }, 160);
            const tid2 = setTimeout(() => {
                legacyTimers.delete(tid2); if (token !== combatToken) return;
                arcaneVfxModule.playAttackIdentityFx({ scope: 'single', subtype: '雷', caster: byId('e5'), targets: [byId('h3')], outcomes: { h3: 'dodge' }, onImpact });
            }, 320);
            legacyTimers.add(tid1); legacyTimers.add(tid2);
            unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, 1050);
            return h1;
        }

        const caster = byId(card.casterId);
        const targets = card.targetIds.map(byId).filter(Boolean);
        const handle = arcaneVfxModule.playAttackIdentityFx({
            scope: card.scope, subtype: card.subtype, caster, targets, outcomes: card.outcomes, onImpact
        });
        if (handle && handle.doneAt > Date.now()) {
            unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, handle.doneAt - Date.now());
        } else {
            lockCards(false);
        }
        return handle;
    }
    function renderSkillCards() {
        const list = $('#skill-list');
        list.replaceChildren();
        DEMO_GROUPS.forEach(group => {
            const hd = document.createElement('div');
            hd.className = 'arcane-identity-group-hd';
            hd.innerHTML = `<span>${group.title}</span><span class="text-[8px] text-cyan-400/80">${group.badge}</span>`;
            list.appendChild(hd);
            group.items.forEach(card => {
                const button = document.createElement('button');
                button.className = 'card w-full py-1.5 px-2 bg-slate-900/80 hover:bg-violet-950/60 border border-slate-700/80 hover:border-violet-500/60 rounded-lg text-left transition-all shadow-sm';
                button.title = card.description;
                button.innerHTML = '<div class="flex items-center justify-between gap-1"><span class="text-xs font-bold text-slate-100 truncate"></span><span class="text-[9px] font-bold px-1 rounded border border-cyan-500/60 text-cyan-300 shrink-0"></span></div><div class="text-[9px] text-slate-400 truncate"></div>';
                const labels = button.querySelectorAll('span');
                labels[0].textContent = card.name;
                labels[1].textContent = card.level;
                if (card.level === '旧版') labels[1].className = 'text-[9px] font-bold px-1 rounded border border-slate-500/60 text-slate-300 shrink-0';
                else if (card.level === '闪避') labels[1].className = 'text-[9px] font-bold px-1 rounded border border-amber-500/60 text-amber-300 shrink-0';
                button.lastElementChild.textContent = card.description;
                button.addEventListener('click', () => playDemoSkill(card));
                list.appendChild(button);
            });
        });
    }
    function resetDemo() {
        combatToken++;
        clearTimeout(unlockTimer); unlockTimer = null;
        clearLegacyDemoFx();
        clearArcaneFx();
        cancelAnimationFrame(fxEngine.animationFrameId); fxEngine.animationFrameId = null;
        fxEngine.particles.length = 0; fxEngine.hitStop = 0; fxEngine.lastFrameTime = 0;
        fxEngine.ctx.clearRect(0, 0, fxEngine.canvas.width, fxEngine.canvas.height);
        beatStatEl.textContent = '待机';
        initUI();
        renderSkillCards();
    }
    $('#btn-reset').addEventListener('click', resetDemo);
    renderSkillCards();
    // ===== 演示控制 END =====
    // 移植：只将新增 arcane- CSS、技能函数、标签与分派合并到正式版已有模块。
    // 必须同时追加 WEBM_FX_REGISTRY 的 { url: '', scale: 1.0, particles: 'arcane', delay: 蓄势秒数 }。
    // 技能数据追加 [特效:精确标签]；按技能类型核对默认光效去重与真实反应回调，不改数值规则。
    // 详细接线、测试与打包步骤见《技能SVG模板使用与快速移植.md》，不是复制整页即可上线。
    // 正式版已提供 fxEngine / combatToken / getEntitySpriteDom / heroesData / enemiesData，勿重复复制演示宿主。
  </script>
</body>
