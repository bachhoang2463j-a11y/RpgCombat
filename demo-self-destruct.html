<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SVG 技能演练 · 自爆收尾批（预警-失稳-聚能-爆发）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; overflow: hidden; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; overflow: hidden; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    @keyframes arcane-sd-warn-pulse { 0%,100% { opacity: 0.24; transform: translate(-50%,-50%) scale(0.95); } 50% { opacity: 0.62; transform: translate(-50%,-50%) scale(1.04); } }
    @keyframes arcane-sd-dying-tremble { 0%,100% { transform: translate(-50%,-50%) translate3d(0,1px,0) rotate(0deg); } 25% { transform: translate(-50%,-50%) translate3d(-2.5px,2px,0) rotate(-1.5deg); } 70% { transform: translate(-50%,-50%) translate3d(2px,3px,0) rotate(1.4deg); } }
    @keyframes arcane-sd-gather-pulse { 0%,100% { transform: translate(-50%,-50%) scale(0.98); opacity: 0.92; } 50% { transform: translate(-50%,-50%) scale(1.04); opacity: 1; } }
    @keyframes arcane-sd-crit-flicker { 0%,49% { opacity: 1; filter: brightness(1.45) contrast(1.2); } 50%,100% { opacity: 0.72; filter: brightness(2.05) contrast(1.35); } }
    @keyframes arcane-sd-crit-snap { 0% { transform: translate(-50%,-50%) scale(1.05); } 65% { transform: translate(-50%,-50%) scale(0.84); } 100% { transform: translate(-50%,-50%) scale(0.96); } }
    @keyframes arcane-sd-kanpo-fall { 0% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 35% { transform: translate(-50%,-50%) scale(0.92,0.88); opacity: 0.95; } 100% { transform: translate(-50%,-50%) translateY(20px) scale(1.12,0.34); opacity: 0; } }
    @keyframes arcane-sd-subdue-press { 0% { transform: translate(-50%,-50%) translateY(-10px) scale(1.06,1.06); } 45% { transform: translate(-50%,-50%) translateY(14px) scale(1.14,0.62); } 100% { transform: translate(-50%,-50%) translateY(11px) scale(1.1,0.68); } }
    @keyframes arcane-sd-shock-ellipse { 0% { transform: translate(-50%,-50%) scale(0.2,0.16); opacity: 0.95; } 100% { transform: translate(-50%,-50%) scale(4.8,1.55); opacity: 0; } }
    @keyframes arcane-sd-flame-lick { 0%,100% { transform: translateY(0) scaleY(1) scaleX(1); opacity: 0.88; } 50% { transform: translateY(-4px) scaleY(1.16) scaleX(0.93); opacity: 1; } }
    @keyframes arcane-sd-venom-pulse { 0%,100% { transform: scale(0.96); opacity: 0.78; } 50% { transform: scale(1.08); opacity: 0.98; } }
    .arcane-selfdestruct-warn { position: absolute; left: 50%; top: 50%; pointer-events: none; z-index: 3; will-change: transform, opacity; animation: arcane-sd-warn-pulse 3.4s ease-in-out infinite; }
    .arcane-selfdestruct-warn-cracks { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .arcane-selfdestruct-badge { position: absolute; top: -6px; right: -8px; z-index: 6; font-size: 9px; line-height: 1; font-weight: 800; padding: 2px 5px; border-radius: 999px; border: 1px solid currentColor; background: rgba(9,13,24,0.88); backdrop-filter: blur(4px); white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.65); }
    .arcane-selfdestruct-host-corpse .arcane-selfdestruct-hp-bar { opacity: 0.14 !important; transition: opacity 0.25s ease; }
    .arcane-selfdestruct-sprite-subdued { filter: saturate(0.32) brightness(0.76) !important; transform: translateY(10px) scale(1.08, 0.7) !important; opacity: 0.78; transition: transform 0.25s ease, filter 0.25s ease, opacity 0.25s ease; }
    .arcane-selfdestruct-stage { position: fixed; transform: translate(-50%,-50%); pointer-events: none; z-index: 54; will-change: transform, opacity; }
    .arcane-selfdestruct-dying-visual { filter: saturate(0.28) brightness(0.84); transition: filter 0.32s ease; }
    .arcane-selfdestruct-crit-flash { animation: arcane-sd-crit-flicker 0.11s steps(1) infinite !important; }
    /* Demo 与狂暴/充能共存样式（与 demo-variant-triggers 同源语言，用于对照演示） */
    .arcane-variant-rage-sprite { filter: drop-shadow(0 0 7px rgba(239,68,68,0.85)) drop-shadow(0 0 18px rgba(185,28,28,0.55)); }
    .arcane-variant-rage-fx { position: absolute; inset: -24px -28px; pointer-events: none; z-index: -1; border-radius: 999px; background: radial-gradient(ellipse at 50% 62%, rgba(239,68,68,0.34) 0%, rgba(185,28,28,0.16) 52%, transparent 74%); }
    .charge-full-danger { filter: drop-shadow(0 0 18px rgba(244,63,94,0.88)); }
    .arcane-selfdestruct-group-hd { font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em; color: #cbd5e1; padding: 3px 6px 2px; margin-top: 2px; border-bottom: 1px solid rgba(148,163,184,0.18); display: flex; justify-content: space-between; align-items: center; }
    .arcane-selfdestruct-float { position: fixed; transform: translate(-50%,-50%); pointer-events: none; z-index: 80; font-weight: 900; font-size: 12px; text-shadow: 0 2px 6px #000, 0 0 8px rgba(0,0,0,0.9); animation: arcane-sd-float-up 0.85s ease-out forwards; white-space: nowrap; }
    @keyframes arcane-sd-float-up { 0% { opacity: 0; transform: translate(-50%,-30%) scale(0.85); } 20% { opacity: 1; transform: translate(-50%,-60%) scale(1.05); } 100% { opacity: 0; transform: translate(-50%,-155%) scale(0.95); } }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->
  <div class="absolute top-2 sm:top-4 right-2 sm:right-4 z-[115] flex gap-1.5 sm:gap-2">
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-violet-400 hover:text-violet-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📚</span> <span class="hidden sm:inline">世界书</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-purple-400 hover:text-purple-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📜</span> <span class="hidden sm:inline">记录</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-400 hover:text-blue-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔲</span> <span class="hidden sm:inline">全屏</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>💬</span> <span class="hidden sm:inline">对话</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-yellow-500 hover:text-yellow-400 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>⚙️</span> <span class="hidden sm:inline">设置</span></button>
    <button id="btn-reset" class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-emerald-400 hover:text-emerald-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔄</span> <span class="hidden sm:inline">重置</span></button>
  </div>

  <!-- 全屏战场区域 -->
  <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-800 to-emerald-900 overflow-hidden z-0" id="battle-scene">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-0"></div>
    <div class="absolute left-1 sm:left-4 md:left-6 top-16 sm:top-20 bottom-44 sm:bottom-48 w-12 sm:w-14 z-30 flex flex-col items-center select-none">
      <div class="relative w-full h-full flex flex-col items-center">
        <div class="timeline-rail"><div class="rail-pulse-beam"></div></div>
        <div id="turn-order-container" class="relative w-full h-full flex flex-col gap-2 sm:gap-2.5 items-center overflow-y-auto no-scrollbar mask-fade-y py-3"></div>
      </div>
    </div>
    <div id="enemies-container" class="absolute left-2 sm:left-6 right-2 sm:right-6 top-[10%] bottom-[190px] sm:bottom-[220px] z-10 flex flex-col items-center justify-start gap-6 overflow-visible pointer-events-none"></div>
  </div>

  <!-- 悬浮 UI 层 -->
  <div class="absolute bottom-[52px] left-0 w-full p-1.5 sm:p-6 flex flex-col-reverse sm:flex-row items-end justify-between gap-1.5 sm:gap-4 z-20 pointer-events-none pb-2 sm:pb-6">
    <div id="heroes-container" class="w-full sm:flex-1 grid grid-cols-4 gap-1 sm:gap-4 max-w-2xl pointer-events-auto relative"></div>
    <div class="relative self-end">
      <div id="menu-container" class="w-[278px] sm:w-[296px] h-[206px] bg-slate-950/95 backdrop-blur-xl rounded-xl border border-slate-700/80 border-t-2 border-t-rose-500/80 flex flex-col overflow-hidden relative shadow-[0_15px_35px_rgba(0,0,0,0.9)] pointer-events-auto self-end mb-1 sm:mb-0">
        <div class="px-2 py-1 bg-gradient-to-r from-rose-950/60 via-slate-900/90 to-slate-950 border-b border-rose-900/40 flex justify-between items-center gap-1 shrink-0">
          <div class="flex items-center gap-1.5 min-w-0"><span class="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse shrink-0"></span><span class="text-[11px] font-bold text-rose-200 truncate">自爆演练</span></div>
          <div class="flex items-center gap-1 shrink-0">
            <span id="sd-beat-stat" class="text-[9px] font-mono text-amber-300 px-1 py-0.5 rounded bg-slate-900/80 border border-slate-700/70">就绪</span>
            <button id="btn-sd-badge" type="button" class="text-[9px] px-1.5 py-0.5 rounded border border-slate-600/80 text-slate-300 bg-slate-900/80 hover:bg-slate-800" title="切换存活期文字角标显隐">角标:关</button>
            <button id="btn-sd-sfx" type="button" class="text-[9px] px-1.5 py-0.5 rounded border border-cyan-500/60 text-cyan-300 bg-cyan-950/40 hover:bg-cyan-900/50" title="开关合成音效">🔊</button>
          </div>
        </div>
        <div id="skill-list" class="flex-1 flex flex-col gap-1 p-1 overflow-y-auto custom-scrollbar"></div>
      </div>
    </div>
  </div>

  <!-- 底部对话栏（复刻主界面，仅装饰） -->
  <div id="chat-bar" class="absolute bottom-0 left-0 right-0 h-[52px] z-30 flex items-center gap-2 px-2 sm:px-3 bg-black/60 border-t border-white/5">
    <div class="w-9 h-9 rounded-full bg-slate-700 border border-white/20 shrink-0 flex items-center justify-center">🕵️</div>
    <input type="text" placeholder="说点什么... (Enter发送)" class="flex-1 h-9 rounded-full px-4 text-sm outline-none">
    <span class="px-3 py-1 rounded-full text-xs font-bold border border-emerald-500/60 text-emerald-300 bg-emerald-950/50">友方旁白 ON</span>
    <span class="px-3 py-1 rounded-full text-xs font-bold border border-rose-500/60 text-rose-300 bg-rose-950/50">敌方旁白 ON</span>
    <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">➤</div>
  </div>
 </div>
  <script>
    // ===== 演示宿主 BEGIN：占位数据、渲染、fxEngine；不移植到正式版 =====
    const $ = s => document.querySelector(s);
    let combatToken = 0;
    let heroesData = [], enemiesData = [];
    const HERO_AVATARS = {
        '埃利奥特': 'https://imgur.la/images/2026/06/25/31a4dd84a831e3f76082542bf12fcf19.png',
        '弗兰克': 'https://imgur.la/images/2026/06/25/26f001dbe399876cd74978bbe12a265b.png',
        '玛德琳': 'https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png',
        '索恩': 'https://imgur.la/images/2026/08/13/77fcdf0fd006c4ff1ccae30774322270.png'
    };
    const HERO_DATA = [['h1', '埃利奥特', '👨', 100, 55, 110, 5], ['h2', '弗兰克', '🧔', 180, 0, 17, 0], ['h3', '玛德琳', '👩', 140, 0, 14, 0], ['h4', '索恩', '🕵️', 140, 0, 20, 0]];
    const ENEMY_ROWS = [[['e1', '🐟'], ['e2', '❄️'], ['e3', '🐟']], [['e4', '👻'], ['e5', '👻'], ['e6', '🌀']]];

function createCompactBarHTML(id, type, label, val, max, colorClass, isTp = false, shield = 0) {
  const pct = Math.max(0, Math.min(100, (val / max) * 100)); const barWidthClass = isTp ? 'w-1/3' : 'w-full';
  const shieldText = shield > 0 && type === 'hp' ? `<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾${shield})</span>` : '';
  let finalColor = colorClass; let extraClass = ''; if (isTp && val >= max) { finalColor = 'bg-amber-400'; extraClass = 'shadow-[0_0_10px_rgba(251,191,36,0.8)] animate-pulse'; }
  return `<div class="relative pt-1.5 sm:pt-2.5 mb-0 sm:mb-[2px]"><span id="${id}-${type}-text" class="absolute right-0 top-0 text-[8px] sm:text-xs font-mono font-bold text-white leading-none text-outline z-10 whitespace-nowrap">${Math.floor(val)}${shieldText}</span><div class="flex items-center gap-1 sm:gap-1.5"><span class="text-[7px] sm:text-[10px] font-bold text-gray-200 leading-none text-outline w-3 sm:w-4">${label}</span><div class="flex-grow h-1 sm:h-1.5 bg-[#222] rounded-[1px] overflow-hidden border border-[#111]"><div id="${id}-${type}-bar" class="${barWidthClass} h-full ${finalColor} ${extraClass} transition-all duration-300 ease-out" style="width: ${pct}%"></div></div></div></div>`;
}

function getEntitySpriteDom(entityOrId){
  const id = entityOrId && typeof entityOrId === 'object' ? entityOrId.id : String(entityOrId||'');
  if(!id) return null;
  return document.getElementById(`hero-card-${id}`) || document.getElementById(`${id}-sprite`) || document.getElementById(`hero-wrap-${id}`) || null;
}
window.getEntitySpriteDom = getEntitySpriteDom;

    function renderDemoEntityBuffs(id, buffs = []) {
        const el = document.getElementById(`${id}-buffs`);
        if (!el) return;
        const map = { '燃烧': ['🔥燃烧', 'border-orange-500/70 text-orange-200 bg-orange-950/80'], '中毒': ['🧪中毒', 'border-purple-500/70 text-purple-200 bg-purple-950/80'], '狂暴': ['💢狂暴', 'border-red-500/70 text-red-200 bg-red-950/80'], '充能': ['⚡充能满', 'border-rose-400/80 text-rose-200 bg-rose-950/85'], '制服': ['🔒已按伏', 'border-slate-400/70 text-slate-200 bg-slate-900/90'] };
        el.innerHTML = buffs.map(b => {
            const [txt, cls] = map[b] || [b, 'border-slate-500/70 text-slate-200 bg-slate-900/85'];
            return `<span class="px-1 py-0.5 rounded text-[8px] font-bold border leading-none shadow ${cls}">${txt}</span>`;
        }).join('');
    }
    function initUI(init = {}) {
        const defaultEnemies = { e1: { form: '群伤' }, e4: { form: '群火' }, e5: { form: '群毒' }, e6: { form: '群穿' } };
        const ec = init.enemies || defaultEnemies;
        heroesData = HERO_DATA.map(([id, name, face, hp, shield, mp, tp]) => ({ id, name, face, img: HERO_AVATARS[name] || '', hp, maxHp: hp, shield, mp, maxMp: mp, tp, maxTp: 100, isAlive: true, buffs: [] }));
        enemiesData = ENEMY_ROWS.flat().map(([id, face]) => {
            const cfg = ec[id] || {};
            const buffs = [];

    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }
}

                { id: 'o-fail', name: '敏捷对抗失败 · 挣脱转爆发', level: 'FAIL', description: '聚能中对抗失利短促一顿后继续进入临界并完整引爆', enemyId: 'e1', form: '群伤', outcome: 'contest_fail', windupMs: W_STD, interruptAtMs: 740, outcomes: ALL_HIT, meta: { accentColor: '#ef4444', hasDirectDamage: true } }
            ]
        },
        {
            title: '五 · 链式串行与并发压测',
            items: [
                { id: 'c-chain', name: '链式串行 · 双尸依次自爆', level: 'SEQ', description: 'e1(群伤) 完播收尾后 e5(群毒) 才启前摇，绝不双爆共震', kind: 'chain', chain: [{ enemyId: 'e1', form: '群伤', outcome: 'explode', windupMs: W_STD, outcomes: ALL_HIT }, { enemyId: 'e5', form: '群毒', outcome: 'explode', windupMs: W_STD, outcomes: ALL_HIT }] },
                { id: 's-reset', name: '压测①：前摇聚能中强制重置', level: 'TEST', description: '聚能第 350ms 自动重置清场，核查零残留层与回调', kind: 'stress-reset', enemyId: 'e4', form: '群火', windupMs: W_STD },
                { id: 's-conc', name: '压测②：前摇中叠加普通火球', level: 'TEST', description: 'e5 聚能读条同时 h1 对 e2 放火球，验证互不误清', kind: 'stress-concurrent', enemyId: 'e5', form: '群毒', windupMs: W_STD, outcomes: ALL_HIT }
            ]
        }
    ];
    let unlockTimer = null, demoExtraTimers = [];
    const BEAT_TEXT = {
        unstable_start: '失稳 · 裂纹渗光', gather_start: '聚能 · 可打断窗', gather_window: '⚠ 看破/按住窗口开放',
        critical_start: '临界 · 频闪警报', critical_snap: '临界 · 收拍', burst_start: '爆发演出中',
        burst_end: '余韵消散 · 干净离场', kanpo_start: '看破压灭中', kanpo_suppressed: '看破成功 · 无爆',
        kanpo_done: '看破收束完成', subdue_start: '敏捷按住压制', subdued_locked: '已制服（无自爆）',
        contest_failed: '对抗失败 · 挣脱', chain_done: '双尸串行完成'
    };
    const setBeatStat = (text, cls = 'text-amber-300') => {
        const el = $('#sd-beat-stat'); if (!el) return;
        el.textContent = text;
        el.className = `text-[9px] font-mono px-1 py-0.5 rounded bg-slate-900/80 border border-slate-700/70 ${cls}`;
    };
    function spawnDemoFloat(dom, text, color = '#f8fafc') {
        if (!dom || !dom.isConnected) return;
        const r = dom.getBoundingClientRect(), d = document.createElement('div');
        d.className = 'arcane-selfdestruct-float';
        d.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height * 0.35}px;color:${color};`;
        d.textContent = text; document.body.appendChild(d);
        setTimeout(() => d.remove(), 860);
    }
    const mountLivingWarnings = () => enemiesData.forEach(e => { if (e.isAlive && !e.subdued && e.selfDestruct) setSelfDestructWarning(e, e.selfDestruct); });
    const lockCards = locked => document.querySelectorAll('#skill-list .card').forEach(c => { c.disabled = locked; });
    function scheduleUnlock(ms) {
        clearTimeout(unlockTimer);
        if (!ms || ms <= 0) { lockCards(false); return; }
        lockCards(true); unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, ms);
    }
    const clearDemoTimers = () => { demoExtraTimers.forEach(clearTimeout); demoExtraTimers = []; };
    function handleSdBeat(beat, info = {}) {
        if (BEAT_TEXT[beat]) {
            const cls = beat.includes('kanpo') ? 'text-amber-300' : beat.includes('subdue') ? 'text-cyan-300' : beat === 'burst_end' || beat === 'chain_done' ? 'text-emerald-300' : 'text-rose-300';
            setBeatStat(BEAT_TEXT[beat], cls);
        }
        const t = info.target, dom = t && getEntitySpriteDom(t);
        if (dom && beat === 'target_dodge') spawnDemoFloat(dom, '闪避', '#cbd5e1');
        else if (dom && beat === 'target_hit') spawnDemoFloat(dom, '受击', info.conf ? info.conf.soft : '#fca5a5');
        else if (dom && beat === 'target_attach') {
            const st = info.stateAttach || (info.conf && info.conf.stateAttach) || '异常';
            if (!t.buffs.includes(st)) { t.buffs.push(st); renderDemoEntityBuffs(t.id, t.buffs); }
            spawnDemoFloat(dom, st === '燃烧' ? '🔥燃烧' : '🧪中毒', info.conf ? info.conf.soft : '#fbbf24');
        }
        if (beat === 'subdued_locked' && info.entity && !info.entity.buffs.includes('制服')) {
            info.entity.buffs.push('制服'); renderDemoEntityBuffs(info.entity.id, info.entity.buffs);
        }
    }
    function playDemoCard(card) {
        combatToken++; clearDemoTimers(); clearTimeout(unlockTimer); clearArcaneFx();
        initUI(card.init || (card.enemyId ? { enemies: Object.assign({ e1: { form: '群伤' }, e4: { form: '群火' }, e5: { form: '群毒' }, e6: { form: '群穿' } }, { [card.enemyId]: { form: card.form } }) } : {}));
        mountLivingWarnings();
        if (card.kind === 'warn') { setBeatStat('存活期预警观察中', 'text-cyan-300'); lockCards(false); return null; }
        if (card.kind === 'warn-badge') {
            const next = setSelfDestructBadge(!getBadgeOn());
            $('#btn-sd-badge').textContent = next ? '角标:开' : '角标:关';
            setBeatStat(next ? '角标已开启对照' : '角标已隐藏（纯视觉）', 'text-amber-300');
            lockCards(false); return null;
        }
        if (card.kind === 'chain') {
            setBeatStat('串行排队中...', 'text-rose-300');
            const h = playSelfDestructChain(card.chain, handleSdBeat);
            if (h) scheduleUnlock(h.doneAt - Date.now()); return h;
        }
        if (card.kind === 'stress-reset') {
            const h = playSelfDestructSequence({ enemyId: card.enemyId, form: card.form, outcome: 'explode', windupMs: card.windupMs, outcomes: ALL_HIT }, handleSdBeat);
            scheduleUnlock(1100);
            demoExtraTimers.push(setTimeout(() => {
                resetDemo();
                const rem = document.querySelectorAll('.arcane-selfdestruct-stage, .arcane-fs-layer').length + S.handles.size;
                setBeatStat(`已中途重置 · 残留:${rem}`, rem === 0 ? 'text-emerald-300' : 'text-red-400');
            }, 750));
            return h;
        }
        if (card.kind === 'stress-concurrent') {
            const h = playSelfDestructSequence({ enemyId: card.enemyId, form: card.form, outcome: 'explode', windupMs: card.windupMs, outcomes: card.outcomes }, handleSdBeat);
            demoExtraTimers.push(setTimeout(() => { playDemoConcurrentCast(heroesData[0], enemiesData[1]); setBeatStat('前摇+火球并发中', 'text-amber-300'); }, 420));
            if (h) scheduleUnlock(h.doneAt - Date.now()); return h;
        }
        const delayMs = card.phase === 'alive' ? 320 : 0;
        if (delayMs) setBeatStat('存活预警 → 击杀触发', 'text-cyan-300');
        scheduleUnlock(delayMs + ((card.outcome === 'kanpo' || card.outcome === 'subdued') ? 1600 : 2250));
        demoExtraTimers.push(setTimeout(() => {
            const sp = getEntitySpriteDom(card.enemyId);
            if (delayMs && sp) spawnDemoFloat(sp, '击倒', '#f8fafc');
            const h = playSelfDestructSequence(card, handleSdBeat);
            if (h) scheduleUnlock(Math.max(200, h.doneAt - Date.now()));
        }, delayMs));
        return null;
    }
    function renderSkillCards() {
        const list = $('#skill-list'); list.replaceChildren();
        DEMO_GROUPS.forEach(group => {
            const hd = document.createElement('div'); hd.className = 'arcane-selfdestruct-group-hd'; hd.textContent = group.title;
            list.appendChild(hd);
            group.items.forEach(card => {
                const button = document.createElement('button');
                button.className = 'card w-full py-1 px-2 bg-slate-900/80 hover:bg-rose-950/50 border border-slate-700/80 hover:border-rose-500/60 rounded-lg text-left transition-all shadow-sm shrink-0';
                button.innerHTML = '<div class="flex items-center justify-between gap-1"><span class="text-[11px] font-bold text-slate-100 truncate"></span><span class="text-[8.5px] font-bold px-1 rounded border border-cyan-500/60 text-cyan-300 shrink-0"></span></div><div class="text-[9px] text-slate-400 truncate"></div>';
                const labels = button.querySelectorAll('span');
                labels[0].textContent = card.name; labels[1].textContent = card.level; button.lastElementChild.textContent = card.description;
                button.addEventListener('click', () => playDemoCard(card));
                list.appendChild(button);
            });
        });
    }
    function resetDemo() {
        combatToken++; clearDemoTimers(); clearTimeout(unlockTimer); unlockTimer = null; lockCards(false); clearArcaneFx();
        cancelAnimationFrame(fxEngine.animationFrameId); fxEngine.animationFrameId = null;
        fxEngine.particles.length = 0; fxEngine.hitStop = 0; fxEngine.lastFrameTime = 0;
        fxEngine.ctx.clearRect(0, 0, fxEngine.canvas.width, fxEngine.canvas.height);
        initUI(); mountLivingWarnings(); setBeatStat('就绪'); renderSkillCards();
    }
    $('#btn-sd-badge').addEventListener('click', () => { const n = setSelfDestructBadge(!getBadgeOn()); $('#btn-sd-badge').textContent = n ? '角标:开' : '角标:关'; setBeatStat(n ? '角标:开启对照' : '角标:关闭(纯视觉)', 'text-amber-300'); });
    $('#btn-sd-sfx').addEventListener('click', () => { $('#btn-sd-sfx').textContent = setSelfDestructSfx(!getSfxOn()) ? '🔊' : '🔇'; });
    $('#btn-reset').addEventListener('click', resetDemo);
    mountLivingWarnings(); renderSkillCards();
    // ===== 演示控制 END =====
    // 移植：只将新增 arcane- CSS、技能函数、标签与分派合并到正式版已有模块。
    // 必须同时追加 WEBM_FX_REGISTRY 的 { url: '', scale: 1.0, particles: 'arcane', delay: 蓄势秒数 }。
    // 技能数据追加 [特效:精确标签]；按技能类型核对默认光效去重与真实反应回调，不改数值规则。
    // 详细接线、测试与打包步骤见《技能SVG模板使用与快速移植.md》，不是复制整页即可上线。
    // 正式版已提供 fxEngine / combatToken / getEntitySpriteDom / heroesData / enemiesData，勿重复复制演示宿主。
  </script>
</body>
</html>
