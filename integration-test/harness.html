<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>RpgCombat ⇄ MiniMapStatus 战后直连 · 集成测试</title>
<style>
  body { margin:0; font:13px/1.6 Consolas,Menlo,monospace; background:#0b1020; color:#dbe4ff; }
  #bar { position:sticky; top:0; padding:10px 14px; background:#111936; border-bottom:1px solid #263056; display:flex; gap:12px; align-items:center; }
  button { padding:6px 14px; border-radius:8px; border:1px solid #4c5db0; background:#1b2550; color:#dbe4ff; cursor:pointer; font:inherit; }
  button:hover { background:#263569; }
  #stat { font-weight:700; }
  #log { margin:0; padding:12px 14px; white-space:pre-wrap; }
  .pass { color:#4ade80; }
  .fail { color:#f87171; }
  .info { color:#93a4d4; }
  .head { color:#fbbf24; font-weight:700; }
  #frames { display:flex; gap:8px; padding:0 14px 14px; }
  iframe { width:50%; height:760px; border:1px solid #263056; border-radius:8px; background:#000; }
</style>
</head>
<body>
<div id="bar">
  <button id="run">▶ 运行全部断言</button>
  <span id="stat" class="info">等待挂载两个应用…</span>
</div>
<pre id="log"></pre>
<div id="frames">
  <iframe id="mms" title="MiniMapStatus"></iframe>
  <iframe id="rpg" title="RpgCombat"></iframe>
</div>
<script>
/* ==========================================================================
   mock 酒馆助手环境
   - 按 message / chat / global 三种作用域实现变量存储，insertOrAssign 深合并、
     replaceVariables 整体替换（与真实语义一致，否则测不出"删不掉"类问题）
   - eventOn/eventEmit 在父页面共享，天然跨 iframe 分发
   - generateRaw 是带调用计数的桩：本特性的核心断言就是"计数为 0"
   ========================================================================== */
const MOCK = (function () {
  const store = { global: {}, chat: {}, message: {} };
  let chatMessages = [];
  const listeners = [];
  let genCount = 0;
  let genResponder = null;
  const worldbooks = { '测试角色卡': [] };

  const clone = (v) => (v === undefined ? v : JSON.parse(JSON.stringify(v)));
  const curId = () => chatMessages.length - 1;

  function bucket(opt) {
    const o = opt || {};
    if (o.type === 'message') {
      const id = o.message_id == null ? curId() : o.message_id;
      if (!store.message[id]) store.message[id] = {};
      return store.message[id];
    }
    if (o.type === 'chat') return store.chat;
    if (o.type === 'character') return store.global;
    return store.global;
  }
  function deepMerge(t, s) {
    for (const k of Object.keys(s || {})) {
      const v = s[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) {
        deepMerge(t[k], v);
      } else {
        t[k] = clone(v);
      }
    }
    return t;
  }
  function parseRange(range) {
    if (typeof range === 'number') return [range, range];
    const s = String(range == null ? curId() : range);
    const m = s.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m) return [parseInt(m[1], 10), parseInt(m[2], 10)];
    const n = parseInt(s, 10);
    return isNaN(n) ? [curId(), curId()] : [n, n];
  }

  const api = {
    tavern_events: { MESSAGE_RECEIVED: 'message_received', CHAT_CHANGED: 'chat_id_changed' },
    getVariables: (opt) => clone(bucket(opt)) || {},
    insertOrAssignVariables: (vars, opt) => { deepMerge(bucket(opt), vars); },
    setVariables: (vars, opt) => { deepMerge(bucket(opt), vars); },
    replaceVariables: (vars, opt) => {
      const b = bucket(opt);
      for (const k of Object.keys(b)) delete b[k];
      deepMerge(b, vars);
    },
    getCurrentMessageId: () => curId(),
    getLastMessageId: () => curId(),
    getCurrentMessage: () => clone(chatMessages[curId()] || null),
    getChatMessages: (range) => {
      const [a, b] = parseRange(range);
      const out = [];
      for (let i = a; i <= b; i++) if (chatMessages[i]) out.push(clone(chatMessages[i]));
      return out;
    },
    setChatMessages: (list) => {
      (list || []).forEach((m) => {
        if (m && m.message_id != null && chatMessages[m.message_id]) {
          chatMessages[m.message_id].message = m.message;
        }
      });
    },
    eventOn: (event, fn) => { listeners.push({ event, fn }); },
    eventOnce: (event, fn) => { listeners.push({ event, fn, once: true }); },
    eventEmit: (event, ...args) => {
      listeners.slice().forEach((l) => {
        if (l.event !== event) return;
        if (l.once) listeners.splice(listeners.indexOf(l), 1);
        try { l.fn(...args); } catch (e) { console.error('[mock] listener error', e); }
      });
    },
    generateRaw: async (cfg) => {
      genCount++;
      lastGenPrompt = ((cfg && cfg.ordered_prompts) || []).map((p) => p.content).join('\n---\n');
      if (typeof genResponder === 'function') return genResponder(cfg);
      throw new Error('mock generateRaw 未设置响应器');
    },
    triggerSlash: () => {},
    getCurrentCharacterName: () => '测试角色卡',
    getCharWorldbookNames: () => ({ primary: '测试角色卡', additional: [] }),
    getWorldbookNames: () => Object.keys(worldbooks),
    getWorldbook: (name) => clone(worldbooks[name] || []),
    createWorldbook: (name) => { worldbooks[name] = worldbooks[name] || []; return true; },
    rebindCharWorldbooks: () => true,
    createWorldbookEntries: (name, entries) => {
      worldbooks[name] = (worldbooks[name] || []).concat(clone(entries));
      return true;
    },
    updateWorldbookWith: (name, fn) => {
      worldbooks[name] = clone(fn(clone(worldbooks[name] || [])));
      return true;
    },
  };
  let lastGenPrompt = '';
  return {
    api,
    store,
    worldbooks,
    setChat: (list) => { chatMessages = clone(list); },
    reset: () => {
      store.global = {}; store.chat = {}; store.message = {};
      listeners.length = 0; genCount = 0; genResponder = null; lastGenPrompt = '';
    },
    resetVars: () => { store.chat = {}; store.message = {}; },
    genCount: () => genCount,
    resetGenCount: () => { genCount = 0; },
    setGenResponder: (fn) => { genResponder = fn; },
    lastGenPrompt: () => lastGenPrompt,
  };
})();
window.__MOCK = MOCK;

/* ---------------- 日志与断言 ---------------- */
const logEl = document.getElementById('log');
let passN = 0, failN = 0;
function out(cls, text) {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = text + '\n';
  logEl.appendChild(span);
}
function head(t) { out('head', '\n== ' + t + ' =='); }
function ok(name, extra) { passN++; out('pass', '  ✓ ' + name + (extra ? '  ' + extra : '')); }
function bad(name, extra) { failN++; out('fail', '  ✗ ' + name + (extra ? '  ' + extra : '')); }
function check(cond, name, extra) { cond ? ok(name) : bad(name, extra); }
function eq(actual, expect, name) {
  const a = JSON.stringify(actual), e = JSON.stringify(expect);
  a === e ? ok(name) : bad(name, '期望 ' + e + '，实际 ' + a);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
/* ---------------- 挂载两个应用 ----------------
   把 mock 接口注入到 iframe 的全局作用域：srcdoc 与父页同源，
   引导脚本插在 <head> 之后，保证在应用自身脚本之前执行。
   就绪判定用轮询而不是 load 事件：两侧都挂了 CDN 资源与音视频，
   load 可能长时间不触发（interactive 阶段脚本其实已执行完） */
async function mountFrame(frameId, url, baseHref, readyProbe) {
  const html = await (await fetch(url, { cache: 'reload' })).text();
  const boot =
    '<base href="' + baseHref + '">' +
    '<script>(function(){var M=parent.__MOCK.api;for(var k in M){window[k]=M[k];}})();\x3c/script>';
  const patched = html.replace(/<head([^>]*)>/i, (m) => m + boot);
  const f = document.getElementById(frameId);
  f.srcdoc = patched;
  const deadline = Date.now() + 20000;
  while (Date.now() < deadline) {
    await sleep(150);
    try { if (readyProbe(f.contentWindow)) return f; } catch (e) { /* 未就绪 */ }
  }
  throw new Error(frameId + ' 未在 20 秒内就绪');
}

let mmsFrame = null, rpgFrame = null;
const mmsWin = () => mmsFrame.contentWindow;
const rpgWin = () => rpgFrame.contentWindow;

/* 测试基线：一楼用户 + 二楼 AI（最新 AI 楼），状态含 4 名成员 */
function baseState() {
  return {
    状态栏: {
      日期和时间: '⏰ 1925年3月2日 深夜',
      地点: '📍 冻土荒原',
      角色列表: [
        { 角色: { 名字: '🔮埃利奥特', 属性: '[❤️HP:100/100][💠MP:60/60][🛡️Armor:5]', 物品: '[💼][绷带x3][高级绷带x1]', 内心: '疲惫' } },
        { 角色: { 名字: '🎩弗兰克', 属性: '[❤️HP:200/200][💠MP:20/20]', 武器: '[.577号子弹：5]', 内心: '警戒' } },
        { 角色: { 名字: '🌂玛德琳', 属性: '[❤️HP:120/120][💠MP:40/40]', 物品: '[.45子弹：12]', 内心: '冷静' } },
        { 角色: { 名字: '🦢索恩', 属性: '[❤️HP:150/150][💠MP:50/50]', 物品: '[砷弹：45]', 内心: '沉默' } },
      ],
    },
  };
}
function seedChat() {
  MOCK.setChat([
    { message: '我们去清剿那只眷族。', role: 'user', is_user: true },
    { message: '<maintext>风雪之中，四人踏入荒原。</maintext>\n【状态栏标记点】', role: 'assistant', is_user: false },
  ]);
}
function seedState(state) {
  MOCK.api.insertOrAssignVariables({ stat_data: state || baseState() }, { type: 'message', message_id: 1 });
}
function readState() {
  return MOCK.api.getVariables({ type: 'message', message_id: 1 }).stat_data;
}
function charOf(state, nameFrag) {
  const list = ((state || {})['状态栏'] || {})['角色列表'] || [];
  for (const e of list) {
    const c = e && (e['角色'] || e);
    if (c && String(c['名字'] || '').includes(nameFrag)) return c;
  }
  return null;
}
/* 往战斗侧注入一份阵容（顶层 let 声明可被同 realm 的 eval 读写） */
function injectHeroes(heroes) {
  rpgWin().eval('heroesData = ' + JSON.stringify(heroes) + '; enemiesData = [];');
}
function heroSpec(o) {
  return Object.assign({
    id: 'h', name: '', img: '', hp: 0, maxHp: 0, mp: 0, maxMp: 0, tp: 0, maxTp: 100,
    atk: 10, def: 5, spd: 100, shield: 0, actCount: 1, isAlive: true, buffs: [],
    skills: [], items: [], classType: '', isSummon: false,
  }, o);
}
function item(name, count, category) {
  return { isItem: true, name, count, category: category || '消耗品', maxUses: 0, usesRemaining: 0, bindings: [] };
}
/* ================= 断言 1：端到端直连（0 次 LLM） ================= */
async function test1() {
  head('1 端到端直连：战斗结束即写入状态栏，且不调用 LLM');
  MOCK.resetVars(); seedChat(); seedState();
  mmsWin().MMS.floorId = 1;
  mmsWin().MMS.isLastAssistantFloor = true;
  MOCK.resetGenCount();

  injectHeroes([
    heroSpec({ name: '埃利奥特', hp: 62, maxHp: 100, mp: 5, maxMp: 60, atk: 10, def: 5, spd: 100,
      items: [item('绷带', 1), item('化尘者之瓶', 0, '道具')] }),
    heroSpec({ name: '弗兰克', hp: 200, maxHp: 200, mp: 20, maxMp: 20,
      items: [item('.577号子弹', 2, '弹药')] }),
    heroSpec({ name: '玛德琳', hp: 120, maxHp: 120, mp: 40, maxMp: 40,
      items: [item('.45子弹', 0, '弹药')] }),
    heroSpec({ name: '索恩', hp: 150, maxHp: 150, mp: 50, maxMp: 50,
      items: [item('砷弹', 43, '弹药')] }),
  ]);
  rpgWin().eval("showBattleResult('win')");
  await sleep(400);

  const st = readState();
  const eli = charOf(st, '埃利奥特');
  eq(eli['属性'], '[❤️HP:62/100][💠MP:5/60][🛡️Armor:5]', 'HP/MP 写入且保留 emoji 键名与 Armor');
  check(!/Atk|Speed/i.test(eli['属性']), '状态栏没有 Atk/Speed 键 → 不新增键');
  eq(eli['物品'], '[💼][绷带x1][高级绷带x1]', '绷带按结算改数量、装饰前缀与同名近似物品不受影响');
  eq(charOf(st, '玛德琳')['物品'], '[.45子弹：0]', '弹药打空保留零数量条目（中文冒号形态保持）');
  eq(charOf(st, '索恩')['物品'], '[砷弹：43]', '索恩弹药数量对齐');
  eq(charOf(st, '弗兰克')['武器'], '[.577号子弹：2]', '武器字段里的弹药也能改');
  eq(eli['内心'], '疲惫', '自由字段不被结算触碰');
  eq(MOCK.genCount(), 0, 'generateRaw 调用次数为 0（全程未经 LLM）');
  const badge = rpgWin().document.getElementById('result-sync-badge');
  check(/状态栏已同步/.test(badge.textContent), '战斗侧徽标收到回执并显示已同步', badge.textContent);
  const prompt = rpgWin().document.getElementById('result-prompt').value;
  check(!/\[HP:|\[MP:|\[Atk:|\[Armor:|\[Speed:/.test(prompt), '提示词已删除数值结算清单');
  check(!/按结算清单中的数量更新/.test(prompt), '提示词已删除转述指令');
  check(/小队战后伤势/.test(prompt) && /埃利奥特：轻伤/.test(prompt), '提示词含程序换算的伤势档位');
  check(/<战报摘要>/.test(prompt), '战报正文用摘要（第二步起替代全量战局记录）');
}
/* ================= 断言 2：幂等 ================= */
async function test2() {
  head('2 幂等：重复推送与 boot 对账都不会二次扣减');
  const before = JSON.stringify(readState());
  const histBefore = (MOCK.api.getVariables({ type: 'chat' }).$mms_history || {}).entries || [];
  // (a) 直接重放同一份结算
  const result = MOCK.api.getVariables({ type: 'chat' }).$rpg_combat_result;
  await mmsWin().MMS.applyCombatResult(result);
  // (b) 走 pending 判定（boot 对账/ 事件通道共用的入口）
  const pending = mmsWin().MMS.pendingCombatResult();
  check(pending === null, 'pendingCombatResult 已判定为"已应用"');
  // (c) 再触发一次事件通道
  MOCK.api.eventEmit('rpgcombat:battle-result', { id: result.id });
  await sleep(200);
  eq(readState(), JSON.parse(before), '状态与首次写入完全一致');
  const histAfter = (MOCK.api.getVariables({ type: 'chat' }).$mms_history || {}).entries || [];
  eq(histAfter.length, histBefore.length, '历史快照未重复追加');
}

/* ================= 断言 3-6：映射规则（直接测纯函数） ================= */
function buildOn(state, result, roster) {
  return mmsWin().eval(
    'mmsBuildCombatResult(' + JSON.stringify(state) + ',' + JSON.stringify(result) + ',' + JSON.stringify(roster || { characters: [] }) + ')'
  );
}
function oneChar(attrs, fields) {
  return { 状态栏: { 角色列表: [{ 角色: Object.assign({ 名字: '🔮埃利奥特', 属性: attrs }, fields || {}) }] } };
}
function payload(heroes) {
  return { v: 1, id: 'rc-test-' + Math.random().toString(36).slice(2), ts: Date.now(), outcome: 'win', round: 3, heroes };
}
async function test3() {
  head('3 上限不一致：沿用状态栏上限并夹取，同时上报');
  const r = buildOn(oneChar('[❤️HP:80/100]'), payload([
    { name: '埃利奥特', alive: true, hp: 115, maxHp: 120, mp: null, maxMp: null, items: [] },
  ]));
  eq(charOf(r.state, '埃利奥特')['属性'], '[❤️HP:100/100]', '当前值夹到状态栏上限，上限不被改写');
  eq(r.report.maxMismatch.length, 1, '上报 1 条上限不一致');
  eq(r.report.maxMismatch[0].combatMax + '→' + r.report.maxMismatch[0].statusMax, '120→100', '上报内容正确');
}

async function test4() {
  head('4 阵亡与零数量');
  const r = buildOn(oneChar('[❤️HP:100/100][状态:清醒]', { 物品: '[绷带x2]' }), payload([
    { name: '埃利奥特', alive: false, hp: 0, maxHp: 100, items: [{ name: '绷带', count: 0 }] },
  ]));
  const c = charOf(r.state, '埃利奥特');
  check(/\[❤️HP:0\/100\]/.test(c['属性']), '阵亡写 HP:0');
  check(/\[状态:重伤濒死\]/.test(c['属性']), '已有"状态"键时写入伤势词');
  eq(c['物品'], '[绷带x0]', '消耗品归零后条目保留');
}

async function test5() {
  head('5 未匹配：角色与物品都跳过并上报，不误写');
  const r = buildOn(oneChar('[❤️HP:100/100]', { 物品: '[绷带x2]' }), payload([
    { name: '埃利奥特', alive: true, hp: 90, maxHp: 100, items: [{ name: '神秘药水', count: 1 }] },
    { name: '路人甲', alive: true, hp: 10, maxHp: 50, items: [] },
  ]));
  eq(r.report.unmatchedChars, ['路人甲'], '未匹配角色上报');
  eq(r.report.unmatchedItems, ['埃利奥特·神秘药水'], '未匹配物品上报（不新增到清单）');
  eq(charOf(r.state, '埃利奥特')['物品'], '[绷带x2]', '清单保持原样');
  check(/\[❤️HP:90\/100\]/.test(charOf(r.state, '埃利奥特')['属性']), '同一角色的属性照常写入');
}

async function test6() {
  head('6 歧义物品：全等优先，近似名不误伤');
  const r = buildOn(oneChar('[❤️HP:100/100]', { 物品: '[高级绷带x1][绷带x3]' }), payload([
    { name: '埃利奥特', alive: true, hp: 100, maxHp: 100, items: [{ name: '绷带', count: 1 }] },
  ]));
  eq(charOf(r.state, '埃利奥特')['物品'], '[高级绷带x1][绷带x1]', '只改"绷带"，"高级绷带"不动');
}
/* ================= 断言 7：合并层硬锁 ================= */
async function test7() {
  head('7 合并层硬锁：更新 AI 的数值命令被丢弃，非锁定内容照常合并');
  MOCK.resetVars();
  MOCK.setChat([
    { message: '开打。', role: 'user', is_user: true },
    { message: '<maintext>战前对峙。</maintext>\n【状态栏标记点】', role: 'assistant', is_user: false },
  ]);
  MOCK.api.insertOrAssignVariables({
    $mms_roster: {
      characters: [{ name: '🦢索恩', attrs: [{ key: '❤️HP', value: '150/150' }], fields: [{ key: '物品', initial: '', mode: 'check' }, { key: '内心', initial: '', mode: 'free' }] }],
      modules: [], maps: { minimap: false, bigmap: false },
    },
  }, { type: 'chat' });
  seedState({ 状态栏: { 日期和时间: '⏰ 深夜', 地点: '📍 荒原',
    角色列表: [{ 角色: { 名字: '🦢索恩', 属性: '[❤️HP:150/150][💠MP:50/50]', 物品: '[砷弹：45][绷带x2]', 内心: '沉默' } }] } });
  mmsWin().MMS.floorId = 1;
  mmsWin().MMS.isLastAssistantFloor = true;

  injectHeroes([heroSpec({ name: '索恩', hp: 90, maxHp: 150, mp: 20, maxMp: 50,
    items: [item('砷弹', 43, '弹药'), item('绷带', 2)] })]);
  rpgWin().eval("showBattleResult('win')");
  await sleep(400);
  eq(charOf(readState(), '索恩')['属性'], '[❤️HP:90/150][💠MP:20/50]', '结算已写入（锁的基线）');

  // 新楼层：战斗叙事 → 更新 AI 试图再扣一次血与弹药
  MOCK.setChat(MOCK.api.getChatMessages('0-1').concat([
    { message: '我去追。', role: 'user', is_user: true },
    { message: '<maintext>索恩连开数枪，肩头被寒风撕出血痕。</maintext>\n【状态栏标记点】', role: 'assistant', is_user: false },
  ]));
  MOCK.setGenResponder(() => JSON.stringify({ 状态栏: { 日期和时间: '⏰ 拂晓', 地点: '📍 冰河谷',
    角色列表: [{ 角色: { 名字: '🦢索恩', 属性: '[❤️HP-30][💠MP-10]', 物品: '[砷弹-10][+止血钳x1]', 内心: '警觉' } }] } }));
  MOCK.resetGenCount();
  mmsWin().MMS.floorId = 3;
  await mmsWin().MMS.runUpdate(3);

/* ================= 断言 10：规则覆盖率（自维护） ================= */
async function test10() {
  head('10 规则覆盖率：源码 addHistory 行号 == DIGEST_RULES srcLine');
  const src = await (await fetch('../index.html', { cache: 'reload' })).text();
  const lines = src.split('\n');
  const srcCalls = new Set();
  lines.forEach((l, i) => {
    if (!/addHistory\(\s*(['`]|\s*removed)/.test(l)) return;
    const t = (l.match(/addHistory\(\s*(?:removed\.length\s*\?\s*)?['`](.*)/) || [])[1] || '';
    if (t.startsWith('[对话]')) return;
    srcCalls.add(i + 1);
  });
  const bs = src.indexOf('const DIGEST_RULES = ['), be = src.indexOf('];', bs);
  const ruleLines = new Set();
  for (const m of src.slice(bs, be).matchAll(/srcLine: (\d+)/g)) ruleLines.add(parseInt(m[1], 10));
  eq(ruleLines.size, srcCalls.size, '规则数 == addHistory 调用数（' + srcCalls.size + '）');
  const missRule = [...srcCalls].filter(x => !ruleLines.has(x));
  const missSrc = [...ruleLines].filter(x => !srcCalls.has(x));
  check(!missRule.length && !missSrc.length, '行号集合完全对齐',
    '缺规则:' + missRule.join(',') + ' 错指向:' + missSrc.join(','));
}

/* ================= 断言 11：战斗中对话的战况摘要化（ongoing + 性能 + 缓存） ================= */
async function test11() {
  head('11 对话 LLM 战况摘要化：进行时模式 + 性能与缓存');
  const log = await (await fetch('fixtures/real-battle-log.txt')).text();
  seedDigestBattle();
  rpgWin().eval('battleHistory = ' + JSON.stringify(log.split('\n')) + '; _historyRawCache = battleHistory.join("\\n");');

  // 进行时模式：不带结算块（关键术式是战后概念），保留回合节拍与对话
  const ongoing = rpgWin().eval('buildOngoingDigest()');
  check(ongoing.length > 0, '进行时摘要非空');
  check(!/【关键术式】/.test(ongoing), '进行时模式不含【关键术式】结算块');
  check(/=== 第 1 回合 ===/.test(ongoing) && /=== 第 4 回合 ===/.test(ongoing), '保留全场回合结构（无限模式的完整脉络）');
  check(ongoing.includes('弗兰克「该死的怪物'), '对话保留');
  check(!/\d+ 点|当前状态: \d+/.test(ongoing), '进行时摘要无数值');

  // 性能：全量解析（204 行 × 118 规则）50 次取均值
  const perf = rpgWin().eval(`(function(){
    const t0 = performance.now();
    for (let i = 0; i < 50; i++) buildOngoingDigest();
    const full = (performance.now() - t0) / 50;
    // 缓存命中路径
    getOngoingDigestCached();
    const t1 = performance.now();
    for (let i = 0; i < 1000; i++) getOngoingDigestCached();
    const cached = (performance.now() - t1) / 1000;
    return { fullMs: full, cachedMs: cached };
  })()`);
  out('info', '  全量摘要耗时 ' + perf.fullMs.toFixed(2) + 'ms/次（204行），缓存命中 ' + perf.cachedMs.toFixed(4) + 'ms/次');
  check(perf.fullMs < 30, '全量摘要均值 < 30ms（对比对话 API 网络延迟数百 ms 可忽略）');
  check(perf.cachedMs < 0.05, '缓存命中近零开销（连续触发的对话调用之间战报未变）');

  // 缓存正确性：战报追加一行后缓存失效并重算（用能被规则解析的终局行）
  rpgWin().eval("battleHistory.push('[战况] 💀 缓存测试目标 被击溃了！');");
  const after = rpgWin().eval('getOngoingDigestCached()');
  check(after.includes('缓存测试目标'), '战报变化后缓存失效重算');

  // 开关默认开 + 关闭后回退原始日志路径
  const useDigestDefault = rpgWin().eval('llmState.digestBattle !== false');
  check(useDigestDefault, '战况摘要化默认开启（旧存档无字段时迁移为开）');
}

  eq(zero, '[.577号子弹：0][绷带x0]', 'LLM 路径归零保留（delta 与 set 都不删条目）');

  // 渲染层：数量 0 的条目标红（渲染是异步 DOM 管线，轮询等待）
  MOCK.api.insertOrAssignVariables({
    stat_data: { 状态栏: { 角色列表: [{ 角色: { 名字: '🎩弗兰克', 属性: '[❤️HP:180/180]', 物品: '[.577号子弹：0][绷带x3]' } }] } },
  }, { type: 'message', message_id: 1 });
  mmsWin().MMS.floorId = 1;
  mmsWin().MMS.refreshFromVars();
  let red = null;
  for (let i = 0; i < 20 && !red; i++) {
    await sleep(150);
    for (const b of mmsWin().document.querySelectorAll('.item-badge')) {
      if (b.textContent.includes('.577号子弹') && b.style.color) { red = { text: b.textContent, color: b.style.color }; break; }
    }
  }
  check(red && /248,\s*113,\s*113|f87171/i.test(red.color), '归零条目渲染为红色', JSON.stringify(red));
  check(red && red.text.includes('：0'), '归零条目显示数量 0', red && red.text);
}

/* ================= 断言 13：属性下限保护 + cur/max ≤30% 红色预警 ================= */
async function test13() {
  head('13 属性下限保护（扣不到负数/不消失）+ ≤30% 红色预警');
  // 纯函数：有上限型超扣 → 夹到 0/上限，条目保留；无上限型 → 夹到 0，条目保留
  const clampCurMax = mmsWin().eval('(function(){ return mmsApplyAttrCommands("[❤️HP:30/100][💠MP:60/60]", "[HP-50]"); })()');
  eq(clampCurMax, '[❤️HP:0/100][💠MP:60/60]', 'cur/max 型超扣夹到 0/上限（条目保留，上限不改写）');
  const clampPlain = mmsWin().eval('(function(){ return mmsApplyAttrCommands("[🛡️Armor:5]", "[Armor-10]"); })()');
  eq(clampPlain, '[🛡️Armor:0]', '无上限数值型超扣夹到 0（不出现负数，条目保留）');

  // 渲染：25/100 与 30/100 红（≤30%），31/100 与 60/60 不红
  MOCK.api.insertOrAssignVariables({
    stat_data: { 状态栏: { 角色列表: [{ 角色: { 名字: '🎩弗兰克',
      属性: '[❤️HP:25/100][❤️HP2:30/100][❤️HP3:31/100][💠MP:60/60][🛡️Armor:5]' } }] } },
  }, { type: 'message', message_id: 1 });
  mmsWin().MMS.refreshFromVars();
  const pick = async (frag) => {
    for (let i = 0; i < 20; i++) {
      await sleep(150);
      for (const b of mmsWin().document.querySelectorAll('.item-badge')) {
        if (b.textContent.includes(frag)) return b;
      }
    }
    return null;
  };
  const b25 = await pick('HP:25/100');
  const b30 = await pick('HP2:30/100');
  const b31 = await pick('HP3:31/100');
  const b60 = await pick('MP:60/60');
  check(b25 && b25.style.color, 'HP 25%（<30%）标红');
  check(b30 && b30.style.color, 'HP 30%（边界，≤30%）标红');
  check(b31 && !b31.style.color, 'HP 31%（>30%）不标红');
  check(b60 && !b60.style.color, '满值 MP 不标红');
  const bA = await pick('Armor:5');
  check(bA && !bA.style.color, '无上限数值（无分母）不参与比例预警');
}

/* ================= 断言 14：人物模块长期追踪（名字键合并 + 无名过滤 + 红叉删除） ================= */
async function test14() {
  head('14 人物长期追踪登记簿：增量合并/无名过滤/[移除]标记/红叉删除');
  const prevPeople = { 盟友: ['🎩【史密斯警探】[友善] 专注失踪案'], NPC: ['🧑【老约翰】[店主] 约好周五见面'], 敌人: ['💀【疤脸乔】[黑帮] 悬而未决的威胁'] };
  const aiPeople = { 盟友: ['🎩【史密斯警探】[友善] 已还清人情，引荐了线人'], NPC: ['👋【新人薇拉】[记者] 追查同一桩案子'], 敌人: ['💀【疤脸乔】[移除]', '🔪【独眼刀疤】[杀手] 已确认接触'] };

  const merged = mmsWin().eval('(function(){ return mmsMergePeople(' + JSON.stringify(prevPeople) + ',' + JSON.stringify(aiPeople) + '); })()');
  check(merged['盟友'].some(l => l.includes('史密斯') && l.includes('已还清人情')) && merged['盟友'].filter(l => l.includes('史密斯')).length === 1, '同名条目=更新描述（不重复）');
  check(!merged['敌人'].some(l => l.includes('疤脸乔')), '[移除] 标记删除既有条目');
  check(merged['敌人'].some(l => l.includes('独眼刀疤')), '新名条目登记');
  check(merged['NPC'].some(l => l.includes('老约翰')) && merged['NPC'].some(l => l.includes('薇拉')), '未提及条目保留 + 新 NPC 登记');

  // 跨桶移动：老约翰被 AI 移到 盟友
  const moved = mmsWin().eval('(function(){ return mmsMergePeople(' + JSON.stringify(prevPeople) + ', { 盟友: ["🤝【老约翰】[店主] 决定入伙"] }); })()');
  check(moved['盟友'].some(l => l.includes('老约翰') && l.includes('入伙')) && !moved['NPC'].some(l => l.includes('老约翰')), '跨桶移动跟随 AI 输出分类');

  // 无名条目过滤（AI 输出与历史遗留都滤）
  const unnamed = mmsWin().eval('(function(){ return mmsMergePeople({ NPC: ["侍者 端茶", "路人甲"] }, { NPC: ["酒保 擦杯子"] }); })()');
  eq(unnamed['NPC'], [], '无名条目（新输出与遗留）都不进人物');

  // 端到端：runUpdate 走新合并路径（AI 输出含无名+更新，未提及者保留）
  // 基线状态种在 0 楼（findPrevState 只往前找，不能种在被更新的楼层自己身上）
  MOCK.resetVars();
  MOCK.setChat([
    { message: '开始调查。', role: 'user', is_user: true },
    { message: '<maintext>酒吧里侍者端来酒，史密斯警探透露了线索。</maintext>\n【状态栏标记点】', role: 'assistant', is_user: false },
  ]);
  MOCK.api.insertOrAssignVariables({ stat_data: { 状态栏: { 日期和时间: '⏰ 深夜', 地点: '📍 酒吧',
    人物: { 盟友: ['🎩【史密斯警探】[友善] 专注失踪案'], NPC: ['🧑【老约翰】[店主] 约好周五见面'] },
    角色列表: [] } } }, { type: 'message', message_id: 0 });
  mmsWin().MMS.floorId = 1;
  mmsWin().MMS.isLastAssistantFloor = true;
  MOCK.setGenResponder(() => JSON.stringify({ 状态栏: { 日期和时间: '⏰ 深夜', 地点: '📍 酒吧',
    人物: { 盟友: ['🎩【史密斯警探】[友善] 提供了码头线索'], NPC: ['侍者 端酒'] } } }));
  await mmsWin().MMS.runUpdate(1);
  const s14 = MOCK.api.getVariables({ type: 'message', message_id: 1 }).stat_data;
  const p14 = s14['状态栏']['人物'];
  check(p14['盟友'].some(l => l.includes('码头线索')), '端到端：描述更新');
  check(p14['NPC'].some(l => l.includes('老约翰')) && !p14['NPC'].some(l => l.includes('侍者')), '端到端：未提及保留、无名滤除');

  // 红叉删除：渲染后点击某条目的叉 → 状态里该人物消失
  for (let i = 0; i < 20; i++) {
    await sleep(150);
    if (mmsWin().document.querySelector('.character-entry .char-del-x')) break;
  }
  const x = mmsWin().document.querySelector('.character-entry .char-del-x');
  check(x, '渲染层出现删除红叉');
  if (x) {
    x.click();
    await sleep(400);
    const after = MOCK.api.getVariables({ type: 'message', message_id: 1 }).stat_data;
    check(!JSON.stringify(after['状态栏']['人物']).includes('史密斯'), '点击红叉后该人物从状态中移除');
  }
}

/* ================= 断言 16：自X 自身负面标签 + 槽位级轮数 ================= */
async function test16() {
  head('16 自X 自身负面：解析/目标分类/必中/固定威力/槽位级轮数');
  const w = rpgWin();

  // --- 解析：自X 入槽、槽位级 turns、冒号简写 ---
  const sk = w.parseSkill('【狂化】[单增;power:30;turns:4][自盲;power:20;turns:2][MP:2]');
  eq(sk.type2, '[自盲]', '自盲占用第二效果槽');
  eq(sk.power2, 20, '自盲 power 解析');
  eq(sk.slotTurns, 4, '槽位级 turns：第一槽 4 回合');
  eq(sk.slotTurns2, 2, '槽位级 turns：自盲槽 2 回合');
  eq(sk.slotTurns3, null, '空槽 turns 为 null');
  eq(sk.turns, null, '无 [Turns:N] 时技能级轮数保持 null');

  const skColon = w.parseSkill('【代价】[自盲:25]');
  eq(skColon.type, '[自盲]', '冒号简写 [自盲:25] 归一入主槽');
  eq(skColon.power, 25, '冒号简写 power 解析');

  const skBare = w.parseSkill('【裸写】[自盲]');
  eq(skBare.type, '[单体]', '裸 [自盲] 走 [单体] 兜底（与裸 单盲 一致：自X 必须写 power）');

  // --- 目标分类：自X 不触发敌方选目标、不算有益单体 ---
  const clsPure = w.classifySkill({ type: '[自盲]', type2: '[无]', type3: '[无]' });
  check(clsPure.hasEnemyTargetTag === false, '纯自盲技能不进敌方选目标（走自施放）');
  check(clsPure.hasSingleBuff === false, '自盲不算有益单体标签（不可经 [他人] 施加给队友）');
  const clsMix = w.classifySkill({ type: '[单体]', type2: '[自盲]', type3: '[无]' });
  check(clsMix.hasEnemyTargetTag === true, '单体+自盲混合：攻击部分仍进敌方选目标');

  // --- 必中 + 轮数回落（直接驱动效果函数；spd 拉满 + hitChance=1 使任何掷骰几乎必然闪避）---
  const mk = () => ({ id: 'h_t16', name: '测试勇者', isAlive: true, hp: 100, maxHp: 100, mp: 50, maxMp: 50,
    tp: 0, maxTp: 100, atk: 10, def: 5, spd: 99999, eva: 0, shield: 0, buffs: [], skills: [], items: [], classType: '', tags: [] });

  const m1 = mk();
  await w.applySingleTagEffect(m1, m1, '[自盲]', 20, 1, 1, 2, null);
  eq(m1.buffs, [{ type: 'hit', value: -20, duration: 2 }], '自盲必中落身：spd 99999 环境下仍施加 {hit:-20, 2回合}（若走掷骰必落空）');

  const m2 = mk();
  await w.applySingleTagEffect(m2, m2, '[自降]', 10, 1, 1, null, null);
  eq(m2.buffs, [{ type: 'def', value: -10, duration: 3 }], '无槽位轮数时回落默认 3 回合');

  // --- 固定代价：极限爆发/暴击 ×2 不放大自负面；普通标签照常翻倍 ---
  const m3 = mk();
  await w.applySingleTagEffect(m3, m3, '[自盲]', 20, 1, 2, 2, null);
  eq(m3.buffs, [{ type: 'hit', value: -20, duration: 2 }], '倍率 ×2 下自盲仍 -20（固定代价，不受爆发/暴击放大）');

  const m4 = mk();
  await w.applySingleTagEffect(m4, m4, '[单瞄]', 20, 100, 2, 2, null);
  eq(m4.buffs, [{ type: 'hit', value: 40, duration: 2 }], '对照：单瞄 ×2 照常 +40（倍率豁免仅限自X）');
}

/* ================= 断言 19：反引号围栏纪律（酒馆引号美化管线兼容） ================= */
async function test19() {
  head('19 反引号围栏纪律：组件源码不得破坏酒馆 ``` 配对豁免链');
  const src = await (await fetch('../index.html', { cache: 'reload' })).text();
  // ① 廉价不变量：组件文件自带头尾围栏（```html ... ```）之外，内部不得再有三连反引号——
  //    酒馆 script.js 的引号美化正则靠 ``` 两两配对豁免代码块，组件内部冒出奇数个围栏序列会把
  //    配对链错位到同楼层其他组件（状态栏 <q> 污染事故：全篇引号被包 <q> → 脚本语法错误 → 渲染失败）
  eq((src.match(/```/g) || []).length, 2, 'index.html 三连反引号序列数 == 2（仅头尾自围栏）');
  // ② 仿真酒馆引号美化管线（script.js 同款正则）：战斗组件（自围栏全文）+ 同楼层模拟组件
  const stQuoteRe = /<style>[\s\S]*?<\/style>|```[\s\S]*?```|~~~[\s\S]*?~~~|``[\s\S]*?``|`[\s\S]*?`|(".*?")|(\u201C.*?\u201D)|(\u00AB.*?\u00BB)|(\u300C.*?\u300D)|(\u300E.*?\u300F)|(\uFF02.*?\uFF02)/gim;
  const applyStQuote = (text) => text.replace(stQuoteRe, function (match, p1) { return p1 ? '<q>' + p1 + '</q>' : match; });
  const sample = '```html\n<!DOCTYPE html>\n<html>\n<script>\n  console.log("状态栏模拟组件启动");\n  const data = { "名字": "测试", "属性": "abc" };\n</' + 'script>\n</html>\n```';
  const converted = applyStQuote(src + '\n' + sample);
  const tail = converted.slice(converted.indexOf('状态栏模拟组件') - 300);
  check(!/<q>/.test(tail), '管线处理后：同楼层后续组件零 <q> 污染');
  // ③ 对照组（证明仿真有效）：战斗组件内部塞一个奇数围栏序列 → 模拟组件必被污染
  const poisoned = src.replace('<!DOCTYPE html>', '<!DOCTYPE html>\n<!-- ```yaml 假围栏 -->');
  const convertedPoisoned = applyStQuote(poisoned + '\n' + sample);
  check(/<q>/.test(convertedPoisoned.slice(convertedPoisoned.indexOf('状态栏模拟组件') - 300)), '对照组：内部多一个围栏序列 → 污染复现（仿真有效）');
  // ④ 正则捕获组替换免疫（事故：normalizeVariantGroupYaml 的 '$1' 字面量被酒馆正则引擎当作捕获组引用，
  //    用户 Combat_block 的 YAML 整段注入脚本字符串字面量 → 裸换行炸语法 → 组件零执行卡加载屏）
  check(!/\$[$&`'\d<]/.test(src), '源码无 $ 捕获组替换序列（$1/$&/$` 等，会被酒馆正则替换注入捕获组内容）');
  const simMsg = '前置楼层文本\n<Combat_block>\n战斗数据栏:\n  敌方列表:\n    - 角色:\n        名字: "测试怪"\n</Combat_block>\n后置文本';
  const applied = simMsg.replace(/<Combat_block>([\s\S]*?)<\/Combat_block>/, src);

async function test21() {
  head('21 Tailwind 静态编译纪律：Play CDN 清零 + 编译块结构 + 类名覆盖零缺失');
  const src = await (await fetch('../index.html', { cache: 'reload' })).text();
  // ① Play CDN 引用清零（运行时 JIT 的 MutationObserver 全文档监听 × 高频 DOM 变动的持续编译税，改为构建期编译内联）
  check(!src.includes('cdn.tailwindcss.com'), 'Play CDN 引用清零');
  // ② 编译块结构：标记唯一、<style> 恰 2 块、位置在自定义 </style> 之后 </head> 之前
  //（复刻 Play CDN 标准模式实测注入位：head 末尾——平级覆盖时工具类仍赢，级联顺序与迁移前一致）
  eq((src.match(/<!-- TAILWIND-CSS-START/g) || []).length, 1, 'TAILWIND-CSS-START 标记唯一');
  eq((src.match(/<style>/g) || []).length, 2, '<style> 块数 == 2（自定义 + 编译）');
  check(src.indexOf('</style>') < src.indexOf('<!-- TAILWIND-CSS-START') && src.indexOf('<!-- TAILWIND-CSS-START') < src.indexOf('</head>'), '编译块位于自定义 </style> 之后、</head> 之前');
  const cssBlock = (src.match(/<!-- TAILWIND-CSS-START[\s\S]*?-->\s*<style>([\s\S]*?)<\/style>/) || [])[1] || '';
  // ③ 产物健全性：哨兵类 + enemy.size 通道 safelist（唯一外部数据直进 class 的口子，取值为 text-* 字号档）
  check(cssBlock.includes('.flex{'), '编译产物含哨兵类 .flex');
  for (const n of [4, 5, 6, 7, 8, 9]) {
    check(cssBlock.includes('.text-' + n + 'xl{') && cssBlock.includes('.sm\\:text-' + n + 'xl{'), 'safelist：text-' + n + 'xl 裸类与 sm: 变体齐备');
  }
  // ④ 类名覆盖零缺失：提取源码全部 class="..." 字面量段（跳 ${} 插值段与单引号拼接式捕获）+ classList 字面量参数，
  //    每个类名必须能在文档 CSS（自定义 ∪ 编译块，反转义 \2c  十六进制转义后）找到选择器——
  //    把「改了类名忘跑 node build-tailwind.cjs → 新类名静默无样式」变成显性测试失败
  const cssUnescaped = [...src.matchAll(/<style>([\s\S]*?)<\/style>/g)].map(mm => mm[1]).join('\n')
    .replace(/\\([0-9a-fA-F]{1,6})\s?/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/\\(.)/g, '$1');
  const tokens = new Set();
  let m;
  const attrRe = /class="([^"]*)"/g;
  while ((m = attrRe.exec(src))) {
    if (m[1].includes("'") || m[1].includes('+')) continue; // '...' + var + '...' 拼接上下文的捕获是噪声
    const lit = m[1].replace(/\$\{[^}]*\}/g, ' ');
    for (const t of lit.split(/\s+/)) if (t) tokens.add(t);
  }
  const clRe = /classList\.(?:add|remove|toggle)\(([^)]*)\)/g;
  while ((m = clRe.exec(src))) {
    const argRe = /'([^']*)'|"([^"]*)"/g;
    let a;
    while ((a = argRe.exec(m[1]))) {
      const val = a[1] !== undefined ? a[1] : a[2];
      if (val.includes('${')) continue;
      for (const t of val.split(/\s+/)) if (t) tokens.add(t);
    }
  }
  const validToken = /^[A-Za-z0-9_\-\[\]()%,.\/:#%]+$/;
  const KNOWN_DEAD = new Set(['py-0.2']); // 历史死类：0.2 不在 v3 默认 spacing 刻度，Play CDN 时代同样无样式（修复反而新增内边距，保留现状并备案）
  const selectorExists = (t) => {
    const sel = '.' + t;
    let pos = cssUnescaped.indexOf(sel);
    while (pos !== -1) {
      const next = cssUnescaped[pos + sel.length];
      if (next === undefined || /[\s,{:>.~+[]/.test(next)) return true;
      pos = cssUnescaped.indexOf(sel, pos + 1);
    }
    return false;
  };
  const candidates = [...tokens].filter(t => validToken.test(t));
  const missing = candidates.filter(t => !KNOWN_DEAD.has(t) && !selectorExists(t));
  check(missing.length === 0, '类名覆盖零缺失（' + candidates.length + ' 个 token 全部有样式）' + (missing.length ? '，缺：' + missing.slice(0, 10).join(' ') : ''));
  // ⑤ 编译产物不得引入三连反引号（test19 围栏纪律；build-tailwind.cjs 写回时同样拦截）
  eq((src.match(/```/g) || []).length, 2, '三连反引号仍 == 2（编译产物无围栏污染）');
}

  check(fx.includes('Math.min(targetSize, FX_WEBM_KEY_MAX)') && fx.includes("vCanvas.style.width = targetSize + 'px'"), '抠图画布封顶且 CSS 尺寸钉原值');
  // ④ 亮度键抠图保留且受开关守卫（12/80 软阈值与渐隐语义不变），catch 的 canvas 污染 fallback 保留
  check(fx.includes('if (!FX_WEBM_SCREEN_MODE) {') && fx.includes('maxVal < 12') && fx.includes('maxVal < 80'), '亮度键抠图保留（12/80 软阈值）且受 screen 开关守卫');
  check(fx.includes("vCanvas.style.mixBlendMode = 'screen';"), 'canvas 被跨域污染时的 screen fallback 保留');
}

   回归锁：曾因 prepareSkillTarget 中召唤直通分支排在延迟检查之前，

  // ② 入口路由（根因锁）：桩掉两条入口分支，验证召唤+延迟走蓄力、纯召唤仍直通
  injectHeroes([heroSpec({ name: '召唤师', hp: 100, maxHp: 100, mp: 100, maxMp: 100,

  rpgWin().eval(`
    window.__t26 = { path: null, releasedTo: null };
    window.__t26Exec = window.executeHeroSkillAction;
    window.__t26Charge = window.handleChargeSkill;
    window.executeHeroSkillAction = async () => { window.__t26.path = 'direct'; };
    window.handleChargeSkill = async () => { window.__t26.path = 'charge'; };
    state.actionQueue = [{ ref: heroesData[0] }]; state.queueIndex = 0;
  `);
  await rpgWin().prepareSkillTarget(0);
  check(rpgWin().__t26.path === 'charge', '召唤+延迟：走蓄力入口（不再被召唤直通短路）');
  await rpgWin().prepareSkillTarget(1);
  check(rpgWin().__t26.path === 'direct', '纯召唤（无延迟）：仍走召唤直通');

  // ③ 释放路由（自施放锁）：蓄满释放时 primaryTarget=施法者，附带 [单防] 落自己而非随机友方
  rpgWin().eval(`
    window.__t26Release = window.doReleaseCharge;
    window.doReleaseCharge = async (h, t) => { window.__t26.releasedTo = t ? t.name : null; };
    heroesData[0].currentDelay = { skill: parseSkill(${JSON.stringify(SKILL_DELAY)}), remaining: 0 };

  await rpgWin().releaseCharge();
  check(rpgWin().__t26.releasedTo === '召唤师', '蓄满释放：primaryTarget=施法者（自施放，[单防] 落自己）');

  // ④ 真实蓄力押注：恢复原函数、桩掉 endTurn，验证进入蓄力 + MP 在蓄力开始时扣除
  rpgWin().eval(`
    window.executeHeroSkillAction = window.__t26Exec;
    window.handleChargeSkill = window.__t26Charge;
    window.doReleaseCharge = window.__t26Release;
    window.__t26EndTurn = window.endTurn;
    window.endTurn = async () => {};
    heroesData[0].mp = 100; heroesData[0].currentDelay = null; heroesData[0].hasteStore = 0;
    state.actionQueue = [{ ref: heroesData[0] }]; state.queueIndex = 0; state.isAnimating = false;
  `);
  await rpgWin().prepareSkillTarget(0);
  // heroesData 是顶层 let（不挂 window 属性），跨 realm 读取须在 iframe 内 eval
  const cd = rpgWin().eval('(function(){ var h = heroesData[0], c = h.currentDelay; return { remaining: c ? c.remaining : null, mp: h.mp, summon: c && c.skill ? c.skill.summonTarget : null }; })()');
  check(cd.remaining === 2, '真实蓄力：currentDelay.remaining = 2（还需 2 回合）');
  check(cd.mp === 80, '真实蓄力：MP 在蓄力开始时押注扣除（100-20）');
  check(cd.summon === '幻梦行军兽', '真实蓄力：蓄力槽保留召唤目标');

  // ⑤ 清理：恢复 endTurn 与入口函数，清空注入，避免污染其它测试
  rpgWin().eval(`

    delete window.__t26Release; delete window.__t26EndTurn;
    heroesData = []; enemiesData = []; state.actionQueue = []; state.queueIndex = 0; state.isAnimating = false;
  `);
}

  // —— 写法A（无冒号，旧数据兼容）：上段扁平构建已清掉组，onCombatDataReceived 失败重试须走预归一化建组 ——
  const noColonYaml = nestedYaml.split('\n').map(l => l.replace(/":$/, '"')).join('\n');
  w.eval('onCombatDataReceived(' + JSON.stringify(noColonYaml) + ')');
  check(ev('heroesData[0].skills.some(s=>s.isGroup && Array.isArray(s.children) && s.children.length===2) && heroesData[0].skills.filter(s=>s._inGroup).length===2'), '无冒号写法经预归一化重试同样建组（兜底路径，非残留数据）');

  // —— 编辑器模板函数：参数化后渲染（主技能 id 前缀 / 子技能命名空间）——
  const formHtml = ev('buildSkillFormFieldsHtml("h-0-s-0", parseSkill("【测试】[单体;power:30][MP:5]"), "void(0)")');
  check(formHtml && formHtml.includes('edit-h-0-s-0-name') && formHtml.includes('edit-h-0-s-0-type') && formHtml.includes('edit-h-0-s-0-summon'), '模板函数产出 A-E 全模块控件');
  check(formHtml.includes('pill-h-0-s-0-others') && formHtml.includes('pill-h-0-s-0-legendary'), '模板函数产出药丸开关 id');
  const subFormHtml = ev('buildSkillFormFieldsHtml("h-0-s-0-c-1", parseSkill("【子】[穿透;power:20]"), "void(0)")');
  check(subFormHtml.includes('edit-h-0-s-0-c-1-name') && subFormHtml.includes('edit-h-0-s-0-c-1-power'), '子技能命名空间前缀正确（-c-1）');

  // —— syncSkillGroupFromChildren：children 重排平铺 ——
  // （上一段扁平兼容测试已把 heroesData 覆盖为无组数据：先重建嵌套数据再测；停轮询防 mock 楼层覆盖）
  w.eval('clearInterval(pollingInterval)');
  w.eval('onCombatDataReceived(' + JSON.stringify(nestedYaml) + ')');
  w.eval(`
    var _p = heroesData[0].skills.find(s=>s.isGroup);
    _p.children.splice(0, 1);
    syncSkillGroupFromChildren(heroesData[0], _p);
  `);
  const afterRemove = ev('heroesData[0].skills.filter(s=>s._inGroup && s.parentName==="温切斯特M1897")');
  eq(afterRemove.length, 1, 'children 删一个 → 平铺子技能同步减一');
  check(afterRemove[0] && afterRemove[0].name === '12号独头弹', '剩余子技能正确（鹿弹已删）');
  eq(ev('heroesData[0].skills.length'), 3, 'skills 总数 = 父1 + 子1 + 普通1');

  // —— 物品组执行链（isItem 伪技能：父道具次数扣减走 executeSkillAction 物品消耗分支）——
  // 注意：①走 onCombatDataReceived 重建（与生产路径一致，冒号形式原生解析+roster 合并）；②先停掉 1s 轮询（mock 当前楼是扁平 YAML，
  // 会在 await 间隙覆盖 heroesData 导致下面 find 不到化尘者之瓶）
  w.eval('clearInterval(pollingInterval)');
  w.eval('onCombatDataReceived(' + JSON.stringify(nestedYaml) + ')');
  w.eval(`
    state.isGameStarted = true; state.actionQueue = [{ type: 'hero', ref: heroesData[0] }]; state.queueIndex = 0;
    heroesData[0].mp = 100;
    battleHistory = []; _historyRawCache = '';
    window.__t29EndTurn = window.endTurn; window.endTurn = async () => {};
  `);
  const bottle2 = ev('heroesData[0].items.find(i=>i.name==="化尘者之瓶")');
  check(bottle2 && bottle2.usesRemaining === 1, '执行前父道具次数 = 1');
  await w.eval('executeGroupedItemSkill(heroesData[0], heroesData[0], heroesData[0].items.find(i=>i.name==="化尘者之瓶"), heroesData[0].items.find(i=>i.name==="化尘者之瓶").children[1])');
  const bottle3 = ev('heroesData[0].items.find(i=>i.name==="化尘者之瓶")');
  check(bottle3 && bottle3.usesRemaining === 0, '执行子技能后父道具次数扣 1（1→0）');
  const itemLine = ev('battleHistory.filter(l => l.includes("化尘者之瓶·飞沙化甲")).join("|")');
  check(/使用了【化尘者之瓶·飞沙化甲】/.test(itemLine), '战报行用「父名·子名」措辞', itemLine);
  check(ev('heroesData[0].mp') === 92, '子技能 MP 8 由 executeSkillAction 照扣（100→92）');
  // 清理：恢复 alert；roster 种子失效化（version 不匹配 → readRoster 返回 null，防复跑影响早前测试）
  w.eval(`
    window.endTurn = window.__t29EndTurn; delete window.__t29EndTurn;
    if (window.__t29Alert) { window.alert = window.__t29Alert; delete window.__t29Alert; }
    state.isGameStarted = false; state.actionQueue = []; state.queueIndex = 0;
    heroesData = []; enemiesData = []; battleHistory = []; _historyRawCache = '';
  `);
  MOCK.api.insertOrAssignVariables({ rpg_combat_roster: { version: 0 } }, { type: 'chat' });
}

/* ================= 断言 30：物品/物品子技能 [召唤]+[延迟] =================
   回归锁（物品版 test26）：parseItem 不解析 [召唤:]/[延迟:]/[MP:]，itemToPseudoSkill 硬编码
   delay:0 且不透传 summonTarget → 物品绑定召唤对象时召唤与蓄力双失效；物品子技能伪技能虽
   透传了召唤，但 prepareGroupedItemSkill 无延迟路由 → 蓄力限制失效（V11.12 实机反馈：蝎眼钥匙）。

  head('30 物品召唤+延迟：直连物品蓄力押注·蓄满释放结算召唤扣次·子技能蓄力路由·roster 旧档不清洗新字段');

  check(it.summonTarget === '幻梦行军兽' && it.delay === 2, '物品解析：summonTarget 与 delay=2 共存');
  check(it.cost === 20 && it.type === '[单防]' && it.category === '道具' && it.maxUses === 1 && it.isHighTier === true, '物品解析：MP:20/[单防]/[高阶]/[道具][次数:1] 正常');
  const ps = rpgWin().itemToPseudoSkill(it);
  check(ps.summonTarget === '幻梦行军兽' && ps.delay === 2 && ps.cost === 20 && ps.isItem === true && ps.itemRef === it, '伪技能透传：召唤/延迟/MP/物品引用齐备');

  // ② 入口路由（根因锁）：桩掉两条入口，验证 延迟物品走蓄力、纯召唤物品仍直连
  injectHeroes([heroSpec({ name: '持钥人', hp: 100, maxHp: 100, mp: 100, maxMp: 100,
    items: [rpgWin().parseItem(ITEM_DELAY), rpgWin().parseItem(ITEM_PURE)] })]);
  rpgWin().eval(`
    window.__t30 = { path: null };
    window.__t30ChargeItem = window.handleChargeItem;
    window.__t30ExecItem = window.executeItemAction;
    window.handleChargeItem = async () => { window.__t30.path = 'charge'; };
    window.executeItemAction = async () => { window.__t30.path = 'direct'; };
    state.actionQueue = [{ ref: heroesData[0] }]; state.queueIndex = 0; state.isAnimating = false;
  `);
  await rpgWin().prepareItemTarget(0);
  check(rpgWin().__t30.path === 'charge', '物品召唤+延迟：走蓄力入口（不再直连自施放短路）');
  await rpgWin().prepareItemTarget(1);
  check(rpgWin().__t30.path === 'direct', '纯召唤物品（无延迟）：仍直连自施放');

  // ③ 真实蓄力押注（物品）：恢复原函数、桩掉 endTurn；MP 押注扣除、次数保留到释放
  rpgWin().eval(`
    window.handleChargeItem = window.__t30ChargeItem;
    window.executeItemAction = window.__t30ExecItem;
    window.__t30EndTurn = window.endTurn;
    window.endTurn = async () => {};
    heroesData[0].mp = 100; heroesData[0].hasteStore = 0; heroesData[0].currentDelay = null;
    state.isAnimating = false;
    battleHistory = []; _historyRawCache = '';
  `);
  await rpgWin().prepareItemTarget(0);
  const cd = rpgWin().eval('(function(){ var h = heroesData[0], c = h.currentDelay; return { remaining: c ? c.remaining : null, mp: h.mp, summon: c && c.skill ? c.skill.summonTarget : null, isItem: c && c.skill ? !!c.skill.isItem : null, uses: h.items[0].usesRemaining, hist: battleHistory.join("|") }; })()');
  check(cd.remaining === 2, '真实蓄力：currentDelay.remaining = 2（还需 2 回合）');
  check(cd.mp === 80, '真实蓄力：MP 押注扣除（100-20）');
  check(cd.summon === '幻梦行军兽' && cd.isItem === true, '真实蓄力：蓄力槽保留召唤目标与物品伪技能形态');
  check(cd.uses === 1, '真实蓄力：道具次数不预扣（释放时才扣，终止蓄力不损耗）');
  check(/⏳ \[持钥人\] 开始蓄力【蝎眼钥匙】，还需 2 回合完成！/.test(cd.hist), '真实蓄力：开始蓄力战报行（与技能同措辞，digest 规则可识别）');

  // ④ 蓄满释放：召唤链真实执行（mock 无世界书 → 优雅失败行）+ 扣次 + skipCost 不重复扣 MP + 不烧爆发
  rpgWin().eval(`
    heroesData[0].currentDelay.remaining = 0;
    heroesData[0].tp = 100; heroesData[0].burstActivated = true;
    battleHistory = []; _historyRawCache = '';
  `);
  await rpgWin().releaseCharge();
  const rel = rpgWin().eval('(function(){ var h = heroesData[0]; return { mp: h.mp, tp: h.tp, burst: h.burstActivated, uses: h.items[0].usesRemaining, hist: battleHistory.join("|") }; })()');
  check(/召唤「幻梦行军兽」失败：未找到图鉴词条/.test(rel.hist), '蓄满释放：召唤分支真实执行（mock 无图鉴 → 优雅失败行，不再静默无召唤）');
  check(/🎒 持钥人 对 持钥人 使用了【蝎眼钥匙】/.test(rel.hist), '蓄满释放：物品战报行（自施措辞）');
  check(rel.uses === 0, '蓄满释放：道具次数经 executeSkillAction 扣减（1→0）');
  check(rel.mp === 80, '蓄满释放：释放时 skipCost 不重复扣 MP');
  check(rel.tp === 100 && rel.burst === true, '蓄满释放：物品不触发极限爆发（满 TP 与爆发态保留）');

  // ⑤ 物品组子技能 [延迟]：路由走蓄力 + 押注 + 释放扣父库存（父名·子名战报）
  rpgWin().eval(`
    var _g = parseItem('【化尘者之瓶】[道具][次数:1]');
    _g.children = [parseSkill('【瓶中之物】[召唤:化尘者][MP:5][延迟:2][法术]')];
    heroesData[0].items = [_g];
    heroesData[0].mp = 100; heroesData[0].currentDelay = null; state.isAnimating = false;
    window.__t30.path = null;
    window.__t30ChargeG = window.handleChargeGroupedItem;
    window.handleChargeGroupedItem = async () => { window.__t30.path = 'charge'; };
  `);
  await rpgWin().prepareGroupedItemSkill(0, 0);
  check(rpgWin().__t30.path === 'charge', '子技能召唤+延迟：走蓄力入口（不再直连执行）');
  rpgWin().eval(`
    window.handleChargeGroupedItem = window.__t30ChargeG;
    heroesData[0].mp = 100; heroesData[0].currentDelay = null; state.isAnimating = false;
    battleHistory = []; _historyRawCache = '';
  `);
  await rpgWin().prepareGroupedItemSkill(0, 0);
  const gcd = rpgWin().eval('(function(){ var h = heroesData[0], c = h.currentDelay; return { remaining: c ? c.remaining : null, mp: h.mp, name: c && c.skill ? c.skill.name : null, summon: c && c.skill ? c.skill.summonTarget : null }; })()');
  check(gcd.remaining === 2 && gcd.mp === 95, '子技能真实蓄力：remaining=2 且 MP 押注扣除（100-5）');
  check(gcd.name === '化尘者之瓶·瓶中之物' && gcd.summon === '化尘者', '子技能蓄力槽：父名·子名 + 召唤目标保留');
  rpgWin().eval('heroesData[0].currentDelay.remaining = 0;');
  await rpgWin().releaseCharge();
  const grel = rpgWin().eval('(function(){ var h = heroesData[0]; return { uses: h.items[0].usesRemaining, mp: h.mp, hist: battleHistory.join("|") }; })()');
  check(grel.uses === 0 && grel.mp === 95, '子技能蓄满释放：父道具次数扣减（1→0）且不重复扣 MP');
  check(/召唤「化尘者」失败：未找到图鉴词条/.test(grel.hist), '子技能蓄满释放：召唤分支执行');

  // ⑥ roster 旧档合并保护：旧版持久化物品（无召唤/延迟/MP/children 键）不清洗 YAML 新字段与组结构
  MOCK.api.insertOrAssignVariables(
    { rpg_combat_roster: { version: 1, heroes: [{ name: '持钥人', config: {}, skills: [], items: [
      { name: '蝎眼钥匙', category: '道具', count: 1, maxUses: 1, bindings: [], type: '[单防]', power: 10 },
      { name: '化尘者之瓶', category: '道具', count: 1, maxUses: 1, bindings: [], type: '[无]', power: 0 }
    ] }] } },
    { type: 'chat' }
  );
  rpgWin().eval(`
    state.isAnimating = false; heroesData[0].currentDelay = null;
    heroesData[0].items = [parseItem(${JSON.stringify(ITEM_DELAY)})];
    var _g2 = parseItem('【化尘者之瓶】[道具][次数:1]');
    _g2.children = [parseSkill('【瓶中之物】[召唤:化尘者][MP:5][延迟:2][法术]')];
    heroesData[0].items.push(_g2);
    applyPersistedRoster();
  `);
  const mrg = rpgWin().eval('(function(){ var k = heroesData[0].items.find(i=>i.name==="蝎眼钥匙"); var b = heroesData[0].items.find(i=>i.name==="化尘者之瓶"); return { summon: k.summonTarget||null, delay: k.delay||0, cost: k.cost||0, maxUses: k.maxUses||0, children: b.children ? b.children.length : 0, childDelay: b.children && b.children[0] ? (b.children[0].delay||0) : null }; })()');
  check(mrg.summon === '幻梦行军兽' && mrg.delay === 2 && mrg.cost === 20, 'roster 旧档合并：YAML 物品的召唤/延迟/MP 保留（旧档无键不覆盖）');
  check(mrg.maxUses === 1, 'roster 合并：持久化次数定义照常生效');
  check(mrg.children === 1 && mrg.childDelay === 2, 'roster 旧档合并：物品组 children 与子技能延迟不再被清洗丢失');

  // ⑦ 清理：恢复桩函数与全局态，roster 种子失效化（防复跑影响早前测试）
  rpgWin().eval(`

/* ================= 断言 31：散射/群散射（护甲×3）+ 转火 + 弹药按发消耗 + (霰弹)特效 =================
   回归锁（V11.13）：[散射]/[群散射] 是全新伤害标签——此前"散射"不在任何 isDamage 关键词里，写入技能只扣
   MP 零伤害；护甲×3 经 calculateDamage 第 4 参贯穿主管线与伤害预览；[转火] 修复多段攻击主目标死亡后
   后置段空转（随机转向其他存活敌人，近战仍限前排）；[绑定:*N] 从释放时一次性扣除改为按伤害段逐发
   配额（余数给前面的发；被闪避照扣；未开火的段不扣；无伤害段兜底维持一次性全额）。 */

  check(sk.type === '[散射(霰弹)]' && sk.power === 140 && sk.type2 === '[散射(霰弹)]' && sk.power2 === 140, '散射双槽解析：两段 [散射(霰弹)] power 140');
  check(sk.switchTarget === true, '[转火] → skill.switchTarget');
  check(sk.damageType === '近战' && sk.hit === 150, '[近战]/[Aim:150] 照常解析（不占槽）');
  check(ev('parseSkill("【简写】[散射:160]").type') === '[散射]' && ev('parseSkill("【简写】[散射:160]").power') === 160, '冒号简写 [散射:160] 归一入主槽（SKILL_TYPES 白名单）');
  const skG = ev('parseSkill("【扇面压制】[群散射(霰弹);power:90][远程]")');
  check(skG.type === '[群散射(霰弹)]' && skG.power === 90, '[群散射(霰弹)] 槽位解析');
  check(ev('classifySkill(parseSkill("【A】[散射;power:100]")).hasEnemyTargetTag') === true, 'classifySkill：[散射] 进敌方选目标');
  check(ev('classifySkill(parseSkill("【B】[群散射;power:100]")).hasEnemyTargetTag') === false, 'classifySkill：[群散射] 不进选目标（AoE 免选）');
  check(ev('parseItem("【战术霰弹枪】[道具][次数:3][散射(霰弹);power:100][转火]").switchTarget') === true, 'parseItem [转火] 镜像解析');
  check(ev('itemToPseudoSkill(parseItem("【战术霰弹枪】[道具][次数:3][散射(霰弹);power:100][转火]")).switchTarget') === true, 'itemToPseudoSkill 透传 switchTarget');
  const it31 = ev('parseItem("【12号鹿弹】[弹药][数量:12][绑定:双管鹿弹*2]")');
  check(it31.category === '弹药' && it31.count === 12 && it31.bindings[0].skillName === '双管鹿弹' && it31.bindings[0].cost === 2, '弹药物品 [绑定:技能*2] 解析');

  // --- ② 公式层（直调，确定性） ---
  const tgt = JSON.stringify({ id: 'e_formula', name: '公式靶', isAlive: true, hp: 500, maxHp: 500, def: 40, spd: 50, buffs: [], shield: 0 });
  eq(ev('calculateDamage(200, ' + tgt + ', false, 3).hpDmg'), 80, 'calculateDamage：200 威力 vs 40 护甲 ×3 → 80（200-120）');
  eq(ev('calculateDamage(200, ' + tgt + ', false).hpDmg'), 160, 'calculateDamage 默认 ×1 回归不变（200-40）');
  eq(ev('calculateDamage(200, ' + tgt + ', true, 3).hpDmg'), 200, '穿透不受护甲倍率影响');

  // --- ③ 配额函数（纯函数） ---
  eq(ev('ammoQuotaForShot(2,2,1)'), 1, '配额：*2 绑定 2 段 → 第1发 1');
  eq(ev('ammoQuotaForShot(2,2,2)'), 1, '配额：*2 绑定 2 段 → 第2发 1');
  eq(ev('ammoQuotaForShot(3,3,3)'), 1, '配额：*3 绑定 3 段 → 第3发 1');
  eq(ev('ammoQuotaForShot(2,3,1)'), 1, '配额：*2 绑定 3 段 → 余数给前面（第1发 1）');
  eq(ev('ammoQuotaForShot(2,3,3)'), 0, '配额：*2 绑定 3 段 → 第3发 0');

  // --- ④ 战斗管线脚手架（击杀特写桩化提速；每场景重建战场） ---
  w.eval(`
    window.__t31Cutin = window.playExecutionAnimation; window.playExecutionAnimation = async function(){};
    state.isGameStarted = true; state.isAnimating = false;
  `);
  const mkHero = (skillStr, items) => JSON.stringify({

  check(ev('classifySkill(parseSkill("【A】[麻痹;power:20]")).hasEnemyTargetTag') === true, 'classifySkill：[麻痹] 进敌方选目标');

  // --- ② 施加层：叠层 + 闪避下降 + 僵直概率封顶 ---
  const hero = heroSpec({ name: '雷霆法师', hp: 100, maxHp: 100, atk: 10, skills: [ev('parseSkill("【雷霆轰击】[单体;power:80][麻痹;power:25][必中]")')] });

  w.eval('enemiesData = [' + enemyJson + '];');
  await w.eval('executeSkillAction(heroesData[0], enemiesData[0], heroesData[0].skills[0], 1, false, true)');
  let r = ev('(function(){ var e = enemiesData[0]; var ls = e.buffs.filter(function(b){ return b.type==="paralyze"; }); return { layers: ls.length, evaSum: ls.reduce(function(s,b){ return s+b.value; },0), dur: ls[0] ? ls[0].duration : 0, hist: battleHistory.join("|") }; })()');
  eq(r.layers, 1, '首次命中：1 层麻痹');
  eq(r.evaSum, -25, '1 层 → 闪避 -25');
  check(/被电流侵蚀而麻痹（第1层）/.test(r.hist), '麻痹施加战报行（第1层）');

  // 再命中两次 → 3 层；闪避合计 -75
  await w.eval('executeSkillAction(heroesData[0], enemiesData[0], heroesData[0].skills[0], 1, false, true)');
  await w.eval('executeSkillAction(heroesData[0], enemiesData[0], heroesData[0].skills[0], 1, false, true)');
  r = ev('(function(){ var e = enemiesData[0]; var ls = e.buffs.filter(function(b){ return b.type==="paralyze"; }); return { layers: ls.length, evaSum: ls.reduce(function(s,b){ return s+b.value; },0), stats: getEffectiveStats(e).eva }; })()');
  eq(r.layers, 3, '连中三次：3 层麻痹（叠层）');
  eq(r.evaSum, -75, '3 层合计闪避 -75');
  eq(r.stats, -75, 'getEffectiveStats 闪避结算含麻痹（-75）');

  // --- ③ 封顶：6 层也只到 20%（用魔改 Math.random 稳定掷骰） ---
  w.eval('enemiesData[0].buffs.push({ type:"paralyze", value:-25, duration:3 });'); // 4 层
  check(ev('Math.min(20, enemiesData[0].buffs.filter(function(b){return b.type==="paralyze";}).length * 5)') === 20, '4 层即封顶 20%');

  // --- ④ 僵直跳行动：掷骰命中 → 跳过 + 消耗一层（先到期先消耗） ---
  w.eval('window.__origRandom = Math.random; Math.random = function(){ return 0; };'); // 0 < skipChance 恒真
  w.eval('battleHistory = []; _historyRawCache = ""; state.actionQueue = [{ type:"enemy", ref: enemiesData[0] }]; state.queueIndex = 0; state.isGameStarted = true;');

  r = ev('(function(){ var e = enemiesData[0]; return { para: e.buffs.filter(function(b){ return b.type==="paralyze"; }).length, atk: e.buffs.filter(function(b){ return b.type==="atk"; }).length, hist: battleHistory.join("|") }; })()');
  eq(r.para, 0, '驱散清除麻痹层');

  // --- ⑦ 战报摘要解析：麻痹施加/僵直行被 DIGEST_RULES 吸收（token 挂在动作锚点或独立事件行） ---
  const dig = ev('(function(){ var t = digestTrackTiers(mergeDigest(parseBattleDigest("> 雷霆法师 对 麻痹靶 发动了【雷霆轰击】\\n   ↳ 麻痹靶 被电流侵蚀而麻痹（第2层），闪避率下降 25 点 持续3回合，行动僵直概率 10%！\\n   ↳ 麻痹靶 被电流侵蚀而麻痹（第3层），闪避率下降 25 点 持续3回合，行动僵直概率 15%！"))); var f = []; t.rounds.forEach(function(r){ r.items.forEach(function(it){ (it.tokens || []).forEach(function(k){ if (k.token === "麻痹靶被麻痹") f.push(k.token); }); }); }); return f.length; })()');

  const dig2 = ev('parseBattleDigest("   🌀 [麻痹靶] 因麻痹僵直，无法行动！").rounds.length');

    heroesData = []; enemiesData = []; battleHistory = []; _historyRawCache = "";
    state.actionQueue = []; state.queueIndex = 0; state.isGameStarted = false;
  `);
}

    return { nodes: nodes, kf: kf, shake: shake ? shake.className.indexOf('aegis-shake-soft') >= 0 : false };
  })()`);
  check(mid.kf, '新 keyframes 已被样式表收录（CSSOM 可解析）');
  check(mid.nodes >= 4, '障壁术演出节点已挂载（主晶盾+激波环+碎片 ≥4 个，实挂 ' + mid.nodes + '）');
  check(mid.shake, '战场景容器挂上 aegis-shake-soft 微震');
  await sleep(1600);
  const late = w.eval('(function(){ return document.querySelectorAll(\'[style*="aegis-core-assemble"], [style*="aegis-shock-ring"], [style*="aegis-shard-tl"], div[style*="z-index: 180"], div[style*="z-index:180"]\').length; })()');
  eq(late, 0, '障壁术演出节点 1.5s 后自动清理（零残留）');
  w.eval('try { playNakTithChime(); } catch (e) { window.__t33chimeErr = String(e); }');
  check(!w.eval('window.__t33chimeErr || ""'), 'playNakTithChime 528Hz 奇迹音叉可调用不抛错');
  w.eval('window.__t33err = undefined; window.__t33chimeErr = undefined;');

  // --- ④ 屏障罩位：召唤行在场时屏障钉在英雄行范围（top/height 内联钉位，不随容器罩召唤行） ---
  MOCK.resetVars(); seedChat(); seedState();
  injectHeroes([
    heroSpec({ id: 'hza', name: '罩位甲', hp: 100, maxHp: 100 }),
    heroSpec({ id: 'hzb', name: '罩位乙', hp: 100, maxHp: 100 }),
  ]);
  w.eval('initUI()');
  const cov = w.eval(`(function(){
    var c = document.getElementById('heroes-container');
    // 塞一个高 90px 的假召唤行（模拟召唤物在场把容器撑高），插在屏障横幅之后、英雄行之前；
    // 必须跨满整行（grid-column:1/-1），否则只占一格不把英雄行推下，罩位断言失真
    var row = document.createElement('div'); row.id = 'ally-summon-row'; row.style.cssText = 'height:90px;grid-column:1/-1;display:block;';
    c.insertBefore(row, c.children[1] || null);
    var wraps = [], i, el;
    for (i = 0; i < c.children.length; i++) { el = c.children[i]; if (el.id && el.id.indexOf('hero-wrap-') === 0) wraps.push(el); }
    var firstTop = Math.min.apply(null, wraps.map(function(x){ return x.offsetTop; }));
    var lastBottom = Math.max.apply(null, wraps.map(function(x){ return x.offsetTop + x.offsetHeight; }));
    teamBarrier = 100; teamBarrierMax = 100;
    updateTeamBarrierUI();
    var wEl = document.getElementById('team-barrier-wrapper');
    var top = parseFloat(wEl.style.top), height = parseFloat(wEl.style.height);
    var bottom = top + height;
    var shown = wEl.style.display !== 'none';
    // 复原：摘召唤行、清屏障
    teamBarrier = 0; teamBarrierMax = 0; updateTeamBarrierUI();
    row.remove();
    // 召唤行移除后再展开一次：英雄行上移，屏障应随之上移（动态重钉）
    teamBarrier = 100; teamBarrierMax = 100;
    updateTeamBarrierUI();
    var top2 = parseFloat(document.getElementById('team-barrier-wrapper').style.top);
    teamBarrier = 0; teamBarrierMax = 0; updateTeamBarrierUI();
    return { wraps: wraps.length, shown: shown, top: top, height: height, bottom: bottom, firstTop: firstTop, lastBottom: lastBottom, top2: top2 };
  })()`);
  check(cov.wraps >= 2, 'initUI 渲染出英雄卡片（hero-wrap ×' + cov.wraps + '）');
  check(cov.shown, '屏障值 >0 时 wrapper 显示');
  check(!isNaN(cov.top) && cov.top > 0, '屏障顶部已内联钉位且为正值（top=' + cov.top + '，修复前为容器顶 inset -10 罩住召唤行）');
  check(Math.abs(cov.top - (cov.firstTop - 10)) <= 1, '罩位上缘 == 首英雄卡顶 -10px（' + cov.top + ' vs ' + (cov.firstTop - 10) + '）');
  check(Math.abs(cov.bottom - (cov.lastBottom + 10)) <= 1, '罩位下缘 == 末英雄卡底 +10px（' + cov.bottom + ' vs ' + (cov.lastBottom + 10) + '）');
  check(cov.top2 < cov.top, '召唤行移除后重钉：屏障随英雄行上移（' + cov.top + ' → ' + cov.top2 + '）');

  // --- ⑤ 清理 ---
  w.eval('heroesData = []; enemiesData = []; teamBarrier = 0; teamBarrierMax = 0; updateTeamBarrierUI();');
}

/* ---------------- 运行 ---------------- */
async function runAll() {
  logEl.textContent = '';
  passN = failN = 0;
  const statEl = document.getElementById('stat');
  statEl.className = 'info';
  statEl.textContent = '运行中…';
  const tests = [test1, test2, test3, test4, test5, test6, test7, test8, test9, test10, test11, test12, test13, test14, test15, test16, test17, test18, test19, test20, test21, test22, test23, test24, test25, test26, test27, test28, test29, test30, test31, test32, test33];
  for (const t of tests) {
    try { await t(); }
    catch (e) { bad(t.name + ' 抛出异常', String((e && e.stack) || e)); }
  }
  out('head', '\n== 汇总 ==');
  out(failN ? 'fail' : 'pass', '  通过 ' + passN + ' 项，失败 ' + failN + ' 项');
  statEl.className = failN ? 'fail' : 'pass';
  statEl.textContent = failN ? '✗ ' + failN + ' 项失败' : '✓ 全部 ' + passN + ' 项通过';
}

(async function boot() {
  const statEl = document.getElementById('stat');
  try {
    seedChat();
    // 关掉 MMS 的 boot 期自动更新：mock 里没挂 genResponder 时它的三次重试（退避 1s/2s）
    // 可能跨进 test1 的计数窗口，造成 generateRaw 计数抖动；测试全部直调 runUpdate，不受影响
    MOCK.api.insertOrAssignVariables({ $mms_config: { autoUpdate: false } }, { type: 'global' });
    mmsFrame = await mountFrame('mms', '../../MiniMapStatus/MiniMapStatus.html', '../../MiniMapStatus/',
      (w) => w.MMS && typeof w.mmsBuildCombatResult === 'function');
    rpgFrame = await mountFrame('rpg', '../index.html', '../',
      (w) => typeof w.showBattleResult === 'function' && typeof w.exportCombatResultToStatus === 'function');
    await sleep(600); // 等两侧 boot 的异步收尾
    statEl.textContent = '两个应用已挂载，点「运行全部断言」';
    document.getElementById('run').addEventListener('click', runAll);
  } catch (e) {
    statEl.className = 'fail';
    statEl.textContent = '挂载失败：' + e.message + '（本页需通过 http 打开，不能用 file://）';
  }
})();
</script>
