<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1920s 远程击杀处决特效演练场</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@1,900&family=Special+Elite&display=swap');
    
    body { font-family: 'Noto Sans SC', sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-playfair { font-family: 'Playfair Display', serif; }
    .font-typewriter { font-family: 'Special Elite', monospace; }
    
    .glass-panel {
      background: rgba(20, 25, 35, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    .text-outline-thick {
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 25px rgba(0,0,0,1);
    }
    .text-outline-crimson {
      text-shadow: -2px -2px 0 #3f0000, 2px -2px 0 #3f0000, -2px 2px 0 #3f0000, 2px 2px 0 #3f0000, 0 0 35px #991b1b;
    }

    .heavy-shake { animation: heavy-shake-anim 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes heavy-shake-anim {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      20%, 60% { transform: translate3d(-12px, 5px, 0) scale(1.025) rotate(-1.2deg); }
      30%, 70% { transform: translate3d(14px, -6px, 0) scale(1.035) rotate(1.5deg); }
      40% { transform: translate3d(-16px, 4px, 0) scale(1.015) rotate(-2deg); }
      50% { transform: translate3d(12px, -3px, 0) scale(1.02) rotate(1deg); }
      80% { transform: translate3d(6px, 2px, 0) scale(1) rotate(0.5deg); }
    }

    /* ==== 时间轴导轨与徽章 ==== */
    .timeline-rail {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 2px;
      background: linear-gradient(180deg, rgba(6,182,212,0.6) 0%, rgba(245,158,11,0.6) 50%, rgba(244,63,94,0.6) 100%);
      box-shadow: 0 0 8px rgba(6,182,212,0.4);
    }
    .rail-pulse-beam {
      position: absolute;
      width: 100%; height: 40px;
      background: linear-gradient(180deg, transparent, #38bdf8, transparent);
      animation: railPulse 2.6s linear infinite;
    }
    @keyframes railPulse {
      0% { top: -40px; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* ========================================================
       1920s 远程处决动画核心 KEYFRAMES（纯 GPU Transform 硬件加速）
       ======================================================== */
    
    /* 入场英雄（左侧老照片/黄铜视窗） */
    @keyframes v-hero-in {
      0% { transform: translateX(-60vw) skewX(8deg); opacity: 0; }
      70% { transform: translateX(12px) skewX(-2deg); opacity: 1; }
      100% { transform: translateX(0) skewX(0); opacity: 1; }
    }

    /* 方案 1：【芝加哥打字机】老式转盘准星锁入 + 剧烈微颤 */
    @keyframes v1-tommy-scope {
      0% { transform: translate(-50%, -50%) scale3d(2.6, 2.6, 1) rotate(45deg); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale3d(0.92, 0.92, 1) rotate(-8deg); opacity: 1; }
      25% { transform: translate(-50%, -50%) scale3d(1.05, 1.05, 1) rotate(4deg); opacity: 1; }
      35% { transform: translate(-50%, -50%) scale3d(0.98, 0.98, 1) rotate(-2deg); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale3d(1.02, 1.02, 1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale3d(1.25, 1.25, 1) rotate(15deg); opacity: 0; }
    }
    /* 连续多道金红弹道曳光 */
    @keyframes v1-tracer-fire {
      0% { transform: translate(-50%, -50%) scaleX(0) scaleY(1.2); opacity: 0; }
      15% { transform: translate(-50%, -50%) scaleX(1) scaleY(1); opacity: 1; }
      35% { transform: translate(-50%, -50%) scaleX(1) scaleY(0.6); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scaleX(1.15) scaleY(0); opacity: 0; }
    }
    /* 敌人千疮百孔多向碎裂 */
    @keyframes v1-enemy-shatter-tl {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(-70px, -65px, 0) rotate(-25deg) scale(0.6); opacity: 0; filter: brightness(1.3) contrast(1.2); }
    }
    @keyframes v1-enemy-shatter-tr {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(75px, -55px, 0) rotate(30deg) scale(0.6); opacity: 0; filter: brightness(1.3) contrast(1.2); }
    }
    @keyframes v1-enemy-shatter-bl {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(-60px, 70px, 0) rotate(-35deg) scale(0.5); opacity: 0; filter: brightness(0.2); }
    }
    @keyframes v1-enemy-shatter-br {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(65px, 75px, 0) rotate(40deg) scale(0.5); opacity: 0; filter: brightness(0.2); }
    }

    /* 方案 2：【春田猎枪】老式黄铜双圈十字瞄具 + 单发重弹贯穿 */
    @keyframes v2-brass-scope {
      0% { transform: translate(-50%, -50%) scale3d(2.8, 2.8, 1); opacity: 0; filter: blur(4px); }
      20% { transform: translate(-50%, -50%) scale3d(1, 1, 1); opacity: 1; filter: blur(0px); }
      75% { transform: translate(-50%, -50%) scale3d(1.03, 1.03, 1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale3d(1.3, 1.3, 1); opacity: 0; }
    }
    @keyframes v2-bullet-shock {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(2.4); opacity: 0.85; }
      100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
    }
    @keyframes v2-enemy-split-l {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(-85px, -30px, 0) rotate(-18deg); opacity: 0; filter: brightness(1.3); }
    }
    @keyframes v2-enemy-split-r {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(85px, 30px, 0) rotate(18deg); opacity: 0; filter: brightness(0.25); }
    }

    /* 方案 3：【堑壕霰弹】粗重环形霰弹准星 + 暴烈散射轰飞 */
    @keyframes v3-shotgun-reticle {
      0% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
      18% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; }
      28% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      75% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
    }
    @keyframes v3-shrapnel-1 { 0%{transform:translate3d(0,0,0);} 100%{transform:translate3d(-110px,-80px,0) rotate(-45deg) scale(0.3); opacity:0; filter:brightness(1.4);} }
    @keyframes v3-shrapnel-2 { 0%{transform:translate3d(0,0,0);} 100%{transform:translate3d(110px,-75px,0) rotate(50deg) scale(0.3); opacity:0; filter:brightness(1.4);} }
    @keyframes v3-shrapnel-5 { 0%{transform:translate3d(0,0,0);} 100%{transform:translate3d(0px,-110px,0) rotate(15deg) scale(0.35); opacity:0; filter:brightness(1.3);} }
    @keyframes v3-shrapnel-3 { 0%{transform:translate3d(0,0,0);} 100%{transform:translate3d(-100px,90px,0) rotate(-60deg) scale(0.2); opacity:0; filter:brightness(0.3);} }
    @keyframes v3-shrapnel-4 { 0%{transform:translate3d(0,0,0);} 100%{transform:translate3d(105px,85px,0) rotate(55deg) scale(0.2); opacity:0; filter:brightness(0.3);} }

    /* 方案 4：【冷血私探·左轮处刑】黑白胶片光影 + 极简铁缺口准星 */
    @keyframes v4-revolver-iron {
      0% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
      22% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      75% { transform: translate(-50%, -50%) scale(1.02); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
    }
    @keyframes v4-noir-split-l {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(-90px, -45px, 0) rotate(-22deg); opacity: 0; filter: grayscale(1) brightness(1.5); }
    }
    @keyframes v4-noir-split-r {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(90px, 45px, 0) rotate(22deg); opacity: 0; filter: grayscale(1) brightness(0.15); }
    }

    /* ==== 艺术字冲击动效 ==== */
    @keyframes v-stamp-text {
      0% { transform: translate(-50%, -50%) scale(3.6) rotate(-6deg); opacity: 0; filter: blur(12px); }
      16% { transform: translate(-50%, -50%) scale(0.92) rotate(-2deg); opacity: 1; filter: blur(0); }
      26% { transform: translate(-50%, -50%) scale(1.08) rotate(-1deg); opacity: 1; }
      75% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.22) rotate(3deg); opacity: 0; }
    }

    /* ==== 屏幕/镜头溅血特效动画 (Lens Blood Splatter) ==== */
    @keyframes blood-splat-burst {
      0% { transform: scale(0.15) rotate(var(--splat-rot, 0deg)); opacity: 0; }
      25% { transform: scale(1.08) rotate(var(--splat-rot, 0deg)); opacity: 1; }
      40% { transform: scale(1) rotate(var(--splat-rot, 0deg)); opacity: 0.95; }
      80% { transform: scale(1) translateY(4px) rotate(var(--splat-rot, 0deg)); opacity: 0.85; }
      100% { transform: scale(1.05) translateY(10px) rotate(var(--splat-rot, 0deg)); opacity: 0; }
    }
    @keyframes blood-drip-flow {
      0% { transform: scaleY(0); opacity: 0; transform-origin: top; }
      30% { transform: scaleY(1); opacity: 0.95; }
      75% { transform: scaleY(1.05) translateY(6px); opacity: 0.85; }
      100% { transform: scaleY(1.1) translateY(14px); opacity: 0; }
    }
    @keyframes blood-vignette-pulse {
      0% { opacity: 0; transform: scale(0.9); }
      20% { opacity: 1; transform: scale(1); }
      75% { opacity: 0.85; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(1.05); }
    }
  </style>
</head>
<body class="w-full h-[100dvh] min-h-[600px] bg-black text-gray-100 overflow-hidden relative select-none">
  
  <!-- 顶部极简方案切换控制栏（无长篇废话，纯净交互） -->
  <div class="fixed top-2 left-1/2 -translate-x-1/2 z-[100] flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 px-3 py-2 glass-panel rounded-full border border-amber-900/60 shadow-2xl">
    <div class="flex items-center gap-1 bg-black/60 p-1 rounded-full border border-amber-500/30">
      <button onclick="setScheme(1)" id="btn-sch-1" class="px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all bg-red-800 text-white shadow-md">
        1. 芝加哥打字机 (.45)
      </button>
      <button onclick="setScheme(2)" id="btn-sch-2" class="px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all text-amber-200/70 hover:text-white">
        2. 春田重猎 (M1903)
      </button>
      <button onclick="setScheme(3)" id="btn-sch-3" class="px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all text-amber-200/70 hover:text-white">
        3. 堑壕猎杀 (M1897)
      </button>
      <button onclick="setScheme(4)" id="btn-sch-4" class="px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all text-amber-200/70 hover:text-white">
        4. 冷血私探 (.38)
      </button>
    </div>

    <div class="h-4 w-[1px] bg-white/20 hidden sm:block"></div>

    <div class="flex items-center gap-1 bg-black/60 p-1 rounded-full border border-gray-700">
      <button onclick="setTargetCount(1)" id="btn-tgt-1" class="px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">1敌</button>
      <button onclick="setTargetCount(2)" id="btn-tgt-2" class="px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono text-gray-400 hover:text-white">2敌</button>
      <button onclick="setTargetCount(3)" id="btn-tgt-3" class="px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono text-gray-400 hover:text-white">3敌</button>
    </div>

    <button onclick="triggerExecution()" class="px-4 py-1.5 bg-gradient-to-r from-red-700 via-rose-600 to-amber-700 hover:from-red-600 hover:to-amber-600 text-white rounded-full text-xs font-bold tracking-widest shadow-[0_0_15px_rgba(220,38,38,0.7)] transform hover:scale-105 active:scale-95 transition-all flex items-center gap-1">
      <span>💥 触发处决</span>
    </button>
  </div>

  <!-- 顶部右侧系统功能徽章（1:1复刻） -->
  <div class="absolute top-3 right-3 z-50 flex gap-1.5">
    <div class="glass-panel px-3 py-1.5 rounded-full text-xs font-bold text-amber-400 flex items-center gap-1">
      <span>🏟️</span> <span>有备而来</span>
    </div>
    <div class="glass-panel px-3 py-1.5 rounded-full text-xs font-bold text-purple-400 flex items-center gap-1">
      <span>📜</span> <span>记录</span>
    </div>
    <div class="glass-panel px-3 py-1.5 rounded-full text-xs font-bold text-yellow-500 flex items-center gap-1">
      <span>⚙️</span> <span>设置</span>
    </div>
  </div>

  <!-- 全屏战场区域（1:1复刻战斗场景） -->
  <div class="absolute inset-0 bg-gradient-to-br from-[#121624] via-[#0d121c] to-[#1c0f18] overflow-hidden z-0" id="battle-scene">
    <div class="absolute inset-0 opacity-25 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-600/30 via-red-950/20 to-black"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/90 via-black/40 to-transparent z-0"></div>
    
    <!-- 左侧：行动顺序队列与能量导轨（1:1复刻） -->
    <div class="absolute left-3 top-20 bottom-44 w-12 z-30 flex flex-col items-center select-none">
      <div class="relative w-full h-full flex flex-col items-center">
        <div class="timeline-rail">
          <div class="rail-pulse-beam"></div>
        </div>
        <div class="relative w-full h-full flex flex-col gap-2.5 items-center py-3">
          <div class="w-10 h-10 rounded-full border-2 border-amber-400 bg-slate-900 shadow-[0_0_12px_rgba(245,158,11,0.6)] overflow-hidden relative">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120" class="w-full h-full object-cover">
            <span class="absolute -bottom-0.5 -right-0.5 bg-cyan-600 text-[8px] font-bold px-1 rounded-full">#1</span>
          </div>
          <div class="w-9 h-9 rounded-full border border-rose-500 bg-slate-900 shadow-md overflow-hidden opacity-90 relative">
            <div class="w-full h-full flex items-center justify-center text-lg">🧟</div>
            <span class="absolute -bottom-0.5 -right-0.5 bg-rose-700 text-[8px] font-bold px-1 rounded-full">#2</span>
          </div>
          <div class="w-9 h-9 rounded-full border border-rose-500 bg-slate-900 shadow-md overflow-hidden opacity-80 relative">
            <div class="w-full h-full flex items-center justify-center text-lg">🐺</div>
            <span class="absolute -bottom-0.5 -right-0.5 bg-rose-700 text-[8px] font-bold px-1 rounded-full">#3</span>
          </div>
          <div class="w-9 h-9 rounded-full border border-cyan-400 bg-slate-900 shadow-md overflow-hidden opacity-75 relative">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120" class="w-full h-full object-cover">
            <span class="absolute -bottom-0.5 -right-0.5 bg-cyan-600 text-[8px] font-bold px-1 rounded-full">#4</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 战场中央敌人区域（1:1复刻卡牌与血条） -->
    <div id="enemies-area" class="absolute inset-0 z-10 flex flex-wrap items-center justify-center gap-12 sm:gap-20 pb-40 px-8 transition-all duration-300">
      <!-- 动态注入敌人 -->
    </div>
  </div>

  <!-- 底部英雄栏与右侧行动面板（1:1复刻） -->
  <div class="absolute bottom-[48px] left-0 w-full px-4 sm:px-8 flex items-end justify-between gap-4 z-20 pointer-events-none pb-2">
    <!-- 英雄卡牌栏 -->
    <div class="w-full max-w-2xl grid grid-cols-4 gap-2.5 pointer-events-auto">
      <!-- 1号位（神枪手/调查员） -->
      <div class="glass-panel p-2 rounded-xl border-2 border-amber-500/70 shadow-[0_0_15px_rgba(245,158,11,0.3)] bg-gradient-to-b from-amber-950/40 to-slate-900/80">
        <div class="flex items-center gap-1.5 mb-1.5">
          <div class="w-8 h-8 rounded-full overflow-hidden border border-amber-400 shadow shrink-0">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120" class="w-full h-full object-cover">
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[11px] font-bold text-amber-200 truncate">艾莲娜·私探</div>
            <div class="text-[9px] text-amber-400/80 font-mono">神枪手 / 120速</div>
          </div>
        </div>
        <div class="space-y-1">
          <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 w-[90%]"></div></div>
          <div class="h-1 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-blue-500 w-[75%]"></div></div>
          <div class="h-1 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-amber-400 w-[100%] animate-pulse"></div></div>
        </div>
      </div>
      <!-- 2号位 -->
      <div class="glass-panel p-2 rounded-xl border border-white/10 bg-slate-900/70">
        <div class="flex items-center gap-1.5 mb-1.5">
          <div class="w-8 h-8 rounded-full overflow-hidden border border-gray-500 shrink-0">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120" class="w-full h-full object-cover">
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[11px] font-bold text-gray-200 truncate">爱德华·教士</div>
            <div class="text-[9px] text-gray-400 font-mono">圣职者</div>
          </div>
        </div>
        <div class="space-y-1">
          <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 w-[100%]"></div></div>
          <div class="h-1 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-blue-500 w-[60%]"></div></div>
        </div>
      </div>
      <!-- 3号位 -->
      <div class="glass-panel p-2 rounded-xl border border-white/10 bg-slate-900/70">
        <div class="flex items-center gap-1.5 mb-1.5">
          <div class="w-8 h-8 rounded-full overflow-hidden border border-gray-500 shrink-0">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120" class="w-full h-full object-cover">
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[11px] font-bold text-gray-200 truncate">布莱克·保镖</div>
            <div class="text-[9px] text-gray-400 font-mono">防守者</div>
          </div>
        </div>
        <div class="space-y-1">
          <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 w-[80%]"></div></div>
          <div class="h-1 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-blue-500 w-[40%]"></div></div>
        </div>
      </div>
      <!-- 4号位 -->
      <div class="glass-panel p-2 rounded-xl border border-white/10 bg-slate-900/70">
        <div class="flex items-center gap-1.5 mb-1.5">
          <div class="w-8 h-8 rounded-full overflow-hidden border border-gray-500 shrink-0">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120" class="w-full h-full object-cover">
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[11px] font-bold text-gray-200 truncate">维多利亚·学者</div>
            <div class="text-[9px] text-gray-400 font-mono">施法者</div>
          </div>
        </div>
        <div class="space-y-1">
          <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 w-[95%]"></div></div>
          <div class="h-1 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-blue-500 w-[85%]"></div></div>
        </div>
      </div>
    </div>

    <!-- 右侧行动技能面板 (260px x 172px, 1:1复刻) -->
    <div class="w-[260px] h-[172px] glass-panel rounded-2xl p-2.5 pointer-events-auto flex flex-col justify-between border border-amber-500/30 shadow-2xl">
      <div class="text-[11px] font-bold text-amber-300 pb-1 border-b border-white/10 flex justify-between items-center">
        <span>⚡ 艾莲娜的行动回合</span>
        <span class="text-[9px] text-emerald-400 font-mono">1/1 行动</span>
      </div>
      <div class="grid grid-cols-2 gap-1.5 my-1">
        <button onclick="triggerExecution()" class="p-2 rounded-lg bg-gradient-to-br from-red-950/80 to-slate-900 border border-red-500/40 text-left hover:border-red-400 transition-all">
          <div class="text-[11px] font-bold text-red-200">⚔️ 致命狙杀</div>
          <div class="text-[9px] text-gray-400">[远程;power:380]</div>
        </button>
        <button class="p-2 rounded-lg bg-slate-900/60 border border-white/10 text-left hover:border-blue-400 transition-all">
          <div class="text-[11px] font-bold text-blue-200">⚡ 战术翻滚</div>
          <div class="text-[9px] text-gray-400">[回避][单速]</div>
        </button>
      </div>
      <div class="flex gap-1 text-[10px]">
        <button class="flex-1 py-1 rounded bg-slate-800/80 hover:bg-slate-700 text-gray-300 font-bold border border-white/5">🛡️ 防御</button>
        <button class="flex-1 py-1 rounded bg-slate-800/80 hover:bg-slate-700 text-gray-300 font-bold border border-white/5">💨 撤退</button>
      </div>
    </div>
  </div>

  <!-- 底部对话输入条（1:1复刻） -->
  <div class="fixed bottom-0 left-0 w-full z-40 bg-slate-950/90 border-t border-white/10 px-4 py-2 flex items-center gap-2">
    <div class="w-7 h-7 rounded-full overflow-hidden border border-blue-400 shrink-0">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-full h-full object-cover">
    </div>
    <input type="text" placeholder="输入对话让场上角色回应..." class="flex-1 bg-white/5 border border-white/10 rounded-full px-3 py-1 text-xs text-white outline-none focus:border-amber-500">
    <button class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded-full text-xs font-bold">发送</button>
  </div>

  <script>
    // 状态
    let currentScheme = 1;
    let targetCount = 1;

    // 敌人模板库 (1920s 经典邪神眷族/黑帮打手/食尸鬼)
    const enemyTemplates = [
      { name: '血教异端行刑者', emoji: '🦹', img: 'https://images.unsplash.com/photo-1509281373149-e957c6296406?w=200', hp: '0/160' },
      { name: '疯狂食尸鬼', emoji: '🧟', img: 'https://images.unsplash.com/photo-1568602471122-7832951cc4c5?w=200', hp: '0/120' },
      { name: '深潜者祭司', emoji: '🦑', img: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=200', hp: '0/240' }
    ];

    const heroData = {
      name: '艾莲娜·私探',
      img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=240'
    };

    // 音效模拟 (复用项目高品质音效)
    const sfxUrls = {
      kill: 'https://files.catbox.moe/20yjkp.mp3',
      shot: 'https://files.catbox.moe/3910c0.mp3',
      hitHeavy: 'https://files.catbox.moe/y86g36.mp3'
    };
    const sfxCache = {};
    for (let k in sfxUrls) {
      sfxCache[k] = new Audio(sfxUrls[k]);
      sfxCache[k].preload = 'auto';
    }
    function playSfx(key, vol = 0.5) {
      if (sfxCache[key]) {
        try {
          const snd = sfxCache[key].cloneNode();
          snd.volume = vol;
          snd.play().catch(()=>{});
        } catch(e){}
      }
    }

    function renderEnemies() {
      const container = document.getElementById('enemies-area');
      const list = enemyTemplates.slice(0, targetCount);
      container.innerHTML = list.map((e, idx) => `
        <div class="flex flex-col items-center gap-2 transition-all transform hover:scale-105">
          <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl border-2 border-rose-500/60 bg-slate-900/90 shadow-[0_0_25px_rgba(244,63,94,0.35)] overflow-hidden relative flex items-center justify-center p-1">
            ${e.img ? `<img src="${e.img}" class="w-full h-full object-cover rounded-xl">` : `<div class="text-5xl">${e.emoji}</div>`}
            <span class="absolute top-1 right-1 bg-red-950/80 border border-red-500/50 text-[9px] text-red-200 px-1 rounded">LV.18</span>
          </div>
          <div class="text-center">
            <div class="text-xs sm:text-sm font-bold text-rose-200">${e.name}</div>
            <div class="w-24 bg-gray-800 h-1.5 rounded-full overflow-hidden mt-1 border border-gray-700">
              <div class="bg-red-600 h-full w-full"></div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setScheme(sch) {
      currentScheme = sch;
      for (let i = 1; i <= 4; i++) {
        const btn = document.getElementById(`btn-sch-${i}`);
        if (i === sch) {
          btn.className = 'px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all bg-red-800 text-white shadow-md border border-red-500/60';
        } else {
          btn.className = 'px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all text-amber-200/70 hover:text-white';
        }
      }
    }

    function setTargetCount(cnt) {
      targetCount = cnt;
      for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById(`btn-tgt-${i}`);
        if (i === cnt) {
          btn.className = 'px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40';
        } else {
          btn.className = 'px-2 py-1 rounded-full text-[10px] sm:text-xs font-mono text-gray-400 hover:text-white';
        }
      }
      renderEnemies();
    }

    // ========================================================
    // 4 种 1920s 复古处决方案核心生成器
    // ========================================================

    // 生成屏幕溅血 SVG 与血雾（零 DOM 重绘，极速 GPU 动画）
    function createBloodSplatterHtml(count = 5) {
      // 真实有机血滴与飞溅形状
      const splatters = [
        `M20,10 C35,2 50,15 45,30 C55,40 60,60 45,70 C30,80 15,65 10,50 C5,35 10,18 20,10 Z`,
        `M30,5 C45,5 55,20 50,35 C65,30 75,45 70,60 C55,75 40,70 30,80 C15,75 10,55 15,40 C5,25 20,10 30,5 Z`,
        `M15,20 C30,10 50,10 40,30 C55,35 60,55 45,65 C35,75 20,80 15,60 C5,45 5,30 15,20 Z`
      ];

      let splatItems = '';
      const positions = [
        { top: '15%', left: '18%', scale: 1.3, rot: -25, delay: '0.12s' },
        { top: '68%', left: '22%', scale: 1.1, rot: 45, delay: '0.15s' },
        { top: '22%', right: '16%', scale: 1.5, rot: 15, delay: '0.14s' },
        { top: '62%', right: '20%', scale: 1.2, rot: -60, delay: '0.18s' },
        { top: '42%', left: '48%', scale: 1.6, rot: 10, delay: '0.1s' }
      ];

      for (let i = 0; i < Math.min(count, positions.length); i++) {
        const p = positions[i];
        const path = splatters[i % splatters.length];
        splatItems += `
          <div class="absolute pointer-events-none opacity-0 z-40"
               style="${p.top ? `top:${p.top};` : ''} ${p.left ? `left:${p.left};` : ''} ${p.right ? `right:${p.right};` : ''} width:140px; height:140px; --splat-rot:${p.rot}deg; animation: blood-splat-burst 1.1s ${p.delay} cubic-bezier(0.12, 0.85, 0.25, 1) both; will-change: transform, opacity;">
            <svg viewBox="0 0 100 100" class="w-full h-full fill-red-800 drop-shadow-[0_0_10px_#580c0c]" style="filter: drop-shadow(0 0 8px #3f0000);">
              <path d="${path}" />
              <circle cx="85" cy="20" r="4" class="fill-red-700"/>
              <circle cx="15" cy="88" r="3.5" class="fill-red-900"/>
              <circle cx="90" cy="75" r="5" class="fill-red-800"/>
              <circle cx="5" cy="15" r="3" class="fill-red-700"/>
            </svg>
          </div>
        `;
      }

      // 屏幕两侧向下的血泪/血痕
      const drips = `
        <div class="absolute top-0 right-[28%] w-1 bg-gradient-to-b from-red-700 via-red-900 to-transparent rounded-full opacity-0 z-40 pointer-events-none"
             style="height:120px; animation: blood-drip-flow 1.2s 0.2s ease-out both;"></div>
        <div class="absolute top-0 left-[25%] w-1.5 bg-gradient-to-b from-red-800 via-red-950 to-transparent rounded-full opacity-0 z-40 pointer-events-none"
             style="height:160px; animation: blood-drip-flow 1.3s 0.16s ease-out both;"></div>
      `;

      return splatItems + drips;
    }

    async function triggerExecution() {
      const killedEnemies = enemyTemplates.slice(0, targetCount);
      const n = killedEnemies.length;

      // 尺寸
      const unitSize = n > 2 ? 'clamp(48px,12vh,120px)' : n > 1 ? 'clamp(68px,16vh,160px)' : 'clamp(90px,20vh,190px)';
      const enemyVisual = enemy => enemy.img
        ? `<img src="${enemy.img}" class="w-full h-full object-cover rounded-xl" />`
        : `<div class="text-6xl">${enemy.emoji || '☠️'}</div>`;

      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 z-[200] flex items-center justify-center overflow-hidden transition-opacity duration-300 pointer-events-none';

      let html = '';

      // 播放前摇枪击声
      playSfx('shot', 0.6);
      setTimeout(() => playSfx('kill', 0.8), 220);
      setTimeout(() => playSfx('hitHeavy', 0.7), 240);

      // 屏幕震动
      document.body.classList.add('heavy-shake');
      setTimeout(() => document.body.classList.remove('heavy-shake'), 450);

      // ========================================================
      // 方案 1：【罪恶都市 · 芝加哥打字机】(1920s Tommy Gun .45 ACP)
      // 特点：老式同心刻度转盘准星 + 密集金红弹雨 + 四向崩碎 + 扇形大面积血雾
      // ========================================================
      if (currentScheme === 1) {
        overlay.className += ' bg-black/80';
        const enemiesHtml = killedEnemies.map(enemy => `
          <div class="flex flex-col items-center gap-1.5 shrink-0">
            <div style="width:${unitSize};height:${unitSize};" class="relative flex items-center justify-center">
              <!-- 老式黄铜转盘准星（SVG 硬件加速） -->
              <div class="absolute left-1/2 top-1/2 opacity-0 z-30 pointer-events-none"
                   style="width:125%; height:125%; animation: v1-tommy-scope 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;">
                <svg viewBox="0 0 100 100" class="w-full h-full text-amber-500 stroke-current fill-none" style="filter: drop-shadow(0 0 8px #f59e0b);">
                  <circle cx="50" cy="50" r="44" stroke-width="1.8" stroke-dasharray="10 4" opacity="0.85"/>
                  <circle cx="50" cy="50" r="32" stroke-width="1" opacity="0.7"/>
                  <line x1="50" y1="4" x2="50" y2="30" stroke-width="2.5" stroke="#ef4444"/>
                  <line x1="50" y1="70" x2="50" y2="96" stroke-width="2.5" stroke="#ef4444"/>
                  <line x1="4" y1="50" x2="30" y2="50" stroke-width="2.5" stroke="#ef4444"/>
                  <line x1="70" y1="50" x2="96" y2="50" stroke-width="2.5" stroke="#ef4444"/>
                  <circle cx="50" cy="50" r="4" fill="#dc2626" stroke="none"/>
                </svg>
              </div>
              <!-- 敌人被密集弹雨打成四象限崩碎 -->
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(0 0, 50% 0, 50% 50%, 0 50%); animation: v1-enemy-shatter-tl 0.8s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(50% 0, 100% 0, 100% 50%, 50% 50%); animation: v1-enemy-shatter-tr 0.8s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(0 50%, 50% 50%, 50% 100%, 0 100%); animation: v1-enemy-shatter-bl 0.8s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(50% 50%, 100% 50%, 100% 100%, 50% 100%); animation: v1-enemy-shatter-br 0.8s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
            </div>
            <div class="text-rose-400 font-mono text-[10px] sm:text-xs font-bold tracking-widest whitespace-nowrap drop-shadow">${enemy.name}</div>
          </div>
        `).join('');

        html = `
          <!-- 镜头暗红血圈 (Lens Vignette) -->
          <div class="absolute inset-0 pointer-events-none z-10 opacity-0"
               style="background: radial-gradient(circle, transparent 35%, rgba(136,8,8,0.4) 65%, rgba(63,0,0,0.85) 100%); animation: blood-vignette-pulse 1.1s cubic-bezier(0.1, 0.8, 0.2, 1) both;"></div>

          <!-- 左侧 1920s 怀旧档案相框 -->
          <div class="absolute left-[8vw] top-1/2 -translate-y-1/2 opacity-0 z-20"
               style="animation: v-hero-in 0.28s cubic-bezier(0.12, 0.8, 0.3, 1) both; will-change: transform, opacity;">
            <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-xl border-2 border-amber-600/80 bg-stone-900/95 shadow-[0_0_30px_rgba(217,119,6,0.4)] p-1.5 relative overflow-hidden">
              <div class="absolute top-1 left-2 text-[9px] font-bold text-amber-400 tracking-wider">档案: ${heroData.name}</div>
              <img src="${heroData.img}" class="w-full h-full object-cover rounded filter contrast-125 sepia-[0.25]">
            </div>
          </div>

          <!-- 居中 1920s 血印大字 -->
          <div class="absolute left-1/2 top-1/2 opacity-0 z-30 flex flex-col items-center"
               style="animation: v-stamp-text 1.15s 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;">
            <div class="font-cinzel text-[clamp(3.8rem,9.5vw,9rem)] font-black text-transparent bg-clip-text bg-gradient-to-b from-amber-100 via-red-500 to-rose-900 text-outline-crimson tracking-wider whitespace-nowrap">
              ${n > 1 ? '歼 灭' : '处 决'}
            </div>
          </div>

          <!-- 右侧目标区 -->
          <div class="absolute right-[8vw] top-1/2 -translate-y-1/2 z-20 flex items-center gap-3">
            ${enemiesHtml}
          </div>

          <!-- 金红弹道贯穿火光 -->
          <div class="absolute left-1/2 top-1/2 w-[160vw] h-2 bg-gradient-to-r from-transparent via-amber-300 to-red-600 opacity-0 z-30 shadow-[0_0_25px_#dc2626]"
               style="animation: v1-tracer-fire 0.65s 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;"></div>

          <!-- 屏幕真实喷溅血液 -->
          ${createBloodSplatterHtml(5)}
        `;
      }

      // ========================================================
      // 方案 2：【荒野猎魔 · 春田重猎】(Springfield M1903 Marksman)
      // 特点：老式黄铜双圈十字猎枪瞄具 + 沉闷重铅弹贯穿撕裂 + 放射状血滴
      // ========================================================
      else if (currentScheme === 2) {
        overlay.className += ' bg-stone-950/85';
        const enemiesHtml = killedEnemies.map(enemy => `
          <div class="flex flex-col items-center gap-1.5 shrink-0">
            <div style="width:${unitSize};height:${unitSize};" class="relative flex items-center justify-center">
              <!-- 老式双圈黄铜十字瞄准镜 -->
              <div class="absolute left-1/2 top-1/2 opacity-0 z-30 pointer-events-none"
                   style="width:120%; height:120%; animation: v2-brass-scope 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;">
                <svg viewBox="0 0 100 100" class="w-full h-full text-amber-400 stroke-current fill-none" style="filter: drop-shadow(0 0 10px #b45309);">
                  <circle cx="50" cy="50" r="45" stroke-width="2.5" stroke="#d97706"/>
                  <circle cx="50" cy="50" r="36" stroke-width="1.2" stroke-dasharray="3 3"/>
                  <line x1="50" y1="5" x2="50" y2="95" stroke-width="1.8" stroke="#f43f5e"/>
                  <line x1="5" y1="50" x2="95" y2="50" stroke-width="1.8" stroke="#f43f5e"/>
                  <!-- 密位点 -->
                  <circle cx="50" cy="35" r="1.5" fill="#f43f5e"/>
                  <circle cx="50" cy="65" r="1.5" fill="#f43f5e"/>
                  <circle cx="35" cy="50" r="1.5" fill="#f43f5e"/>
                  <circle cx="65" cy="50" r="1.5" fill="#f43f5e"/>
                  <circle cx="50" cy="50" r="3" fill="#dc2626"/>
                </svg>
              </div>
              <!-- 铅弹激波环 -->
              <div class="absolute left-1/2 top-1/2 rounded-full border-2 border-amber-300 opacity-0 z-30 pointer-events-none"
                   style="width:75%; height:75%; animation: v2-bullet-shock 0.65s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;"></div>
              <!-- 敌人对半猛烈撕裂 -->
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); animation: v2-enemy-split-l 0.8s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); animation: v2-enemy-split-r 0.8s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
            </div>
            <div class="text-amber-300 font-serif text-[10px] sm:text-xs font-bold tracking-widest whitespace-nowrap drop-shadow">${enemy.name}</div>
          </div>
        `).join('');

        html = `
          <!-- 镜头深绯红晕影 -->
          <div class="absolute inset-0 pointer-events-none z-10 opacity-0"
               style="background: radial-gradient(circle, transparent 30%, rgba(153,27,27,0.45) 70%, rgba(30,0,0,0.9) 100%); animation: blood-vignette-pulse 1.1s cubic-bezier(0.1, 0.8, 0.2, 1) both;"></div>

          <!-- 左侧 复古黄铜猎人勋章视窗 -->
          <div class="absolute left-[8vw] top-1/2 -translate-y-1/2 opacity-0 z-20"
               style="animation: v-hero-in 0.28s cubic-bezier(0.12, 0.8, 0.3, 1) both; will-change: transform, opacity;">
            <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-full border-4 border-amber-600 bg-stone-900 shadow-[0_0_35px_rgba(217,119,6,0.6)] p-1.5 relative overflow-hidden flex items-center justify-center">
              <img src="${heroData.img}" class="w-full h-full object-cover rounded-full filter contrast-125 sepia-[0.3]">
            </div>
          </div>

          <!-- 居中 罗马典雅血印 -->
          <div class="absolute left-1/2 top-1/2 opacity-0 z-30 flex flex-col items-center"
               style="animation: v-stamp-text 1.1s 0.22s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;">
            <div class="font-cinzel text-[clamp(3.8rem,9.5vw,9rem)] font-black text-transparent bg-clip-text bg-gradient-to-b from-amber-200 via-rose-500 to-red-950 text-outline-crimson tracking-wider whitespace-nowrap">
              ${n > 1 ? '全 灭' : '击 破'}
            </div>
          </div>

          <!-- 右侧目标区 -->
          <div class="absolute right-[8vw] top-1/2 -translate-y-1/2 z-20 flex items-center gap-3">
            ${enemiesHtml}
          </div>

          <!-- 铅弹贯穿线 -->
          <div class="absolute left-1/2 top-1/2 w-[160vw] h-1.5 bg-gradient-to-r from-transparent via-amber-200 to-red-500 opacity-0 z-30 shadow-[0_0_20px_#f59e0b]"
               style="animation: v1-tracer-fire 0.6s 0.22s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;"></div>

          <!-- 屏幕真实喷溅血液 -->
          ${createBloodSplatterHtml(6)}
        `;
      }

      // ========================================================
      // 方案 3：【堑壕猎杀 · 暴烈霰弹】(Winchester M1897 Trench Shotgun)
      // 特点：一战堑壕霰弹枪粗犷准星 + 5 块放射碎骨轰飞 + 狂暴大片血浆
      // ========================================================
      else if (currentScheme === 3) {
        overlay.className += ' bg-red-950/80';
        const enemiesHtml = killedEnemies.map(enemy => `
          <div class="flex flex-col items-center gap-1.5 shrink-0">
            <div style="width:${unitSize};height:${unitSize};" class="relative flex items-center justify-center">
              <!-- 粗重散射环准星 -->
              <div class="absolute left-1/2 top-1/2 opacity-0 z-30 pointer-events-none"
                   style="width:130%; height:130%; animation: v3-shotgun-reticle 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;">
                <svg viewBox="0 0 100 100" class="w-full h-full text-red-500 stroke-current fill-none" style="filter: drop-shadow(0 0 12px #dc2626);">
                  <circle cx="50" cy="50" r="42" stroke-width="3" stroke-dasharray="14 8"/>
                  <circle cx="50" cy="50" r="22" stroke-width="2"/>
                  <circle cx="50" cy="50" r="5" fill="#f87171"/>
                  <circle cx="50" cy="20" r="2" fill="#ef4444"/>
                  <circle cx="50" cy="80" r="2" fill="#ef4444"/>
                  <circle cx="20" cy="50" r="2" fill="#ef4444"/>
                  <circle cx="80" cy="50" r="2" fill="#ef4444"/>
                </svg>
              </div>
              <!-- 敌人被霰弹直接轰碎成 5 块 -->
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(0 0, 50% 0, 50% 33%, 0 33%); animation: v3-shrapnel-1 0.75s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(50% 0, 100% 0, 100% 33%, 50% 33%); animation: v3-shrapnel-2 0.75s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(0 33%, 100% 33%, 100% 66%, 0 66%); animation: v3-shrapnel-5 0.75s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(0 66%, 50% 66%, 50% 100%, 0 100%); animation: v3-shrapnel-3 0.75s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(50% 66%, 100% 66%, 100% 100%, 50% 100%); animation: v3-shrapnel-4 0.75s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
            </div>
            <div class="text-rose-400 font-mono text-[10px] sm:text-xs font-bold tracking-widest whitespace-nowrap drop-shadow">${enemy.name}</div>
          </div>
        `).join('');

        html = `
          <!-- 镜头狂暴暗红血雾 -->
          <div class="absolute inset-0 pointer-events-none z-10 opacity-0"
               style="background: radial-gradient(circle, transparent 25%, rgba(185,28,28,0.5) 60%, rgba(69,10,10,0.95) 100%); animation: blood-vignette-pulse 1.1s cubic-bezier(0.1, 0.8, 0.2, 1) both;"></div>

          <!-- 左侧 狂暴铁血视窗 -->
          <div class="absolute left-[8vw] top-1/2 -translate-y-1/2 opacity-0 z-20"
               style="animation: v-hero-in 0.28s cubic-bezier(0.12, 0.8, 0.3, 1) both; will-change: transform, opacity;">
            <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-2xl border-4 border-red-700 bg-stone-900 shadow-[0_0_35px_rgba(220,38,38,0.7)] p-1 relative overflow-hidden">
              <img src="${heroData.img}" class="w-full h-full object-cover rounded-xl filter contrast-150">
            </div>
          </div>

          <!-- 居中 轰碎血印 -->
          <div class="absolute left-1/2 top-1/2 opacity-0 z-30 flex flex-col items-center"
               style="animation: v-stamp-text 1.1s 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;">
            <div class="font-cinzel text-[clamp(3.8rem,9.5vw,9rem)] font-black text-transparent bg-clip-text bg-gradient-to-b from-amber-100 via-rose-500 to-red-950 text-outline-crimson tracking-wider whitespace-nowrap">
              ${n > 1 ? '轰 碎' : '轰 杀'}
            </div>
          </div>

          <!-- 右侧目标区 -->
          <div class="absolute right-[8vw] top-1/2 -translate-y-1/2 z-20 flex items-center gap-3">
            ${enemiesHtml}
          </div>

          <!-- 霰弹宽幅扇形火光 -->
          <div class="absolute left-1/2 top-1/2 w-[160vw] h-4 bg-gradient-to-r from-transparent via-amber-400 to-red-600 opacity-0 z-30 shadow-[0_0_35px_#ef4444]"
               style="animation: v1-tracer-fire 0.65s 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;"></div>

          <!-- 屏幕大面积溅血 -->
          ${createBloodSplatterHtml(6)}
        `;
      }

      // ========================================================
      // 方案 4：【冷血私探 · 胶片处刑】(Film Noir Detective .38 Special)
      // 特点：黑白胶片高对比剪影 + 极简缺口铁准星 + 鲜血红特写
      // ========================================================
      else if (currentScheme === 4) {
        overlay.className += ' bg-black/90';
        const enemiesHtml = killedEnemies.map(enemy => `
          <div class="flex flex-col items-center gap-1.5 shrink-0">
            <div style="width:${unitSize};height:${unitSize};" class="relative flex items-center justify-center">
              <!-- 经典黑铁缺口准星 -->
              <div class="absolute left-1/2 top-1/2 opacity-0 z-30 pointer-events-none"
                   style="width:110%; height:110%; animation: v4-revolver-iron 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;">
                <svg viewBox="0 0 100 100" class="w-full h-full text-red-600 stroke-current fill-none" style="filter: drop-shadow(0 0 8px #991b1b);">
                  <circle cx="50" cy="50" r="40" stroke-width="2" opacity="0.8"/>
                  <path d="M42,50 L58,50 M50,42 L50,58" stroke-width="2"/>
                  <rect x="47" y="10" width="6" height="15" fill="#ef4444" stroke="none"/>
                  <rect x="47" y="75" width="6" height="15" fill="#ef4444" stroke="none"/>
                  <rect x="10" y="47" width="15" height="6" fill="#ef4444" stroke="none"/>
                  <rect x="75" y="47" width="15" height="6" fill="#ef4444" stroke="none"/>
                </svg>
              </div>
              <!-- 敌人黑白高反差断裂 -->
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); animation: v4-noir-split-l 0.8s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0" style="clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); animation: v4-noir-split-r 0.8s 0.22s cubic-bezier(0.1, 0.8, 0.2, 1) both; will-change: transform, opacity;">${enemyVisual(enemy)}</div>
            </div>
            <div class="text-red-400 font-mono text-[10px] sm:text-xs font-bold tracking-widest whitespace-nowrap drop-shadow">${enemy.name}</div>
          </div>
        `).join('');

        html = `
          <!-- 胶片噪点与单色暗角 -->
          <div class="absolute inset-0 pointer-events-none z-10 opacity-0"
               style="background: radial-gradient(circle, transparent 40%, rgba(127,29,29,0.3) 75%, black 100%); animation: blood-vignette-pulse 1.1s cubic-bezier(0.1, 0.8, 0.2, 1) both;"></div>

          <!-- 左侧 黑色电影底片相框 -->
          <div class="absolute left-[8vw] top-1/2 -translate-y-1/2 opacity-0 z-20"
               style="animation: v-hero-in 0.28s cubic-bezier(0.12, 0.8, 0.3, 1) both; will-change: transform, opacity;">
            <div class="w-32 h-32 sm:w-40 sm:h-40 border border-white/30 bg-black p-1 relative overflow-hidden shadow-2xl">
              <img src="${heroData.img}" class="w-full h-full object-cover filter grayscale contrast-150">
            </div>
          </div>

          <!-- 居中 黑色电影风血字 -->
          <div class="absolute left-1/2 top-1/2 opacity-0 z-30 flex flex-col items-center"
               style="animation: v-stamp-text 1.1s 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;">
            <div class="font-playfair italic text-[clamp(3.8rem,9.5vw,9rem)] font-black text-rose-600 text-outline-thick tracking-wider drop-shadow-[0_0_35px_#dc2626] whitespace-nowrap">
              ${n > 1 ? '湮 灭' : '击 破'}
            </div>
          </div>

          <!-- 右侧目标区 -->
          <div class="absolute right-[8vw] top-1/2 -translate-y-1/2 z-20 flex items-center gap-3">
            ${enemiesHtml}
          </div>

          <!-- 一枪致命光斑 -->
          <div class="absolute left-1/2 top-1/2 w-[160vw] h-1 bg-white opacity-0 z-30 shadow-[0_0_25px_#fff,0_0_50px_#ef4444]"
               style="animation: v1-tracer-fire 0.55s 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) both; will-change: transform, opacity;"></div>

          <!-- 屏幕真实喷溅血液 -->
          ${createBloodSplatterHtml(5)}
        `;
      }

      overlay.innerHTML = html;
      document.body.appendChild(overlay);

      // 1.35s 后自动优雅淡出清理
      setTimeout(() => {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 300);
      }, 1350);
    }

    // 初始化渲染
    window.addEventListener('DOMContentLoaded', () => {
      renderEnemies();
    });
  </script>
</body>
</html>
