    const entityOf = id => heroesData.concat(enemiesData).find(e => e.id === id);
    function settle(spec) {
        const e = entityOf(spec.t);
        const base = { targetId: e.id, maxHp: e.maxHp, hpBefore: e.hp, hpAfter: e.hp, hpDmg: 0, shieldBefore: e.shield || 0, shieldAfter: e.shield || 0, shieldDmg: 0, isCrit: !!spec.crit, isBurst: !!spec.burst, dirX: spec.dirX, dirY: spec.dirY };
        if (spec.dodge) return Object.assign(base, { outcome: 'dodge' });
        if (spec.block) return Object.assign(base, { outcome: 'block' });
        let dmg = spec.dmg || 0;
        const shieldDmg = Math.min(e.shield || 0, dmg); dmg -= shieldDmg;
        const hpDmg = Math.min(e.hp, dmg);
        e.shield = (e.shield || 0) - shieldDmg; e.hp -= hpDmg;
        return Object.assign(base, { outcome: 'hit', hpAfter: e.hp, hpDmg, shieldAfter: e.shield, shieldDmg });
    }
    function refreshText(list) {
        list.forEach(r => {
            const e = entityOf(r.targetId), el = document.getElementById(e.id + '-hp-text');
            if (!el) return;
            if (e.id.startsWith('h')) el.innerHTML = Math.floor(e.hp) + (e.shield > 0 ? '<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾' + e.shield + ')</span>' : '');
            else el.textContent = Math.floor(e.hp) + '/' + e.maxHp + (e.shield > 0 ? ' 盾' + e.shield : '');
        });
    }
    function calcDir(fromId, toId) {
        const a = getEntitySpriteDom(fromId), b = getEntitySpriteDom(toId);
        if (!a || !b) return { dirX: 0.25, dirY: -0.35 };
        const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
        return { dirX: (br.left + br.width / 2) - (ar.left + ar.width / 2), dirY: (br.top + br.height / 2) - (ar.top + ar.height / 2) };
    }

            const tid = setTimeout(() => { legacyTimers.delete(tid); legacyLayers.delete(f); f.remove(); }, 1200);
            legacyTimers.add(tid);
            dom.animate([{ translate: '0 0' }, { translate: '-3px 0', rotate: '-1deg', offset: 0.25 }, { translate: '3px 0', rotate: '1deg', offset: 0.5 }, { translate: '-3px 0', rotate: '-0.5deg', offset: 0.75 }, { translate: '0 0' }], { duration: 400, easing: 'ease-in-out' });

    function buildWave(hits) {
        const classified = hits.map(spec => {
            const e = entityOf(spec.t);
            const shieldDmg = spec.dodge || spec.block ? 0 : Math.min(e.shield || 0, spec.dmg || 0);
            const hpDmg = spec.dodge || spec.block ? 0 : Math.min(e.hp, (spec.dmg || 0) - shieldDmg);
            return arcaneVfxModule.classifyHit({ targetId: e.id, outcome: spec.dodge ? 'dodge' : spec.block ? 'block' : 'hit', maxHp: e.maxHp, hpBefore: e.hp, hpAfter: e.hp - hpDmg, hpDmg, shieldBefore: e.shield || 0, shieldAfter: (e.shield || 0) - shieldDmg, shieldDmg, isCrit: !!spec.crit, isBurst: !!spec.burst });
        });
        return { classified, hasHeavy: classified.some(h => h.tier === 3), shook: false, hitStopped: false, audioPlayed: false };
    }

            return null;
        }

        const impactCounts = new Map();
        const makeOnImpact = (specMap, fromId, wave, suppressShake) => (target, info) => {
            if (token !== combatToken) return;
            const id = target && target.id ? target.id : '?';
            const n = (impactCounts.get(id) || 0) + 1;
            impactCounts.set(id, n);
            const spec = Object.assign({}, specMap.get(id) || { t: id, dmg: 200 }, calcDir(fromId, id));
            const res = settle(spec);
            arcaneVfxModule.playHitFeedback(res, { onBeat: refreshText, wave, suppressShake });
            const tag = res.outcome === 'dodge' ? '避' : res.outcome === 'block' ? '挡' : res.hpDmg > 0 ? '-' + res.hpDmg : '盾-' + res.shieldDmg;
            beatStatEl.textContent = impactCounts.size > 1 ? `${impactCounts.size}靶@${info.beatMs}ms` : `${id}:${tag}@${info.beatMs}ms`;
        };

        if (card.concurrentDemo) {
            const m1 = new Map([['e4', { t: 'e4', dmg: 260, crit: true }]]), m2 = new Map([['e6', { t: 'e6', dmg: 620 }]]), m3 = new Map([['h3', { t: 'h3', dodge: true }]]);
            const h1 = arcaneVfxModule.playAttackIdentityFx({ scope: 'single', subtype: '枪击', caster: entityOf('h2'), targets: [entityOf('e4')], outcomes: { e4: 'hit' }, onImpact: makeOnImpact(m1, 'h2') });
            const tid1 = setTimeout(() => { legacyTimers.delete(tid1); if (token !== combatToken) return; arcaneVfxModule.playAttackIdentityFx({ scope: 'single', subtype: '光', caster: entityOf('h1'), targets: [entityOf('e6')], outcomes: { e6: 'hit' }, onImpact: makeOnImpact(m2, 'h1') }); }, 180);
            const tid2 = setTimeout(() => { legacyTimers.delete(tid2); if (token !== combatToken) return; arcaneVfxModule.playAttackIdentityFx({ scope: 'single', subtype: '雷', caster: entityOf('e5'), targets: [entityOf('h3')], outcomes: { h3: 'dodge' }, onImpact: makeOnImpact(m3, 'e5') }); }, 360);
            legacyTimers.add(tid1); legacyTimers.add(tid2);
            unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, 1650);
            return h1;
        }

        if (card.beats) {
            const gap = card.gap || 220;
            let lastHandle = null, endAt = 0;
            card.beats.forEach((beat, i) => {
                const tid = setTimeout(() => {
                    legacyTimers.delete(tid); if (token !== combatToken) return;
                    const first = beat[0], fromId = first.from || card.casterId, sub = first.subtype || card.subtype;
                    const specMap = new Map(beat.map(s => [s.t, s]));
                    const outcomes = Object.fromEntries(beat.map(s => [s.t, s.dodge ? 'dodge' : 'hit']));
                    lastHandle = arcaneVfxModule.playAttackIdentityFx({ scope: 'single', subtype: sub, caster: entityOf(fromId), targets: [entityOf(first.t)], outcomes, onImpact: makeOnImpact(specMap, fromId) });
                }, i * gap);
                legacyTimers.add(tid);
                endAt = i * gap;
            });
            unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, endAt + 1450);
            return lastHandle;
        }

        const hits = card.hits || card.targetIds.map(id => ({ t: id, dmg: 250 }));
        const specMap = new Map(hits.map(s => [s.t, s]));
        const outcomes = Object.fromEntries(hits.map(s => [s.t, s.dodge ? 'dodge' : 'hit']));
        const isAoe = card.scope === 'aoe';
        const wave = isAoe ? buildWave(hits) : null;
        const suppressShake = (isAoe && (card.subtype === '爆炸' || card.subtype === '雷')) || card.subtype === '爆炸';
        if (wave && isAoe && (card.subtype === '爆炸' || card.subtype === '雷')) wave.shook = true;
        const handle = arcaneVfxModule.playAttackIdentityFx({
            scope: card.scope, subtype: card.subtype, caster: entityOf(card.casterId), targets: card.targetIds.map(entityOf).filter(Boolean), outcomes, onImpact: makeOnImpact(specMap, card.casterId, wave, suppressShake)
        });
        const impactTail = card.scope === 'aoe' ? 1900 : (card.subtype === '爆炸' || card.subtype === '光' ? 1850 : 1450);
        const waitMs = Math.max(handle && handle.doneAt ? handle.doneAt - Date.now() : 0, impactTail);
        unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, waitMs);
        return handle;
    }
    function renderSkillCards() {
        const list = $('#skill-list');
        list.replaceChildren();
        const BADGE_CLS = {
            '旧版': 'border-slate-500/60 text-slate-300',
            '闪避': 'border-slate-400/60 text-slate-300',
            '格挡': 'border-zinc-400/60 text-zinc-200',
            '护盾': 'border-sky-400/60 text-sky-300',
            '破盾': 'border-sky-300/70 text-sky-200',
            '破盾+': 'border-sky-300/80 text-amber-200',
            '暴击': 'border-orange-500/70 text-orange-300',
            '爆发': 'border-amber-300/80 text-yellow-200',
            'L2': 'border-rose-500/70 text-rose-300',
            'L2+': 'border-rose-400/70 text-rose-200'
        };
        DEMO_GROUPS.forEach(group => {
            const hd = document.createElement('div');
            hd.className = 'arcane-identity-group-hd';
            hd.innerHTML = `<span>${group.title}</span><span class="text-[8px] text-cyan-400/80">${group.badge}</span>`;
            list.appendChild(hd);
            group.items.forEach(card => {
                const button = document.createElement('button');
                button.className = 'card w-full py-1.5 px-2 bg-slate-900/80 hover:bg-violet-950/60 border border-slate-700/80 hover:border-violet-500/60 rounded-lg text-left transition-all shadow-sm';
                button.title = card.description;
                button.innerHTML = '<div class="flex items-center justify-between gap-1"><span class="text-xs font-bold text-slate-100 truncate"></span><span class="text-[9px] font-bold px-1 rounded border border-cyan-500/60 text-cyan-300 shrink-0"></span></div><div class="text-[9px] text-slate-400 truncate"></div>';
                const labels = button.querySelectorAll('span');
                labels[0].textContent = card.name;
                labels[1].textContent = card.level;
                if (BADGE_CLS[card.level]) labels[1].className = 'text-[9px] font-bold px-1 rounded border shrink-0 ' + BADGE_CLS[card.level];
                button.lastElementChild.textContent = card.description;
                button.addEventListener('click', () => playDemoSkill(card));
                list.appendChild(button);
            });
        });
    }
    function resetDemo() {
        combatToken++;
        clearTimeout(unlockTimer); unlockTimer = null;
        clearLegacyDemoFx();
        clearArcaneFx();
        cancelAnimationFrame(fxEngine.animationFrameId); fxEngine.animationFrameId = null;
        fxEngine.particles.length = 0; fxEngine.hitStop = 0; fxEngine.lastFrameTime = 0;
        fxEngine.ctx.clearRect(0, 0, fxEngine.canvas.width, fxEngine.canvas.height);
        beatStatEl.textContent = '待机';
        initUI();
        renderSkillCards();
    }
    $('#btn-reset').addEventListener('click', resetDemo);
    renderSkillCards();
    // ===== 演示控制 END =====

    // 技能数据追加 [特效:精确标签]；按技能类型核对默认光效去重与真实反应回调，不改数值规则。
    // 详细接线、测试与打包步骤见《技能SVG模板使用与快速移植.md》，不是复制整页即可上线。
    // 正式版已提供 fxEngine / combatToken / getEntitySpriteDom / heroesData / enemiesData，勿重复复制演示宿主。
  </script>
