<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>击杀结算动画特效 Demo 展示</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=Cinzel:wght@700;900&family=Share+Tech+Mono&display=swap');
    
    body { 
      font-family: 'Noto Sans SC', sans-serif; 
      user-select: none;
      background: #090d16;
      color: #fff;
    }
    
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
    
    .glass-panel {
      background: rgba(20, 25, 35, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
    }

    .text-outline {
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 8px rgba(0,0,0,0.8);
    }
    .text-outline-thick {
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 20px rgba(0,0,0,1);
    }

    .breathe { animation: breathe 4s ease-in-out infinite alternate; }
    @keyframes breathe { 
      0% { transform: translateY(0px); filter: drop-shadow(0 5px 15px rgba(255,255,255,0.05)); } 
      100% { transform: translateY(-8px); filter: drop-shadow(0 15px 25px rgba(255,255,255,0.15)); } 
    }

    .shake { animation: shake-anim 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes shake-anim {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(4px, -2px, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 3px, 0); }
      40%, 60% { transform: translate3d(5px, 1px, 0); }
    }

    .heavy-shake { animation: heavy-shake-anim 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes heavy-shake-anim {
      10%, 90% { transform: translate3d(-8px, -4px, 0) scale(1.02); }
      20%, 80% { transform: translate3d(10px, 6px, 0) scale(1.01); }
      30%, 50%, 70% { transform: translate3d(-12px, -8px, 0); }
      40%, 60% { transform: translate3d(10px, 5px, 0); }
    }

    /* ====================================================
       STYLE 1: 完美同轴斜切 (Fixed & Enhanced Coaxial Slash)
       ==================================================== */
    @keyframes s1-hero-in {
      0% { transform: translate(-50%, -50%) translate(var(--hero-ox), var(--hero-oy)) translateX(-70vw) skewX(15deg); opacity: 0; }
      70% { transform: translate(-50%, -50%) translate(var(--hero-ox), var(--hero-oy)) translateX(15px) skewX(-4deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) translate(var(--hero-ox), var(--hero-oy)) translateX(0) skewX(0); opacity: 1; }
    }
    @keyframes s1-enemy-in {
      0% { transform: translate(-50%, -50%) translate(var(--enemy-ox), var(--enemy-oy)) translateX(70vw) skewX(-15deg); opacity: 0; }
      70% { transform: translate(-50%, -50%) translate(var(--enemy-ox), var(--enemy-oy)) translateX(-15px) skewX(4deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) translate(var(--enemy-ox), var(--enemy-oy)) translateX(0) skewX(0); opacity: 1; }
    }
    @keyframes s1-slash-anim {
      0% { transform: translate(-50%, -50%) rotate(var(--slash-rot)) scaleX(0); opacity: 0; height: 2px; }
      10% { opacity: 1; height: 16px; filter: drop-shadow(0 0 25px #fff) drop-shadow(0 0 50px #f43f5e); }
      40% { transform: translate(-50%, -50%) rotate(var(--slash-rot)) scaleX(1); opacity: 1; height: 8px; }
      100% { transform: translate(-50%, -50%) rotate(var(--slash-rot)) scaleX(1.15); opacity: 0; height: 0px; }
    }
    @keyframes s1-top-shatter {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; filter: brightness(1); }
      100% { transform: translate(70px, -80px) rotate(15deg); opacity: 0; filter: brightness(2.2) drop-shadow(0 0 25px #f43f5e); }
    }
    @keyframes s1-bottom-shatter {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; filter: brightness(1); }
      100% { transform: translate(-70px, 80px) rotate(-15deg); opacity: 0; filter: brightness(0.2); }
    }
    @keyframes s1-vs-anim {
      0% { transform: translate(-50%, -50%) scale(4.5); opacity: 0; filter: blur(16px); }
      14% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; filter: blur(0px); }
      24% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
      75% { transform: translate(-50%, -50%) scale(1); opacity: 1; text-shadow: 0 0 35px #f43f5e, 0 0 70px #be123c; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
    }

    /* ====================================================
       STYLE 2: 居合一闪·残影定格 (Iai Flash & Ink Shatter)
       ==================================================== */
    @keyframes s2-screen-flash {
      0% { opacity: 0; }
      10% { opacity: 0.95; }
      30% { opacity: 0; }
      40% { opacity: 0.85; }
      100% { opacity: 0; }
    }
    @keyframes s2-hero-blur-dash {
      0% { transform: translate(-50%, -50%) translateX(-60vw) scale(0.7); opacity: 0; filter: blur(25px); }
      15% { transform: translate(-50%, -50%) translateX(-10vw) scale(1.1); opacity: 1; filter: blur(0); }
      35% { transform: translate(-50%, -50%) translateX(25vw) scale(1); opacity: 1; }
      75% { transform: translate(-50%, -50%) translateX(25vw) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) translateX(55vw) scale(0.9); opacity: 0; }
    }
    @keyframes s2-blade-flash {
      0% { transform: translate(-50%, -50%) rotate(-10deg) scaleX(0); opacity: 0; }
      15% { transform: translate(-50%, -50%) rotate(-10deg) scaleX(1); opacity: 1; height: 6px; }
      100% { transform: translate(-50%, -50%) rotate(-10deg) scaleX(1.1); opacity: 0; height: 0; }
    }
    @keyframes s2-ink-stamp {
      0% { transform: translate(-50%, -50%) scale(0.3) rotate(-15deg); opacity: 0; filter: blur(12px); }
      18% { transform: translate(-50%, -50%) scale(1.3) rotate(0deg); opacity: 1; filter: blur(0); }
      28% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      75% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; filter: blur(8px); }
    }

    /* ====================================================
       STYLE 3: 次元裂隙·空间碎镜 (Dimensional Rift)
       ==================================================== */
    @keyframes s3-rift-beam {
      0% { transform: translate(-50%, -50%) rotate(-14deg) scaleX(0); opacity: 0; height: 0; }
      15% { transform: translate(-50%, -50%) rotate(-14deg) scaleX(1); opacity: 1; height: 160px; filter: drop-shadow(0 0 35px #c084fc); }
      70% { transform: translate(-50%, -50%) rotate(-14deg) scaleX(1.05); opacity: 1; height: 90px; }
      100% { transform: translate(-50%, -50%) rotate(-14deg) scaleX(0); opacity: 0; height: 0; }
    }
    @keyframes s3-shard-1 {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(-90px, -70px) rotate(-35deg) scale(0.2); opacity: 0; filter: brightness(2); }
    }
    @keyframes s3-shard-2 {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(100px, -50px) rotate(40deg) scale(0.1); opacity: 0; filter: brightness(2); }
    }
    @keyframes s3-shard-3 {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(-70px, 80px) rotate(-45deg) scale(0.2); opacity: 0; filter: brightness(2); }
    }
    @keyframes s3-shard-4 {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(80px, 90px) rotate(30deg) scale(0.1); opacity: 0; filter: brightness(2); }
    }

    /* ====================================================
       STYLE 4 (重构版): 🎯 远程专属·极速战术狙杀 (Ultra-Fast Sniper Scope)
       纯 GPU 硬件加速变换 (translate3d/scale3d)，零卡顿，60FPS 丝滑流畅
       ==================================================== */
    @keyframes s4-scope-lock {
      0% { transform: translate(-50%, -50%) scale3d(2.4, 2.4, 1) rotate(45deg); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale3d(1, 1, 1) rotate(0deg); opacity: 1; }
      75% { transform: translate(-50%, -50%) scale3d(1.02, 1.02, 1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale3d(1.3, 1.3, 1) rotate(-15deg); opacity: 0; }
    }
    @keyframes s4-bullet-streak {
      0% { transform: translate(-50%, -50%) scaleX(0); opacity: 0; }
      12% { transform: translate(-50%, -50%) scaleX(1); opacity: 1; height: 6px; }
      35% { transform: translate(-50%, -50%) scaleX(1); opacity: 1; height: 3px; }
      100% { transform: translate(-50%, -50%) scaleX(1.1); opacity: 0; height: 0px; }
    }
    @keyframes s4-shockwave-ring {
      0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 6px; }
      60% { transform: translate(-50%, -50%) scale(2.2); opacity: 0.8; border-width: 2px; }
      100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; border-width: 0px; }
    }
    @keyframes s4-sniper-text {
      0% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; filter: blur(12px); }
      15% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; filter: blur(0px); }
      25% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
      75% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.25); opacity: 0; }
    }
    @keyframes s4-enemy-split-left {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(-75px, -35px, 0) rotate(-20deg); opacity: 0; filter: brightness(2); }
    }
    @keyframes s4-enemy-split-right {
      0% { transform: translate3d(0, 0, 0); opacity: 1; }
      100% { transform: translate3d(75px, 35px, 0) rotate(20deg); opacity: 0; filter: brightness(0.3); }
    }

    /* ====================================================
       STYLE 5: 星穹漫画·爆裂定格 (Manga Break / P5 Cut-in)
       ==================================================== */
    @keyframes s5-speed-burst {
      0% { opacity: 0; transform: scale(1.6); }
      20% { opacity: 0.7; transform: scale(1); }
      75% { opacity: 0.7; transform: scale(0.98); }
      100% { opacity: 0; transform: scale(0.9); }
    }
    @keyframes s5-ribbon-slide {
      0% { transform: translate(-50%, -50%) rotate(-6deg) scaleX(0); opacity: 0; }
      20% { transform: translate(-50%, -50%) rotate(-6deg) scaleX(1); opacity: 1; }
      75% { transform: translate(-50%, -50%) rotate(-6deg) scaleX(1.02); opacity: 1; }
      100% { transform: translate(-50%, -50%) rotate(-6deg) scaleX(0); opacity: 0; }
    }
    @keyframes s5-eye-banner {
      0% { transform: translateX(-100vw) skewX(-15deg); opacity: 0; }
      20% { transform: translateX(-4vw) skewX(-15deg); opacity: 1; }
      75% { transform: translateX(2vw) skewX(-15deg); opacity: 1; }
      100% { transform: translateX(100vw) skewX(-15deg); opacity: 0; }
    }
    @keyframes s5-stamp-impact {
      0% { transform: translate(-50%, -50%) rotate(-7deg) scale(4.5); opacity: 0; filter: blur(16px); }
      18% { transform: translate(-50%, -50%) rotate(-7deg) scale(1); opacity: 1; filter: blur(0); }
      26% { transform: translate(-50%, -50%) rotate(-7deg) scale(1.15); opacity: 1; }
      75% { transform: translate(-50%, -50%) rotate(-7deg) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) rotate(-7deg) scale(1.35); opacity: 0; filter: blur(6px); }
    }
  </style>
</head>
<body class="w-screen h-screen overflow-hidden relative select-none">

  <!-- ========================================== -->
  <!-- 极简控制栏 (Floating Minimal Pill Switcher) -->
  <!-- ========================================== -->
  <div class="fixed top-3 left-1/2 -translate-x-1/2 z-[300] glass-panel px-2.5 py-1.5 rounded-full flex items-center gap-1.5 shadow-[0_10px_35px_rgba(0,0,0,0.8)] border border-cyan-500/30">
    <button onclick="playCurrent()" class="px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-white rounded-full text-xs font-bold transition-all shadow-[0_0_12px_rgba(6,182,212,0.6)] flex items-center gap-1">
      <span>▶</span> 播放
    </button>
    <div class="w-[1px] h-4 bg-white/20 mx-1"></div>
    
    <button id="tab-1" onclick="switchStyle(1)" class="style-tab px-3 py-1 bg-cyan-950/80 border border-cyan-400/60 text-cyan-200 rounded-full text-xs font-bold transition-all">
      1. ⚔️ 近战·同轴斜斩
    </button>
    <button id="tab-2" onclick="switchStyle(2)" class="style-tab px-3 py-1 bg-slate-900/60 border border-transparent hover:border-slate-600 text-slate-300 rounded-full text-xs font-bold transition-all">
      2. ⚔️ 近战·居合一闪
    </button>
    <button id="tab-3" onclick="switchStyle(3)" class="style-tab px-3 py-1 bg-slate-900/60 border border-transparent hover:border-slate-600 text-slate-300 rounded-full text-xs font-bold transition-all">
      3. ✨ 魔法·空间裂隙
    </button>
    <button id="tab-4" onclick="switchStyle(4)" class="style-tab px-3 py-1 bg-slate-900/60 border border-transparent hover:border-slate-600 text-slate-300 rounded-full text-xs font-bold transition-all">
      4. 🎯 远程专属·精密狙杀
    </button>
    <button id="tab-5" onclick="switchStyle(5)" class="style-tab px-3 py-1 bg-slate-900/60 border border-transparent hover:border-slate-600 text-slate-300 rounded-full text-xs font-bold transition-all">
      5. 💥 爆发·星穹漫画
    </button>
  </div>

  <!-- ========================================== -->
  <!-- 1:1 完整战斗场景背景 (1:1 Battle UI) -->
  <!-- ========================================== -->
  <div id="battle-scene" class="absolute inset-0 bg-gradient-to-br from-indigo-950 via-slate-900 to-emerald-950 overflow-hidden z-0">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/85 via-black/30 to-transparent z-0"></div>
    
    <!-- 顶部场地与控制按键 (1:1 原版) -->
    <div class="absolute top-3 right-4 z-50 flex gap-2">
      <div class="glass-panel px-3 py-1.5 rounded-full text-xs font-bold text-amber-400 flex items-center gap-1.5 shadow-md">
        <span>🏟️</span> <span>有备而来</span>
      </div>
      <div class="glass-panel px-3 py-1.5 rounded-full text-xs text-gray-300 flex items-center gap-1">
        <span>📜</span> <span>记录</span>
      </div>
    </div>

    <!-- 左侧：时间轴队列 (1:1 原版) -->
    <div class="absolute left-3 sm:left-6 top-16 bottom-48 w-12 z-30 flex flex-col gap-2.5 py-4">
      <div class="w-10 h-10 rounded-full border-2 border-slate-600 overflow-hidden opacity-60 bg-gray-900">
        <img src="https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png" class="w-full h-full object-cover">
      </div>
      <div id="turn-active-avatar" class="w-11 h-11 rounded-full border-2 border-yellow-400 overflow-hidden shadow-[0_0_15px_rgba(250,204,21,0.8)] bg-gray-900 scale-110 relative transition-all">
        <img id="turn-active-img" src="https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png" class="w-full h-full object-cover">
      </div>
      <div class="w-10 h-10 rounded-full border-2 border-slate-600 overflow-hidden opacity-60 bg-gray-900">
        <img src="https://imgur.la/images/2026/08/13/77fcdf0fd006c4ff1ccae30774322270.png" class="w-full h-full object-cover">
      </div>
      <div class="w-10 h-10 rounded-full border-2 border-slate-600 overflow-hidden opacity-60 bg-gray-900">
        <img src="https://imgur.la/images/2026/06/25/26f001dbe399876cd74978bbe12a265b.png" class="w-full h-full object-cover">
      </div>
      <div class="w-10 h-10 rounded-full border-2 border-rose-600 overflow-hidden opacity-75 bg-gray-900 flex items-center justify-center text-lg">
        👻
      </div>
    </div>

    <!-- 中间战场敌人 (食尸鬼 Ghost) -->
    <div id="enemy-anchor" class="absolute inset-0 z-10 flex items-center justify-center pb-32">
      <div class="flex flex-col items-center group relative cursor-pointer breathe">
        <div class="text-[6.5rem] drop-shadow-[0_10px_25px_rgba(244,63,94,0.3)]">👻</div>
        <div class="text-rose-300 text-xs font-bold tracking-widest mt-2">[ 食尸鬼 ]</div>
        <div class="w-16 h-1.5 bg-black/60 mt-1 rounded-full overflow-hidden">
          <div class="h-full bg-rose-500 w-full shadow-[0_0_8px_rgba(244,63,94,0.8)]"></div>
        </div>
      </div>
    </div>

    <!-- 底部悬浮 UI 层 (4英雄卡片 + 右侧操作面板) -->
    <div class="absolute bottom-3 left-0 w-full px-4 sm:px-6 flex items-end justify-between gap-4 z-20 pointer-events-none">
      
      <!-- 4 个英雄卡片 (1:1 复刻) -->
      <div class="flex-1 grid grid-cols-4 gap-2 max-w-3xl pointer-events-auto">
        
        <!-- 1. 埃利奥特 (远程枪手) -->

        <!-- 2. 弗兰克 -->
        <div id="card-hero-2" class="bg-[#18181b] rounded overflow-hidden relative border border-slate-700/80 shadow-2xl transition-all">
          <div class="absolute top-1 right-1 flex flex-col gap-0.5 z-20">
            <span class="bg-red-950/80 border border-red-500/60 text-red-300 text-[8px] px-1 rounded">仇恨+100</span>

          <div class="p-1.5 flex flex-col gap-1 text-[9px] font-mono">
            <div class="flex justify-between text-yellow-400 font-bold"><span>HP</span><span>180</span></div>

            <div class="w-full h-1 bg-black/50 rounded-full overflow-hidden"><div class="h-full bg-green-500 w-1/5"></div></div>
          </div>
        </div>

        <!-- 3. 玛德琳 -->
        <div id="card-hero-3" class="bg-[#18181b] rounded overflow-hidden relative border-2 border-yellow-400 shadow-[0_0_20px_rgba(250,204,21,0.5)] transition-all">
          <div class="absolute top-1 right-1 flex flex-col gap-0.5 z-20">
            <span class="bg-indigo-950/80 border border-indigo-400/60 text-indigo-200 text-[8px] px-1 rounded">隐匿-90</span>
          </div>
          <div class="w-full aspect-[4/3] relative bg-gray-900 border-b border-gray-700">
            <div class="absolute top-0 left-0 w-full bg-gradient-to-b from-black/80 to-transparent px-1.5 py-0.5 text-[11px] font-bold text-white z-10">玛德琳</div>
            <img src="https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png" class="w-full h-full object-cover">
          </div>
          <div class="p-1.5 flex flex-col gap-1 text-[9px] font-mono">
            <div class="flex justify-between text-yellow-400 font-bold"><span>HP</span><span>140</span></div>
            <div class="w-full h-1 bg-black/50 rounded-full overflow-hidden"><div class="h-full bg-yellow-400 w-full"></div></div>
            <div class="flex justify-between text-cyan-400 font-bold"><span>MP</span><span>12</span></div>
            <div class="w-full h-1 bg-black/50 rounded-full overflow-hidden"><div class="h-full bg-cyan-400 w-1/4"></div></div>
            <div class="flex justify-between text-green-400 font-bold"><span>TP</span><span>20</span></div>
            <div class="w-full h-1 bg-black/50 rounded-full overflow-hidden"><div class="h-full bg-green-500 w-1/5"></div></div>

          <div class="absolute top-1 right-1 flex flex-col gap-0.5 z-20">
            <span class="bg-teal-950/80 border border-teal-400/60 text-teal-200 text-[8px] px-1 rounded">风行·速+20</span>
          </div>
          <div class="w-full aspect-[4/3] relative bg-gray-900 border-b border-gray-700">
            <div class="absolute top-0 left-0 w-full bg-gradient-to-b from-black/80 to-transparent px-1.5 py-0.5 text-[11px] font-bold text-white z-10">索恩</div>
            <img src="https://imgur.la/images/2026/08/13/77fcdf0fd006c4ff1ccae30774322270.png" class="w-full h-full object-cover">
          </div>
          <div class="p-1.5 flex flex-col gap-1 text-[9px] font-mono">
            <div class="flex justify-between text-yellow-400 font-bold"><span>HP</span><span>140</span></div>
            <div class="w-full h-1 bg-black/50 rounded-full overflow-hidden"><div class="h-full bg-yellow-400 w-full"></div></div>
            <div class="flex justify-between text-cyan-400 font-bold"><span>MP</span><span>20</span></div>
            <div class="w-full h-1 bg-black/50 rounded-full overflow-hidden"><div class="h-full bg-cyan-400 w-1/3"></div></div>
            <div class="flex justify-between text-green-400 font-bold"><span>TP</span><span>20</span></div>
            <div class="w-full h-1 bg-black/50 rounded-full overflow-hidden"><div class="h-full bg-green-500 w-1/5"></div></div>
          </div>
        </div>

      </div>

      <!-- 右侧行动面板 (1:1 复刻 260px x 172px) -->
      <div class="w-[260px] h-[172px] bg-slate-950/95 backdrop-blur-xl rounded-xl border border-slate-700/80 border-t-2 border-t-cyan-500/80 flex flex-col overflow-hidden shadow-[0_15px_35px_rgba(0,0,0,0.9)] pointer-events-auto shrink-0">
        <div id="panel-turn-title" class="text-center text-xs py-1 text-white/90 bg-white/5 tracking-widest font-bold border-b border-white/10">玛德琳 的回合</div>
        <div class="flex-1 flex flex-col p-1.5 gap-1 justify-center bg-slate-900/50">
          <button onclick="playCurrent()" class="w-full py-1.5 px-3 bg-slate-900/80 hover:bg-cyan-950/60 border border-slate-700/80 hover:border-cyan-500/60 rounded-lg text-xs font-bold text-slate-200 hover:text-cyan-300 transition-all flex items-center gap-2 shadow-sm">
            <span class="text-rose-400">⚔️</span> 普攻攻击
          </button>
          <button onclick="playCurrent()" class="w-full py-1.5 px-3 bg-gradient-to-r from-cyan-950/90 to-slate-900 border border-cyan-500/60 rounded-lg text-xs font-bold text-white shadow-[0_0_12px_rgba(6,182,212,0.2)] hover:scale-[1.01] transition-all flex items-center gap-2">
            <span class="text-cyan-400">⚡</span> 释放技能
          </button>
          <button class="w-full py-1.5 px-3 bg-slate-900/80 hover:bg-emerald-950/60 border border-slate-700/80 hover:border-emerald-500/60 rounded-lg text-xs font-bold text-slate-200 hover:text-emerald-300 transition-all flex items-center gap-2">
            <span class="text-emerald-400">🛡️</span> 防御姿态
          </button>
          <button class="w-full py-1.5 px-3 bg-slate-900/80 hover:bg-purple-950/60 border border-slate-700/80 hover:border-purple-500/60 rounded-lg text-xs font-bold text-slate-200 hover:text-purple-300 transition-all flex items-center gap-2">
            <span class="text-purple-400">💨</span> 尝试撤离
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- 特效容器挂载点 -->
  <div id="fx-root" class="fixed inset-0 pointer-events-none z-[200]"></div>

  <script>
    let currentStyle = 1;
    let isPlaying = false;

    const HEROES = {
      madeline: { name: '玛德琳', img: 'https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png', type: '近战' },
      sean: { name: '索恩', img: 'https://imgur.la/images/2026/08/13/77fcdf0fd006c4ff1ccae30774322270.png', type: '远程' }
    };
    const ENEMY_DATA = {
      name: '食尸鬼',
      emoji: '👻'
    };

    // 音效缓存
    const audioUrls = {
      'kill': 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/kill.mp3',
      'slash': 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/atk1.mp3',
      'hitDown': 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/hitDown.mp3',
      'burst': 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/burst.mp3',
      'taunt': 'https://cdn.jsdelivr.net/gh/bachhoang2463j-a11y/test1@main/taunt.mp3'
    };
    const audioCache = {};
    for (let k in audioUrls) {
      audioCache[k] = new Audio(audioUrls[k]);
      audioCache[k].preload = 'auto';
    }
    function playAudio(k, vol = 0.6) {
      if (audioCache[k]) {
        try {
          const snd = audioCache[k].cloneNode();
          snd.volume = vol;
          snd.play().catch(() => {});
        } catch(e) {}
      }
    }

    function triggerShake(type = 'normal') {
      const scene = document.getElementById('battle-scene');
      if (!scene) return;
      const cls = type === 'heavy' ? 'heavy-shake' : 'shake';
      scene.classList.add(cls);
      setTimeout(() => scene.classList.remove(cls), 400);
    }

    function switchStyle(id) {
      currentStyle = id;
      document.querySelectorAll('.style-tab').forEach((tab, idx) => {
        if (idx + 1 === id) {
          tab.className = 'style-tab px-3 py-1 bg-cyan-950/90 border border-cyan-400 text-cyan-200 rounded-full text-xs font-bold transition-all shadow-[0_0_12px_rgba(6,182,212,0.4)]';
        } else {
          tab.className = 'style-tab px-3 py-1 bg-slate-900/60 border border-transparent hover:border-slate-600 text-slate-300 rounded-full text-xs font-bold transition-all';
        }
      });

      // 远程风格切换时，将当前行动者动态切换为远程神枪手「索恩」
      const activeHero = (id === 4) ? HEROES.sean : HEROES.madeline;
      document.getElementById('panel-turn-title').innerText = `${activeHero.name} 的回合`;
      document.getElementById('turn-active-img').src = activeHero.img;
      
      // 更新卡片高亮
      document.getElementById('card-hero-3').className = (id === 4) 
        ? 'bg-[#18181b] rounded overflow-hidden relative border border-slate-700/80 shadow-2xl transition-all'
        : 'bg-[#18181b] rounded overflow-hidden relative border-2 border-yellow-400 shadow-[0_0_20px_rgba(250,204,21,0.5)] transition-all';
      document.getElementById('card-hero-4').className = (id === 4) 
        ? 'bg-[#18181b] rounded overflow-hidden relative border-2 border-cyan-400 shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all'
        : 'bg-[#18181b] rounded overflow-hidden relative border border-slate-700/80 shadow-2xl transition-all';

      playCurrent();
    }

    function playCurrent() {
      if (isPlaying) return;
      isPlaying = true;
      const root = document.getElementById('fx-root');
      root.innerHTML = '';

      switch (currentStyle) {
        case 1: playStyle1(root); break;
        case 2: playStyle2(root); break;
        case 3: playStyle3(root); break;
        case 4: playStyle4(root); break;
        case 5: playStyle5(root); break;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '5') {
        switchStyle(parseInt(e.key));
      } else if (e.code === 'Space') {
        e.preventDefault();
        playCurrent();
      }
    });

    // ====================================================
    // STYLE 1: ⚔️ 近战·同轴斜切 (Fixed Coaxial Slash)
    // ====================================================
    function playStyle1(root) {
      const isLandscape = window.innerWidth > window.innerHeight;
      const rot = isLandscape ? -7 : -14;
      const rotRad = (rot * Math.PI) / 180;
      
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 bg-black/70 flex items-center justify-center overflow-hidden transition-opacity duration-300 pointer-events-none';
      
      const heroOffsetX = -window.innerWidth * 0.36;
      const heroOffsetY = heroOffsetX * Math.tan(rotRad);
      const enemyOffsetX = window.innerWidth * 0.36;
      const enemyOffsetY = enemyOffsetX * Math.tan(rotRad);

      overlay.style.setProperty('--hero-ox', `${heroOffsetX}px`);
      overlay.style.setProperty('--hero-oy', `${heroOffsetY}px`);
      overlay.style.setProperty('--enemy-ox', `${enemyOffsetX}px`);
      overlay.style.setProperty('--enemy-oy', `${enemyOffsetY}px`);
      overlay.style.setProperty('--slash-rot', `${rot}deg`);

      overlay.innerHTML = `
        <div class="absolute left-1/2 top-1/2 opacity-0 z-10" style="animation: s1-hero-in 0.3s cubic-bezier(0.12, 0.8, 0.3, 1) both;">
          <div style="width:clamp(85px,20vh,190px);height:clamp(85px,20vh,190px);" class="rounded-full border-4 border-yellow-400 overflow-hidden shadow-[0_0_35px_rgba(250,204,21,0.9)] bg-gray-900 flex items-center justify-center">
            <img src="${HEROES.madeline.img}" class="w-full h-full object-cover">
          </div>
        </div>

        <div class="absolute left-1/2 top-1/2 opacity-0 z-10" style="animation: s1-enemy-in 0.3s cubic-bezier(0.12, 0.8, 0.3, 1) both;">
          <div style="width:clamp(80px,18vh,170px);height:clamp(80px,18vh,170px);" class="relative flex items-center justify-center">
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[5.5rem] sm:text-[8rem]"
                 style="clip-path: polygon(0 0, 100% 0, 100% 44%, 0 56%); animation: s1-top-shatter 0.75s 0.28s cubic-bezier(0.1, 0.8, 0.2, 1) both;">
              ${ENEMY_DATA.emoji}
            </div>
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[5.5rem] sm:text-[8rem]"
                 style="clip-path: polygon(0 56%, 100% 44%, 100% 100%, 0 100%); animation: s1-bottom-shatter 0.75s 0.28s cubic-bezier(0.1, 0.8, 0.2, 1) both;">
              ${ENEMY_DATA.emoji}
            </div>
          </div>
        </div>

        <div class="absolute h-2 sm:h-2.5 bg-white left-1/2 top-1/2 origin-center opacity-0 z-20 shadow-[0_0_20px_#f43f5e,0_0_50px_#fff]"
             style="width: 140vw; animation: s1-slash-anim 0.5s 0.28s cubic-bezier(0.1, 0.8, 0.2, 1) both;">
        </div>

        <div class="text-[clamp(3.5rem,9vw,9rem)] italic font-black text-rose-500 text-outline-thick absolute left-1/2 top-1/2 opacity-0 z-30 tracking-[0.25em] whitespace-nowrap drop-shadow-[0_0_35px_rgba(244,63,94,0.8)]"
             style="animation: s1-vs-anim 1.1s 0.28s ease-out both;">
          击破
        </div>
      `;

      root.appendChild(overlay);
      setTimeout(() => { playAudio('kill'); triggerShake('heavy'); }, 280);
      setTimeout(() => { overlay.style.opacity = '0'; setTimeout(() => { overlay.remove(); isPlaying = false; }, 300); }, 1400);
    }

    // ====================================================
    // STYLE 2: ⚔️ 近战·居合一闪 (Iai Flash)
    // ====================================================
    function playStyle2(root) {
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 bg-black/85 flex items-center justify-center overflow-hidden transition-opacity duration-300 pointer-events-none';

      overlay.innerHTML = `
        <div class="absolute inset-0 bg-white opacity-0 z-40" style="animation: s2-screen-flash 1.1s 0.25s ease-out both;"></div>
        <div class="absolute h-24 w-[180vw] bg-gradient-to-r from-transparent via-rose-600/50 to-transparent left-1/2 top-1/2 opacity-0 z-10"
             style="animation: s2-blade-flash 0.9s 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) both;"></div>
        <div class="absolute h-1 bg-rose-400 w-[180vw] left-1/2 top-1/2 opacity-0 z-20 shadow-[0_0_25px_#f43f5e]"
             style="animation: s2-blade-flash 0.9s 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) both;"></div>

        <div class="absolute left-1/2 top-1/2 opacity-0 z-30" style="animation: s2-hero-blur-dash 1.2s cubic-bezier(0.14, 1, 0.28, 1) both;">
          <div class="w-32 h-32 sm:w-44 sm:h-44 rounded-full border-4 border-rose-500 overflow-hidden shadow-[0_0_40px_#f43f5e] bg-black">
            <img src="${HEROES.madeline.img}" class="w-full h-full object-cover">
          </div>
        </div>

        <div class="absolute left-1/2 top-1/2 opacity-0 z-30 flex flex-col items-center" style="animation: s2-ink-stamp 1.2s 0.28s cubic-bezier(0.14, 1, 0.28, 1) both;">
          <div class="font-cinzel text-[clamp(4.5rem,12vw,12rem)] font-black text-rose-500 text-outline-thick tracking-wider drop-shadow-[0_0_50px_#e11d48]">斬</div>
          <div class="text-rose-200 text-xs sm:text-base font-bold tracking-[0.8em] -mt-4 uppercase">EXECUTION COMPLETE</div>
        </div>

        <div class="absolute right-[18vw] top-1/2 -translate-y-1/2 z-20">
          <div class="relative w-32 h-32 flex items-center justify-center">
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[6rem]"
                 style="clip-path: polygon(0 0, 100% 0, 100% 44%, 0 56%); animation: s1-top-shatter 0.8s 0.28s cubic-bezier(0.1, 0.8, 0.2, 1) both;">
              👻
            </div>
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[6rem]"
                 style="clip-path: polygon(0 56%, 100% 44%, 100% 100%, 0 100%); animation: s1-bottom-shatter 0.8s 0.28s cubic-bezier(0.1, 0.8, 0.2, 1) both;">
              👻
            </div>
          </div>
        </div>
      `;

      root.appendChild(overlay);
      playAudio('slash');
      setTimeout(() => { playAudio('kill'); triggerShake('heavy'); }, 280);
      setTimeout(() => { overlay.style.opacity = '0'; setTimeout(() => { overlay.remove(); isPlaying = false; }, 300); }, 1450);
    }

    // ====================================================
    // STYLE 3: ✨ 魔法·空间裂隙 (Dimensional Rift)
    // ====================================================
    function playStyle3(root) {
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 bg-slate-950/85 flex items-center justify-center overflow-hidden transition-opacity duration-300 pointer-events-none';

      overlay.innerHTML = `
        <div class="absolute w-[160vw] bg-gradient-to-r from-transparent via-purple-600/50 to-transparent left-1/2 top-1/2 opacity-0 z-10"
             style="animation: s3-rift-beam 1.2s 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) both;"></div>
        <div class="absolute h-1.5 w-[160vw] bg-fuchsia-300 left-1/2 top-1/2 opacity-0 z-20 shadow-[0_0_30px_#c084fc,0_0_60px_#a855f7]"
             style="animation: s3-rift-beam 1.2s 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) both;"></div>

        <div class="absolute left-[12vw] top-1/2 -translate-y-1/2 opacity-0 z-20"
             style="animation: s1-hero-in 0.3s cubic-bezier(0.12, 0.8, 0.3, 1) both;">
          <div class="w-28 h-28 sm:w-40 sm:h-40 rounded-full border-4 border-purple-400 overflow-hidden shadow-[0_0_40px_#a855f7] bg-gray-900">
            <img src="${HEROES.madeline.img}" class="w-full h-full object-cover">
          </div>
        </div>

        <div class="text-[clamp(3.5rem,9vw,9rem)] italic font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-fuchsia-300 to-rose-400 text-outline-thick absolute left-1/2 top-1/2 opacity-0 z-30 tracking-[0.3em] whitespace-nowrap"
             style="animation: s1-vs-anim 1.1s 0.25s ease-out both;">
          湮灭
        </div>

        <div class="absolute right-[15vw] top-1/2 -translate-y-1/2 z-20">
          <div class="relative w-36 h-36 flex items-center justify-center">
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[6rem]" 
                 style="clip-path: polygon(0 0, 50% 0, 50% 50%, 0 50%); animation: s3-shard-1 0.85s 0.25s cubic-bezier(0.1, 0.8, 0.2, 1) both;">👻</div>
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[6rem]" 
                 style="clip-path: polygon(50% 0, 100% 0, 100% 50%, 50% 50%); animation: s3-shard-2 0.85s 0.25s cubic-bezier(0.1, 0.8, 0.2, 1) both;">👻</div>
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[6rem]" 
                 style="clip-path: polygon(0 50%, 50% 50%, 50% 100%, 0 100%); animation: s3-shard-3 0.85s 0.25s cubic-bezier(0.1, 0.8, 0.2, 1) both;">👻</div>
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[6rem]" 
                 style="clip-path: polygon(50% 50%, 100% 50%, 100% 100%, 50% 100%); animation: s3-shard-4 0.85s 0.25s cubic-bezier(0.1, 0.8, 0.2, 1) both;">👻</div>
          </div>
        </div>
      `;

      root.appendChild(overlay);
      playAudio('burst');
      setTimeout(() => { playAudio('kill'); triggerShake('heavy'); }, 250);
      setTimeout(() => { overlay.style.opacity = '0'; setTimeout(() => { overlay.remove(); isPlaying = false; }, 300); }, 1400);
    }

    // ====================================================
    // STYLE 4: 🎯 远程专属·精密狙杀 (Ultra-Fast Sniper Scope)
    // 极致轻量化：纯矢量 SVG 准星锁定 + 超音速弹道贯穿 + 零重绘性能优化
    // ====================================================
    function playStyle4(root) {
      const hero = HEROES.sean; // 远程神枪手索恩
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 bg-slate-950/75 flex items-center justify-center overflow-hidden transition-opacity duration-300 pointer-events-none';

      overlay.innerHTML = `
        <!-- 左侧狙击手 HUD 视窗 -->
        <div class="absolute left-[10vw] top-1/2 -translate-y-1/2 opacity-0 z-20"
             style="animation: s1-hero-in 0.25s cubic-bezier(0.12, 0.8, 0.3, 1) both;">
          <div class="w-28 h-28 sm:w-36 sm:h-36 rounded-xl border border-cyan-500/80 bg-slate-900/90 shadow-[0_0_25px_rgba(6,182,212,0.4)] p-1 relative overflow-hidden">
            <div class="absolute top-1 left-1.5 text-[8px] font-mono-tech text-cyan-300 tracking-wider">SNIPER: ${hero.name}</div>
            <div class="absolute bottom-1 right-1.5 text-[7px] font-mono-tech text-amber-400/90">CALIBER: 12.7MM</div>
            <img src="${hero.img}" class="w-full h-full object-cover rounded">
          </div>
        </div>

        <!-- 居中战术「精密击破 / HEADSHOT」艺术字 -->
        <div class="absolute left-1/2 top-1/2 opacity-0 z-30 flex flex-col items-center"
             style="animation: s4-sniper-text 1.1s 0.24s cubic-bezier(0.1, 0.9, 0.2, 1) both;">
          <div class="font-mono-tech text-xs sm:text-sm text-cyan-300 tracking-[0.6em] bg-cyan-950/90 px-4 py-0.5 rounded-full border border-cyan-500/60 mb-1 shadow-lg">
            [ TARGET NEUTRALIZED ]
          </div>
          <div class="font-cinzel text-[clamp(3rem,8vw,7.5rem)] font-black text-transparent bg-clip-text bg-gradient-to-b from-cyan-200 via-cyan-400 to-teal-500 text-outline-thick tracking-wider drop-shadow-[0_0_35px_#06b6d4]">
            击 破
          </div>
        </div>

        <!-- 右侧目标区域：超轻量 SVG 狙击准星锁定 + 弹道激波 + 精准贯穿碎裂 -->
        <div class="absolute right-[16vw] top-1/2 -translate-y-1/2 z-20">
          <div class="relative w-36 h-36 flex items-center justify-center">
            
            <!-- 极简 SVG 战术瞄准准星 (纯矢量，零 GPU 重绘) -->
            <div class="absolute left-1/2 top-1/2 w-40 h-40 opacity-0 z-20 pointer-events-none"
                 style="animation: s4-scope-lock 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) both;">
              <svg viewBox="0 0 100 100" class="w-full h-full text-cyan-400 stroke-current fill-none">
                <!-- 外环与刻度 -->
                <circle cx="50" cy="50" r="42" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.8"/>
                <circle cx="50" cy="50" r="28" stroke-width="1" opacity="0.6"/>
                <!-- 十字准线 -->
                <line x1="50" y1="8" x2="50" y2="35" stroke-width="2"/>
                <line x1="50" y1="65" x2="50" y2="92" stroke-width="2"/>
                <line x1="8" y1="50" x2="35" y2="50" stroke-width="2"/>
                <line x1="65" y1="50" x2="92" y2="50" stroke-width="2"/>
                <!-- 中心红点锁定 -->
                <circle cx="50" cy="50" r="3" fill="#f43f5e" stroke="none"/>
              </svg>
            </div>

            <!-- 超音速弹道激波环 (0.24s 爆破扩散) -->
            <div class="absolute left-1/2 top-1/2 w-28 h-28 rounded-full border border-cyan-300 opacity-0 z-20 pointer-events-none"
                 style="animation: s4-shockwave-ring 0.6s 0.24s cubic-bezier(0.1, 0.8, 0.2, 1) both;"></div>

            <!-- 敌人被一枪贯穿左右碎裂 -->
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[6rem]"
                 style="clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); animation: s4-enemy-split-left 0.75s 0.24s cubic-bezier(0.1, 0.8, 0.2, 1) both;">
              👻
            </div>
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[6rem]"
                 style="clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); animation: s4-enemy-split-right 0.75s 0.24s cubic-bezier(0.1, 0.8, 0.2, 1) both;">
              👻
            </div>
          </div>
        </div>

        <!-- 贯穿全屏的超音速子弹光束 (0.24s 极速穿透) -->
        <div class="absolute left-1/2 top-1/2 w-[160vw] h-1.5 bg-gradient-to-r from-transparent via-cyan-200 to-cyan-400 opacity-0 z-30 shadow-[0_0_20px_#38bdf8]"
             style="animation: s4-bullet-streak 0.6s 0.24s cubic-bezier(0.1, 0.9, 0.2, 1) both;"></div>
      `;

      root.appendChild(overlay);

      playAudio('taunt'); // 瞄准提示
      setTimeout(() => {
        playAudio('kill'); // 枪响爆头
        triggerShake('heavy');
      }, 240);

      setTimeout(() => {
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.remove();
          isPlaying = false;
        }, 300);
      }, 1400);
    }

    // ====================================================
    // STYLE 5: 💥 爆发·星穹漫画 (Manga Break)
    // ====================================================
    function playStyle5(root) {
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 bg-black/85 flex items-center justify-center overflow-hidden transition-opacity duration-300 pointer-events-none';

      overlay.innerHTML = `
        <div class="absolute inset-0 opacity-0 bg-[radial-gradient(circle_at_center,_transparent_0%,_#fff_100%)] mix-blend-overlay pointer-events-none"
             style="animation: s5-speed-burst 1.3s cubic-bezier(0.1, 0.9, 0.2, 1) both;"></div>

        <div class="absolute w-[180vw] h-40 bg-gradient-to-r from-rose-950 via-red-900 to-amber-950 top-1/2 left-1/2 opacity-0 z-10 border-y-4 border-yellow-400 shadow-[0_0_60px_rgba(244,63,94,0.8)]"
             style="animation: s5-ribbon-slide 1.3s cubic-bezier(0.1, 0.9, 0.2, 1) both;">
        </div>

        <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-32 flex items-center px-8 sm:px-20 opacity-0 z-20"
             style="animation: s5-eye-banner 1.3s cubic-bezier(0.1, 0.9, 0.2, 1) both;">
          <div class="w-32 h-32 sm:w-44 sm:h-44 rounded-full border-4 border-yellow-400 overflow-hidden shadow-[0_0_40px_#eab308] bg-black shrink-0">
            <img src="${HEROES.madeline.img}" class="w-full h-full object-cover">
          </div>
        </div>

        <div class="absolute left-1/2 top-1/2 opacity-0 z-30 pointer-events-none"
             style="animation: s5-stamp-impact 1.2s 0.24s cubic-bezier(0.1, 0.9, 0.2, 1) both;">
          <div class="font-cinzel text-[clamp(4.5rem,13vw,13rem)] font-black text-yellow-400 text-outline-thick tracking-widest drop-shadow-[0_0_60px_#eab308]">
            BREAK
          </div>
        </div>

        <div class="absolute right-[14vw] top-1/2 -translate-y-1/2 z-20">
          <div class="relative w-36 h-36 flex items-center justify-center">
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[6.5rem]"
                 style="clip-path: polygon(0 0, 100% 0, 100% 44%, 0 56%); animation: s1-top-shatter 0.8s 0.24s cubic-bezier(0.1, 0.8, 0.2, 1) both;">
              👻
            </div>
            <div class="absolute inset-0 flex items-center justify-center opacity-0 text-[6.5rem]"
                 style="clip-path: polygon(0 56%, 100% 44%, 100% 100%, 0 100%); animation: s1-bottom-shatter 0.8s 0.24s cubic-bezier(0.1, 0.8, 0.2, 1) both;">
              👻
            </div>
          </div>
        </div>
      `;

      root.appendChild(overlay);
      playAudio('burst');
      setTimeout(() => { playAudio('kill'); triggerShake('heavy'); }, 240);
      setTimeout(() => { overlay.style.opacity = '0'; setTimeout(() => { overlay.remove(); isPlaying = false; }, 300); }, 1450);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => playStyle1(document.getElementById('fx-root')), 400);
    });
  </script>
</body>
</html>
