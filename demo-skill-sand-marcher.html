<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SVG 技能演练 · 飞沙化甲 & 蝎眼钥匙</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; overflow: hidden; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; overflow: hidden; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    .arcane-stygian-base { position:absolute; width:196px; height:68px; margin-left:-98px; margin-top:-34px; pointer-events:none; will-change:transform,opacity; animation:arcane-stygian-base-life 1.05s cubic-bezier(0.2,0.8,0.2,1) both; }
    .arcane-stygian-moon { position:absolute; width:304px; height:180px; margin-left:-152px; margin-top:-90px; pointer-events:none; will-change:transform,opacity; animation:arcane-stygian-moon-life 0.92s cubic-bezier(0.16,1,0.3,1) both; }
    .arcane-stygian-reticle { position:absolute; width:192px; height:192px; margin-left:-96px; margin-top:-96px; pointer-events:none; will-change:transform,opacity; animation:arcane-stygian-reticle-lock 0.54s cubic-bezier(0.22,1,0.36,1) both; }
    .arcane-stygian-reac { position:absolute; width:212px; height:212px; margin-left:-106px; margin-top:-106px; pointer-events:none; will-change:transform,opacity; animation:arcane-stygian-reac-pop 0.46s cubic-bezier(0.16,1,0.3,1) both; }
    .arcane-stygian-eye { will-change:opacity; animation:arcane-stygian-eye-blink 0.48s steps(1) 0.14s both; }
    @keyframes arcane-stygian-base-life { 0%{opacity:0;transform:scale(0.35)} 22%{opacity:1;transform:scale(1.05)} 68%{opacity:0.9;transform:scale(1)} 100%{opacity:0;transform:scale(1.18)} }
    @keyframes arcane-stygian-moon-life { 0%{opacity:0;transform:scale(0.68) translateY(14px)} 18%{opacity:0.98;transform:scale(1.03) translateY(-2px)} 62%{opacity:0.94;transform:scale(1) translateY(0)} 100%{opacity:0;transform:scale(1.08) translateY(-16px)} }
    @keyframes arcane-stygian-reticle-lock { 0%{opacity:0;transform:scale(1.65) rotate(-38deg)} 46%{opacity:1;transform:scale(0.94) rotate(0deg)} 70%{opacity:1;transform:scale(1) rotate(0deg)} 100%{opacity:0;transform:scale(0.84) rotate(14deg)} }
    @keyframes arcane-stygian-reac-pop { 0%{opacity:0;transform:scale(0.32) rotate(0deg)} 28%{opacity:0.96;transform:scale(1.08) rotate(22deg)} 100%{opacity:0;transform:scale(1.56) rotate(45deg)} }
    @keyframes arcane-stygian-eye-blink { 0%{opacity:0} 20%{opacity:1} 45%{opacity:0.45} 65%{opacity:1} 100%{opacity:0} }

    .arcane-marcher-tint { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 45%, rgba(245,158,11,0.12) 0%, rgba(153,27,27,0.28) 46%, rgba(8,5,4,0.68) 100%); will-change:opacity; animation:arcane-marcher-tint-life 3.3s ease-in-out both; }
    .arcane-marcher-circle { position:absolute; left:50%; top:46%; pointer-events:none; will-change:transform,opacity; animation:arcane-marcher-circle-charge 1.42s cubic-bezier(0.22,0.85,0.3,1) both; }
    .arcane-marcher-core { position:absolute; left:50%; top:46%; width:180px; height:180px; margin-left:-90px; margin-top:-90px; pointer-events:none; will-change:transform,opacity; animation:arcane-marcher-core-collapse 1.42s ease-in both; }
    .arcane-marcher-beam-h { position:absolute; left:0; right:0; top:46%; height:64px; margin-top:-32px; background:linear-gradient(180deg, transparent, rgba(220,38,38,0.6) 24%, #fef08a 50%, rgba(245,158,11,0.65) 76%, transparent); will-change:transform,opacity; animation:arcane-marcher-beam-hx 0.56s cubic-bezier(0.12,0.9,0.25,1) both; }
    .arcane-marcher-beam-v { position:absolute; top:0; bottom:0; left:50%; width:54px; margin-left:-27px; background:linear-gradient(90deg, transparent, rgba(220,38,38,0.55) 24%, #fef08a 50%, rgba(245,158,11,0.6) 76%, transparent); will-change:transform,opacity; animation:arcane-marcher-beam-vy 0.56s cubic-bezier(0.12,0.9,0.25,1) both; }
    .arcane-marcher-rift { position:absolute; left:50%; top:45%; pointer-events:none; will-change:transform,opacity; animation:arcane-marcher-rift-life 1.62s cubic-bezier(0.14,0.92,0.28,1) both; }
    .arcane-marcher-eye-flare { will-change:transform,opacity; transform-box:fill-box; transform-origin:center; animation:arcane-marcher-eye-pulse 0.9s ease-out 0.1s both; }
    .arcane-marcher-banner { position:absolute; left:50%; bottom:24%; width:360px; max-width:88vw; height:52px; margin-left:-180px; pointer-events:none; will-change:transform,opacity; animation:arcane-marcher-banner-in 1.48s cubic-bezier(0.16,1,0.3,1) 0.08s both; }
    .arcane-marcher-ward { position:absolute; width:164px; height:164px; margin-left:-82px; margin-top:-82px; pointer-events:none; will-change:transform,opacity; animation:arcane-marcher-ward-pop 0.72s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes arcane-marcher-tint-life { 0%{opacity:0} 22%{opacity:1} 82%{opacity:1} 100%{opacity:0} }
    @keyframes arcane-marcher-circle-charge { 0%{opacity:0;transform:scale(0.35) rotate(-32deg)} 28%{opacity:0.95;transform:scale(1.02) rotate(0deg)} 84%{opacity:1;transform:scale(1) rotate(14deg)} 91%{opacity:0.95;transform:scale(0.12) rotate(36deg)} 100%{opacity:0;transform:scale(0.04) rotate(42deg)} }
    @keyframes arcane-marcher-core-collapse { 0%{opacity:0;transform:scale(0.2)} 45%{opacity:0.85;transform:scale(0.95)} 86%{opacity:1;transform:scale(1.18)} 92%{opacity:1;transform:scale(0.22)} 100%{opacity:0;transform:scale(0.05)} }
    @keyframes arcane-marcher-beam-hx { 0%{opacity:0;transform:scaleX(0) scaleY(0.35)} 18%{opacity:1;transform:scaleX(1.04) scaleY(1.2)} 100%{opacity:0;transform:scaleX(1.08) scaleY(0.12)} }
    @keyframes arcane-marcher-beam-vy { 0%{opacity:0;transform:scaleY(0) scaleX(0.35)} 18%{opacity:1;transform:scaleY(1.04) scaleX(1.2)} 100%{opacity:0;transform:scaleY(1.08) scaleX(0.12)} }
    @keyframes arcane-marcher-rift-life { 0%{opacity:0;transform:scale(1.26,0.05)} 11%{opacity:1;transform:scale(1.06,1.06)} 18%{opacity:1;transform:scale(1,1)} 75%{opacity:1;transform:scale(1.02,1.02)} 100%{opacity:0;transform:scale(0.86,0.08)} }
    @keyframes arcane-marcher-eye-pulse { 0%{opacity:0;transform:scale(0.3)} 18%{opacity:1;transform:scale(1.35)} 50%{opacity:0.92;transform:scale(1)} 100%{opacity:0;transform:scale(0.85)} }
    @keyframes arcane-marcher-banner-in { 0%{opacity:0;transform:translateX(-110px) skewX(-12deg)} 15%{opacity:1;transform:translateX(8px) skewX(-6deg)} 24%{opacity:1;transform:translateX(0) skewX(-6deg)} 78%{opacity:1;transform:translateX(0) skewX(-6deg)} 100%{opacity:0;transform:translateX(90px) skewX(-12deg)} }
    @keyframes arcane-marcher-ward-pop { 0%{opacity:0;transform:scale(1.4) rotate(-18deg)} 32%{opacity:1;transform:scale(0.96) rotate(0deg)} 100%{opacity:0;transform:scale(1.12) rotate(12deg)} }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->
  <div class="absolute top-2 sm:top-4 right-2 sm:right-4 z-[115] flex gap-1.5 sm:gap-2">
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-violet-400 hover:text-violet-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📚</span> <span class="hidden sm:inline">世界书</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-purple-400 hover:text-purple-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📜</span> <span class="hidden sm:inline">记录</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-400 hover:text-blue-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔲</span> <span class="hidden sm:inline">全屏</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>💬</span> <span class="hidden sm:inline">对话</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-yellow-500 hover:text-yellow-400 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>⚙️</span> <span class="hidden sm:inline">设置</span></button>
    <button id="btn-reset" class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-emerald-400 hover:text-emerald-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔄</span> <span class="hidden sm:inline">重置</span></button>
  </div>

  <!-- 全屏战场区域 -->
  <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-800 to-emerald-900 overflow-hidden z-0" id="battle-scene">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-0"></div>
    <div class="absolute left-1 sm:left-4 md:left-6 top-16 sm:top-20 bottom-44 sm:bottom-48 w-12 sm:w-14 z-30 flex flex-col items-center select-none">
      <div class="relative w-full h-full flex flex-col items-center">
        <div class="timeline-rail"><div class="rail-pulse-beam"></div></div>
        <div id="turn-order-container" class="relative w-full h-full flex flex-col gap-2 sm:gap-2.5 items-center overflow-y-auto no-scrollbar mask-fade-y py-3"></div>
      </div>
    </div>
    <div id="enemies-container" class="absolute left-2 sm:left-6 right-2 sm:right-6 top-[10%] bottom-[190px] sm:bottom-[220px] z-10 flex flex-col items-center justify-start gap-6 overflow-visible pointer-events-none"></div>
  </div>

  <!-- 悬浮 UI 层 -->
  <div class="absolute bottom-[52px] left-0 w-full p-1.5 sm:p-6 flex flex-col-reverse sm:flex-row items-end justify-between gap-1.5 sm:gap-4 z-20 pointer-events-none pb-2 sm:pb-6">
    <div id="heroes-container" class="w-full sm:flex-1 grid grid-cols-4 gap-1 sm:gap-4 max-w-2xl pointer-events-auto relative"></div>
    <div class="relative self-end">
      <div id="menu-container" class="w-[260px] h-[172px] bg-slate-950/95 backdrop-blur-xl rounded-xl border border-slate-700/80 border-t-2 border-t-cyan-500/80 flex flex-col overflow-hidden relative shadow-[0_15px_35px_rgba(0,0,0,0.9)] pointer-events-auto self-end mb-1 sm:mb-0">
        <div class="px-2.5 py-1 bg-gradient-to-r from-violet-950/60 via-slate-900/90 to-slate-950 border-b border-violet-900/40 flex justify-between items-center shrink-0">
          <div class="flex items-center gap-1.5 min-w-0"><span class="w-1.5 h-1.5 rounded-full bg-violet-400 animate-pulse shrink-0"></span><span class="text-xs font-bold text-violet-300">技能演练 · 嵌入式特效</span></div>
          <span id="asset-status-pill" class="text-[9px] text-slate-400 font-mono">资源探测中</span>
        </div>
        <div id="skill-list" class="flex-1 flex flex-col gap-1 p-1 overflow-y-auto custom-scrollbar"></div>
      </div>
    </div>
  </div>

  <!-- 底部对话栏（复刻主界面，仅装饰） -->
  <div id="chat-bar" class="absolute bottom-0 left-0 right-0 h-[52px] z-30 flex items-center gap-2 px-2 sm:px-3 bg-black/60 border-t border-white/5">
    <div class="w-9 h-9 rounded-full bg-slate-700 border border-white/20 shrink-0 flex items-center justify-center">🕵️</div>
    <input type="text" placeholder="说点什么... (Enter发送)" class="flex-1 h-9 rounded-full px-4 text-sm outline-none">
    <span class="px-3 py-1 rounded-full text-xs font-bold border border-emerald-500/60 text-emerald-300 bg-emerald-950/50">友方旁白 ON</span>
    <span class="px-3 py-1 rounded-full text-xs font-bold border border-rose-500/60 text-rose-300 bg-rose-950/50">敌方旁白 ON</span>
    <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">➤</div>
  </div>
 </div>
  <script>
    // ===== 演示宿主 BEGIN：占位数据、渲染、fxEngine；不移植到正式版 =====
    const $ = s => document.querySelector(s);
    let combatToken = 0;
    let heroesData = [], enemiesData = [];
    const HERO_AVATARS = {
        '埃利奥特': 'https://imgur.la/images/2026/06/25/31a4dd84a831e3f76082542bf12fcf19.png',
        '弗兰克': 'https://imgur.la/images/2026/06/25/26f001dbe399876cd74978bbe12a265b.png',
        '玛德琳': 'https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png',
        '索恩': 'https://imgur.la/images/2026/08/13/77fcdf0fd006c4ff1ccae30774322270.png'
    };
    const HERO_DATA = [['h1', '埃利奥特', '👨', 100, 55, 110, 5], ['h2', '弗兰克', '🧔', 180, 0, 17, 0], ['h3', '玛德琳', '👩', 140, 0, 14, 0], ['h4', '索恩', '🕵️', 140, 0, 20, 0]];
    const ENEMY_ROWS = [[['e1', '🐟'], ['e2', '❄️'], ['e3', '🐟']], [['e4', '👻'], ['e5', '👻'], ['e6', '🌀']]];

function createCompactBarHTML(id, type, label, val, max, colorClass, isTp = false, shield = 0) {
  const pct = Math.max(0, Math.min(100, (val / max) * 100)); const barWidthClass = isTp ? 'w-1/3' : 'w-full';
  const shieldText = shield > 0 && type === 'hp' ? `<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾${shield})</span>` : '';
  let finalColor = colorClass; let extraClass = ''; if (isTp && val >= max) { finalColor = 'bg-amber-400'; extraClass = 'shadow-[0_0_10px_rgba(251,191,36,0.8)] animate-pulse'; }
  return `<div class="relative pt-1.5 sm:pt-2.5 mb-0 sm:mb-[2px]"><span id="${id}-${type}-text" class="absolute right-0 top-0 text-[8px] sm:text-xs font-mono font-bold text-white leading-none text-outline z-10 whitespace-nowrap">${Math.floor(val)}${shieldText}</span><div class="flex items-center gap-1 sm:gap-1.5"><span class="text-[7px] sm:text-[10px] font-bold text-gray-200 leading-none text-outline w-3 sm:w-4">${label}</span><div class="flex-grow h-1 sm:h-1.5 bg-[#222] rounded-[1px] overflow-hidden border border-[#111]"><div id="${id}-${type}-bar" class="${barWidthClass} h-full ${finalColor} ${extraClass} transition-all duration-300 ease-out" style="width: ${pct}%"></div></div></div></div>`;
}

function getEntitySpriteDom(entityOrId){
  const id = entityOrId && typeof entityOrId === 'object' ? entityOrId.id : String(entityOrId||'');
  if(!id) return null;
  return document.getElementById(`hero-card-${id}`) || document.getElementById(`${id}-sprite`) || document.getElementById(`hero-wrap-${id}`) || null;
}
window.getEntitySpriteDom = getEntitySpriteDom;

    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }
}

        ring(g, p) { g.strokeStyle = p.color; g.lineWidth = 3 * p.life; g.beginPath(); g.arc(0, 0, 4 + p.size * (1 - p.life) * 40, 0, 6.283); g.stroke(); },
        flame(g, p) { const r = p.size * (0.4 + p.life * 0.8); const gr = g.createRadialGradient(0, 0, 0, 0, 0, r); gr.addColorStop(0, '#fff7d6'); gr.addColorStop(0.35, p.color); gr.addColorStop(1, 'rgba(120,20,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, 6.283); g.fill(); },
        smoke(g, p) { const r = p.size * (1.6 - p.life); const gr = g.createRadialGradient(0, 0, 0, 0, 0, r); gr.addColorStop(0, p.color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, 6.283); g.fill(); },
        feather(g, p) { const s = p.size; g.fillStyle = p.color; g.beginPath(); g.moveTo(-s * 1.5, 0); g.quadraticCurveTo(0, -s * 0.55, s * 1.5, 0); g.quadraticCurveTo(0, s * 0.4, -s * 1.5, 0); g.fill(); g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 0.8; g.beginPath(); g.moveTo(-s * 1.8, 0); g.lineTo(s * 1.5, 0); g.stroke(); },

        streak(g, p) { g.strokeStyle = p.color; g.lineWidth = p.size; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, 0); g.lineTo(-p.vx * 4, -p.vy * 4); g.stroke(); }
    };
    function releaseIdleCanvas() {
        if (S.driver || S.handles.size || S.particles.length || S.flights.length || !S.canvas) return;
        S.canvas.remove(); S.canvas = null; S.ctx = null;
    }
    function scheduleParticleCleanup() {
        if (S.particleTimer !== null) return;
        S.particleTimer = after(Math.max(0, S.particleUntil - performance.now()), () => {
            S.particleTimer = null;
            const now = performance.now();
            S.particles = S.particles.filter(p => p.expiresAt > now);
            if (S.particles.length) { scheduleParticleCleanup(); return; }
            if (!S.flights.length && S.driver) {
                const index = fxEngine.particles.indexOf(S.driver);
                if (index >= 0) fxEngine.particles.splice(index, 1);
                S.driver = null;
            }
            if (S.ctx) S.ctx.clearRect(0, 0, S.canvas.width, S.canvas.height);
            releaseIdleCanvas();
        });
    }
    function addP(o) {
        const p = Object.assign({ vx: 0, vy: 0, life: 1, decay: 0.02, size: 3, color: '#fde68a', grav: 0, drag: 0.98, rot: 0, vr: 0, shape: 'dot', blend: 'lighter' }, o);
        p.expiresAt = performance.now() + p.life / p.decay * 16.7;

    function burst(n, fn) { for (let i = 0; i < n; i++) addP(fn(i)); }
    // 绕场收束（demo orbitCharge 原样）
    function orbitCharge(c, n, dur, mk, rx, ry, shrink = 0.8) {
        const orb = []; for (let i = 0; i < n; i++) orb.push({ a: Math.random() * 6.283, r: rnd(0.45, 1), s: rnd(0.025, 0.05), k: Math.random() });
        const t0 = performance.now();
        const id = every(33, () => { const k = Math.min(1, (performance.now() - t0) / dur); orb.forEach(o => { o.a += o.s * (1 + k * 3); const r = o.r * (1 - k * shrink); addP(Object.assign({ x: c.x + Math.cos(o.a) * rx * r, y: c.y + Math.sin(o.a) * ry * r, decay: 0.25 }, mk(o))); }); });

    // 贝塞尔弹道（demo fly 原样；由驱动粒子步进，不另启 rAF）
    function fly(a, b, lift, dur, draw, done, ease) {
        ease = ease || (k => k * k);
        const cx = (a.x + b.x) / 2, cy = Math.min(a.y, b.y) - lift;
        const startedAt = performance.now();
        const f = {
            age: 0, dur, timer: null,
            step(pr) { const t = ease(pr), u = 1 - t; draw(u * u * a.x + 2 * u * t * cx + t * t * b.x, u * u * a.y + 2 * u * t * cy + t * t * b.y, pr); },
            progress() { return Math.min(1, (performance.now() - startedAt) / dur); }
        };
        S.flights.push(f);
        ensureCanvas(); ensureDriver();
        f.timer = after(dur, () => {
            const index = S.flights.indexOf(f);
            if (index >= 0) S.flights.splice(index, 1);
            f.step(1);
            if (done) done();
        });
        return f;
    }
    function ensureDriver() {
        if (S.driver) return;
        const driver = {
            age: 0, life: 1e9, x: 0, y: 0, vx: 0, vy: 0,
            update(p) {
                step(fxEngine.lastDt || 16.7);
                if (!S.particles.length && !S.flights.length) {
                    p.age = p.life; S.driver = null;
                    if (S.ctx) S.ctx.clearRect(0, 0, S.canvas.width, S.canvas.height);
                    releaseIdleCanvas();
                }
            },
            draw() { render(); }
        };
        S.driver = driver;
        fxEngine.addParticle(driver);
    }
    function step(dt) {
        const k = dt / 16.7;
        for (const f of S.flights) f.step(f.progress());
        for (let i = S.particles.length - 1; i >= 0; i--) {
            const p = S.particles[i];
            p.vx *= Math.pow(p.drag, k); p.vy *= Math.pow(p.drag, k);
            p.vy += p.grav * k;
            p.x += p.vx * k; p.y += p.vy * k;
            p.rot += p.vr * k;
            p.life = Math.min(p.life - p.decay * k, Math.max(0, (p.expiresAt - performance.now()) * p.decay / 16.7));
            if (p.life <= 0) S.particles.splice(i, 1);
        }
    }
    function render() {
        const g = S.ctx; if (!g || !S.canvas) return;
        g.clearRect(0, 0, S.canvas.width, S.canvas.height);
        for (let i = 0; i < S.particles.length; i++) {
            const p = S.particles[i];
            g.save();
            g.globalAlpha = Math.min(1, p.life * 1.4);
            g.globalCompositeOperation = p.blend;
            g.translate(p.x, p.y);
            if (p.shape !== 'streak') g.rotate(p.rot);
            DRAW[p.shape](g, p);
            g.restore();
        }
    }

                    pill.textContent = clean.startsWith('..') ? '本地相对资源已就绪' : '8766 资源已预热';
                    pill.className = 'text-[9px] text-emerald-400 font-mono';
                }
                return;
            }
        }
        if (pill) {
            pill.textContent = '立绘未命中（矢量兜底）';
            pill.className = 'text-[9px] text-amber-400 font-mono';
        }
    }
    probeAndWarmVfxAssets();
    $('#btn-reset').addEventListener('click', resetDemo);
    renderSkillCards();
