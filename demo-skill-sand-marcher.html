<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SVG 技能演练 · 飞沙化甲 & 蝎眼钥匙</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; overflow: hidden; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; overflow: hidden; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    .arcane-stygian-aura { position:absolute; pointer-events:none; border-radius:50%; background:radial-gradient(ellipse at 50% 48%, rgba(125,211,252,0.22) 0%, rgba(59,75,117,0.32) 48%, rgba(13,18,32,0.52) 72%, transparent 100%); will-change:transform,opacity; animation:arcane-stygian-shield-life 1.12s cubic-bezier(0.16,1,0.3,1) both; }
    .arcane-stygian-shield-wrap { position:absolute; pointer-events:none; will-change:transform,opacity; animation:arcane-stygian-shield-life 1.12s cubic-bezier(0.16,1,0.3,1) both; filter:drop-shadow(0 0 12px rgba(56,189,248,0.38)); }
    .arcane-stygian-eye { will-change:opacity; animation:arcane-stygian-eye-blink 0.68s ease-out 0.08s both; }
    @keyframes arcane-stygian-shield-life { 0%{opacity:0;transform:scale(0.62) translateY(14px)} 18%{opacity:0.98;transform:scale(1.04) translateY(-2px)} 68%{opacity:0.95;transform:scale(1) translateY(0)} 100%{opacity:0;transform:scale(1.06) translateY(-10px)} }
    @keyframes arcane-stygian-eye-blink { 0%{opacity:0} 24%{opacity:1} 68%{opacity:0.88} 100%{opacity:0} }
    @keyframes arcane-armor-sweep { 0%{opacity:0;transform:translateX(-110px)} 30%{opacity:0.75} 100%{opacity:0;transform:translateX(130px)} }

    .arcane-marcher-veil { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 48% 44%, rgba(56,39,82,0.26) 0%, rgba(20,13,34,0.78) 48%, rgba(5,3,10,0.94) 100%); will-change:opacity; animation:arcane-marcher-veil-life 3.3s ease-in-out both; }
    .arcane-marcher-flash { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 46% 44%, rgba(216,204,238,0.44) 0%, rgba(104,85,134,0.28) 28%, rgba(30,20,46,0.16) 54%, transparent 78%); will-change:opacity; animation:arcane-fs-flash 0.54s ease-out both; }
    .arcane-marcher-rift-stage { position:absolute; left:50%; top:46%; width:min(740px,90vw); aspect-ratio:4/3; transform:translate(-50%,-50%); pointer-events:none; will-change:transform,opacity; }
    .arcane-marcher-abyss { position:absolute; inset:-6%; pointer-events:none; background:radial-gradient(ellipse 40% 62% at 50% 48%, #040208 0%, rgba(16,10,28,0.96) 44%, rgba(56,39,82,0.44) 68%, transparent 88%); will-change:transform,opacity; }
    .arcane-marcher-rift-rim { position:absolute; inset:-4%; pointer-events:none; mix-blend-mode:screen; will-change:transform,opacity; }
    .arcane-marcher-rift-stage.is-vertical .arcane-marcher-abyss { animation:arcane-rift-open-v 1.65s cubic-bezier(0.14,0.92,0.28,1) both; }
    .arcane-marcher-rift-stage.is-vertical .arcane-marcher-rift-rim { background:radial-gradient(ellipse 30% 62% at 48% 48%, rgba(196,181,253,0.16) 0%, rgba(139,92,246,0.34) 36%, rgba(88,28,135,0.18) 64%, transparent 86%), radial-gradient(ellipse 10% 56% at 34% 48%, rgba(196,181,253,0.32) 0%, rgba(124,58,237,0.16) 46%, transparent 82%), radial-gradient(ellipse 10% 56% at 62% 48%, rgba(196,181,253,0.32) 0%, rgba(124,58,237,0.16) 46%, transparent 82%); animation:arcane-rift-open-v 1.65s cubic-bezier(0.14,0.92,0.28,1) both; }
    .arcane-marcher-rift-stage.is-diag .arcane-marcher-abyss { background:radial-gradient(ellipse 68% 34% at 48% 48%, #040208 0%, rgba(16,10,28,0.96) 42%, rgba(72,52,102,0.46) 68%, transparent 88%); animation:arcane-rift-open-diag 1.65s cubic-bezier(0.14,0.92,0.28,1) both; }
    .arcane-marcher-rift-stage.is-diag .arcane-marcher-rift-rim { background:radial-gradient(ellipse 64% 22% at 48% 48%, rgba(196,181,253,0.18) 0%, rgba(139,92,246,0.38) 38%, rgba(88,28,135,0.16) 66%, transparent 88%), radial-gradient(ellipse 60% 8% at 48% 38%, rgba(221,214,254,0.36) 0%, rgba(124,58,237,0.18) 52%, transparent 88%); animation:arcane-rift-open-diag 1.65s cubic-bezier(0.14,0.92,0.28,1) both; }
    .arcane-marcher-rift-stage.is-ground .arcane-marcher-abyss { top:36%; bottom:-14%; background:radial-gradient(ellipse 64% 48% at 50% 56%, #040208 0%, rgba(16,10,28,0.95) 45%, rgba(62,44,88,0.42) 70%, transparent 90%); animation:arcane-rift-open-ground 1.65s cubic-bezier(0.14,0.92,0.28,1) both; }
    .arcane-marcher-rift-stage.is-ground .arcane-marcher-rift-rim { top:34%; bottom:-14%; background:radial-gradient(ellipse 62% 28% at 50% 52%, rgba(196,181,253,0.22) 0%, rgba(139,92,246,0.36) 42%, rgba(88,28,135,0.18) 68%, transparent 90%); animation:arcane-rift-open-ground 1.65s cubic-bezier(0.14,0.92,0.28,1) both; }
    .arcane-marcher-beast-clip { position:absolute; inset:0; overflow:hidden; pointer-events:none; -webkit-mask-image:radial-gradient(ellipse 52% 56% at 46% 46%, #000 32%, rgba(0,0,0,0.68) 62%, transparent 92%); mask-image:radial-gradient(ellipse 52% 56% at 46% 46%, #000 32%, rgba(0,0,0,0.68) 62%, transparent 92%); }
    .arcane-marcher-rift-stage.is-vertical .arcane-marcher-beast-clip { -webkit-mask-image:radial-gradient(ellipse 44% 60% at 47% 47%, #000 34%, rgba(0,0,0,0.62) 64%, transparent 92%); mask-image:radial-gradient(ellipse 44% 60% at 47% 47%, #000 34%, rgba(0,0,0,0.62) 64%, transparent 92%); }
    .arcane-marcher-rift-stage.is-ground .arcane-marcher-beast-clip { -webkit-mask-image:linear-gradient(to top, transparent 6%, rgba(0,0,0,0.88) 28%, #000 46%, #000 84%, transparent 100%); mask-image:linear-gradient(to top, transparent 6%, rgba(0,0,0,0.88) 28%, #000 46%, #000 84%, transparent 100%); }
    .arcane-marcher-beast-wrap { position:relative; width:100%; height:100%; pointer-events:none; will-change:transform,opacity; }
    .arcane-marcher-rift-stage.is-vertical .arcane-marcher-beast-wrap { animation:arcane-marcher-emerge-v 1.65s cubic-bezier(0.14,0.9,0.26,1) both; }
    .arcane-marcher-rift-stage.is-diag .arcane-marcher-beast-wrap { animation:arcane-marcher-emerge-diag 1.65s cubic-bezier(0.14,0.9,0.26,1) both; }
    .arcane-marcher-rift-stage.is-ground .arcane-marcher-beast-wrap { animation:arcane-marcher-emerge-ground 1.65s cubic-bezier(0.14,0.9,0.26,1) both; }
    .arcane-marcher-edge-y { position:absolute; width:136%; aspect-ratio:16/9; height:auto; left:22%; top:18%; max-width:none; pointer-events:none; -webkit-mask-image:linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.38) 5%, #000 13%, #000 76%, rgba(0,0,0,0.36) 89%, transparent 98%); mask-image:linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.38) 5%, #000 13%, #000 76%, rgba(0,0,0,0.36) 89%, transparent 98%); }
    .arcane-marcher-edge-x { position:relative; width:100%; height:100%; -webkit-mask-image:linear-gradient(to right, transparent 0%, rgba(0,0,0,0.42) 5%, #000 11.5%, #000 58%, rgba(0,0,0,0.38) 76%, transparent 94%); mask-image:linear-gradient(to right, transparent 0%, rgba(0,0,0,0.42) 5%, #000 11.5%, #000 58%, rgba(0,0,0,0.38) 76%, transparent 94%); }
    .arcane-marcher-edge-x img { width:100%; height:100%; object-fit:cover; display:block; filter:contrast(1.18) brightness(0.84) saturate(0.8); }
    .arcane-marcher-tint-glaze { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 15% 20.2%, rgba(44,28,68,0.06) 0%, rgba(30,18,48,0.56) 34%, rgba(10,6,18,0.94) 70%); mix-blend-mode:multiply; }
    .arcane-marcher-violet-wash { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 15% 20.2%, rgba(0,0,0,0) 7%, rgba(46,29,76,0.42) 32%, rgba(12,7,22,0.88) 72%); }
    .arcane-marcher-eye-flare { position:absolute; left:42.4%; top:38.6%; width:72px; height:72px; margin-left:-36px; margin-top:-36px; pointer-events:none; will-change:transform,opacity; animation:arcane-marcher-eye-pulse 1.15s ease-out 0.12s both; }
    .arcane-marcher-eye-core { position:absolute; inset:20px; border-radius:50%; background:radial-gradient(circle, #fffbeb 0%, #fbbf24 26%, rgba(217,119,6,0.42) 52%, transparent 82%); }
    .arcane-marcher-eye-beam-h { position:absolute; left:6px; right:6px; top:35px; height:2px; border-radius:50%; background:radial-gradient(ellipse, #fffbeb 0%, rgba(251,191,36,0.68) 38%, transparent 80%); }
    .arcane-marcher-eye-beam-v { position:absolute; top:16px; bottom:16px; left:35px; width:2px; border-radius:50%; background:radial-gradient(ellipse, #fffbeb 0%, rgba(251,191,36,0.52) 38%, transparent 80%); }
    @keyframes arcane-marcher-veil-life { 0%{opacity:0} 22%{opacity:1} 82%{opacity:1} 100%{opacity:0} }
    @keyframes arcane-rift-open-v { 0%{opacity:0;transform:scale(0.18,0.35)} 12%{opacity:1;transform:scale(1.06,1.02)} 76%{opacity:1;transform:scale(1,1)} 100%{opacity:0;transform:scale(0.18,0.92)} }
    @keyframes arcane-rift-open-diag { 0%{opacity:0;transform:rotate(-42deg) scale(0.35,0.16)} 12%{opacity:1;transform:rotate(-42deg) scale(1.06,1.06)} 76%{opacity:1;transform:rotate(-42deg) scale(1,1)} 100%{opacity:0;transform:rotate(-42deg) scale(0.9,0.14)} }
    @keyframes arcane-rift-open-ground { 0%{opacity:0;transform:scale(0.25,0.3)} 14%{opacity:1;transform:scale(1.05,1.05)} 76%{opacity:1;transform:scale(1,1)} 100%{opacity:0;transform:scale(0.7,0.22)} }
    @keyframes arcane-marcher-emerge-v { 0%{opacity:0;transform:scale(0.42) translate(28px,10px)} 18%{opacity:1;transform:scale(1.06) translate(-4px,0)} 74%{opacity:1;transform:scale(1.02) translate(0,0)} 100%{opacity:0;transform:scale(0.68) translate(16px,6px)} }
    @keyframes arcane-marcher-emerge-diag { 0%{opacity:0;transform:scale(0.46) translate(92px,-66px)} 18%{opacity:1;transform:scale(1.06) translate(-8px,8px)} 74%{opacity:1;transform:scale(1.02) translate(0,0)} 100%{opacity:0;transform:scale(0.72) translate(46px,-32px)} }
    @keyframes arcane-marcher-emerge-ground { 0%{opacity:0;transform:scale(0.68) translateY(96px)} 20%{opacity:1;transform:scale(1.05) translateY(-4px)} 74%{opacity:1;transform:scale(1.02) translateY(0)} 100%{opacity:0;transform:scale(0.84) translateY(58px)} }
    @keyframes arcane-marcher-eye-pulse { 0%{opacity:0;transform:scale(0.2)} 18%{opacity:1;transform:scale(1.38)} 52%{opacity:0.95;transform:scale(1)} 100%{opacity:0;transform:scale(0.75)} }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->
  <div class="absolute top-2 sm:top-4 right-2 sm:right-4 z-[115] flex gap-1.5 sm:gap-2">
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-violet-400 hover:text-violet-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📚</span> <span class="hidden sm:inline">世界书</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-purple-400 hover:text-purple-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📜</span> <span class="hidden sm:inline">记录</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-400 hover:text-blue-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔲</span> <span class="hidden sm:inline">全屏</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>💬</span> <span class="hidden sm:inline">对话</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-yellow-500 hover:text-yellow-400 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>⚙️</span> <span class="hidden sm:inline">设置</span></button>
    <button id="btn-reset" class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-emerald-400 hover:text-emerald-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔄</span> <span class="hidden sm:inline">重置</span></button>
  </div>

  <!-- 全屏战场区域 -->
  <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-800 to-emerald-900 overflow-hidden z-0" id="battle-scene">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-0"></div>
    <div class="absolute left-1 sm:left-4 md:left-6 top-16 sm:top-20 bottom-44 sm:bottom-48 w-12 sm:w-14 z-30 flex flex-col items-center select-none">
      <div class="relative w-full h-full flex flex-col items-center">
        <div class="timeline-rail"><div class="rail-pulse-beam"></div></div>
        <div id="turn-order-container" class="relative w-full h-full flex flex-col gap-2 sm:gap-2.5 items-center overflow-y-auto no-scrollbar mask-fade-y py-3"></div>
      </div>
    </div>
    <div id="enemies-container" class="absolute left-2 sm:left-6 right-2 sm:right-6 top-[10%] bottom-[190px] sm:bottom-[220px] z-10 flex flex-col items-center justify-start gap-6 overflow-visible pointer-events-none"></div>
  </div>

  <!-- 悬浮 UI 层 -->
  <div class="absolute bottom-[52px] left-0 w-full p-1.5 sm:p-6 flex flex-col-reverse sm:flex-row items-end justify-between gap-1.5 sm:gap-4 z-20 pointer-events-none pb-2 sm:pb-6">
    <div id="heroes-container" class="w-full sm:flex-1 grid grid-cols-4 gap-1 sm:gap-4 max-w-2xl pointer-events-auto relative"></div>
    <div class="relative self-end">
      <div id="menu-container" class="w-[282px] h-[222px] bg-slate-950/95 backdrop-blur-xl rounded-xl border border-slate-700/80 border-t-2 border-t-violet-500/80 flex flex-col overflow-hidden relative shadow-[0_15px_35px_rgba(0,0,0,0.9)] pointer-events-auto self-end mb-1 sm:mb-0">
        <div class="px-2.5 py-1 bg-gradient-to-r from-violet-950/60 via-slate-900/90 to-slate-950 border-b border-violet-900/40 flex justify-between items-center shrink-0">
          <div class="flex items-center gap-1.5 min-w-0"><span class="w-1.5 h-1.5 rounded-full bg-violet-400 animate-pulse shrink-0"></span><span class="text-xs font-bold text-violet-300">技能演练 · 空间裂隙</span></div>
          <span id="asset-status-pill" class="text-[9px] text-slate-400 font-mono">资源探测中</span>
        </div>

class CanvasFxEngine {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }
}

        // 0ms：玄武岩瓶启封 + 冥河死寂尘沙渐起
        playPresetCue('fs_start');
        burst(10, () => {
            const a = Math.random() * 6.283, r = rnd(10, 32);
            return { x: cc.x + Math.cos(a) * r, y: cc.y - 16 + Math.sin(a) * r * 0.5, vx: Math.cos(a) * 1.5, vy: rnd(-2.2, -0.6), drag: 0.94, decay: 0.036, size: rnd(14, 22), shape: 'gradMist', blend: 'source-over', color: 'rgba(28,36,64,0.68)', fade: 'rgba(13,18,32,0)' };
        });
        if (casterEl && casterEl !== el) {
            flash(casterEl, 'arcane-flash-cold');
            playPresetCue('fs_fly');
            fly({ x: cc.x, y: cc.y - 18 }, { x: c.x, y: c.y }, -42, 250, (x, y) => {
                if (cancelled || token !== combatToken) return;
                addP({ x, y, shape: 'gradMist', size: rnd(10, 15), decay: 0.055, blend: 'source-over', color: 'rgba(42,50,82,0.56)', fade: 'rgba(13,18,32,0)' });
                burst(2, () => ({ x: x + rnd(-5, 5), y: y + rnd(-5, 5), vx: rnd(-1.0, 1.0), vy: rnd(-1.2, 0.8), drag: 0.92, decay: 0.072, size: rnd(2.2, 3.8), shape: 'gradOrb', trail: 6, core: '#e0f2fe', color: 'rgba(147,197,253,0.88)', edge: 'rgba(99,102,241,0.4)' }));
            });
        }

        let stepTick = 0;
        const swirl = tEvery(30, () => {
            if (cancelled || token !== combatToken) return;
            const ang = (stepTick++) * 0.92;
            burst(3, i => {
                const a = ang + i * 2.09, rad = rnd(24, 54);
                return {
                    x: c.x + Math.cos(a) * rad, y: c.bottom - 14 - stepTick * 10,
                    vx: -Math.sin(a) * 2.0, vy: rnd(-2.4, -1.0), drag: 0.94, decay: 0.042,
                    size: i === 0 ? rnd(12, 18) : rnd(2.1, 3.5),
                    shape: i === 0 ? 'gradMist' : 'gradOrb', trail: i === 0 ? 0 : 5,
                    blend: i === 0 ? 'source-over' : 'lighter',
                    core: i === 0 ? undefined : '#f1f5f9',
                    color: i === 0 ? 'rgba(22,30,54,0.65)' : 'rgba(148,184,232,0.85)',
                    edge: 'rgba(71,85,125,0.38)', fade: 'rgba(13,18,32,0)'
                };
            });
        });

        // 280ms：收束单卡哥特盾牌外框 + 夜影兜帽双眸 + 柔光流转
        tAfter(CHARGE, () => {
            stopInt(swirl);
            if (cancelled || token !== combatToken) return;
            playPresetCue('fs_armor');
            tAfter(65, () => { if (!cancelled && token === combatToken) playPresetCue('fs_shield'); });
            shake('light');
            flash(el, 'arcane-flash-cold');

            const imgSrc = resolveVfxImg('stygian');
            const sw = Math.min(186, Math.max(150, Math.round(c.w * 1.16))), sh = Math.round(sw * 1.15);
            const ay = Math.max(sh * 0.52 + 8, c.y - 10);
            const clipId = 'arcane-sh-clip-' + uid, maskId = 'arcane-sh-mask-' + uid, mgId = 'arcane-sh-mg-' + uid, rimId = 'arcane-sh-rim-' + uid, sheenId = 'arcane-sh-sheen-' + uid;
            const shieldPath = 'M 100,12 C 138,12 172,22 184,32 C 186,118 160,174 100,218 C 40,174 14,118 16,32 C 28,22 62,12 100,12 Z';
            const innerPath  = 'M 100,20 C 134,20 165,28 176,37 C 178,116 154,167 100,208 C 46,167 22,116 24,37 C 35,28 66,20 100,20 Z';

            addLayer(`<div class="arcane-stygian-aura" style="left:${c.x}px; top:${ay}px; width:${Math.round(sw * 1.24)}px; height:${Math.round(sh * 1.14)}px; margin-left:${-Math.round(sw * 0.62)}px; margin-top:${-Math.round(sh * 0.57)}px;"></div>
              <div class="arcane-stygian-shield-wrap" style="left:${c.x}px; top:${ay}px; width:${sw}px; height:${sh}px; margin-left:${-Math.round(sw / 2)}px; margin-top:${-Math.round(sh / 2)}px;">
                <svg viewBox="0 0 200 230" style="width:100%;height:100%;overflow:visible">
                  <defs>
                    <clipPath id="${clipId}"><path d="${shieldPath}"/></clipPath>
                    <radialGradient id="${mgId}" cx="50%" cy="44%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset="0.64" stop-color="#fff"/><stop offset="0.88" stop-color="#777"/><stop offset="1" stop-color="#111"/></radialGradient>
                    <mask id="${maskId}"><rect x="0" y="0" width="200" height="230" fill="url(#${mgId})"/></mask>
                    <linearGradient id="${rimId}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#e0f2fe"/><stop offset="0.45" stop-color="#7dd3fc"/><stop offset="1" stop-color="#64748b"/></linearGradient>
                    <linearGradient id="${sheenId}" x1="0%" y1="0%" x2="100%" y2="25%"><stop offset="0" stop-color="transparent"/><stop offset="0.5" stop-color="rgba(224,242,254,0.34)"/><stop offset="1" stop-color="transparent"/></linearGradient>
                  </defs>
                  <path d="${shieldPath}" fill="#090d1a" fill-opacity="0.9"/>
                  <g clip-path="url(#${clipId})" mask="url(#${maskId})">
                    <image href="${imgSrc}" x="0" y="0" width="200" height="230" preserveAspectRatio="xMidYMid slice" onerror="this.style.display='none'"/>
                    <rect x="-80" y="0" width="120" height="230" fill="url(#${sheenId})" style="animation:arcane-armor-sweep 0.62s 0.08s ease-out both"/>
                  </g>
                  <path d="${shieldPath}" fill="none" stroke="url(#${rimId})" stroke-width="2.6" stroke-opacity="0.92"/>
                  <path d="${innerPath}" fill="none" stroke="#93c5fd" stroke-width="0.95" stroke-opacity="0.48"/>
                  <circle cx="100" cy="12" r="2.8" fill="#e0f2fe" opacity="0.9"/>
                  <g class="arcane-stygian-eye">
                    <circle cx="95.5" cy="43.8" r="4.6" fill="rgba(125,211,252,0.45)"/>
                    <circle cx="104.5" cy="43.8" r="4.6" fill="rgba(125,211,252,0.45)"/>
                    <circle cx="95.5" cy="43.8" r="1.9" fill="#e0f2fe"/>
                    <circle cx="104.5" cy="43.8" r="1.9" fill="#e0f2fe"/>
                  </g>
                </svg>
              </div>`, 1140);

            addP({ x: c.x, y: c.y, shape: 'ring', size: 1.9, decay: 0.044, color: 'rgba(147,197,253,0.46)' });
            burst(20, () => {
                const a = Math.random() * 6.283, spd = rnd(2.0, 5.6);
                return {
                    x: c.x, y: c.y - 8, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 0.5,
                    drag: 0.93, decay: rnd(0.025, 0.044), size: rnd(2.2, 4.0), shape: 'gradOrb', trail: 6,
                    core: '#f8fafc', color: pick(['rgba(186,230,253,0.88)', 'rgba(125,211,252,0.82)', 'rgba(129,140,248,0.75)']),
                    edge: 'rgba(59,75,117,0.35)'
                };
            });
            burst(10, () => {
                const a = Math.random() * 6.283, spd = rnd(1.2, 3.2);
                return {
                    x: c.x + rnd(-18, 18), y: c.y + rnd(-8, 18), vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
                    drag: 0.94, decay: rnd(0.026, 0.04), size: rnd(14, 22), shape: 'gradMist', blend: 'source-over',
                    color: pick(['rgba(20,26,48,0.72)', 'rgba(52,64,98,0.56)']), fade: 'rgba(13,18,32,0)'
                };
            });
            let aimTick = 0;
            const aimOrbit = tEvery(26, () => {
                if (cancelled || token !== combatToken || aimTick++ > 18) return stopInt(aimOrbit);
                for (let k = 0; k < 3; k++) {
                    const ang = aimTick * 0.28 + k * 2.094;
                    addP({
                        x: c.x + Math.cos(ang) * 62, y: c.y + Math.sin(ang) * 42,
                        vx: -Math.sin(ang) * 2.4, vy: Math.cos(ang) * 1.6, drag: 0.92, decay: 0.14,
                        shape: 'gradOrb', trail: 5, size: 2.9, core: '#e0f2fe', color: 'rgba(125,211,252,0.88)', edge: 'rgba(99,102,241,0.38)'
                    });
                }
            });
        });

        // 660ms：[再动] 银靛流光升腾
        tAfter(660, () => {
            if (cancelled || token !== combatToken) return;
            playPresetCue('fs_reac');
            addP({ x: c.x, y: c.y - 16, shape: 'gradFlare', size: 16, decay: 0.048, core: '#f0f9ff', color: 'rgba(147,197,253,0.72)' });
            burst(14, () => ({
                x: c.x + rnd(-24, 24), y: c.y + rnd(-10, 20), vx: rnd(-1.3, 1.3), vy: rnd(-5.0, -2.0),
                drag: 0.93, decay: 0.038, size: rnd(2.1, 3.8), shape: 'gradOrb', trail: 7,
                core: '#ffffff', color: 'rgba(186,230,253,0.88)', edge: 'rgba(129,140,248,0.4)'
            }));
        });

        tAfter(LIFE, () => handle.cancel());
        return handle;
    }

    // ===== ② 蝎眼钥匙 · 幻梦行军兽（L4，零直边双轴消融 + 暗紫渐变裂隙高光 + 4档真音对比） =====
    function playXieYanKey(caster, targets, isReaction = false, scheme = S.marcherScheme || 'vertical') {
        const casterEl = domOf(caster) || (targets && domOf(targets[0]));
        const wardTargets = (targets && targets.length ? targets : (caster ? [caster] : [])).filter(Boolean);
        const mode = (scheme === 'diag' || scheme === 'ground') ? scheme : 'vertical';
        const token = combatToken;
        ensureCanvas(); ensureDriver();
        const CHARGE = 1150, LIFE = 3350;
        const vw = window.innerWidth, vh = window.innerHeight;
        const cX = vw * 0.5, cY = mode === 'ground' ? vh * 0.52 : vh * 0.46;
        let cancelled = false;
        const timers = new Set(), layers = new Set(), intervals = new Set();
        const tAfter = (ms, fn) => { const id = after(ms, () => { timers.delete(id); fn(); }); timers.add(id); return id; };
        const tEvery = (ms, fn) => { const id = every(ms, fn); intervals.add(id); return id; };
        const stopInt = id => { stopEvery(id); intervals.delete(id); };
        const addLayer = (html, ms) => { const l = fsLayer(html, ms); layers.add(l); return l; };

        const handle = {
            doneAt: Date.now() + LIFE, impactDom: null, dodge: null, hit: null,
            cancel() {
                cancelled = true;
                timers.forEach(id => { clearTimeout(id); S.timers.delete(id); }); timers.clear();
                intervals.forEach(id => stopEvery(id)); intervals.clear();
                layers.forEach(l => { S.layers.delete(l); l.remove(); }); layers.clear();
                if (S.dark) S.dark.style.opacity = '0';
                S.handles.delete(handle);
                releaseIdleCanvas();
            }
        };
        S.handles.add(handle);

        // Act I (0–1150ms)：钥匙启封蓄压，低饱和暗紫流光与纯无白芯深渊灰雾向裂隙原点收束塌缩
        darken(0.9);
        addLayer('<div class="arcane-marcher-veil"></div>', 3300);
        playPresetCue('xy_charge');

        if (casterEl) {
            const csc = ctr(casterEl);
            tAfter(40, () => {
                if (cancelled || token !== combatToken) return;
                flash(casterEl, 'arcane-flash-cold');
                playPresetCue('xy_fly');
                fly({ x: csc.x, y: csc.y - 12 }, { x: cX, y: cY }, 45, 220, (x, y) => {
                    if (cancelled || token !== combatToken) return;
                    addP({ x, y, shape: 'gradOrb', trail: 6, size: 4, decay: 0.09, core: '#ede9fe', color: 'rgba(139,112,184,0.85)', edge: 'rgba(56,39,82,0.4)' });
                });
            });
        }
        const rumble = tEvery(320, () => { if (!cancelled && token === combatToken) shake('light'); });
        let orbitTick = 0;
        const orbitInt = tEvery(36, () => {
            if (cancelled || token !== combatToken) return stopInt(orbitInt);
            orbitTick++;
            const pr = Math.min(1, orbitTick / 26), baseR = Math.max(vw, vh) * 0.40 * (1 - pr * 0.82);
            burst(6, i => {
                const a = Math.random() * 6.283, r = baseR + rnd(-28, 28), spd = rnd(3.2, 6.4);
                const isMist = i < 2;
                return {
                    x: cX + Math.cos(a) * r, y: cY + Math.sin(a) * r,
                    vx: -Math.cos(a) * spd - Math.sin(a) * 1.8, vy: -Math.sin(a) * spd + Math.cos(a) * 1.8,
                    drag: 0.94, decay: isMist ? 0.028 : 0.044,
                    size: isMist ? rnd(18, 30) : rnd(2.2, 4),
                    shape: isMist ? 'gradMist' : 'gradOrb', trail: isMist ? 0 : 6,
                    blend: isMist ? 'source-over' : 'lighter',
                    core: isMist ? undefined : '#ede9fe',
                    color: isMist ? pick(['rgba(20,13,34,0.72)', 'rgba(46,32,70,0.54)']) : pick(['rgba(167,154,194,0.82)', 'rgba(124,99,166,0.82)', 'rgba(91,63,128,0.75)']),
                    edge: 'rgba(56,39,82,0.38)', fade: 'rgba(8,5,14,0)'
                };
            });
        });
        tAfter(1010, () => { stopInt(orbitInt); stopInt(rumble); });
        tAfter(1035, () => {
            if (cancelled || token !== combatToken) return;
            addP({ x: cX, y: cY, shape: 'gradFlare', size: 42, decay: 0.08, core: '#f5f3ff', color: 'rgba(139,112,184,0.75)' });
            fxEngine.hitStop = 110;
        });

        // Act II (1150–2650ms)：空间裂隙撕开 + 零直边双轴渐隐容器 + 裂隙边缘暗紫微光
        tAfter(CHARGE, () => {
            if (cancelled || token !== combatToken) return;
            fxEngine.hitStop = 0;
            shake('quake');
            playPresetCue('xy_burst');
            tAfter(180, () => { if (!cancelled && token === combatToken) playPresetCue('xy_roar'); });
            tAfter(410, () => { if (!cancelled && token === combatToken) playPresetCue('xy_stomp'); });

            const imgSrc = resolveVfxImg('marcher');
            const stageTop = mode === 'ground' ? '50%' : '46%';
            addLayer(`<div class="arcane-marcher-flash"></div>
              <div class="arcane-marcher-rift-stage is-${mode}" style="top:${stageTop};">
                <div class="arcane-marcher-abyss"></div>
                <div class="arcane-marcher-rift-rim"></div>
                <div class="arcane-marcher-beast-clip">
                  <div class="arcane-marcher-beast-wrap">
                    <div class="arcane-marcher-edge-y">
                      <div class="arcane-marcher-edge-x">
                        <img src="${imgSrc}" alt="" onerror="this.style.display='none'"/>
                        <div class="arcane-marcher-tint-glaze"></div>
                        <div class="arcane-marcher-violet-wash"></div>
                      </div>
                    </div>
                    <div class="arcane-marcher-eye-flare">
                      <div class="arcane-marcher-eye-core"></div>
                      <div class="arcane-marcher-eye-beam-h"></div>
                      <div class="arcane-marcher-eye-beam-v"></div>
                    </div>
                  </div>
                </div>
              </div>`, 1680);

            addP({ x: cX, y: cY, shape: 'ring', size: 5.5, decay: 0.026, color: 'rgba(139,112,184,0.44)' });
            addP({ x: cX, y: cY, shape: 'gradFlare', size: 64, decay: 0.052, core: '#f5f3ff', color: 'rgba(124,99,166,0.7)' });

            // 前景暗紫浓雾塑形与遮挡穿插（0 硬边线）
            burst(28, i => {
                const dir = i % 2 === 0 ? -1 : 1;
                const vx = mode === 'diag' ? -dir * rnd(5, 11) * 0.74 : (mode === 'ground' ? rnd(-5, 5) : dir * rnd(4.5, 11));
                const vy = mode === 'diag' ? dir * rnd(5, 11) * 0.67 : (mode === 'ground' ? rnd(-8.5, -2.5) : rnd(-2.8, 2.4));
                return {
                    x: cX + rnd(-95, 95), y: cY + (mode === 'ground' ? rnd(30, 120) : rnd(-80, 95)),
                    vx, vy, grav: mode === 'ground' ? 0.14 : 0.02, drag: 0.92, decay: rnd(0.016, 0.028),
                    size: rnd(26, 48), sx: 1.55, sy: 0.85, shape: 'gradMist', blend: 'source-over',
                    color: pick(['rgba(14,9,24,0.84)', 'rgba(34,22,52,0.72)', 'rgba(58,42,84,0.56)']),
                    fade: 'rgba(6,4,12,0)'
                };
            });

            // 裂隙方向特化渐变尾粒（无 stroke 实线）
            burst(44, () => {
                let vx, vy, sx = cX, sy = cY;
                if (mode === 'diag') {
                    const sign = Math.random() < 0.65 ? -1 : 1, sp = rnd(6, 15);
                    vx = sign * 0.743 * sp + rnd(-2.2, 2.2); vy = -sign * 0.669 * sp + rnd(-2.2, 2.2);
                    sx = cX + rnd(-80, 80); sy = cY + rnd(-60, 60);
                } else if (mode === 'ground') {
                    vx = rnd(-6.5, 6.5); vy = rnd(-13, -4.5);
                    sx = cX + rnd(-150, 150); sy = cY + rnd(40, 110);
                } else {
                    const side = Math.random() < 0.5 ? -1 : 1, sp = rnd(5, 14);
                    vx = side * sp; vy = rnd(-3.5, 3.5);
                    sx = cX + rnd(-32, 32); sy = cY + rnd(-130, 130);
                }
                return {
                    x: sx, y: sy, vx, vy, grav: mode === 'ground' ? 0.22 : 0.04, drag: 0.93, decay: rnd(0.02, 0.036),
                    size: rnd(2.2, 4.4), shape: 'gradOrb', trail: 7,
                    core: '#f5f3ff',
                    color: pick(['rgba(167,154,194,0.85)', 'rgba(139,112,184,0.82)', 'rgba(104,85,134,0.78)']),
                    edge: 'rgba(56,39,82,0.4)'
                };
            });

            const riftStream = tEvery(46, () => {
                if (cancelled || token !== combatToken) return stopInt(riftStream);
                burst(4, i => {
                    const side = i % 2 === 0 ? -1 : 1;
                    const vx = mode === 'diag' ? -0.743 * rnd(7, 13) : (mode === 'ground' ? rnd(-3.2, 3.2) : side * rnd(6, 12));
                    const vy = mode === 'diag' ? 0.669 * rnd(7, 13) : (mode === 'ground' ? rnd(-7.5, -3) : rnd(-1.4, 1.4));
                    const isMist = i < 2;
                    return {
                        x: cX + rnd(-110, 110), y: cY + (mode === 'ground' ? rnd(50, 120) : rnd(-100, 100)),
                        vx, vy, grav: mode === 'ground' ? 0.12 : 0, drag: 0.94, decay: isMist ? 0.024 : 0.036,
                        size: isMist ? rnd(18, 30) : rnd(2, 3.6), shape: isMist ? 'gradMist' : 'gradOrb', trail: isMist ? 0 : 6,
                        blend: isMist ? 'source-over' : 'lighter',
                        core: isMist ? undefined : '#ede9fe',
                        color: isMist ? 'rgba(24,15,38,0.62)' : 'rgba(152,132,188,0.8)', edge: 'rgba(56,39,82,0.35)', fade: 'rgba(6,4,12,0)'
                    };
                });
            });
            tAfter(980, () => stopInt(riftStream));
        });

        // Act III (2500–3350ms)：堡垒鞍齿轮锁合单防回流
        tAfter(2500, () => {
            if (cancelled || token !== combatToken) return;
            playPresetCue('xy_lock');
            wardTargets.forEach(wt => {
                const wEl = domOf(wt);
                if (!wEl) return;
                const wc = ctr(wEl);
                fly({ x: cX, y: cY }, { x: wc.x, y: wc.y }, -64, 340, (x, y) => {
                    if (cancelled || token !== combatToken) return;
                    addP({ x, y, shape: 'gradOrb', trail: 6, size: 3.8, decay: 0.08, core: '#fef3c7', color: 'rgba(196,181,253,0.82)', edge: 'rgba(104,85,134,0.4)' });
                }, () => {
                    if (cancelled || token !== combatToken) return;
                    flash(wEl, 'arcane-flash-cold');
                    playPresetCue('xy_ward');
                    addP({ x: wc.x, y: wc.y, shape: 'ring', size: 2.2, decay: 0.04, color: 'rgba(167,139,250,0.48)' });
                    burst(16, () => {
                        const a = Math.random() * 6.283, spd = rnd(2.2, 6);
                        return { x: wc.x, y: wc.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, drag: 0.92, decay: 0.038, size: rnd(2.2, 3.8), shape: 'gradOrb', trail: 5, core: '#f5f3ff', color: 'rgba(167,154,194,0.85)', edge: 'rgba(72,52,102,0.38)' };
                    });
                });
            });
        });
        tAfter(2860, () => { if (!cancelled && token === combatToken) darken(0); });
        tAfter(LIFE, () => handle.cancel());
        return handle;
    }
    // ===== 新技能实现 END =====

    // ===== 对外接口（与正式版同名同参；不将演示卡片或占位数据带入模块） =====
    function isArcaneSkillFx(fxTag) { return ARCANE_TAGS.indexOf(fxTag) !== -1; }
    function playArcaneSkillFx(fxTag, caster, targets, isReaction = false, scheme) {
        if (!isArcaneSkillFx(fxTag)) return null;
        if (fxTag === '飞沙化甲') return playFeiShaHuaJia(caster, targets);
        if (fxTag === '蝎眼钥匙') return playXieYanKey(caster, targets, isReaction, scheme || window.__RPG_MARCHER_SCHEME__ || S.marcherScheme);
        return null;
    }
    function playArcaneProjectile(type, fromDom, toDom, dodged = false) {
        if (!fromDom || !toDom || !fromDom.getBoundingClientRect || !toDom.getBoundingClientRect) return Promise.resolve();
        const token = combatToken;
        ensureCanvas(); ensureDriver();
        if (type === 'fire') fireProjectile(fromDom, toDom, !!dodged, token);
        else if (type === 'enemy_spell') enemySpellProjectile(fromDom, toDom, !!dodged, token);
        const beat = type === 'fire' ? 580 : 480;
        return new Promise(res => {
            const id = setTimeout(() => { S.rawTimers.delete(id); res(); }, beat);
            S.rawTimers.set(id, res);
        });
    }
    function clearArcaneFx() {
        stopAllSfx();
        S.timers.forEach(id => clearTimeout(id)); S.timers.clear();
        S.rawTimers.forEach((resolve, id) => { clearTimeout(id); resolve(); }); S.rawTimers.clear();
        S.intervals.forEach(id => clearInterval(id)); S.intervals.clear();
        S.flights.length = 0; S.particles.length = 0;
        S.particleTimer = null; S.particleUntil = 0;
        if (S.driver) { const idx = fxEngine.particles.indexOf(S.driver); if (idx >= 0) fxEngine.particles.splice(idx, 1); S.driver = null; }
        S.handles.forEach(h => { if (h && h.cancel) h.cancel(); }); S.handles.clear();
        S.layers.forEach(d => d.remove()); S.layers.clear();
        S.anchors.forEach(d => d.remove()); S.anchors.clear();
        S.flashes.forEach(el => el.classList.remove('arcane-flash-cold', 'arcane-flash-heal')); S.flashes.clear();
        S.shakeEls.forEach(el => el.classList.remove('arcane-shake-light', 'arcane-shake-heavy', 'arcane-shake-quake')); S.shakeEls.clear();
        if (S.dark) { S.dark.remove(); S.dark = null; }
        if (S.canvas) { S.canvas.remove(); S.canvas = null; S.ctx = null; }
    }
    window.isArcaneSkillFx = isArcaneSkillFx;
    window.playArcaneSkillFx = playArcaneSkillFx;
    window.playArcaneProjectile = playArcaneProjectile;
    window.clearArcaneFx = clearArcaneFx;
    window.warmArcaneSfx = warmAllSfx;
    return { isArcaneSkillFx, playArcaneSkillFx, playArcaneProjectile, clearArcaneFx };
})();
    // ===== 可移植特效模块 END =====

    // ===== 演示控制 BEGIN：仅驱动上述正式版接口，不参与移植 =====
    // 接入点 4：CARDS 每项为 { name, level, description, fxTag, casterId, targetIds, isReaction }。
    // casterId / targetIds 使用上方 h1-h4、e1-e6；level 使用 L1-L4，默认列表为空。
    // 反应演练可在 playDemoSkill 中调用返回的 handle.dodge / hit，不把模拟攻击写进技能实现。
    const CARDS = [
        { name: '飞沙化甲 · 自身', level: 'L2', description: '单防50 · 单瞄30 · 再动1 · 冥河夜影覆甲', fxTag: '飞沙化甲', casterId: 'h1', targetIds: ['h1'], isReaction: false },
        { name: '飞沙化甲 · 他人', level: 'L2', description: '单防50 · 单瞄30 · 再动1 · 远程授甲（弗兰克）', fxTag: '飞沙化甲', casterId: 'h1', targetIds: ['h2'], isReaction: false },
        { name: '蝎眼钥匙 · 行军兽', level: 'L4', description: '召唤幻梦行军兽 · 单防10 · 高阶大招演出', fxTag: '蝎眼钥匙', casterId: 'h1', targetIds: [], isReaction: false }
    ];
    let unlockTimer = null;

    function lockCards(locked) {
        document.querySelectorAll('#skill-list .card').forEach(card => { card.disabled = locked; });
    }
    function playDemoSkill(card) {
        combatToken++;
        clearArcaneFx();
        clearTimeout(unlockTimer);
        const entities = heroesData.concat(enemiesData);
        const caster = entities.find(e => e.id === card.casterId);
        const targets = card.targetIds.map(id => entities.find(e => e.id === id));
        const handle = playArcaneSkillFx(card.fxTag, caster, targets, !!card.isReaction);
        if (handle && handle.doneAt > Date.now()) {
            lockCards(true);
            unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, handle.doneAt - Date.now());
        }
        return handle;
    }
    function renderSkillCards() {
        const list = $('#skill-list');
        list.replaceChildren();
        if (!CARDS.length) {
            list.innerHTML = '<div class="flex-1 flex items-center justify-center text-xs text-slate-500">暂无技能</div>';
            return;
        }
        CARDS.forEach(card => {
            const button = document.createElement('button');
            button.className = 'card w-full py-1.5 px-2 bg-slate-900/80 hover:bg-violet-950/60 border border-slate-700/80 hover:border-violet-500/60 rounded-lg text-left transition-all shadow-sm';
            button.title = card.fxTag;
            button.innerHTML = '<div class="flex items-center justify-between gap-1"><span class="text-xs font-bold text-slate-100"></span><span class="text-[9px] font-bold px-1 rounded border border-cyan-500/60 text-cyan-300"></span></div><div class="text-[9px] text-slate-400 truncate"></div>';
            const labels = button.querySelectorAll('span');
            labels[0].textContent = card.name;
            labels[1].textContent = card.level;
            button.lastElementChild.textContent = card.description;
            button.addEventListener('click', () => playDemoSkill(card));
            list.appendChild(button);
        });
    }
    function resetDemo() {
        combatToken++;
        clearTimeout(unlockTimer); unlockTimer = null;
        clearArcaneFx();
        cancelAnimationFrame(fxEngine.animationFrameId); fxEngine.animationFrameId = null;
        fxEngine.particles.length = 0; fxEngine.hitStop = 0; fxEngine.lastFrameTime = 0;
        fxEngine.ctx.clearRect(0, 0, fxEngine.canvas.width, fxEngine.canvas.height);
        initUI();
        renderSkillCards();
        setMarcherScheme(window.__RPG_MARCHER_SCHEME__);
        setSfxPack(window.__RPG_SFX_PACK__);
    }
    window.__RPG_MARCHER_SCHEME__ = window.__RPG_MARCHER_SCHEME__ || 'vertical';
    window.__RPG_SFX_PACK__ = window.__RPG_SFX_PACK__ || 'battle';
    const SCHEME_LABELS = { vertical: '竖裂深渊探身', diag: '42°斜裂飞扑', ground: '地裂深坑仰出' };
    function setMarcherScheme(scheme) {
        window.__RPG_MARCHER_SCHEME__ = scheme;
        document.querySelectorAll('#rift-scheme-bar .scheme-btn').forEach(btn => {
            const on = btn.dataset.scheme === scheme;
            btn.className = 'scheme-btn text-[10px] font-bold py-0.5 rounded transition-colors border ' + (on ? 'bg-violet-900/60 text-violet-100 border-violet-400/70' : 'bg-slate-900/80 text-slate-400 border-slate-700/70 hover:text-slate-200');
        });
        const cardDesc = document.querySelector('#skill-list .card:last-child div:last-child');
        if (cardDesc) cardDesc.textContent = '召唤幻梦行军兽 · ' + (SCHEME_LABELS[scheme] || '');
    }
    function setSfxPack(pack) {
        window.__RPG_SFX_PACK__ = pack;
        document.querySelectorAll('#sfx-pack-bar .sfx-btn').forEach(btn => {
            const on = btn.dataset.sfx === pack;
            btn.className = 'sfx-btn text-[9px] font-bold py-0.5 rounded transition-colors border ' + (on ? 'bg-cyan-900/60 text-cyan-100 border-cyan-400/70' : 'bg-slate-900/80 text-slate-400 border-slate-700/70 hover:text-slate-200');
        });
    }
    document.querySelectorAll('#rift-scheme-bar .scheme-btn').forEach(btn => {
        btn.addEventListener('click', () => setMarcherScheme(btn.dataset.scheme));
    });
    document.querySelectorAll('#sfx-pack-bar .sfx-btn').forEach(btn => {
        btn.addEventListener('click', () => setSfxPack(btn.dataset.sfx));
    });

    async function probeAndWarmVfxAssets() {
        const pill = $('#asset-status-pill');
        const tryImg = url => new Promise(res => {
            const img = new Image();
            let done = false;
            const finish = ok => { if (!done) { done = true; res(ok); } };
            const timer = setTimeout(() => finish(false), 1200);
            img.onload = () => { clearTimeout(timer); finish(true); };
            img.onerror = () => { clearTimeout(timer); finish(false); };
            img.src = url;
        });
        const bases = [window.__RPG_ASSET_BASE__, 'http://127.0.0.1:8766', 'http://192.168.110.83:8766', '../my_assets'].filter(Boolean);
        for (const base of bases) {
            const clean = base.replace(/\/+$/, '');
            const u1 = clean + '/vfx_stygian_armor.jpg', u2 = clean + '/vfx_dream_marcher.jpg';
            const [ok1, ok2] = await Promise.all([tryImg(u1), tryImg(u2)]);
            if (ok1 && ok2) {
                window.__RPG_VFX_ASSET_BASE__ = clean;
                window.__RPG_VFX_IMAGES__ = { stygian: u1, marcher: u2 };
                if (window.warmArcaneSfx) window.warmArcaneSfx();
                if (pill) {
                    pill.textContent = clean.startsWith('..') ? '本地相对资源已就绪' : '8766 音画已预热';
                    pill.className = 'text-[9px] text-emerald-400 font-mono';
                }
                return;
            }
        }
        if (pill) {
            pill.textContent = '立绘未命中（矢量兜底）';
            pill.className = 'text-[9px] text-amber-400 font-mono';
        }
    }
    document.addEventListener('pointerdown', () => { if (window.warmArcaneSfx) window.warmArcaneSfx(); }, { once: true });
    probeAndWarmVfxAssets();
    $('#btn-reset').addEventListener('click', resetDemo);
    renderSkillCards();
    setMarcherScheme(window.__RPG_MARCHER_SCHEME__);
    setSfxPack(window.__RPG_SFX_PACK__);
    // ===== 演示控制 END =====
    // 移植：只将新增 arcane- CSS、技能函数、标签与分派合并到正式版已有模块。
    // 必须同时追加 WEBM_FX_REGISTRY 的 { url: '', scale: 1.0, particles: 'arcane', delay: 蓄势秒数 }。
    // 技能数据追加 [特效:精确标签]；按技能类型核对默认光效去重与真实反应回调，不改数值规则。
    // 详细接线、测试与打包步骤见《技能SVG模板使用与快速移植.md》，不是复制整页即可上线。
    // 正式版已提供 fxEngine / combatToken / getEntitySpriteDom / heroesData / enemiesData，勿重复复制演示宿主。
  </script>
