<head>

  <title>Arcanum MCMXXIV · 奇幻秘术演练场</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Limelight&family=Cinzel:wght@500;700&family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .s-light { animation: s-light 0.18s ease-out; } .s-heavy { animation: s-heavy 0.32s ease-out; } .s-quake { animation: s-quake 0.55s ease-out; }
    @keyframes s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    /* 受击/治疗/冷闪：作用在 .fx-body（角色卡 / 敌方精灵） */
    .flash-fire .fx-body { animation: f-fire 0.45s steps(1) both; } @keyframes f-fire { 0% { filter: brightness(2.6) sepia(1) saturate(6) hue-rotate(-20deg); } 30% { filter: brightness(1.4) sepia(1) saturate(4) hue-rotate(-25deg); } 70% { filter: none; } }
    .flash-heal .fx-body { animation: f-heal 0.6s ease-out both; } @keyframes f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .flash-cold .fx-body { animation: f-cold 0.5s steps(1) both; } @keyframes f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    .flinch .fx-body { animation: flinch 0.28s ease-out; } @keyframes flinch { 30% { transform: translateX(10px) skewX(-6deg); } }
    .debuff-chip { font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(168,85,247,0.6); color: #e9d5ff; background: rgba(59,7,100,0.75); font-family: 'JetBrains Mono', monospace; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; }

    #dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease;
      background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    #fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 55; }
    .fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    .float { position: fixed; z-index: 61; pointer-events: none; font-weight: 900; white-space: nowrap; transform: translate(-50%, 0); text-shadow: 0 2px 0 #000, 0 0 12px currentColor; animation: float-up 1.3s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
    @keyframes float-up { 0% { opacity: 0; transform: translate(-50%, 10px) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -8px) scale(1.15); } 30% { transform: translate(-50%, -14px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }

    /* 装饰艺术铭牌横幅（特效层，不属于主界面） */
    #banner { position: fixed; left: 50%; top: 92px; transform: translateX(-50%); z-index: 60; pointer-events: none; opacity: 0; text-align: center; padding: 10px 46px 12px;
      background: linear-gradient(180deg, rgba(20,22,52,0.92), rgba(10,12,30,0.92)); border-top: 2px solid #d4af37; border-bottom: 2px solid #d4af37;
      clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 18px 100%, 0 50%); }
    #banner .en { font-family: 'Limelight', serif; font-size: 14px; letter-spacing: 6px; color: #b9a77a; }
    #banner .cn { font-size: 30px; font-weight: 900; letter-spacing: 8px; background: linear-gradient(180deg, #fff6d5, #e9c46a 50%, #a8741a); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #banner.show { animation: banner-in 1.8s ease both; }
    @keyframes banner-in { 0% { opacity: 0; transform: translateX(-50%) scaleX(0.3); } 14% { opacity: 1; transform: translateX(-50%) scaleX(1.04); } 22% { transform: translateX(-50%) scaleX(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-8px); } }
    /* —— 主工程默认受击特效样式（复刻 index.html） —— */
    @keyframes svg-slash { 0% { stroke-dasharray: 0 200; stroke-dashoffset: 0; opacity: 1; } 50% { stroke-dasharray: 200 200; stroke-dashoffset: 0; opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 100% { stroke-dasharray: 200 200; stroke-dashoffset: -200; opacity: 0; transform: translate(-50%, -50%) scale(1.3); } }
    .anim-slash path { animation: svg-slash 0.4s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
    @keyframes gunshot-core-flash { 0% { transform: translate(-50%, -50%) scale(0.15) rotate(0deg); opacity: 0; filter: brightness(2.5); } 18% { transform: translate(-50%, -50%) scale(1.18) rotate(12deg); opacity: 1; filter: brightness(1.8); } 40% { transform: translate(-50%, -50%) scale(1.02) rotate(20deg); opacity: 0.9; } 100% { transform: translate(-50%, -50%) scale(1.35) rotate(35deg); opacity: 0; } }
    @keyframes gunshot-spark-ray { 0% { transform: translate(-50%, -50%) scale(0.1) rotate(var(--ray-rot, 0deg)); opacity: 1; } 35% { transform: translate(-50%, -50%) scale(1.15) translateY(-22px) rotate(var(--ray-rot, 0deg)); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.35) translateY(-42px) rotate(var(--ray-rot, 0deg)); opacity: 0; } }
    @keyframes gunshot-shock-ring { 0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; stroke-width: 6; } 50% { transform: translate(-50%, -50%) scale(1.6); opacity: 0.75; stroke-width: 2.5; } 100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; stroke-width: 1; } }
    @keyframes angel-flap { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(-9deg); } 70% { transform: rotate(4deg); } }
    .card.lock { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* —— 通用动画 —— */
    @keyframes fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes draw-on { to { stroke-dashoffset: 0; } }
    .grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes ankh-drop { 0% { transform: translate(-50%,-50%) translateY(-160px) scale(0.6); opacity: 0; } 55% { transform: translate(-50%,-50%) translateY(6px) scale(1.05); opacity: 1; } 75% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; filter: brightness(3); } }
    @keyframes clock-life { 0% { transform: translate(-50%,-50%) scale(0.4); opacity: 0; } 18% { transform: translate(-50%,-50%) scale(1.05); opacity: 1; } 80% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.35); opacity: 0; } }
    @keyframes hand-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ghost-shatter { 0% { opacity: 0.75; filter: blur(0); } 60% { opacity: 0.6; } 100% { opacity: 0; filter: blur(6px); transform: scale(1.12, 0.9) translateY(10px); } }
    @keyframes shield-life { 0% { opacity: 0; transform: translate(-50%,-50%) scaleX(0.2); } 12% { opacity: 1; transform: translate(-50%,-50%) scaleX(1.04); } 20% { transform: translate(-50%,-50%) scaleX(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes shield-reveal { 0%, 100% { opacity: 0; } 10% { opacity: 1; } }
    @keyframes ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes lotus-bloom { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.15) rotate(4deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes curtain { 0% { transform: translate(-50%, 0) scaleY(0); opacity: 0; } 25% { transform: translate(-50%, 0) scaleY(1.05); opacity: 1; } 75% { opacity: 0.9; } 100% { transform: translate(-50%, 0) scaleY(1); opacity: 0; } }
    @keyframes fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes rose-in { 0% { transform: translate(-50%,-50%) scale(0.3) rotateX(68deg) rotate(0deg); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1) rotateX(68deg) rotate(200deg); opacity: 1; } }
    @keyframes rose-out { 0% { transform: translate(-50%,-50%) scale(1) rotateX(68deg) rotate(200deg); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.8) rotateX(68deg) rotate(280deg); opacity: 0; } }
    @keyframes twister { 0% { transform: translate(-50%,-50%) scale(0.2, 0.2) rotate(0); opacity: 0; } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1, 1) rotate(180deg); } 100% { transform: translate(-50%,-50%) translateY(-120px) scale(1.6, 1.3) rotate(900deg); opacity: 0; } }
    @keyframes streak { 0% { transform: translateX(-30vw) scaleX(0.3); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateX(130vw) scaleX(1); opacity: 0; } }
    @keyframes wing-glyph { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.6); } 20% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } 30% { transform: translate(-50%,-50%) scale(1); } 75% { opacity: 0.9; } 100% { opacity: 0; transform: translate(-50%,-50%) translateY(-14px); } }
    @keyframes slow-rot { to { transform: rotate(360deg); } }
    @keyframes converge { 0% { transform: translate(var(--sx), var(--sy)) rotate(var(--r0)); opacity: 0; } 25% { opacity: 0.9; } 100% { transform: translate(0, 0) rotate(0deg) scale(0.2); opacity: 0.2; } }
    @keyframes dome-in { 0% { transform: translateX(-50%) scale(0.15, 0.05); opacity: 0; filter: brightness(4); } 18% { transform: translateX(-50%) scale(1.08, 1.1); opacity: 1; filter: brightness(2.4); } 30% { transform: translateX(-50%) scale(0.97, 0.96); filter: brightness(1.4); } 40% { transform: translateX(-50%) scale(1); filter: brightness(1); } 82% { opacity: 1; } 100% { transform: translateX(-50%) scale(1.02); opacity: 0; } }
    @keyframes hex-light { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 0.4; } }
    @keyframes sweep { 0% { transform: translateX(-120%) skewX(-20deg); } 100% { transform: translateX(220%) skewX(-20deg); } }
    @keyframes shock-ell { 0% { transform: translate(-50%,-50%) scale(0.1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; } }
    @keyframes wings-in { 0% { transform: translate(-50%,-50%) scale(0.35, 0.1); opacity: 0; } 40% { opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
    @keyframes wings-out { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(0.92) translateY(30px); } }
    @keyframes wing-fold { 0% { transform: rotate(0) scaleX(1); } 55% { transform: rotate(-34deg) scaleX(0.82); } 100% { transform: rotate(-30deg) scaleX(0.8); } }
    @keyframes sun-grow { 0% { transform: scale(0.1); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>

 <svg width="0" height="0" class="fixed z-0 pointer-events-none"><defs><filter id="bloom-red" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" /><feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2" /><feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>

  <script>
    // ========================================================
    // 场景与通用工具
    // ========================================================
    const $ = s => document.querySelector(s);
    // —— 按主工程 initUI / renderEnemyFormation / createCompactBarHTML 的 DOM 结构渲染（便于移植：特效只依赖 hero-wrap / enemy-box 的外接矩形）
    function bar(id, type, label, val, max, color, isTp = false, shield = 0) {
      const pct = Math.max(0, Math.min(100, val / max * 100)), sh = shield > 0 ? `<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾${shield})</span>` : '';
      return `<div class="relative pt-1.5 sm:pt-2.5 mb-0 sm:mb-[2px]"><span id="${id}-${type}-text" class="absolute right-0 top-0 text-[8px] sm:text-xs font-mono font-bold text-white leading-none text-outline z-10 whitespace-nowrap">${val}${sh}</span><div class="flex items-center gap-1 sm:gap-1.5"><span class="text-[7px] sm:text-[10px] font-bold text-gray-200 leading-none text-outline w-3 sm:w-4">${label}</span><div class="flex-grow h-1 sm:h-1.5 bg-[#222] rounded-[1px] overflow-hidden border border-[#111]"><div class="${isTp ? 'w-1/3' : 'w-full'} h-full ${color}" style="width:${pct}%"></div></div></div></div>`;

    const CHARGE_IS = 1100;
    function castIsis() {
      lockCards(CHARGE_IS + 2000); showBanner('EMBRACE OF ISIS', '伊西斯之拥'); darken(0.72);
      const pc = party(), Wd = Math.min(innerWidth * 0.95, 1300), Hd = Wd * 0.42, ax = pc.x, ay = pc.t - Hd * 0.12;
      const end = CHARGE_IS / 1000 - 0.12;
      choir(0, [220, 277, 330], end, 0.09, 0.95, true); choir(0.4, [440, 554, 659], end - 0.4, 0.06, 0.95, true);
      for (let i = 0; i < 8; i++) chime(rnd(0.1, end - 0.1), rnd(1800, 3200), 0.5, 0.025, rnd(-0.7, 0.7));
      const feathers = [];
      for (let r = 0; r < 4; r++) for (let i = 0; i <= 15; i++) {
        const t = i / 15, bx = 30 + t * 520, by = -150 - Math.sin(t * Math.PI) * 50 + t * 70 + r * 36, L = 70 + t * 130 - r * 18, ang = -(12 + t * 55);
        feathers.push(`<path d="M0,0 Q-14,${L * 0.5} 0,${L} Q14,${L * 0.5} 0,0 Z" transform="translate(${-bx},${by}) rotate(${-ang})" fill="url(#wf)" stroke="#fff4c2" stroke-width="1.2" opacity="${1 - r * 0.15}"/>`);
      }
      const wing = `<g style="transform-origin: -30px -150px; animation: wing-fold 0.6s ${CHARGE_IS}ms cubic-bezier(0.5,0,0.3,1) both;">${feathers.reverse().join('')}</g>`;
      const layer = fsLayer(`
        <div class="fs-anchor wings" style="left:${ax}px; top:${ay}px; width:${Wd}px; height:${Hd * 1.5}px; animation: wings-in ${CHARGE_IS}ms cubic-bezier(0.2,0.8,0.2,1) both; filter: drop-shadow(0 0 14px rgba(253,230,138,0.7));">
          <svg viewBox="-600 -300 1200 520" style="width:100%;height:100%;overflow:visible">
            <defs><linearGradient id="wf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="0.6" stop-color="#d4af37"/><stop offset="1" stop-color="#059669"/></linearGradient>
              <radialGradient id="sun"><stop offset="0" stop-color="#fff7d6"/><stop offset="0.6" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></radialGradient></defs>
            ${wing}<g transform="scale(-1,1)">${wing}</g>
            <g style="transform-origin: 0px -200px; animation: sun-grow ${CHARGE_IS}ms ease-out both;">
              ${Array.from({ length: 24 }, (_, i) => `<line x1="0" y1="-200" x2="0" y2="-310" stroke="#fde68a" stroke-width="2" opacity="0.6" transform="rotate(${i * 15} 0 -200)"/>`).join('')}
              <circle cx="0" cy="-200" r="56" fill="url(#sun)" stroke="#fff4c2" stroke-width="3"/>
              <path d="M-30,-130 Q-50,-150 -30,-160 M30,-130 Q50,-150 30,-160" fill="none" stroke="#d4af37" stroke-width="5" stroke-linecap="round"/>
            </g>
          </svg></div>`, CHARGE_IS + 1900);
      const rise = setInterval(() => burst(4, () => ({ x: ax + rnd(-Wd / 2, Wd / 2), y: innerHeight + 10, vx: 0, vy: rnd(-9, -5), drag: 0.985, decay: 0.02, size: rnd(1.2, 2.4), color: pick(['#fde68a', '#6ee7b7']) })), 40);
      setTimeout(() => { clearInterval(rise); isisRelease(pc, layer); }, CHARGE_IS);
    }
    function isisRelease(pc, layer) {
      boom(0, { f0: 900, f1: 150, dur: 0.35, vol: 0.6, peak: 0.05 }); boom(0.18, { f0: 900, f1: 150, dur: 0.35, vol: 0.55, peak: 0.05 }); whoosh(0, { f0: 300, f1: 900, q: 0.7, dur: 0.5, vol: 0.4, peak: 0.15 });
      kick(0.18, { hi: 140, lo: 45, pd: 0.06, dur: 0.6, vol: 0.8, drive: 2, wet: 0.2 });
      chime(0.2, 392, 3, 0.15); chime(0.24, 588, 2.6, 0.09); choir(0.15, [523, 659, 784], 2.2, 0.07, 0.15);
      for (let i = 0; i < 12; i++) chime(0.3 + rnd(0, 1.2), rnd(2600, 4200), 0.4, 0.02, rnd(-0.7, 0.7));
      shake('heavy');
      setTimeout(() => { const w = layer.querySelector('.wings'); w.style.animation = 'wings-out 0.9s ease-in both'; }, 700);
      fsLayer(`<div style="position:absolute;inset:0;background:radial-gradient(ellipse at ${pc.x}px ${pc.y}px, rgba(255,247,214,0.9), rgba(52,211,153,0.4) 35%, transparent 70%); animation: fs-flash 0.7s 0.15s ease-out both;"></div>`, 1000);
      const rain = setInterval(() => burst(7, () => ({ x: pc.x + rnd(-pc.w / 2 - 80, pc.w / 2 + 80), y: rnd(-20, pc.t - 40), vx: 0, vy: rnd(7, 11), drag: 1, decay: 0.022, size: 1.8, shape: 'streak', color: pick(['#6ee7b7', '#a7f3d0', '#fde68a']) })), 40);
      setTimeout(() => clearInterval(rain), 1100);
      setTimeout(() => heroes.forEach((h, i) => setTimeout(() => { flash(h, 'flash-heal'); floatText(h, '+100', '#6ee7b7', 28); const c = ctr(h); burst(14, () => ({ x: c.x + rnd(-24, 24), y: c.y + rnd(-50, 50), vx: rnd(-0.4, 0.4), vy: rnd(-1.6, -0.5), decay: 0.025, size: rnd(1.4, 2.4), color: '#a7f3d0' })); }, i * 90)), 260);
      // 驱散：诅咒碎片剥离并燃尽
      setTimeout(() => {
        whoosh(0, { type: 'highpass', f0: 3000, f1: 6000, q: 0.7, dur: 0.5, vol: 0.3, peak: 0.02 }); for (let i = 0; i < 10; i++) click(rnd(0, 0.4), 0.12, rnd(2500, 5000), 0.006, rnd(-0.5, 0.5));
        heroes.forEach(h => {
          const chip = h.querySelector('.chip'); if (!chip || chip.style.display === 'none') return; chip.style.display = 'none';
          const c = ctr(h);
          burst(12, () => { const an = rnd(-2.6, -0.5), s = rnd(2, 5); return { x: c.x, y: c.top, vx: Math.cos(an) * s, vy: Math.sin(an) * s, drag: 0.95, rot: rnd(0, 6), vr: rnd(-0.3, 0.3), decay: 0.035, size: rnd(4, 7), shape: 'shard', blend: 'source-over', color: '#a855f7', fill: 'rgba(20,6,30,0.9)' }; });
          burst(16, () => ({ x: c.x + rnd(-20, 20), y: c.top + rnd(-20, 10), vx: rnd(-1, 1), vy: rnd(-2, -0.6), drag: 0.96, decay: 0.03, size: rnd(1, 2), color: pick(['#fb923c', '#fde68a']) }));
          floatText(h, '驱散', '#e9d5ff', 18, -30);
        });
      }, 650);
      setTimeout(() => darken(0), 1500);
    }

    // ========================================================
    // 技能卡
    // ========================================================
    const CARDS = [
      ['L1', '精准流火', 'PRECISE FLAME', '[穿透(火焰);power:30][燃烧;power:10][Aim:160][MP:2][法术]', '通用 (火焰)：火球 + 燃烧挂层', castJingZhunLiuHuo],
      ['L1', '迅捷愈合法', 'SWIFT MENDING', '[单回;power:30][再动;power:1][MP:3][法术][他人][限3次]', '安卡降临 · 钟环再动', castXunJieYuHe],
      ['L2', '折影步', 'REFRACTED STEP', '[回避;power:900][MP:4][反应:近战][法术]', '通用反应：错身留影', castZheYingBu],
      ['L2', '巫师护盾', "WIZARD'S AEGIS", '[单盾;power:180][MP:4][暴击:5%][反应][法术]', '透明屏障 · 挡刀光与枪击', castWuShiHuDun],
      ['通用', '敌方法术弹', 'HOSTILE BOLT', '敌方单体法术攻击通用特效', '通用：紫色魔弹命中', castEnemyBolt],
      ['L2', '双莲祛煞', 'TWIN LOTUS WARD', '[免伤;power:120][反应:法术][法术][限3次]', '双蓝睡莲 · 光幕吞煞', castShuangLian],
      ['L3', '灵风术', 'ZEPHYR OF HERMES', '[单避;power:50][单速;power:30][Turns:10][MP:10][法术][限1次]', '风玫瑰法阵 · 全屏疾风', castLingFeng],
      ['L3', '纳克提特障壁术', 'NAK-TITH BARRIER', '[肃正:近战;power:200;Armor:40][MP:10][TP:15][法术][高阶]', '无形几何 · 晶格穹顶', castNakTith],
      ['L3', '伊西斯之拥', 'EMBRACE OF ISIS', '[群回;power:100][群驱散:1][MP:10][法术]', '金翼合抱 · 光雨驱散', castIsis]
    ];
    $('#skill-list').innerHTML = CARDS.map(([lv, t, e, tags, d], i) => `<button class="card w-full py-1.5 px-2 bg-slate-900/80 hover:bg-violet-950/60 border border-slate-700/80 hover:border-violet-500/60 rounded-lg text-left transition-all shadow-sm" data-i="${i}" title="${tags}"><div class="flex items-center justify-between gap-1"><span class="text-xs font-bold text-slate-100">${t}</span><span class="text-[9px] font-bold px-1 rounded border ${lv === '通用' ? 'border-rose-500/60 text-rose-300' : lv === 'L3' ? 'border-amber-500/60 text-amber-300' : lv === 'L2' ? 'border-cyan-500/60 text-cyan-300' : 'border-slate-500/60 text-slate-300'}">${lv}</span></div><div class="text-[9px] text-slate-400 truncate">${d}</div></button>`).join('');
    document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => { getAudioContext(); CARDS[+c.dataset.i][5](); }));
    $('#btn-reset').addEventListener('click', () => { heroes.forEach(h => { const ch = h.querySelector('.chip'); ch.style.display = ''; h.style.transform = ''; }); P = []; darken(0); });
  </script>
</body>
</html>
