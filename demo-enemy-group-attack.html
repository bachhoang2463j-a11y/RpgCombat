<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>敌方群攻 · 命中特效演练</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* L2：主体用独立 SVG 层，粒子只补速度与碎屑。 */
    .arcane-group-stage { position: absolute; overflow: hidden; pointer-events: none; }
    .arcane-group-charge { position: absolute; transform: translate(-50%, -50%); }
    .arcane-group-charge svg, .arcane-group-stage > svg { width: 100%; height: 100%; overflow: visible; }
    .arcane-group-sweep-core { filter: drop-shadow(0 0 4px #ff604b); }
    .arcane-group-sweep-glow { filter: blur(3px); }
    .arcane-group-missile { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
    .arcane-group-missile svg { position: absolute; overflow: visible; filter: drop-shadow(0 0 3px #eab308); }
    .arcane-group-missile-body { transform-origin: 75% 50%; will-change: transform, opacity; }
    .arcane-group-flight { position: absolute; inset: 0; }
    .arcane-group-impact { position: absolute; inset: 0; }
    /* 破碎只拆头像图面，姓名、数值与卡片本体不参与。 */
    .arcane-portrait-fragments { position: absolute; overflow: hidden; pointer-events: none; }
    .arcane-portrait-fragment { position: absolute; inset: 0; will-change: transform, opacity; }
    .arcane-portrait-fragment .portrait { height: 100%; }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->

    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>💬</span> <span class="hidden sm:inline">对话</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-yellow-500 hover:text-yellow-400 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>⚙️</span> <span class="hidden sm:inline">设置</span></button>

  <!-- 悬浮 UI 层 -->

        <div class="px-2.5 py-1 bg-gradient-to-r from-violet-950/60 via-slate-900/90 to-slate-950 border-b border-violet-900/40 flex justify-between items-center shrink-0">
          <div class="flex items-center gap-1.5 min-w-0"><span class="w-1.5 h-1.5 rounded-full bg-violet-400 animate-pulse shrink-0"></span><span class="text-xs font-bold text-violet-300">敌方群攻 · 命中</span></div>

    <span class="px-3 py-1 rounded-full text-xs font-bold border border-rose-500/60 text-rose-300 bg-rose-950/50">敌方旁白 ON</span>
    <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">➤</div>
  </div>
 </div>
  <script>
    // ===== 演示宿主 BEGIN：占位数据、渲染、fxEngine；不移植到正式版 =====
    const $ = s => document.querySelector(s);
    let combatToken = 0;
    let heroesData = [], enemiesData = [];
    const HERO_DATA = [['h1', '埃利奥特', '👨', 100, 55, 110, 5], ['h2', '弗兰克', '🧔', 180, 0, 17, 0], ['h3', '玛德琳', '👩', 140, 0, 14, 0], ['h4', '索恩', '🕵️', 140, 0, 20, 0]];
    const ENEMY_ROWS = [[['e1', '🐟'], ['e2', '❄️'], ['e3', '🐟']], [['e4', '👻'], ['e5', '👻'], ['e6', '🌀']]];

function createCompactBarHTML(id, type, label, val, max, colorClass, isTp = false, shield = 0) {
  const pct = Math.max(0, Math.min(100, (val / max) * 100)); const barWidthClass = isTp ? 'w-1/3' : 'w-full';
  const shieldText = shield > 0 && type === 'hp' ? `<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾${shield})</span>` : '';
  let finalColor = colorClass; let extraClass = ''; if (isTp && val >= max) { finalColor = 'bg-amber-400'; extraClass = 'shadow-[0_0_10px_rgba(251,191,36,0.8)] animate-pulse'; }
  return `<div class="relative pt-1.5 sm:pt-2.5 mb-0 sm:mb-[2px]"><span id="${id}-${type}-text" class="absolute right-0 top-0 text-[8px] sm:text-xs font-mono font-bold text-white leading-none text-outline z-10 whitespace-nowrap">${Math.floor(val)}${shieldText}</span><div class="flex items-center gap-1 sm:gap-1.5"><span class="text-[7px] sm:text-[10px] font-bold text-gray-200 leading-none text-outline w-3 sm:w-4">${label}</span><div class="flex-grow h-1 sm:h-1.5 bg-[#222] rounded-[1px] overflow-hidden border border-[#111]"><div id="${id}-${type}-bar" class="${barWidthClass} h-full ${finalColor} ${extraClass} transition-all duration-300 ease-out" style="width: ${pct}%"></div></div></div></div>`;
}

function getEntitySpriteDom(entityOrId){
  const id = entityOrId && typeof entityOrId === 'object' ? entityOrId.id : String(entityOrId||'');
  if(!id) return null;
  return document.getElementById(`hero-card-${id}`) || document.getElementById(`${id}-sprite`) || document.getElementById(`hero-wrap-${id}`) || null;
}
window.getEntitySpriteDom = getEntitySpriteDom;

    function initUI() {
        heroesData = HERO_DATA.map(([id, name, face, hp, shield, mp, tp]) => ({ id, name, face, hp, maxHp: hp, shield, mp, maxMp: mp, tp, maxTp: 100, isAlive: true, buffs: [] }));
        enemiesData = ENEMY_ROWS.flat().map(([id, face]) => ({ id, name: id, face, hp: 100, maxHp: 100, isAlive: true, buffs: [] }));
    $('#heroes-container').innerHTML = heroesData.map(({ id, name, face, hp, maxHp, shield, mp, maxMp, tp, maxTp }) => `
      <div class="hero relative transition-all duration-300 min-w-[70px] z-20" id="hero-wrap-${id}">
        <div id="hero-card-${id}" class="fx-body hero-card-inner bg-[#18181b] rounded overflow-hidden relative border shadow-2xl transition-all border-gray-800">
          <div id="${id}-buffs" class="absolute top-1 right-1 flex flex-col gap-1 items-end z-20 pointer-events-none"></div>
          <div class="w-full h-12 sm:h-auto sm:aspect-[4/3] relative bg-gray-900 border-b border-gray-700">
            <div class="absolute top-0 left-0 w-full bg-gradient-to-b from-black/80 to-transparent px-1.5 py-1 text-[9px] sm:text-xs font-bold text-white z-10 flex justify-between"><span>${name}</span></div>
            <div class="portrait w-full h-full">${face}</div>
          </div>
          <div class="px-1 py-1 sm:px-2 sm:py-1.5 flex flex-col gap-[1px] sm:gap-0.5">${createCompactBarHTML(id, 'hp', 'HP', hp, maxHp, 'bg-yellow-400', false, shield)}${createCompactBarHTML(id, 'mp', 'MP', mp, maxMp, 'bg-cyan-400')}${createCompactBarHTML(id, 'tp', 'TP', tp, maxTp, 'bg-green-500', true)}</div>
        </div>
      </div>`).join('');
    $('#enemies-container').innerHTML = ENEMY_ROWS.map((row, ri) => `<div class="flex items-end justify-center" style="gap:${ri ? 26 : 22}px; ${ri ? 'margin-top:18px' : ''}">${row.map(([id, em]) => `
      <div class="flex flex-col items-center group relative shrink-0" id="enemy-box-${id}" style="transform:scale(${ri ? 1 : 0.72}); ${ri ? '' : 'filter:brightness(0.82) saturate(0.92)'}">
        <div id="${id}-sprite" class="fx-body enemy-sprite text-7xl sm:text-8xl drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] breathe mt-2 sm:mt-4 flex justify-center items-center">${em}</div>
        <div class="w-10 sm:w-16 h-1 sm:h-1.5 bg-black/50 mt-2 sm:mt-4 rounded-full overflow-hidden relative"><div class="h-full bg-rose-500 w-full shadow-[0_0_8px_rgba(244,63,94,0.8)]"></div></div>
      </div>`).join('')}</div>`).join('');
    $('#turn-order-container').innerHTML = ['👨', '❄️', '🧔', '👩', '🕵️', '👻', '👻'].map((e, i) => `<div class="turn-dot ${i ? '' : 'cur'}" style="border-color:${i === 1 || i > 4 ? '#e11d48' : '#06b6d4'}">${e}</div>`).join('');
    }
    initUI();

class CanvasFxEngine {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }
}

// 实例化全局特效引擎
const fxEngine = new CanvasFxEngine();

        burst(22, () => { const ang = Math.random() * 6.283, d = rnd(40, 70); return { x: a.x + Math.cos(ang) * d, y: a.y + Math.sin(ang) * d, vx: -Math.cos(ang) * d / 9, vy: -Math.sin(ang) * d / 9, drag: 0.86, decay: 0.06, size: rnd(1.2, 2.4), color: pick(['#fdba74', '#f97316', '#fde68a']) }; });
        fsLayer(`<div class="arcane-fs-anchor" style="left:${a.x}px; top:${a.y}px; width:64px; height:64px; border-radius:50%; background: radial-gradient(circle, #fff7d6 0%, #fb923c 35%, rgba(220,38,38,0.45) 60%, transparent 72%); animation: arcane-seed-bloom 0.26s ease-out both;"></div>`, 320);
        whoosh(0, { f0: 400, f1: 1800, q: 1.2, dur: 0.22, vol: 0.3, peak: 0.18, pan: -0.5 }); boom(0.02, { f0: 900, f1: 300, dur: 0.25, vol: 0.25, peak: 0.08, pan: -0.5 });
        for (let i = 0; i < 4; i++) click(0.04 + i * 0.04, 0.12, rnd(2500, 4500), 0.006, -0.5);
        after(240, () => {
            if (token !== combatToken) return; // 重置后停止绘制/音效启动
            whoosh(0, { f0: 350, f1: 1500, q: 0.9, dur: 0.34, vol: 0.55, peak: 0.28, cut: true, pan: -0.6, pan1: 0.5 });
            for (let i = 0; i < 6; i++) click(0.03 + i * 0.05, 0.1, rnd(2200, 4800), 0.006, -0.4 + i * 0.15);
            fly(a, b, 90, 340, (x, y) => {
                if (token !== combatToken) return;
                addP({ x, y, shape: 'flame', size: 16, decay: 0.2, color: '#fb923c' });
                burst(5, () => ({ x: x + rnd(-6, 6), y: y + rnd(-6, 6), vx: rnd(-1, 1), vy: rnd(-1.6, -0.3), drag: 0.94, decay: rnd(0.04, 0.07), size: rnd(6, 11), shape: 'flame', color: pick(['#f97316', '#ef4444', '#fbbf24']) }));
                for (let j = 0; j < 2; j++) { const an = performance.now() / 45 + j * 3.14; addP({ x: x + Math.cos(an) * 11, y: y + Math.sin(an) * 11, decay: 0.3, size: 2, color: '#fff7d6' }); }
            }, () => {
                if (token !== combatToken || dodged) return; // 闪避：弹达原位，不爆散不响，不 flash/flinch
                click(0, 0.8, 4000); kick(0, { hi: 240, lo: 55, pd: 0.035, dur: 0.26, vol: 0.9, drive: 3 }); crunch(0, { f: 1600, f1: 700, q: 1.2, dur: 0.12, vol: 0.5 });
                boom(0.005, { f0: 5000, f1: 200, dur: 0.5, vol: 0.5, wet: 0.25 }); whoosh(0.05, { f0: 600, f1: 300, q: 0.8, dur: 0.6, vol: 0.15, peak: 0.05 });
                for (let i = 0; i < 12; i++) click(rnd(0.06, 0.6), 0.15, rnd(2500, 6000), 0.006, rnd(0.1, 0.8));
                fsLayer(`<div class="arcane-fs-anchor" style="left:${b.x}px; top:${b.y}px; width:140px; height:140px; border-radius:50%; background: radial-gradient(circle, #fff 0%, #fdba74 30%, rgba(239,68,68,0.5) 58%, transparent 72%); animation: arcane-hit-flash 0.34s ease-out both;"></div>`, 420);
                burst(2, i => ({ x: b.x, y: b.y, shape: 'ring', size: 1.8 + i, decay: 0.07 - i * 0.02, color: i ? '#f97316' : '#fde68a' }));
                burst(40, () => { const an = Math.random() * 6.283, s = rnd(2, 8); return { x: b.x, y: b.y, vx: Math.cos(an) * s, vy: Math.sin(an) * s - 1, grav: 0.13, drag: 0.93, decay: rnd(0.025, 0.05), size: rnd(1, 2.2), color: pick(['#fde68a', '#fb923c', '#fff7d6']) }; });
                burst(10, () => ({ x: b.x + rnd(-14, 14), y: b.y + rnd(-14, 14), vx: rnd(-1, 1), vy: rnd(-2, -0.5), drag: 0.95, decay: rnd(0.03, 0.05), size: rnd(12, 20), shape: 'flame', color: '#f97316' }));
                burst(9, () => ({ x: b.x + rnd(-24, 24), y: b.y + rnd(-18, 18), vx: rnd(-0.3, 0.3), vy: rnd(-0.9, -0.4), drag: 0.99, decay: 0.011, size: rnd(16, 28), shape: 'smoke', blend: 'source-over', color: 'rgba(40,32,30,0.55)' }));
            });
        });
    }

    // ===== ② 敌方紫色法术弹（480ms 命中拍点） =====
    function enemySpellProjectile(fromDom, toDom, dodged, token) {
        const t = ctr(fromDom), h = ctr(toDom);
        const a = { x: t.x - 20, y: t.y - 10 }, b = { x: h.x, y: toDom.hasAttribute('data-arcane-fx') ? h.y : h.top + 30 };
        whoosh(0, { f0: 300, f1: 900, q: 1.4, dur: 0.48, vol: 0.32, peak: 0.4, pan: 0.6, pan1: -0.3 }); tone(0, { type: 'triangle', f0: 110, f1: 90, dur: 0.48, vol: 0.08 });
        fly(a, b, 30, 480, (x, y) => {
            if (token !== combatToken) return;
            addP({ x, y, size: 9, decay: 0.22, color: '#c084fc' }); addP({ x, y, size: 4, decay: 0.3, color: '#fff' });
            burst(3, () => ({ x: x + rnd(-5, 5), y: y + rnd(-5, 5), vx: rnd(0.5, 1.5), vy: rnd(-0.5, 0.5), drag: 0.94, decay: 0.06, size: rnd(1.5, 3), color: pick(['#7c3aed', '#a855f7']) }));
        }, () => {
            if (token !== combatToken || dodged) return;
            click(0, 0.6, 3500); kick(0, { hi: 180, lo: 55, pd: 0.03, dur: 0.25, vol: 0.7, drive: 3 }); boom(0, { f0: 3000, f1: 200, dur: 0.4, vol: 0.35, wet: 0.3 });
            burst(24, () => { const an = Math.random() * 6.283, s = rnd(1.5, 5); return { x: b.x, y: b.y, vx: Math.cos(an) * s, vy: Math.sin(an) * s, drag: 0.93, decay: 0.04, size: rnd(1, 2.4), color: pick(['#e9d5ff', '#c084fc', '#7c3aed']) }; });
        }, k => k);
    }

    let groupSfx = true, defaultHitBuffer = null, defaultShakeFrame = null;
    const groupSoundNodes = new Set();

    function stopGroupSounds() {
        groupSoundNodes.forEach(node => node.disconnect()); groupSoundNodes.clear();
    }
    async function prepareGroupAudio(fxTag) {
        if (!groupSfx) return;
        const ctx = audio();
        if (fxTag !== 'group:spell') return;
        if (!defaultHitBuffer) {
            const bytes = Uint8Array.from(atob(GROUP_ATK1_BASE64), ch => ch.charCodeAt(0));
            defaultHitBuffer = await ctx.decodeAudioData(bytes.buffer);
        }
    }
    function playDefaultHitSound() {
        if (!groupSfx) return;
        const ctx = audio(), source = ctx.createBufferSource(), gain = ctx.createGain();
        source.buffer = defaultHitBuffer; gain.gain.value = 0.5;
        source.connect(gain); gain.connect(ctx.destination);
        groupSoundNodes.add(gain);
        source.onended = () => { gain.disconnect(); groupSoundNodes.delete(gain); };
        source.start();
    }
    function setGroupSfx(on) {
        groupSfx = !!on;
        if (!groupSfx) stopGroupSounds();
        return groupSfx;
    }

    // 白爆沿用正式版的短时随机衰减震屏；重置也解除尚未结束的帧回调。
    window.triggerScreenShake = function(intensity = 6, duration = 300) {
        const scene = document.getElementById('battle-scene'), token = combatToken;
        const startTime = Date.now();
        const shakeLoop = () => {
            if (token !== combatToken) return;
            const elapsed = Date.now() - startTime;
            if (elapsed < duration) {
                const decay = 1 - elapsed / duration;
                scene.style.transform = `translate(${(Math.random() - 0.5) * intensity * decay}px, ${(Math.random() - 0.5) * intensity * decay}px)`;
                defaultShakeFrame = requestAnimationFrame(shakeLoop);
            } else { scene.style.transform = ''; defaultShakeFrame = null; }
        };
        defaultShakeFrame = requestAnimationFrame(shakeLoop);
        after(duration, () => { cancelAnimationFrame(defaultShakeFrame); defaultShakeFrame = null; scene.style.transform = ''; });
    };

        fxEngine.addParticle({
            x: x, y: y, vx: 0, vy: 0, age: 0, life: 450,
            draw: function(ctx, pct) {
                var maxR = 250; // 覆盖所有角色的半径
                var r = pct * maxR;
                var a = Math.max(0, (1 - pct) * 0.8);
                ctx.globalAlpha = a;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(1, 6 * (1 - pct));
                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.stroke();

                // 内层余波
                if (pct > 0.1) {
                    var r2 = (pct - 0.1) * maxR * 0.8;
                    ctx.strokeStyle = '#e2e8f0';
                    ctx.lineWidth = Math.max(1, 3 * (1 - pct));
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, r2, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        });

        // 80颗流星状粒子由中心向四周猛烈散开
        for (var i = 0; i < 80; i++) {
            var angle = Math.random() * Math.PI * 2;
            var speed = 6 + Math.random() * 12; // 极快的初速
            var sz = 2 + Math.random() * 4;
            fxEngine.addParticle({
                x: x, y: y,
                vx: speed * Math.cos(angle),
                vy: speed * Math.sin(angle),
                drag: 0.92, // 较强空气阻力，形成迅速减速的效果
                gravity: 0,
                age: 0, life: 400 + Math.random() * 300,
                size: sz,
                draw: function(ctx, pct) {
                    var a = pct < 0.1 ? pct / 0.1 : Math.max(0, 1 - pct);
                    ctx.globalAlpha = a;
                    ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#cbd5e1';

                    // 绘制拖尾
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    var trailX = this.x - this.vx * 3;
                    var trailY = this.y - this.vy * 3;
                    ctx.lineTo(trailX, trailY);
                    ctx.strokeStyle = ctx.fillStyle;
                    ctx.lineWidth = this.size;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // 头部亮点
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // 全屏中心亮闪
        fxEngine.addParticle({
            x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 250,
            draw: function(ctx, pct) {
                if (pct > 0.4) return;
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = (1 - pct / 0.4) * 0.4;
                ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            }
        });

        window.triggerScreenShake(6, 300);
    }

    // 头像安全图面：上缘从姓名条下方开始，下缘止于头像，不遮数值条。
    function portraitFrame(target) {
        const dom = domOf(target).querySelector('.portrait'), r = ctr(dom);
        const top = Math.max(r.top, dom.previousElementSibling.getBoundingClientRect().bottom);
        return { dom, x: r.x, y: (top + r.bottom) / 2, left: r.left, right: r.right,
                 top, bottom: r.bottom, w: r.w, h: r.bottom - top, imageTop: r.top, imageH: r.h };
    }
    function groupRun(ms) {
        const owner = { timers: new Set(), layers: new Set(), animations: new Set(), flights: new Set(), hostParticles: new Set() };
        owner.at = (delay, fn) => {
            const id = after(delay, () => { owner.timers.delete(id); fn(); });
            owner.timers.add(id); return id;
        };
        const finish = () => {
            owner.timers.forEach(id => { clearTimeout(id); S.timers.delete(id); }); owner.timers.clear();
            owner.animations.forEach(a => a.cancel()); owner.animations.clear();
            owner.layers.forEach(d => { S.layers.delete(d); d.remove(); }); owner.layers.clear();
            owner.flights.forEach(f => { clearTimeout(f.timer); S.timers.delete(f.timer); });
            S.flights = S.flights.filter(f => !owner.flights.has(f));
            S.particles = S.particles.filter(p => p.owner !== owner);
            fxEngine.particles = fxEngine.particles.filter(p => !owner.hostParticles.has(p));
            S.handles.delete(handle); releaseIdleCanvas();
        };
        const handle = { doneAt: Date.now() + ms, cancel: () => { finish(); stopGroupSounds(); } };
        S.handles.add(handle); owner.at(ms, finish); owner.handle = handle;
        return owner;
    }

    // 微粒只做余屑；晶体有切面，不再用圆光晕掩盖尖锐主体。
    DRAW.group = function(g, p) {
        const [core, color, edge] = GROUP_COLORS[p.kind], r = p.size;
        const alpha = g.globalAlpha;
        for (let i = 4; i > 0; i--) {
            const x = -i * (p.tail || 0) / 4, rr = r * (0.65 - i * .1);
            const gr = g.createRadialGradient(x, 0, 0, x, 0, rr * 2);
            gr.addColorStop(0, color + '90'); gr.addColorStop(1, edge + '00');
            g.globalAlpha = alpha * (.28 - i * .045);
            g.fillStyle = gr; g.beginPath(); g.arc(x, 0, rr * 2, 0, 6.283); g.fill();
        }
        g.globalAlpha = alpha;
        if (p.texture === 'crystal') {
            const gr = g.createLinearGradient(-r, -r, r, r);
            gr.addColorStop(0, core); gr.addColorStop(.35, color); gr.addColorStop(1, edge + '20');
            g.fillStyle = gr; g.beginPath(); g.moveTo(r * 1.8, 0); g.lineTo(-r * .5, r * .9); g.lineTo(-r, -r * .65); g.closePath(); g.fill();
            g.fillStyle = core + 'b0'; g.beginPath(); g.moveTo(r * 1.8, 0); g.lineTo(-r * .4, 0); g.lineTo(-r, -r * .65); g.closePath(); g.fill();
        } else {
            const gr = g.createRadialGradient(r * .22, 0, 0, 0, 0, r);
            gr.addColorStop(0, core); gr.addColorStop(.22, core + 'e0'); gr.addColorStop(.55, color + 'c0'); gr.addColorStop(1, edge + '00');
            g.fillStyle = gr; g.scale(2, .55); g.beginPath(); g.arc(0, 0, r, 0, 6.283); g.fill();
        }
    };

            const body = missile.querySelector('.arcane-group-missile-body');
            const angle = Math.atan2(b.y - a.y, b.x - a.x);
            missile.style.transform = `translate(${a.x}px,${a.y}px) rotate(${angle}rad)`;
            groupAnimate(owner, body, [
                { transform: 'scale(.12)', opacity: 0 }, { transform: 'scale(.58)', opacity: 1, offset: .35 },
                { transform: 'scale(1.12)', opacity: 1, offset: .76 }, { transform: 'scale(1)', opacity: 1 }
            ], 300, 'ease-in');
            owner.at(300, () => {
                if (index === 0 && groupSfx) {
                    whoosh(0, { type: 'highpass', f0: 4900, f1: 1500, q: .8, dur: .28, vol: .3, peak: .02 });
                    click(0, .26, 5200, .009);
                }
                const flight = fly(a, b, lift, 280, (x, y, progress) => {
                    const t = progress * progress;
                    const direction = Math.atan2((1 - t) * (cy - a.y) + t * (b.y - cy), (1 - t) * (cx - a.x) + t * (b.x - cx));
                    missile.style.transform = `translate(${x}px,${y}px) rotate(${direction}rad)`;
                    groupParticle(owner, y >= rowTop ? { left, top: rowTop, w: right - left, h: rowBottom - rowTop } : null,
                        { x: x - Math.cos(direction) * length, y: y - Math.sin(direction) * length,
                          vx: -Math.cos(direction) * .6 * k, vy: -Math.sin(direction) * .6 * k,
                          rot: direction, size: 1.8 * k, texture: 'spark', tail: 8 * k, decay: 16.7 / 90 });
                }, () => {
                    missile.remove();
                    const direction = Math.atan2(b.y - cy, b.x - cx);
                    rangedHit(frame, b, owner, direction, -.6 + index * .4);
                });
                owner.flights.add(flight);
            });
        });
        return owner.handle;
    }

    function playSpellGroup() {
        const owner = groupRun(800), container = document.getElementById('heroes-container');
        const children = Array.from(container.children).filter(el => el.style.display !== 'none' && !el.classList.contains('hidden') && !el.classList.contains('opacity-0') && !el.classList.contains('opacity-40'));
        const center = unionRect(children);
        const previous = new Set(fxEngine.particles);
        playDefaultHitSound(); spawnDefaultAOEParticles(center.x, center.y);
        fxEngine.particles.forEach(p => { if (!previous.has(p)) owner.hostParticles.add(p); });
        return owner.handle;
    }
    // ===== 新技能实现 END =====

    // ===== 对外接口（与正式版同名同参；不将演示卡片或占位数据带入模块） =====
    function isArcaneSkillFx(fxTag) { return ARCANE_TAGS.indexOf(fxTag) !== -1; }
    function playArcaneSkillFx(fxTag, caster, targets, isReaction = false) {
        if (!isArcaneSkillFx(fxTag)) return null;
        // 接入点 3：本 demo 的三类命中分派，不修改正式版默认分派。
        if (fxTag === 'group:melee') return playMeleeGroup(caster, targets);
        if (fxTag === 'group:ranged') return playRangedGroup(caster, targets);
        return playSpellGroup();
    }
    function playArcaneProjectile(type, fromDom, toDom, dodged = false) {
        if (!fromDom || !toDom || !fromDom.getBoundingClientRect || !toDom.getBoundingClientRect) return Promise.resolve();
        const token = combatToken;
        ensureCanvas(); ensureDriver();
        if (type === 'fire') fireProjectile(fromDom, toDom, !!dodged, token);
        else if (type === 'enemy_spell') enemySpellProjectile(fromDom, toDom, !!dodged, token);
        const beat = type === 'fire' ? 580 : 480;
        return new Promise(res => {
            const id = setTimeout(() => { S.rawTimers.delete(id); res(); }, beat);
            S.rawTimers.set(id, res);
        });
    }
    function clearArcaneFx() {
        stopGroupSounds();
        cancelAnimationFrame(defaultShakeFrame); defaultShakeFrame = null;
        document.getElementById('battle-scene').style.transform = '';
        S.timers.forEach(id => clearTimeout(id)); S.timers.clear();
        S.rawTimers.forEach((resolve, id) => { clearTimeout(id); resolve(); }); S.rawTimers.clear();
        S.intervals.forEach(id => clearInterval(id)); S.intervals.clear();
        S.flights.length = 0; S.particles.length = 0;
        S.particleTimer = null; S.particleUntil = 0;
        if (S.driver) { const idx = fxEngine.particles.indexOf(S.driver); if (idx >= 0) fxEngine.particles.splice(idx, 1); S.driver = null; }
        S.handles.forEach(h => { if (h && h.cancel) h.cancel(); }); S.handles.clear();
        S.layers.forEach(d => d.remove()); S.layers.clear();
        S.anchors.forEach(d => d.remove()); S.anchors.clear();
        S.flashes.forEach(el => el.classList.remove('arcane-flash-cold', 'arcane-flash-heal')); S.flashes.clear();
        S.shakeEls.forEach(el => el.classList.remove('arcane-shake-light', 'arcane-shake-heavy', 'arcane-shake-quake')); S.shakeEls.clear();
        if (S.dark) { S.dark.remove(); S.dark = null; }
        if (S.canvas) { S.canvas.remove(); S.canvas = null; S.ctx = null; }
        if (sfxBus) { sfxBus.gain.cancelScheduledValues(audioCtx.currentTime); sfxBus.gain.value = 0.9; }
    }
    window.isArcaneSkillFx = isArcaneSkillFx;
    window.playArcaneSkillFx = playArcaneSkillFx;
    window.playArcaneProjectile = playArcaneProjectile;
    window.clearArcaneFx = clearArcaneFx;
    return { isArcaneSkillFx, playArcaneSkillFx, playArcaneProjectile, clearArcaneFx, prepareGroupAudio, setGroupSfx };
})();
    // ===== 可移植特效模块 END =====

    // ===== 演示控制 BEGIN：仅驱动上述正式版接口，不参与移植 =====
    // 接入点 4：CARDS 每项为 { name, level, description, fxTag, casterId, targetIds, isReaction }。
    // casterId / targetIds 使用上方 h1-h4、e1-e6；level 使用 L1-L4，默认列表为空。
    // 反应演练可在 playDemoSkill 中调用返回的 handle.dodge / hit，不把模拟攻击写进技能实现。
    const CARDS = [
        { name: '近战群攻', level: 'L2', description: '三爪蓄势 → 瞬间贯穿整排 → 红痕余烬', fxTag: 'group:melee', casterId: 'e5', targetIds: ['h1', 'h2', 'h3', 'h4'] },
        { name: '远程群攻', level: 'L2', description: '四枚金晶成形 → 高速齐射 → 棱片碎裂', fxTag: 'group:ranged', casterId: 'e5', targetIds: ['h1', 'h2', 'h3', 'h4'] },
        { name: '法术群攻', level: '默认', description: '正式版白色爆炸 · 原 atk1 音效', fxTag: 'group:spell', casterId: 'e5', targetIds: ['h1', 'h2', 'h3', 'h4'] }
    ];
    let unlockTimer = null;

    // 与前摇 demo 同样默认开；只在手动点击技能后启动音频。
    const sfxBtn = document.getElementById('btn-group-sfx');
    let sfxOn = true;
    function renderSfxBtn() {
        sfxBtn.textContent = sfxOn ? '🔊 音效开' : '🔇 音效关';
        sfxBtn.setAttribute('aria-pressed', String(sfxOn));
        sfxBtn.className = 'text-[9px] font-bold px-1.5 rounded border transition-all hover:bg-white/10 shrink-0 ' + (sfxOn ? 'border-emerald-500/60 text-emerald-300' : 'border-slate-600 text-slate-400');
    }
    sfxBtn.addEventListener('click', () => { sfxOn = !sfxOn; arcaneVfxModule.setGroupSfx(sfxOn); renderSfxBtn(); });
    renderSfxBtn();

    function lockCards(locked) {
        document.querySelectorAll('#skill-list .card').forEach(card => { card.disabled = locked; });
    }
    async function playDemoSkill(card) {
        combatToken++;
        const token = combatToken;
        clearArcaneFx();
        clearTimeout(unlockTimer);
        lockCards(true);
        await arcaneVfxModule.prepareGroupAudio(card.fxTag);
        if (token !== combatToken) return null;
        const entities = heroesData.concat(enemiesData);
        const caster = entities.find(e => e.id === card.casterId);
        const targets = card.targetIds.map(id => entities.find(e => e.id === id));
        const handle = playArcaneSkillFx(card.fxTag, caster, targets, !!card.isReaction);
        if (handle && handle.doneAt > Date.now()) {
            unlockTimer = setTimeout(() => { unlockTimer = null; lockCards(false); }, handle.doneAt - Date.now());
        } else lockCards(false);
        return handle;
    }
    function renderSkillCards() {
        const list = $('#skill-list');
        list.replaceChildren();
        if (!CARDS.length) {
            list.innerHTML = '<div class="flex-1 flex items-center justify-center text-xs text-slate-500">暂无技能</div>';
            return;
        }
        CARDS.forEach(card => {
            const button = document.createElement('button');
            button.className = 'card w-full py-1.5 px-2 bg-slate-900/80 hover:bg-violet-950/60 border border-slate-700/80 hover:border-violet-500/60 rounded-lg text-left transition-all shadow-sm';
            button.title = card.fxTag;
            button.innerHTML = '<div class="flex items-center justify-between gap-1"><span class="text-xs font-bold text-slate-100"></span><span class="text-[9px] font-bold px-1 rounded border border-cyan-500/60 text-cyan-300"></span></div><div class="text-[9px] text-slate-400 truncate"></div>';
            const labels = button.querySelectorAll('span');
            labels[0].textContent = card.name;
            labels[1].textContent = card.level;
            button.lastElementChild.textContent = card.description;
            button.addEventListener('click', () => playDemoSkill(card));
            list.appendChild(button);
        });
    }
    function resetDemo() {
        combatToken++;
        clearTimeout(unlockTimer); unlockTimer = null;
        clearArcaneFx();
        cancelAnimationFrame(fxEngine.animationFrameId); fxEngine.animationFrameId = null;
        fxEngine.particles.length = 0; fxEngine.hitStop = 0; fxEngine.lastFrameTime = 0;
        fxEngine.ctx.clearRect(0, 0, fxEngine.canvas.width, fxEngine.canvas.height);
        initUI();
        renderSkillCards();
    }
    $('#btn-reset').addEventListener('click', resetDemo);
    renderSkillCards();
    // ===== 演示控制 END =====
    // 移植：只将新增 arcane- CSS、技能函数、标签与分派合并到正式版已有模块。

    // 技能数据追加 [特效:精确标签]；按技能类型核对默认光效去重与真实反应回调，不改数值规则。
    // 详细接线、测试与打包步骤见《技能SVG模板使用与快速移植.md》，不是复制整页即可上线。
    // 正式版已提供 fxEngine / combatToken / getEntitySpriteDom / heroesData / enemiesData，勿重复复制演示宿主。
  </script>
