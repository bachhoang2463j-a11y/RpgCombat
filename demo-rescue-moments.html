  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; overflow: hidden; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; overflow: hidden; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    .arcane-rescue-anchor { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
    .arcane-rescue-svg { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; overflow: visible; }
    .arcane-rescue-ghost { position: fixed; pointer-events: none; will-change: transform, opacity; overflow: hidden; border-radius: 6px; }
    .arcane-rescue-blood-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 12; border-radius: inherit; }
    .arcane-rescue-blood-wash { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, rgba(127,29,29,0.08) 18%, rgba(153,27,27,0.52) 74%, rgba(69,10,10,0.88) 100%); box-shadow: inset 0 0 18px rgba(220,38,38,0.65); will-change: opacity; }
    .arcane-rescue-blood-trail { position: absolute; top: -6px; border-radius: 999px; background: linear-gradient(180deg, rgba(69,10,10,0.45) 0%, #991b1b 42%, #dc2626 78%, #fca5a5 96%, #7f1d1d 100%); box-shadow: 0 0 6px rgba(220,38,38,0.75); transform-origin: 50% 0%; will-change: transform, opacity; }
    .arcane-rescue-blood-trail::after { content: ''; position: absolute; left: 50%; bottom: -3px; width: 150%; height: 6px; transform: translateX(-50%); border-radius: 50% 50% 50% 50% / 38% 38% 62% 62%; background: radial-gradient(circle at 38% 36%, #fecaca 0%, #dc2626 55%, #7f1d1d 100%); }
    @keyframes arcane-rescue-crimson-pulse { 0%, 100% { transform: translate3d(0,0,0) scale(1); } 25% { transform: translate3d(-2px,1px,0) scale(1.03); } 55% { transform: translate3d(2px,-1px,0) scale(1.02); } }
    .arcane-rescue-float { position: fixed; transform: translate(-50%, -50%); pointer-events: none; z-index: 63; font-family: 'Noto Sans SC', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.06em; white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.75); will-change: transform, opacity; }
    .arcane-rescue-group-hd { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; color: #94a3b8; padding: 4px 6px 2px; border-bottom: 1px solid rgba(148,163,184,0.16); margin-top: 2px; display: flex; justify-content: space-between; align-items: center; }
    .arcane-rescue-sfx-row { display: flex; flex-wrap: wrap; gap: 3px; padding: 2px 2px 3px; }
    .arcane-rescue-sfx-btn { font-size: 9px; line-height: 1.2; padding: 2px 5px; border-radius: 5px; border: 1px solid rgba(129,140,248,0.28); background: rgba(15,23,42,0.9); color: #94a3b8; cursor: pointer; transition: all 0.14s ease; white-space: nowrap; }
    .arcane-rescue-sfx-btn:hover { border-color: rgba(129,140,248,0.75); color: #e0e7ff; background: rgba(30,41,59,0.95); }
    .arcane-rescue-sfx-btn.active { border-color: #818cf8; background: rgba(67,56,202,0.42); color: #e0e7ff; box-shadow: 0 0 8px rgba(99,102,241,0.4); font-weight: 700; }
    .arcane-rescue-modal { position: fixed; inset: 0; z-index: 95; display: flex; align-items: center; justify-content: center; padding-bottom: 96px; background: rgba(2,6,23,0.36); backdrop-filter: blur(1.5px); }
    .arcane-rescue-modal-card { width: min(300px, 90vw); background: linear-gradient(160deg, rgba(15,23,42,0.98), rgba(9,13,26,0.98)); border: 1px solid rgba(56,189,248,0.45); border-top: 2px solid #38bdf8; border-radius: 12px; padding: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.88); }
    .arcane-rescue-react-btn { width: 100%; text-align: left; border-radius: 8px; padding: 8px 10px; border: 1px solid rgba(148,163,184,0.22); background: rgba(30,41,59,0.75); transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease; }
    .arcane-rescue-react-btn:hover { border-color: rgba(56,189,248,0.75); background: rgba(30,58,138,0.42); transform: translateY(-1px); }
    .stun-fx { position: absolute; left: 50%; top: -8px; width: 48px; height: 18px; margin-left: -24px; display: flex; justify-content: space-around; align-items: center; pointer-events: none; z-index: 25; }
    .stun-star { font-size: 13px; color: #fde047; text-shadow: 0 0 8px rgba(250,204,21,0.9); animation: arcane-rescue-stun 1.4s ease-in-out infinite; }
    .stun-star:nth-child(2) { animation-delay: 0.25s; } .stun-star:nth-child(3) { animation-delay: 0.5s; }
    @keyframes arcane-rescue-stun { 0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.78; } 50% { transform: translateY(-4px) scale(1.12); opacity: 1; } }
    @keyframes arcane-ghost-shatter { 0% { opacity: 0.72; transform: scale(1); } 45% { opacity: 0.85; transform: scale(1.06); } 100% { opacity: 0; transform: scale(1.18); } }
    .arcane-identity-anchor { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
    .arcane-identity-svg-full { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; overflow: visible; }
    .arcane-identity-glow-amber { filter: drop-shadow(0 0 8px #fbbf24) drop-shadow(0 0 18px #d97706); }
    .arcane-identity-ghost { position: fixed; pointer-events: none; will-change: transform, opacity; overflow: hidden; border-radius: 6px; }
    @keyframes arcane-identity-slash-spark { 0% { transform: translate(-50%,-50%) scale(0.25); opacity: 1; } 35% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.45); opacity: 0; } }
    @keyframes arcane-counter-charge-ring { 0% { transform: translate(-50%,-50%) scale(1.35) rotate(0deg); opacity: 0; } 35% { opacity: 0.95; } 100% { transform: translate(-50%,-50%) scale(0.32) rotate(54deg); opacity: 0.25; } }
    .arcane-hit-track { position: relative; }
    .arcane-hit-ghost { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #fecaca, #fff1f2); box-shadow: 0 0 6px rgba(254,202,202,0.9); z-index: 0; }
    .arcane-hit-fill { z-index: 1; transition: none; }
    @keyframes arcane-hit-fill-blink { 0% { filter: brightness(2.2); } 100% { filter: none; } }
    .arcane-hit-fill-blink { animation: arcane-hit-fill-blink 0.22s ease-out; }
    .arcane-hit-num-layer { position: fixed; inset: 0; pointer-events: none; z-index: 62; overflow: hidden; }
    .arcane-hit-num { position: absolute; transform: translate(-100%, -18%); white-space: nowrap; line-height: 1; will-change: transform, opacity; pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0,0,0,0.92), 0 3px 10px rgba(0,0,0,0.65); }
    .arcane-hit-num.l1 { font-family: 'Inter', 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 24px; color: #f1f5f9; }
    .arcane-hit-num.l2 { font-family: 'Chakra Petch', 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 27px; color: #fda4af; }
    .arcane-hit-num.l3 { font-family: 'Cinzel', 'Noto Sans SC', serif; font-weight: 800; font-size: 32px; color: #fb7185; text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 14px rgba(244,63,94,0.45); }
    .arcane-hit-num.counter { font-family: 'Chakra Petch', 'Noto Sans SC', sans-serif; font-style: italic; font-weight: 800; font-size: 26px; color: #fcd34d; text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 12px rgba(245,158,11,0.55); }
    .arcane-hit-num.shield { font-family: 'Inter', 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 24px; color: #bae6fd; }
    .arcane-hit-num.word { font-family: 'Noto Sans SC', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.08em; }
    .arcane-hit-num.dodge { font-style: italic; color: #cbd5e1; opacity: 0.95; }
    .arcane-hit-num.block { color: #e2e8f0; letter-spacing: 0.1em; }
    .arcane-hit-num.break { font-size: 17px; color: #7dd3fc; letter-spacing: 0.08em; }
    .arcane-hit-core { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">

  <script>
    // ===== 演示宿主 BEGIN：占位数据、渲染、fxEngine；不移植到正式版 =====
    const $ = s => document.querySelector(s);
    let combatToken = 0;
    let heroesData = [], enemiesData = [];
    const HERO_AVATARS = {
        '埃利奥特': 'https://imgur.la/images/2026/06/25/31a4dd84a831e3f76082542bf12fcf19.png',
        '弗兰克': 'https://imgur.la/images/2026/06/25/26f001dbe399876cd74978bbe12a265b.png',
        '玛德琳': 'https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png',
        '索恩': 'https://imgur.la/images/2026/08/13/77fcdf0fd006c4ff1ccae30774322270.png'
    };
    const HERO_DATA = [['h1', '埃利奥特', '👨', 100, 55, 110, 5], ['h2', '弗兰克', '🧔', 180, 0, 17, 0], ['h3', '玛德琳', '👩', 140, 0, 14, 0], ['h4', '索恩', '🕵️', 140, 0, 20, 0]];
    const ENEMY_ROWS = [[['e1', '🐟'], ['e2', '❄️'], ['e3', '🐟']], [['e4', '👻'], ['e5', '👻'], ['e6', '🌀']]];

function createCompactBarHTML(id, type, label, val, max, colorClass, isTp = false, shield = 0) {

class CanvasFxEngine {
    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';

            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }

    function initResAudio() {
        if (!resAudioCtx) {
            resAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const comp = resAudioCtx.createDynamicsCompressor();
            comp.threshold.value = -8; comp.knee.value = 6; comp.ratio.value = 3.5;
            comp.attack.value = 0.002; comp.release.value = 0.14;
            comp.connect(resAudioCtx.destination);
            resMaster = resAudioCtx.createGain();
            resMaster.gain.value = 0.96;
            resMaster.connect(comp);
        }
        if (resAudioCtx.state === 'suspended') resAudioCtx.resume().catch(() => {});
        if (!resDecodePromise) {
            const entries = Object.entries(RESCUE_SAMPLE_B64);
            resDecodePromise = Promise.all(entries.map(([k, b64]) => {
                if (resDecoded.has(k) || !b64) return Promise.resolve();
                try {
                    const bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
                    return resAudioCtx.decodeAudioData(bytes.buffer.slice(0))
                        .then(buf => { resDecoded.set(k, buf); })
                        .catch(() => {});
                } catch (_) { return Promise.resolve(); }
            }));
        }
        return resAudioCtx;
    }
    function stopRescueSamples() {

    function playSample(key, opts = {}) {
        if (opts.sfxGate !== false && !rescueSfxOn) return;
        const ctx = initResAudio();
        const delaySec = Math.max(0, opts.delay || 0);
        const startPlay = (buf, adjDelay) => {
            if (!buf || (opts.sfxGate !== false && !rescueSfxOn)) return;
            const src = ctx.createBufferSource();
            src.buffer = buf;
            if (opts.rate) src.playbackRate.value = opts.rate;
            const g = ctx.createGain();
            g.gain.value = opts.vol !== undefined ? opts.vol : 0.85;
            const p = ctx.createStereoPanner();
            p.pan.value = Math.max(-0.85, Math.min(0.85, opts.pan || 0));
            src.connect(g); g.connect(p); p.connect(resMaster);
            resActiveSrcs.add(src);
            src.onended = () => { resActiveSrcs.delete(src); try { src.disconnect(); } catch (_) {} };
            src.start(ctx.currentTime + Math.max(0, adjDelay));
        };
        const cached = resDecoded.get(key);
        if (cached) { startPlay(cached, delaySec); return; }
        const requestedAt = performance.now();
        if (resDecodePromise) {
            resDecodePromise.then(() => {
                const buf = resDecoded.get(key);
                if (!buf) return;
                const elapsed = (performance.now() - requestedAt) / 1000;
                if (elapsed > 0.6 && delaySec === 0) return;
                startPlay(buf, Math.max(0, delaySec - elapsed));
            });
