<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>救场与倒下 · 情绪反馈 Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap');
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Noto Sans SC', sans-serif; user-select: none; }
    /* —— 以下复刻主工程 index.html 主界面样式 —— */
    .glass-panel { background: rgba(20, 25, 35, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
    .text-outline { text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 1px 2px rgba(0,0,0,0.8); }
    .mask-fade-y { -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .timeline-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: linear-gradient(180deg, rgba(250,204,21,0.85) 0%, rgba(6,182,212,0.65) 25%, rgba(99,102,241,0.45) 60%, rgba(255,255,255,0.05) 100%); box-shadow: 0 0 10px rgba(6,182,212,0.55); pointer-events: none; z-index: 0; }
    @keyframes rail-pulse { 0% { transform: translateY(-100%); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(800%); opacity: 0; } }
    .rail-pulse-beam { position: absolute; left: 0; top: 0; width: 2px; height: 40px; background: linear-gradient(180deg, transparent, #38bdf8, #fff); box-shadow: 0 0 12px #38bdf8; animation: rail-pulse 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .turn-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #111827; border: 2px solid; position: relative; z-index: 1; flex-shrink: 0; overflow: hidden; }
    .turn-dot.cur { width: 52px; height: 52px; font-size: 26px; border-color: #facc15 !important; box-shadow: 0 0 20px rgba(250,204,21,0.9); }
    .breathe { animation: breathe 3.2s ease-in-out infinite; } @keyframes breathe { 50% { transform: translateY(-4px) scale(1.02); } }
    #chat-bar input { background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.12); color: #e2e8f0; }
    .portrait { background: radial-gradient(ellipse at 50% 30%, #3b3f5c, #14151f 75%); display: flex; align-items: flex-end; justify-content: center; font-size: 64px; overflow: hidden; }
    .card:disabled { pointer-events: none; opacity: 0.45; filter: grayscale(0.6); }

    /* ===== 可移植特效样式 BEGIN：与 index.html 的 arcane- 命名及层序一致 ===== */
    .arcane-fs-layer { position: fixed; inset: 0; pointer-events: none; z-index: 52; overflow: hidden; }
    .arcane-fs-anchor { position: absolute; transform: translate(-50%, -50%); }
    #arcane-fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 55; }
    #arcane-dark { position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0; transition: opacity 0.35s ease; background: radial-gradient(ellipse at 40% 60%, rgba(5,6,20,0.55) 0%, rgba(2,3,10,0.92) 75%); }
    @keyframes arcane-seed-bloom { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0; } 70% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(0.6); opacity: 0; } }
    @keyframes arcane-hit-flash { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.7); opacity: 0; } }
    @keyframes arcane-f-cold { 0% { filter: brightness(1.6) hue-rotate(180deg) saturate(2.5); } 60% { filter: none; } }
    @keyframes arcane-f-heal { 0% { filter: brightness(1.8) drop-shadow(0 0 18px #34d399); } 100% { filter: none; } }
    .arcane-flash-cold { animation: arcane-f-cold 0.5s steps(1) both !important; }
    .arcane-flash-heal { animation: arcane-f-heal 0.6s ease-out both !important; }
    @keyframes arcane-tint { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-ripple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
    @keyframes arcane-ring-out { 0% { r: 4; opacity: 0.95; stroke-width: 3; } 100% { r: 150; opacity: 0; stroke-width: 0.5; } }
    @keyframes arcane-fs-flash { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-draw-on { to { stroke-dashoffset: 0; } }
    .arcane-grow { stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes arcane-fade-life { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes arcane-slow-rot { to { transform: rotate(360deg); } }
    @keyframes arcane-s-light { 25% { transform: translate3d(-3px, 2px, 0); } 60% { transform: translate3d(3px, -2px, 0); } }
    @keyframes arcane-s-heavy { 15% { transform: translate3d(-8px, 4px, 0); } 35% { transform: translate3d(7px, -5px, 0); } 60% { transform: translate3d(-4px, 3px, 0); } 85% { transform: translate3d(2px, -1px, 0); } }
    @keyframes arcane-s-quake { 10% { transform: translate3d(-14px, 8px, 0); } 25% { transform: translate3d(12px, -10px, 0); } 40% { transform: translate3d(-9px, 6px, 0); } 60% { transform: translate3d(6px, -4px, 0); } 80% { transform: translate3d(-3px, 2px, 0); } }
    .arcane-shake-light { animation: arcane-s-light 0.18s ease-out; }
    .arcane-shake-heavy { animation: arcane-s-heavy 0.32s ease-out; }
    .arcane-shake-quake { animation: arcane-s-quake 0.55s ease-out; }
    /* 新技能的 arcane- 样式写在这里；移植时只追加新样式，不覆盖正式版的已有样式。 */
    .arcane-rescue-anchor { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
    .arcane-rescue-svg { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; overflow: visible; }
    .arcane-rescue-ghost { position: fixed; pointer-events: none; will-change: transform, opacity; overflow: hidden; border-radius: 6px; }
    .arcane-rescue-vignette { position: fixed; inset: 0; pointer-events: none; z-index: 41; background: radial-gradient(ellipse at 50% 54%, rgba(2,6,23,0) 32%, rgba(2,6,23,0.48) 74%, rgba(0,0,0,0.82) 100%); will-change: opacity; }
    .arcane-rescue-fallen .portrait > img, .arcane-rescue-fallen .portrait > span { transform-origin: 50% 88%; transform: translate3d(0, 14px, 0) rotate(-14deg) scale(0.92, 0.74); }
    .arcane-rescue-float { position: fixed; transform: translate(-50%, -50%); pointer-events: none; z-index: 63; font-family: 'Noto Sans SC', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.06em; white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.75); will-change: transform, opacity; }
    .arcane-rescue-group-hd { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; color: #94a3b8; padding: 4px 6px 2px; border-bottom: 1px solid rgba(148,163,184,0.16); margin-top: 2px; display: flex; justify-content: space-between; align-items: center; }
    .arcane-rescue-modal { position: fixed; inset: 0; z-index: 95; display: flex; align-items: center; justify-content: center; background: rgba(2,6,23,0.52); backdrop-filter: blur(2px); }
    .arcane-rescue-modal-card { width: min(300px, 90vw); background: linear-gradient(160deg, rgba(15,23,42,0.98), rgba(9,13,26,0.98)); border: 1px solid rgba(56,189,248,0.45); border-top: 2px solid #38bdf8; border-radius: 12px; padding: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.88); }
    .arcane-rescue-react-btn { width: 100%; text-align: left; border-radius: 8px; padding: 8px 10px; border: 1px solid rgba(148,163,184,0.22); background: rgba(30,41,59,0.75); transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease; }
    .arcane-rescue-react-btn:hover { border-color: rgba(56,189,248,0.75); background: rgba(30,58,138,0.42); transform: translateY(-1px); }
    .stun-fx { position: absolute; left: 50%; top: -8px; width: 48px; height: 18px; margin-left: -24px; display: flex; justify-content: space-around; align-items: center; pointer-events: none; z-index: 25; }
    .stun-star { font-size: 13px; color: #fde047; text-shadow: 0 0 8px rgba(250,204,21,0.9); animation: arcane-rescue-stun 1.4s ease-in-out infinite; }
    .stun-star:nth-child(2) { animation-delay: 0.25s; } .stun-star:nth-child(3) { animation-delay: 0.5s; }
    @keyframes arcane-rescue-stun { 0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.78; } 50% { transform: translateY(-4px) scale(1.12); opacity: 1; } }
    @keyframes arcane-ghost-shatter { 0% { opacity: 0.72; transform: scale(1); } 45% { opacity: 0.85; transform: scale(1.06); } 100% { opacity: 0; transform: scale(1.18); } }
    .arcane-identity-anchor { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
    .arcane-identity-svg-full { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; overflow: visible; }
    .arcane-identity-glow-amber { filter: drop-shadow(0 0 8px #fbbf24) drop-shadow(0 0 18px #d97706); }
    .arcane-identity-ghost { position: fixed; pointer-events: none; will-change: transform, opacity; overflow: hidden; border-radius: 6px; }
    @keyframes arcane-identity-slash-spark { 0% { transform: translate(-50%,-50%) scale(0.25); opacity: 1; } 35% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.45); opacity: 0; } }
    @keyframes arcane-counter-charge-ring { 0% { transform: translate(-50%,-50%) scale(1.35) rotate(0deg); opacity: 0; } 35% { opacity: 0.95; } 100% { transform: translate(-50%,-50%) scale(0.32) rotate(54deg); opacity: 0.25; } }
    .arcane-hit-track { position: relative; }
    .arcane-hit-ghost { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #fecaca, #fff1f2); box-shadow: 0 0 6px rgba(254,202,202,0.9); z-index: 0; }
    .arcane-hit-fill { z-index: 1; transition: none; }
    @keyframes arcane-hit-fill-blink { 0% { filter: brightness(2.2); } 100% { filter: none; } }
    .arcane-hit-fill-blink { animation: arcane-hit-fill-blink 0.22s ease-out; }
    .arcane-hit-num-layer { position: fixed; inset: 0; pointer-events: none; z-index: 62; overflow: hidden; }
    .arcane-hit-num { position: absolute; transform: translate(-100%, -18%); white-space: nowrap; line-height: 1; will-change: transform, opacity; pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0,0,0,0.92), 0 3px 10px rgba(0,0,0,0.65); }
    .arcane-hit-num.l1 { font-family: 'Inter', 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 24px; color: #f1f5f9; }
    .arcane-hit-num.l2 { font-family: 'Chakra Petch', 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 27px; color: #fda4af; }
    .arcane-hit-num.l3 { font-family: 'Cinzel', 'Noto Sans SC', serif; font-weight: 800; font-size: 32px; color: #fb7185; text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 14px rgba(244,63,94,0.45); }
    .arcane-hit-num.counter { font-family: 'Chakra Petch', 'Noto Sans SC', sans-serif; font-style: italic; font-weight: 800; font-size: 26px; color: #fcd34d; text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 12px rgba(245,158,11,0.55); }
    .arcane-hit-num.shield { font-family: 'Inter', 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 24px; color: #bae6fd; }
    .arcane-hit-num.word { font-family: 'Noto Sans SC', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.08em; }
    .arcane-hit-num.dodge { font-style: italic; color: #cbd5e1; opacity: 0.95; }
    .arcane-hit-num.block { color: #e2e8f0; letter-spacing: 0.1em; }
    .arcane-hit-num.break { font-size: 17px; color: #7dd3fc; letter-spacing: 0.08em; }
    .arcane-hit-core { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
    /* ===== 可移植特效样式 END ===== */
  </style>
</head>
<body class="text-white">
 <div id="app" class="fixed inset-0 overflow-hidden">
  <!-- 顶部控制按钮（复刻主界面） -->
  <div class="absolute top-2 sm:top-4 right-2 sm:right-4 z-[115] flex gap-1.5 sm:gap-2">
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-violet-400 hover:text-violet-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📚</span> <span class="hidden sm:inline">世界书</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-purple-400 hover:text-purple-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>📜</span> <span class="hidden sm:inline">记录</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-blue-400 hover:text-blue-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔲</span> <span class="hidden sm:inline">全屏</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>💬</span> <span class="hidden sm:inline">对话</span></button>
    <button class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-yellow-500 hover:text-yellow-400 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>⚙️</span> <span class="hidden sm:inline">设置</span></button>
    <button id="btn-reset" class="glass-panel px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-[10px] sm:text-xs font-bold text-emerald-400 hover:text-emerald-300 hover:bg-white/10 transition-all flex items-center gap-1.5 shadow-md"><span>🔄</span> <span class="hidden sm:inline">重置</span></button>
  </div>

  <!-- 全屏战场区域 -->
  <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-800 to-emerald-900 overflow-hidden z-0" id="battle-scene">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
    <div class="absolute bottom-0 w-full h-1/2 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-0"></div>
    <div class="absolute left-1 sm:left-4 md:left-6 top-16 sm:top-20 bottom-44 sm:bottom-48 w-12 sm:w-14 z-30 flex flex-col items-center select-none">
      <div class="relative w-full h-full flex flex-col items-center">
        <div class="timeline-rail"><div class="rail-pulse-beam"></div></div>
        <div id="turn-order-container" class="relative w-full h-full flex flex-col gap-2 sm:gap-2.5 items-center overflow-y-auto no-scrollbar mask-fade-y py-3"></div>
      </div>
    </div>
    <div id="enemies-container" class="absolute left-2 sm:left-6 right-2 sm:right-6 top-[10%] bottom-[190px] sm:bottom-[220px] z-10 flex flex-col items-center justify-start gap-6 overflow-visible pointer-events-none"></div>
  </div>

  <!-- 悬浮 UI 层 -->
  <div class="absolute bottom-[52px] left-0 w-full p-1.5 sm:p-6 flex flex-col-reverse sm:flex-row items-end justify-between gap-1.5 sm:gap-4 z-20 pointer-events-none pb-2 sm:pb-6">
    <div id="heroes-container" class="w-full sm:flex-1 grid grid-cols-4 gap-1 sm:gap-4 max-w-2xl pointer-events-auto relative"></div>
    <div class="relative self-end">
      <div id="menu-container" class="w-[260px] h-[172px] bg-slate-950/95 backdrop-blur-xl rounded-xl border border-slate-700/80 border-t-2 border-t-cyan-500/80 flex flex-col overflow-hidden relative shadow-[0_15px_35px_rgba(0,0,0,0.9)] pointer-events-auto self-end mb-1 sm:mb-0">
        <div class="px-2.5 py-1 bg-gradient-to-r from-violet-950/60 via-slate-900/90 to-slate-950 border-b border-violet-900/40 flex justify-between items-center shrink-0">
          <div class="flex items-center gap-1.5 min-w-0"><span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse shrink-0"></span><span class="text-xs font-bold text-sky-200 truncate">救场与倒下 · 情绪反馈</span></div>
          <div class="flex items-center gap-1 shrink-0"><span id="rescue-beat-stat" class="text-[9px] font-mono text-sky-300/90 truncate max-w-[66px]" title="当前演出拍点">待机</span><button id="btn-fall-vignette" class="text-[9px] font-bold px-1 rounded border border-violet-500/60 text-violet-300 hover:bg-white/10 transition-all shrink-0" aria-pressed="true" title="我方倒下0.35s战场暗角脉动">🌑暗</button><button id="btn-rescue-sfx" class="text-[9px] font-bold px-1 rounded border border-emerald-500/60 text-emerald-300 hover:bg-white/10 transition-all shrink-0" aria-pressed="true" title="合成音效开关">🔊</button></div>
        </div>
        <div id="skill-list" class="flex-1 flex flex-col gap-1 p-1 overflow-y-auto custom-scrollbar"></div>
      </div>
    </div>
  </div>

  <!-- 底部对话栏（复刻主界面，仅装饰） -->
  <div id="chat-bar" class="absolute bottom-0 left-0 right-0 h-[52px] z-30 flex items-center gap-2 px-2 sm:px-3 bg-black/60 border-t border-white/5">
    <div class="w-9 h-9 rounded-full bg-slate-700 border border-white/20 shrink-0 flex items-center justify-center">🕵️</div>
    <input type="text" placeholder="说点什么... (Enter发送)" class="flex-1 h-9 rounded-full px-4 text-sm outline-none">
    <span class="px-3 py-1 rounded-full text-xs font-bold border border-emerald-500/60 text-emerald-300 bg-emerald-950/50">友方旁白 ON</span>
    <span class="px-3 py-1 rounded-full text-xs font-bold border border-rose-500/60 text-rose-300 bg-rose-950/50">敌方旁白 ON</span>
    <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">➤</div>
  </div>
 </div>
  <script>
    // ===== 演示宿主 BEGIN：占位数据、渲染、fxEngine；不移植到正式版 =====
    const $ = s => document.querySelector(s);
    let combatToken = 0;
    let heroesData = [], enemiesData = [];
    const HERO_AVATARS = {
        '埃利奥特': 'https://imgur.la/images/2026/06/25/31a4dd84a831e3f76082542bf12fcf19.png',
        '弗兰克': 'https://imgur.la/images/2026/06/25/26f001dbe399876cd74978bbe12a265b.png',
        '玛德琳': 'https://imgur.la/images/2026/06/25/585bf7f2f1559168b419b8be56da36a6.png',
        '索恩': 'https://imgur.la/images/2026/08/13/77fcdf0fd006c4ff1ccae30774322270.png'
    };
    const HERO_DATA = [['h1', '埃利奥特', '👨', 100, 55, 110, 5], ['h2', '弗兰克', '🧔', 180, 0, 17, 0], ['h3', '玛德琳', '👩', 140, 0, 14, 0], ['h4', '索恩', '🕵️', 140, 0, 20, 0]];
    const ENEMY_ROWS = [[['e1', '🐟'], ['e2', '❄️'], ['e3', '🐟']], [['e4', '👻'], ['e5', '👻'], ['e6', '🌀']]];

function createCompactBarHTML(id, type, label, val, max, colorClass, isTp = false, shield = 0) {
  const pct = Math.max(0, Math.min(100, (val / max) * 100)); const barWidthClass = isTp ? 'w-1/3' : 'w-full';
  const shieldText = shield > 0 && type === 'hp' ? `<span class="text-slate-300 ml-0.5 text-[7px] sm:text-[9px]">(盾${shield})</span>` : '';
  let finalColor = colorClass; let extraClass = ''; if (isTp && val >= max) { finalColor = 'bg-amber-400'; extraClass = 'shadow-[0_0_10px_rgba(251,191,36,0.8)] animate-pulse'; }
  const ghost = type === 'hp' ? `<div id="${id}-hp-ghost" class="arcane-hit-ghost" style="width:${pct}%"></div>` : '';
  const trackCls = type === 'hp' ? 'arcane-hit-track' : '';
  const fillCls = type === 'hp' ? 'arcane-hit-fill' : 'transition-all duration-300 ease-out';
  return `<div class="relative pt-1.5 sm:pt-2.5 mb-0 sm:mb-[2px]"><span id="${id}-${type}-text" class="absolute right-0 top-0 text-[8px] sm:text-xs font-mono font-bold text-white leading-none text-outline z-10 whitespace-nowrap">${Math.floor(val)}${shieldText}</span><div class="flex items-center gap-1 sm:gap-1.5"><span class="text-[7px] sm:text-[10px] font-bold text-gray-200 leading-none text-outline w-3 sm:w-4">${label}</span><div class="flex-grow h-1 sm:h-1.5 bg-[#222] rounded-[1px] overflow-hidden border border-[#111] ${trackCls}">${ghost}<div id="${id}-${type}-bar" class="${barWidthClass} h-full ${finalColor} ${extraClass} ${fillCls}" style="width: ${pct}%"></div></div></div></div>`;
}

function getEntitySpriteDom(entityOrId){
  const id = entityOrId && typeof entityOrId === 'object' ? entityOrId.id : String(entityOrId||'');
  if(!id) return null;
  return document.getElementById(`hero-card-${id}`) || document.getElementById(`${id}-sprite`) || document.getElementById(`hero-wrap-${id}`) || null;

    constructor() {
        this.canvas = null;
        this.ctx = null;
        this.particles = [];
        this.animationFrameId = null;
        this.hitStop = 0; // 定帧剩余毫秒：>0 时粒子冻结，制造重击顿挫感
        this.lastFrameTime = 0; // 上一帧时间戳：用于计算真实帧间隔 dt
        this.lastDt = 16.7;     // 最近一帧的真实间隔（毫秒），供雷电 overlay 等外部特效对齐
        this.init();
    }

    init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.canvas.id = 'fx-canvas';
            this.canvas.className = 'fixed inset-0 pointer-events-none z-[99]';
            document.body.appendChild(this.canvas);
        }
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        if (this.canvas) {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
    }

    addParticle(p) {
        this.particles.push(p);
        if (this.particles.length === 1) {
            this.startLoop();
        }
    }

    startLoop() {
        if (!this.animationFrameId) {
            // 重置时间戳，避免空闲后重启的首帧因间隔过大而跳变（配合 update 内 33ms 上限钳制）
            this.lastFrameTime = 0;
            const loop = () => {
                this.update();
                this.draw();
                if (this.particles.length > 0) {
                    this.animationFrameId = requestAnimationFrame(loop);
                } else {
                    this.animationFrameId = null;
                }
            };
            this.animationFrameId = requestAnimationFrame(loop);
        }
    }

    update() {
        // Delta-time：按真实帧间隔推进动画，速度与 FPS 解耦（高刷屏不加速、掉帧不减速）
        // dt 上限 33ms：标签页休眠/卡顿后恢复时防止粒子瞬移跳变
        const now = performance.now();
        const dt = this.lastFrameTime ? Math.min(now - this.lastFrameTime, 33) : 16.7;
        this.lastDt = dt;
        this.lastFrameTime = now;
        const k = dt / 16.7; // 归一化时间系数：1 = 60fps 基准步长

        // Hit Stop 定帧：命中瞬间冻结粒子若干毫秒，制造"重击砸进肉里"的顿挫落差
        if (this.hitStop > 0) {
            this.hitStop -= dt;
            return;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.age += dt;

            p.x += p.vx * k;
            p.y += p.vy * k;

            if (p.gravity) p.vy += p.gravity * k;
            if (p.drag) {
                const d = Math.pow(p.drag, k); // 阻尼按时间比例复合衰减
                p.vx *= d;
                p.vy *= d;
            }
            if (p.update) p.update(p);

            if (p.age >= p.life) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 使用 'screen' 混合模式实现极具发光感的爆燃、辉光效果
        this.ctx.globalCompositeOperation = 'screen';
        
        for (let i = 0; i < this.particles.length; i++) {
            const p = this.particles[i];
            const pct = p.age / p.life;
            this.ctx.save();
            p.draw(this.ctx, pct);
            this.ctx.restore();
        }
        
        this.ctx.globalCompositeOperation = 'source-over';
    }

            if (b.phase === 'avoided') { setBeatStat('回避致命!'); arcaneVfxModule.spawnRescueFloat(getEntitySpriteDom(target), '回避致命!', '#818cf8', 0); }
        } });
        if (chainFall) demoAt(1200, () => {
            setBeatStat('无被动二击');
            arcaneVfxModule.playIncomingSlash(from, target, 'hit', () => {
                applyDemoDamage(target, 52, { suppressAudio: true }); setBeatStat('倒下');
                arcaneVfxModule.playHeroFall(target, { deathCause: '近战' }, b => { if (b.phase === 'touchdown') markHeroDead(target); });
            });
        });
    }
    function playDemoScenario(card) {
        if (!card) return;
        closeReactionModal(); demoTimers.forEach(clearTimeout); demoTimers.clear(); unlockTimer = null;
        ++combatToken; arcaneVfxModule.clearArcaneFx(); initUI(card.setup || {}); lockCards();
        const m = card.meta || {}, ev = card.event;
        if (ev === 'sheshen') {
            const g = getEnt(m.guardianId), t = getEnt(m.targetId), f = getEnt(m.incomingFrom || 'e4');
            arcaneVfxModule.playRescueMomentFx({ event: 'sheshen', guardian: g, target: t, meta: { ...m, incomingFrom: f }, onBeat(b) {
                if (b.phase === 'resolve') setBeatStat('决意');
                else if (b.phase === 'dash') setBeatStat('闪身');
                else if (b.phase === 'blockImpact') { setBeatStat('格挡!'); applyDemoDamage(g, m.dmg || 42, { suppressAudio: true }); }
                else if (b.phase === 'return') setBeatStat('归位');
                else if (b.phase === 'reactionReady') openReactionModal(g, t, f);
            } });
            if (m.blockOutcome !== 'reaction') scheduleUnlock(1220);
        } else if (ev === 'baseline_hit') {
            const t = getEnt(m.targetId), f = getEnt(m.incomingFrom || 'e4');
            setBeatStat('直接受击'); arcaneVfxModule.playIncomingSlash(f, t, 'hit', () => applyDemoDamage(t, m.dmg || 65)); scheduleUnlock(780);
        } else if (ev === 'grit' || ev === 'grit_chain') {
            setBeatStat('致命攻击'); runGritOnce(getEnt(m.targetId), getEnt(m.incomingFrom || 'e4'), ev === 'grit_chain');
            scheduleUnlock(ev === 'grit_chain' ? 2450 : 1320);
        } else if (ev === 'avoidFatal' || ev === 'avoid_chain') {
            runAvoidOnce(getEnt(m.targetId), getEnt(m.incomingFrom || 'e5'), m.incomingType || '远程', ev === 'avoid_chain');
            scheduleUnlock(ev === 'avoid_chain' ? 2280 : 1060);
        } else if (ev === 'fall') {
            const t = getEnt(m.targetId), f = getEnt(m.incomingFrom || 'e4');
            setBeatStat('致命击落');
            arcaneVfxModule.playIncomingSlash(f, t, 'hit', () => {
                applyDemoDamage(t, m.dmg || 46, { suppressAudio: true }); setBeatStat('倒下');
                arcaneVfxModule.playHeroFall(t, { deathCause: m.deathCause || '近战' }, b => { if (b.phase === 'touchdown') markHeroDead(t); });
            });
            scheduleUnlock(1160);
        } else if (ev === 'dot_fall') {
            const t = getEnt(m.targetId);
            setBeatStat('灼烧Tick');
            arcaneVfxModule.playStatusTickBurn(t, m.dotDmg || 28, () => {
                applyDemoDamage(t, m.dotDmg || 28, { ignoreShield: true, suppressAudio: true });
                demoAt(280, () => { setBeatStat('DoT致死'); arcaneVfxModule.playHeroFall(t, { deathCause: 'DoT' }, b => { if (b.phase === 'touchdown') markHeroDead(t); }); });
            });
            scheduleUnlock(1240);
        } else if (ev === 'fall_vs_subdue') {
            const h = getEnt(m.heroId || 'h3'), e = getEnt(m.enemyId || 'e1');
            setBeatStat('倒下vs制服');
            applyDemoDamage(h, 40, { suppressAudio: true });
            arcaneVfxModule.playHeroFall(h, { deathCause: '近战' }, b => { if (b.phase === 'touchdown') markHeroDead(h); });
            demoAt(200, () => { applyDemoDamage(e, 28, { suppressAudio: true }); markEnemySubdued(e); });
            scheduleUnlock(1100);
        } else if (ev === 'stress_double_sheshen') {
            const h1 = getEnt('h1'), h2 = getEnt('h2'), h3 = getEnt('h3'), e4 = getEnt('e4'), e2 = getEnt('e2');
            setBeatStat('一次舍身');
            arcaneVfxModule.playRescueMomentFx({ event: 'sheshen', guardian: h2, target: h1, meta: { incomingType: '近战', incomingFrom: e4 } });
            demoAt(360, () => {
                setBeatStat('抢占二次');
                arcaneVfxModule.playRescueMomentFx({ event: 'sheshen', guardian: h2, target: h3, meta: { incomingType: '远程', incomingFrom: e2 }, onBeat(b) { if (b.phase === 'blockImpact') applyDemoDamage(h2, 32, { suppressAudio: true }); } });
            });
            scheduleUnlock(1650);
        } else if (ev === 'stress_fall_reset') {
            const h3 = getEnt('h3'); setBeatStat('倒下中断');
            arcaneVfxModule.playHeroFall(h3, { deathCause: '近战' }, b => { if (b.phase === 'touchdown') markHeroDead(h3); });
            demoAt(240, () => { resetDemo(); setBeatStat('重置清零'); demoAt(900, () => setBeatStat('待机')); });
        }
    }
    function resetDemo() {
        closeReactionModal();
        demoTimers.forEach(clearTimeout); demoTimers.clear(); unlockTimer = null;
        ++combatToken; arcaneVfxModule.clearArcaneFx(); initUI(); setBeatStat('待机');
        document.querySelectorAll('#skill-list .card').forEach(b => { b.disabled = false; });
    }
    function renderScenarioCards() {
        const list = $('#skill-list');
        if (!list) return;
        list.innerHTML = DEMO_GROUPS.map(g => `
          <div class="arcane-rescue-group-hd"><span>${g.title}</span><span class="text-sky-300/80 font-normal">${g.badge}</span></div>
          ${g.cards.map((c, idx) => `<button type="button" data-g="${DEMO_GROUPS.indexOf(g)}" data-c="${idx}" class="card w-full text-left px-2 py-1 rounded bg-slate-900/90 border border-slate-700/70 hover:border-sky-400/75 hover:bg-slate-800/90 transition-all flex items-center justify-between gap-1 shrink-0"><span class="text-[10px] font-bold text-slate-100 truncate">${c.name}</span><span class="text-[9px] font-mono px-1 rounded bg-slate-800 text-sky-300 shrink-0">${c.badge}</span></button>`).join('')}`).join('');
        list.querySelectorAll('.card').forEach(btn => btn.addEventListener('click', () => {
            const g = DEMO_GROUPS[Number(btn.dataset.g)]; const c = g && g.cards[Number(btn.dataset.c)];
            if (c) playDemoScenario(c);
        }));
    }
    const btnReset = $('#btn-reset'), btnVig = $('#btn-fall-vignette'), btnSfx = $('#btn-rescue-sfx');
    if (btnReset) btnReset.addEventListener('click', resetDemo);
    if (btnVig) btnVig.addEventListener('click', () => {
        vignetteEnabled = !vignetteEnabled; arcaneVfxModule.setFallVignette(vignetteEnabled);
        btnVig.setAttribute('aria-pressed', String(vignetteEnabled));
        btnVig.textContent = vignetteEnabled ? '🌑暗' : '☀️无暗';
        btnVig.classList.toggle('border-violet-500/60', vignetteEnabled); btnVig.classList.toggle('text-violet-300', vignetteEnabled);
        btnVig.classList.toggle('border-slate-600/60', !vignetteEnabled); btnVig.classList.toggle('text-slate-400', !vignetteEnabled);
    });
    if (btnSfx) btnSfx.addEventListener('click', () => {
        sfxEnabled = !sfxEnabled; arcaneVfxModule.setRescueSfx(sfxEnabled);
        btnSfx.setAttribute('aria-pressed', String(sfxEnabled)); btnSfx.textContent = sfxEnabled ? '🔊' : '🔇';
        btnSfx.classList.toggle('border-emerald-500/60', sfxEnabled); btnSfx.classList.toggle('text-emerald-300', sfxEnabled);
        btnSfx.classList.toggle('border-slate-600/60', !sfxEnabled); btnSfx.classList.toggle('text-slate-400', !sfxEnabled);
    });
    renderScenarioCards();
    // ===== 演示控制 END =====
    // 移植：只将新增 arcane- CSS、技能函数、标签与分派合并到正式版已有模块。
    // 必须同时追加 WEBM_FX_REGISTRY 的 { url: '', scale: 1.0, particles: 'arcane', delay: 蓄势秒数 }。
    // 技能数据追加 [特效:精确标签]；按技能类型核对默认光效去重与真实反应回调，不改数值规则。
    // 详细接线、测试与打包步骤见《技能SVG模板使用与快速移植.md》，不是复制整页即可上线。
    // 正式版已提供 fxEngine / combatToken / getEntitySpriteDom / heroesData / enemiesData，勿重复复制演示宿主。
  </script>
</body>
