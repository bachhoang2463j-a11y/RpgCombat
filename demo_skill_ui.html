<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Combat 战斗前端 - 260px x 172px 紧凑面板与蓝色系蓄力 UI 预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #f3f4f6;
      height: 100vh;
      width: 100vw;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }
    
    .font-mono-num {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.35);
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.65);
    }

    /* 技能卡片炫彩左条 & 辉光 */
    .skill-card-magic {
      border-left: 3px solid #c084fc !important;
      background: linear-gradient(135deg, rgba(28, 18, 48, 0.92) 0%, rgba(15, 23, 42, 0.96) 100%);
    }
    .skill-card-magic:hover:not(.disabled-card) {
      border-left-color: #f0abfc !important;
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.3);
    }

    .skill-card-ranged {
      border-left: 3px solid #f59e0b !important;
      background: linear-gradient(135deg, rgba(42, 28, 16, 0.92) 0%, rgba(15, 23, 42, 0.96) 100%);
    }
    .skill-card-ranged:hover:not(.disabled-card) {
      border-left-color: #fbbf24 !important;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    }

    .skill-card-melee {
      border-left: 3px solid #f43f5e !important;
      background: linear-gradient(135deg, rgba(48, 18, 28, 0.92) 0%, rgba(15, 23, 42, 0.96) 100%);
    }
    .skill-card-melee:hover:not(.disabled-card) {
      border-left-color: #fda4af !important;
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.3);
    }

    .skill-card-default {
      border-left: 3px solid #38bdf8 !important;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92) 0%, rgba(15, 23, 42, 0.96) 100%);
    }
    .skill-card-default:hover:not(.disabled-card) {
      border-left-color: #7dd3fc !important;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .disabled-card {
      opacity: 0.5;
      filter: grayscale(0.4);
      cursor: not-allowed !important;
      border-left-color: #64748b !important;
      background: rgba(15, 23, 42, 0.7) !important;
    }

    .exhausted-card {
      opacity: 0.4;
      filter: grayscale(0.85);
      cursor: not-allowed !important;
      border-left-color: #ef4444 !important;
      background: rgba(30, 10, 15, 0.7) !important;
    }

    .hero-active-ring {
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.5), inset 0 0 8px rgba(56, 189, 248, 0.3);
      border-color: #38bdf8 !important;
    }
  </style>
</head>
<body class="w-full h-[100dvh] min-h-[600px] bg-black text-gray-100 overflow-hidden relative select-none">

  <!-- 全屏战场场景 -->
  <div class="absolute inset-0 bg-gradient-to-br from-indigo-950 via-slate-900 to-emerald-950 overflow-hidden z-0" id="battle-scene">

    <!-- 顶部消息广播 Bar -->

      </div>

        🐺
      </div>
      <div class="w-10 h-10 rounded-full border border-slate-600 bg-slate-900/80 opacity-70 flex items-center justify-center text-lg shrink-0">
        🗡️
      </div>
    </div>

    <!-- 中间：敌方单位展示 -->
    <div id="enemies-container" class="absolute inset-0 z-10 flex items-center justify-center gap-16 pb-48 px-8">
      <div class="w-44 bg-slate-950/80 border border-rose-900/60 rounded-xl p-3 shadow-2xl flex flex-col items-center relative">
        <div class="text-xs font-bold text-rose-300 mb-1">🐺 青眼苍狼</div>
        <div class="w-24 h-24 bg-slate-900 rounded-lg border border-rose-800/40 flex items-center justify-center text-4xl mb-2 shadow-inner">
          🐺
        </div>
        <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-700">
          <div class="bg-rose-500 h-full w-[85%]"></div>
        </div>
        <div class="text-[10px] text-slate-400 font-mono mt-1">HP: 102 / 120</div>
      </div>

      <div class="w-44 bg-slate-950/80 border border-purple-900/60 rounded-xl p-3 shadow-2xl flex flex-col items-center relative">
        <div class="text-xs font-bold text-purple-300 mb-1">🧙‍♀️ 邪灵祭司</div>
        <div class="w-24 h-24 bg-slate-900 rounded-lg border border-purple-800/40 flex items-center justify-center text-4xl mb-2 shadow-inner">

        </div>
        <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-700">

        </div>

  <!-- 顶部控制按钮 -->

    <button class="glass-panel px-3 py-1.5 rounded-full text-xs font-bold text-yellow-500 hover:bg-white/10 transition-all flex items-center gap-1 shadow-md">
      <span>⚙️</span> <span>设置</span>
    </button>
    <button class="glass-panel px-3 py-1.5 rounded-full text-xs font-bold text-emerald-400 hover:bg-white/10 transition-all flex items-center gap-1 shadow-md">

    </button>
  </div>

  <!-- 底部悬浮 UI 层 -->

          <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden border border-slate-800"><div class="bg-emerald-400 h-full w-[20%]"></div></div>
        </div>
      </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <div class="flex items-center gap-1.5">
              <span class="text-base">🛡️</span>
              <span class="text-xs font-bold text-slate-300">弗兰克</span>
            </div>
            <span class="text-[9px] bg-amber-950 text-amber-300 border border-amber-700/60 px-1 py-0.2 rounded font-bold">防守者</span>
          </div>
          <div class="w-full h-10 bg-slate-950/80 rounded-lg border border-slate-800 flex items-center justify-center text-xl mb-1 text-slate-400 shadow-inner">
            🛡️
          </div>
        </div>
        <div class="space-y-1 text-[9px] font-mono">
          <div class="flex justify-between text-rose-300"><span>HP</span><span>180/180</span></div>
          <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden border border-slate-800"><div class="bg-rose-500 h-full w-[100%]"></div></div>
          <div class="flex justify-between text-cyan-300"><span>MP</span><span>17/17</span></div>
          <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden border border-slate-800"><div class="bg-cyan-400 h-full w-[100%]"></div></div>
          <div class="flex justify-between text-emerald-300"><span>TP</span><span>20/100</span></div>
          <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden border border-slate-800"><div class="bg-emerald-400 h-full w-[20%]"></div></div>
        </div>
      </div>

      <!-- 英雄 3: 玛德琳 -->

        <div>
          <div class="flex items-center justify-between mb-1">
            <div class="flex items-center gap-1.5">
              <span class="text-base">🗡️</span>
              <span class="text-xs font-bold text-slate-300">玛德琳</span>
            </div>
            <span class="text-[9px] bg-slate-800 text-slate-300 border border-slate-600/60 px-1 py-0.2 rounded font-bold">隐匿者</span>

          <div class="flex items-center gap-1.5 min-w-0">
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse shrink-0"></span>
            <span class="text-xs font-bold text-cyan-300">选择技能</span>

        </div>
      </div>

      <div id="charge-menu" class="hidden flex-1 flex-col p-2 gap-1 justify-center relative bg-slate-900/70 border-t border-cyan-500/40">

        </div>
        <button onclick="continueCharge()" class="w-full py-1.5 px-2.5 bg-gradient-to-r from-cyan-700 to-blue-700 hover:from-cyan-600 hover:to-blue-600 border border-cyan-500 rounded-lg text-xs font-bold text-white shadow-md flex items-center justify-center gap-1.5 transition-all">

          <span>2.</span> 终止蓄力 (清除蓄力状态)
        </button>
      </div>

    </div>

  </div>

          { name: "柯尔特三连发", cost: 0, hpCost: 0, tpCost: 0, damageType: "远程", hit: 80, type: "[单体(枪击)]", power: 60, type2: "[单体(枪击)]", power2: 60, type3: "[单体(枪击)]", power3: 60, isReaction: false, kanpoTarget: null },
          { name: "温切斯特独头弹", cost: 0, hpCost: 0, tpCost: 0, damageType: "远程", hit: 100, type: "[单体(枪击)]", power: 100, type2: "[单体(枪击)]", power2: 100, type3: "[单降]", power3: 10, isReaction: false, kanpoTarget: null },
          { name: "双管猎象枪", cost: 0, hpCost: 0, tpCost: 20, damageType: "远程", hit: 80, type: "[单体(枪击)]", power: 220, type2: "[单降]", power2: 20, isReaction: false, kanpoTarget: null },
          { name: "克虏伯1918型", cost: 0, hpCost: 0, tpCost: 0, damageType: "远程", hit: 110, delay: 3, haste: 3, type: "[穿透(枪击)]", power: 280, isReaction: false, kanpoTarget: null }
        ]
      },
      {
        id: 2,
        name: "玛德琳",
        classType: "隐匿者",
        hp: 140, maxHp: 140,
        mp: 14, maxMp: 14,
        tp: 20,
        skills: [
          { name: "无迹可寻", cost: 2, hpCost: 0, tpCost: 0, maxUses: 1, usesRemaining: 1, type: "[嘲讽]", power: -30, type2: "[单避]", power2: 10, isReaction: false, kanpoTarget: null },
          { name: "寂静指令", cost: 2, hpCost: 0, tpCost: 0, type: "[群增]", power: 10, type2: "[群瞄]", power2: 30, isReaction: false, kanpoTarget: null },
          { name: "关节锁", cost: 0, hpCost: 0, tpCost: 0, damageType: "近战", hit: 110, turns: 1, type: "[单体]", power: 50, type2: "[单盲]", power2: 30, isReaction: false, kanpoTarget: null },
          { name: "从西班牙射击", cost: 0, hpCost: 0, tpCost: 0, damageType: "远程", hit: 120, type: "[单体(枪击)]", power: 80, isReaction: false, kanpoTarget: null },
          { name: "柯尔特三连发", cost: 0, hpCost: 0, tpCost: 0, damageType: "远程", hit: 70, type: "[单体(枪击)]", power: 60, type2: "[单体(枪击)]", power2: 60, type3: "[单体(枪击)]", power3: 60, isReaction: false, kanpoTarget: null },
          { name: "死亡编织", cost: 0, hpCost: 0, tpCost: 10, damageType: "远程", hit: 100, type: "[群攻(爆炸)]", power: 110, isReaction: false, kanpoTarget: null }
        ]
      }
    ];

    let currentHeroIdx = 0;
    let isDemoChargeMode = false;

    function selectHero(idx) {
      currentHeroIdx = idx;

      [0, 1, 2].forEach(i => {
        const card = document.getElementById(`hero-card-${i}`);
        if (i === idx) {
          card.classList.add('hero-active-ring');
          card.classList.remove('opacity-80');
        } else {
          card.classList.remove('hero-active-ring');
          card.classList.add('opacity-80');
        }
      });

      const hero = heroesData[idx];
      document.getElementById('active-log-hero-name').innerText = hero.name;
      document.getElementById('menu-title-text').innerText = `${hero.name} 的回合`;

      renderSkillMenu();
    }

    function renderSkillMenu() {
      const hero = heroesData[currentHeroIdx];
      const skillListContainer = document.getElementById('skill-list');
      skillListContainer.innerHTML = '';

      hero.skills.forEach(skill => {
        if (skill.isReaction || skill.kanpoTarget) return;
        renderSkillCardItem(skillListContainer, hero, skill);
      });
    }

    function renderSkillCardItem(container, hero, skill) {
      const isMpEnough = hero.mp >= skill.cost;
      const isHpEnough = hero.hp > (skill.hpCost || 0);
      const isTpEnough = hero.tp >= (skill.tpCost || 0);
      const isEnough = isMpEnough && isHpEnough && isTpEnough;
      const isExhausted = skill.maxUses > 0 && skill.usesRemaining <= 0;

      let themeClass = 'skill-card-default';
      let typeBadgeStyle = 'bg-slate-800 text-slate-300 border-slate-600/60';
      let typeIcon = '⚔️';

      if (skill.damageType === '法术') {
        themeClass = 'skill-card-magic';
        typeBadgeStyle = 'bg-purple-950/90 text-purple-300 border-purple-500/60';
        typeIcon = '⚡';
      } else if (skill.damageType === '远程') {
        themeClass = 'skill-card-ranged';
        typeBadgeStyle = 'bg-amber-950/90 text-amber-300 border-amber-500/60';
        typeIcon = '🎯';
      } else if (skill.damageType === '近战') {
        themeClass = 'skill-card-melee';
        typeBadgeStyle = 'bg-rose-950/90 text-rose-300 border-rose-500/60';
        typeIcon = '🗡️';
      }

      let cardStateClass = themeClass;
      if (isExhausted) cardStateClass += ' exhausted-card';
      else if (!isEnough) cardStateClass += ' disabled-card';

      const card = document.createElement('button');
      card.className = `w-full p-1.5 rounded-lg border border-slate-800/80 text-left shrink-0 flex flex-col gap-1 relative overflow-hidden transition-all duration-200 group ${cardStateClass}`;

      // 第一排：【技能名称】 + 【技能类型】
      let row1Html = `
        <div class="flex items-center justify-between gap-1.5 w-full shrink-0">
          <div class="flex items-center gap-1 min-w-0">
            <span class="text-xs font-bold text-slate-100 group-hover:text-cyan-300 transition-colors tracking-wide truncate leading-tight">
              ${skill.name}
            </span>
            ${skill.isOthers ? `<span class="text-[8px] bg-teal-950/90 text-teal-300 border border-teal-600/60 px-1 py-0.2 rounded shrink-0 leading-tight">他人</span>` : ''}
          </div>
          ${skill.damageType ? `
            <span class="text-[8px] font-bold px-1 py-0.2 rounded border shrink-0 flex items-center gap-0.5 ${typeBadgeStyle} leading-tight">
              <span>${typeIcon}</span> ${skill.damageType}
            </span>
          ` : `
            <span class="text-[8px] font-bold px-1 py-0.2 rounded border border-slate-700 bg-slate-900 text-slate-400 shrink-0 leading-tight">
              普通
            </span>
          `}
        </div>
      `;

      // 第二排：[技能效果]
      let tagsHtml = '';
      function formatTagPill(typeStr, powerNum) {
        if (!typeStr || typeStr === '[无]') return '';
        let cleanTag = typeStr.replace(/[\[\]]/g, '');
        let colorStyle = 'bg-slate-900/80 text-slate-300 border-slate-700';

        if (cleanTag.includes('攻') || cleanTag.includes('单体') || cleanTag.includes('穿透')) colorStyle = 'bg-rose-950/80 text-rose-300 border-rose-800/70';
        else if (cleanTag.includes('回') || cleanTag.includes('驱散')) colorStyle = 'bg-emerald-950/80 text-emerald-300 border-emerald-800/70';
        else if (cleanTag.includes('盾') || cleanTag.includes('防')) colorStyle = 'bg-blue-950/80 text-blue-300 border-blue-800/70';
        else if (cleanTag.includes('降') || cleanTag.includes('盲') || cleanTag.includes('眩晕')) colorStyle = 'bg-purple-950/80 text-purple-300 border-purple-800/70';
        else if (cleanTag.includes('再动')) colorStyle = 'bg-fuchsia-950/80 text-fuchsia-300 border-fuchsia-700/70 font-bold';
        else if (cleanTag.includes('避')) colorStyle = 'bg-teal-950/80 text-teal-300 border-teal-700/70';
        else if (cleanTag.includes('嘲')) colorStyle = 'bg-amber-950/80 text-amber-300 border-amber-800/70';

        let pText = powerNum !== undefined && powerNum !== 0 ? `<span class="opacity-90 font-mono-num ml-0.5">${powerNum}</span>` : '';
        return `<span class="text-[8px] px-1 py-0.2 rounded border ${colorStyle} shrink-0 flex items-center leading-none">${cleanTag}${pText}</span>`;
      }

      tagsHtml += formatTagPill(skill.type, skill.power);
      if (skill.type2) tagsHtml += formatTagPill(skill.type2, skill.power2);
      if (skill.type3) tagsHtml += formatTagPill(skill.type3, skill.power3);

      if (skill.delay) {
        tagsHtml += `<span class="text-[8px] px-1 py-0.2 rounded border bg-amber-950/90 text-amber-300 border-amber-500/70 shrink-0 font-bold flex items-center gap-0.5 leading-none">⏳ 蓄力:${skill.delay}</span>`;
      }
      if (skill.haste) {
        tagsHtml += `<span class="text-[8px] px-1 py-0.2 rounded border bg-cyan-950/90 text-cyan-300 border-cyan-500/70 shrink-0 font-bold flex items-center gap-0.5 leading-none">⚡ 加速:${skill.haste}</span>`;
      }

      let row2Html = `
        <div class="flex items-center gap-1 flex-wrap w-full shrink-0">
          ${tagsHtml || '<span class="text-[8px] text-slate-500">无附加效果</span>'}
        </div>
      `;

      // 第三排：[消耗] + [状态]
      let costBadgesHtml = '';
      if (skill.cost > 0) {
        const errClass = !isMpEnough ? 'text-rose-400 border-rose-500/80 bg-rose-950' : 'text-cyan-300 border-cyan-800/60 bg-cyan-950/60';
        costBadgesHtml += `<span class="text-[8px] font-mono-num font-bold px-1 py-0.2 rounded border ${errClass} leading-none">💧 ${skill.cost} MP</span>`;
      }
      if (skill.hpCost > 0) {
        const errClass = !isHpEnough ? 'text-rose-400 border-rose-500/80 bg-rose-950' : 'text-rose-300 border-rose-800/60 bg-rose-950/60';
        costBadgesHtml += `<span class="text-[8px] font-mono-num font-bold px-1 py-0.2 rounded border ${errClass} leading-none">❤️ ${skill.hpCost} HP</span>`;
      }
      if (skill.tpCost > 0) {
        const errClass = !isTpEnough ? 'text-rose-400 border-rose-500/80 bg-rose-950' : 'text-emerald-300 border-emerald-800/60 bg-emerald-950/60';
        costBadgesHtml += `<span class="text-[8px] font-mono-num font-bold px-1 py-0.2 rounded border ${errClass} leading-none">🔥 ${skill.tpCost} TP</span>`;
      }
      if (!costBadgesHtml) {
        costBadgesHtml = `<span class="text-[8px] text-slate-400 font-mono leading-none">⚡ 零消耗</span>`;
      }

      let limitBadgeHtml = '';
      if (skill.maxUses > 0) {
        if (isExhausted) {
          limitBadgeHtml = `<span class="text-[8px] font-bold px-1 py-0.2 rounded border bg-rose-950 text-rose-400 border-rose-800 leading-none">🚫 已用尽</span>`;
        } else {
          limitBadgeHtml = `<span class="text-[8px] font-bold px-1 py-0.2 rounded border bg-amber-950 text-amber-300 border-amber-600/70 leading-none">📌 限${skill.usesRemaining}/${skill.maxUses}次</span>`;
        }
      }

      let notEnoughNotice = '';
      if (!isExhausted && !isEnough) {
        let missingArr = [];
        if (!isMpEnough) missingArr.push('MP不足');
        if (!isHpEnough) missingArr.push('HP不足');
        if (!isTpEnough) missingArr.push('TP不足');
        notEnoughNotice = `<span class="text-[8px] text-rose-400 font-bold leading-none">⚠️ ${missingArr.join(' ')}</span>`;
      }

      let row3Html = `
        <div class="flex items-center justify-between gap-1 w-full shrink-0 pt-1 border-t border-slate-800/80">
          <div class="flex items-center gap-1 flex-wrap">
            ${costBadgesHtml}
          </div>
          <div class="flex items-center gap-1 shrink-0">
            ${limitBadgeHtml}
            ${notEnoughNotice}
          </div>
        </div>
      `;

      card.innerHTML = row1Html + row2Html + row3Html;
      container.appendChild(card);
    }

    function openSkillMenu() {
      document.getElementById('skill-menu').classList.remove('translate-x-full');
    }

    function closeSkillMenu() {
      document.getElementById('skill-menu').classList.add('translate-x-full');
    }

    function prepareAttack() {
      alert("模拟发起普攻！");
    }

    function actionDefend() {
      alert("模拟防御姿态！");
    }

    function toggleDemoMode() {
      isDemoChargeMode = !isDemoChargeMode;
      const mm = document.getElementById('main-action-menu');
      const cm = document.getElementById('charge-menu');
      const btn = document.getElementById('demo-mode-btn');

      if (isDemoChargeMode) {
        mm.classList.add('hidden');
        mm.classList.remove('flex');
        cm.classList.remove('hidden');
        cm.classList.add('flex');
        btn.innerText = '切正常UI';
        btn.className = "text-[9px] text-amber-400 bg-amber-950/80 hover:bg-amber-900 border border-amber-600/50 px-1.5 py-0.2 rounded shrink-0";
      } else {
        cm.classList.add('hidden');
        cm.classList.remove('flex');
        mm.classList.remove('hidden');
        mm.classList.add('flex');
        btn.innerText = '切蓄力UI';
        btn.className = "text-[9px] text-cyan-400 bg-cyan-950/80 hover:bg-cyan-900 border border-cyan-600/50 px-1.5 py-0.2 rounded shrink-0";
      }
    }

    function continueCharge() {
      alert("模拟继续蓄力！");
    }

    function cancelCharge() {
      toggleDemoMode();
    }

    window.onload = function() {
      selectHero(0);
    };
  </script>
</body>
</html>
